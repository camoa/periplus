  match:
    file: '**'
    filetype: python
    text: '(?m)^[ \t]*import[ \t]+(?:[\w.]+(?:[ \t]+as[ \t]+\w+)?[ \t]*,[ \t]*){2}(?<spec>[\w.]+(?:[ \t]+as[ \t]+\w+)?)'
  values:
    bound:
      from: {capture: spec}
      normalize: [{replace: '^[\w.]+[ \t]+as[ \t]+', with: ''}, {replace: '\..*$', with: ''}]
    target:
      from: {capture: spec}
      normalize: [{replace: '\.[\w.]*$', with: ''}, {replace: '[ \t]+as[ \t]+\w+$', with: ''}]
  emits: [{binding: {name: '{bound}', target: '{target}'}}]
  confidence: declared
- rule: bind_from_first
  reads: file
  in: [python]
  match:
    file: '**'
    filetype: python
    text: '(?m)^[ \t]*from[ \t]+(?<source>\w[\w.]*)[ \t]+import[ \t]*\(?\s*(?<spec>\w+(?:[ \t]+as[ \t]+\w+)?)'
  values:
    bound: {from: {capture: spec}, normalize: [{replace: '^\w+[ \t]+as[ \t]+', with: ''}]}
    orig: {from: {capture: spec}, normalize: [{replace: '[ \t]+as[ \t]+\w+$', with: ''}]}
  emits: [{binding: {name: '{bound}', target: '{source}.{orig}'}}]
  confidence: declared
