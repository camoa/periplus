$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A form class the form handlers of a content entity annotation name, for the default, add, edit and delete operations.

rules:
- rule: handler_form
  reads: file
  in: [entity_type_classes]
  match:
    file: '**'
    filetype: drupal_php_text
    reads_sections: [block_comment]
    text: '(?m)^ \*\s+"(?<h>default|add|edit|delete)"\s*=\s*"(?<c>Drupal\\[\w\\]+)"'
  id: {template: '{psr4_class}'}
  emits: [{edge: {kind: has_handler, from: this_node, to: {template: '{c}'}}}]
  confidence: declared
