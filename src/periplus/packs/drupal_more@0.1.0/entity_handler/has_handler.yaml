# The edge kind of the handler rules: an entity class to a class its annotation names as a handler.

edge_kinds:
- {kind: has_handler, from: php.class, to: php.class, description: "The entity class names that class as a handler in its annotation, such as storage, access, list_builder or a form operation"}
