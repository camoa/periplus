$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# The storage schema handler a content entity annotation names.

rules:
- rule: handler_storage_schema
  reads: file
  in: [entity_type_classes]
  match:
    file: '**'
    filetype: drupal_php_text
    reads_sections: [block_comment]
    text: '(?m)^ \*\s+"(?<h>storage_schema)"\s*=\s*"(?<c>Drupal\\[\w\\]+)"'
  id: {template: '{psr4_class}'}
  emits: [{edge: {kind: has_handler, from: this_node, to: {template: '{c}'}}}]
  confidence: declared
