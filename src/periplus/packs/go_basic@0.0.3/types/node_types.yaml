$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

node_types:
- name: go.function
  description: "a Go function declared at package level, without a receiver"
  id_namespace: go.function
- name: go.method
  description: "a Go method, a function declared with a receiver, named by its package and receiver type"
  id_namespace: go.method
- name: go.struct
  description: "a Go struct type, declared as type T struct"
  id_namespace: go.struct
- name: go.interface
  description: "a Go interface type, declared as type T interface"
  id_namespace: go.interface
edge_kinds:
- kind: calls
  cause: from
  description: "the function or method calls that function or method; a call on an object may be inferred from declared types, and in Go the end may be a type converted by name"
  from: [go.function, go.method]
  to: [go.function, go.struct, go.interface]
