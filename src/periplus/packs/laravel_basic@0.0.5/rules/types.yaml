$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# The node types and edge kinds this pack declares.
node_types:
- name: laravel.route
  description: "A route in a route file, named by its file, verb and URI, such as web:GET /books/{slug}; a resource route is one node"
  id_namespace: laravel.route
- name: laravel.view
  description: "A Blade template file, named by its dotted path below the views folder: books/show.blade.php is books.show"
  id_namespace: laravel.view
- name: laravel.controller
  description: "A class in the controllers folder, taken as a controller by its folder alone"
  id_namespace: laravel.controller
- name: laravel.model
  description: "A class in the models folder, taken as an Eloquent model by its folder alone"
  id_namespace: laravel.model
- name: laravel.config
  description: "A config file, named by its file name: config/app.php is app"
  id_namespace: laravel.config
- name: laravel.config_key
  description: "A key of the array a config file returns, named by the file and its keys, such as app.name; the file name alone stands for the whole array"
  id_namespace: laravel.config_key
- name: laravel.migration
  description: "A migration file, named by its file"
  id_namespace: laravel.migration

edge_kinds:
- kind: handled_by
  description: "the route is handled by that controller method, as the route definition names it"
  from: laravel.route
  to: php.method
  # realizes: to, the to end is the code that carries out the from end; a walk that
  # reaches the from end adds the to end at the same hop.
  realizes: to
- kind: resource_controller
  description: "the resource route, Route::resource or Route::apiResource, is served by that controller class"
  from: laravel.route
  to: php.class
- kind: route_renders
  description: "the route renders that view directly, through Route::view"
  from: laravel.route
  to: laravel.view
- kind: includes_view
  description: "the view includes that view by name, with @include, @includeIf, @each or @component"
  from: laravel.view
  to: laravel.view
- kind: extends_view
  description: "the view extends that layout view by name, with @extends"
  from: laravel.view
  to: laravel.view
- kind: implemented_by
  description: "the controller or model is that PHP class"
  from: [laravel.controller, laravel.model]
  to: php.class
- kind: renders
  description: "the function or method renders that view, named in a view() call"
  from: [php.function, php.method]
  to: laravel.view
- kind: reads_config
  description: "the view, function or method reads that config key, named in a config() call"
  from: [laravel.view, php.function, php.method]
  to: laravel.config_key
- kind: key_of
  description: "the config key belongs to that config file"
  from: laravel.config_key
  to: laravel.config
- kind: uses_component
  description: "the view uses that anonymous Blade component, written as an <x-name> tag, which is the view components.name"
  from: laravel.view
  to: laravel.view
