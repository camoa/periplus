# config('app.name') written in a template: an edge from the view to the key app.name, and an
# edge from the key app, named by the file, to the config file app, unresolved when no such file
# exists. The key app.name is mapped when the file declares it; otherwise it is in state
# referenced, since this_node takes no on_miss. The key is this rule's own node and the view the
# end it names, because reads_config also runs from a PHP function or method, and this_node needs
# one id namespace.
- rule: config_read_in_view
  reads: file
  in: [views]
  match:
    file: '*'
    filetype: blade
    text: '(?:^|[^\w>$:])config\(\s*[''"](?<key>[\w-]+[\w.-]*)[''"]\s*[,)]'
  id: {from: {capture: key}}
  line: {capture: key}
  emits:
  - edge:
      kind: reads_config
      from: {template: '{view}', types: [laravel.view]}
      to: this_node
  confidence: declared

# config('app.name') in a PHP function or method: an edge from it to the key app.name, at the
# call's line, unresolved when no config file declares that key. config('app') ends on the key app
# that stands for the file. No key_of edge: a reference rule's edges run from the function or
# method. config($key) and config(['app.name' => 'x']) give nothing and go under skipped.
- rule: config_call
  reads: file
  in: [source]
  match:
    reference: function_call_expression
    name_child: function
    filetype: php
    where: [{name_matches: '(?i)\\?config'}]
  emits:
  - edge:
      kind: reads_config
      from: enclosing_declaration
      to: {from: {argument: 0}, types: [laravel.config_key], on_miss: unresolved}
  confidence: declared

- rule: config_key_in_file
  reads: file
  in: [views]
  match:
    file: '*'
    filetype: blade
    text: '(?:^|[^\w>$:])config\(\s*[''"](?<key>(?<file>[\w-]+)[\w.-]*)[''"]\s*[,)]'
  id: {from: {capture: file}}
  emits:
  - edge:
      kind: key_of
      from: this_node
      to: {from: {capture: file}, types: [laravel.config], on_miss: unresolved}
  confidence: declared

- rule: migration_file
  reads: file
  in: [migrations]
  match: {file: '*', filetype: php}
  id: {from: file_stem}
  emits: [{node: {type: laravel.migration}}]
  confidence: declared
