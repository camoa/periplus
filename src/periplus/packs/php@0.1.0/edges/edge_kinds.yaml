$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# php pack — the edge kinds this pack declares. Finding them is in edges/find_*.yaml.
#
# Endpoints take one type or a flat list of alternatives. Nesting a combination inside a
# list is not expressible — that is the grammar restriction that keeps validation cheap,
# and it can be widened later without breaking any pack written against it.

edge_kinds:

  - kind: contains
    cause: none
    description: "the file, type, function or YAML entry holds that declaration or nested YAML entry directly inside it"
    from: [php.file, php.file_entry, php.class_like, php.callable]
    to:   [php.class_like, php.callable, php.property, php.class_constant, php.enum_case]
    source: nearest_enclosing_container
    # why: the containment source was hardcoded to the file node across 15 language
    #      configs, so a method's container was the file rather than its class.

  - kind: inherits
    cause: none
    description: "the class or interface extends that one, as its extends clause names it"
    from: php.class
    to:   php.class

  - kind: implements
    description: "the class or enum names that interface in its implements clause"
    from: [php.class, php.enum]
    to:   php.interface
    # realizes: the from end is a concrete form of the to end; a walk that reaches the to end
    # adds the from ends at the same hop.
    realizes: true

  - kind: mixes_in
    cause: none
    description: "the class or trait uses that trait with a use statement in its body"
    from: php.class_like
    to:   php.trait

  - kind: instantiates
    cause: from
    description: "the function or method creates an object of that class with new; new self() and new static() name the enclosing class"
    from: php.callable
    to:   php.class
    # why: `object_creation_expression` was simply absent from the trigger set. On one
    #      615-file corpus that was 505 `new X(` sites across 178 classes emitting nothing.
    #
    # Its own kind rather than folded into `calls`: instantiating a class and calling a
    # method are different questions, and a reader asking "who constructs this" should not
    # have to filter call edges.

  - kind: calls
    cause: from
    description: "the function or method calls that function or method; a call on an object may be inferred from declared types, and in Go the end may be a type converted by name"
    from: php.callable
    to:   php.callable

  - kind: indirect_call
    cause: touch
    description: "the function or method takes that function or method as a first-class callable, f(...), without calling it"
    from: php.callable
    to:   php.callable
    # why: `$obj->m(...)` creates a Closure and transfers control nowhere. Recording it as
    #      `calls` asserts something false; dropping it loses a real reference.

  # Operational edges. Open in the design, drafted here so the shape can be argued with.
  - kind: reads
    cause: from
    description: "the function or method accesses that member as $obj->name; the rule matches any such access, an assignment included"
    from: php.callable
    to:   [php.property, php.class_constant, php.enum_case]

  - kind: writes
    cause: from
    description: "the function or method assigns a value to that property"
    from: php.callable
    to:   php.property
    # Separate from `reads` rather than one relation with a direction field: the write is
    # the half that answers "what changes this", and folding them together loses most of
    # the value of having the edge at all.

  - kind: imports
    cause: from
    description: "the file or module imports that thing: a PHP use statement names a class, function or constant, a TypeScript import names a module"
    from: php.file
    to:   [php.class_like, php.function, php.class_constant]
