$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A resource named in a client method call, from the function that makes it.

rules:
- rule: resource_call_literal_in_function
  reads: file
  in:
  - typescript_source
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: \.(?:getResource|getResourceCollection|createResource|updateResource|deleteResource|getResourceCollectionPathSegments)(?:<[^>(]*>)?\(\s*['"](?<resource>[a-z_]+--[a-z_-]+)['"]
  values:
    fn:
      from: {enclosing: function_body, capture: name}
  id:
    template: '{module}:{fn}'
  line:
    capture: resource
  emits:
  - edge:
      kind: function_uses_jsonapi_resource
      from: this_node
      to:
        template: '{resource}'
  confidence: declared
