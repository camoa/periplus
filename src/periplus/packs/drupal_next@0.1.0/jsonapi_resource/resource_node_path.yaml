$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A resource named by a raw /jsonapi/entity/bundle path.

rules:
- rule: resource_node_from_path
  reads: file
  in:
  - typescript_source
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: /jsonapi/(?<entity>[a-z_]+)/(?<bundle>[a-z_-]+)
  id:
    template: '{entity}--{bundle}'
  line:
    capture: entity
  emits:
  - node:
      type: drupal_next.jsonapi_resource
  confidence: declared
