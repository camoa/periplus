$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A resource named by a constant, from the function that makes the call.

rules:
- rule: resource_call_constant_in_function
  reads: file
  in:
  - typescript_source
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: \.(?:getResource|getResourceCollection|createResource|updateResource|deleteResource)(?:<[^>(]*>)?\(\s*(?<constant>[A-Z][A-Z0-9_]*)\b
  values:
    fn:
      from: {enclosing: function_body, capture: name}
  id:
    template: '{module}:{fn}'
  line:
    capture: constant
  emits:
  - edge:
      kind: function_uses_jsonapi_resource
      from: this_node
      to:
        template: '{constant}'
        resolve:
        - bound_first_segment
        separator: /
  confidence: declared
