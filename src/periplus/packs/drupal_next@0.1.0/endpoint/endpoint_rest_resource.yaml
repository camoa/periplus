$schema: https://periplus.dev/schema/0/pack-file.schema.json

# The edge runs from the endpoint to the plugin, as endpoint_served_by runs to the route.

edge_kinds:
- kind: endpoint_served_by_rest_resource
  cause: from
  description: "the endpoint is served by that REST resource plugin, whose annotation declares the path as canonical or create"
  from: drupal_next.endpoint
  to: drupal.rest_resource
