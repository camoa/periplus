$schema: https://periplus.dev/schema/0/pack-file.schema.json

# drupal.fetch('/path') or drupal.fetch('/path', { headers }) with no method: a GET.

rules:
- rule: call_endpoint_method_client_fetch_get
  reads: file
  in:
  - typescript_source
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: |-
      \bdrupal\w*\.fetch\(\s*[`'\"](?<path>/(?!jsonapi\b)[^`'\"?]*)[`'\"]\s*(?:\)|,\s*\{(?!(?:[^{}]|\{[^{}]*\})*?\bmethod\b\s*[:,}]))
  values:
    target:
      template: '{path}'
      normalize:
      - replace: \$\{[^}]*$
        with: ''
      - replace: (?<=[^/])\$\{[^}]*\}$
        with: ''
      - replace: \$\{[^}]*\}
        with: '{}'
      - replace: (?<=.)/$
        with: ''
  id:
    template: '{module}'
  line:
    capture: path
  emits:
  - edge:
      kind: calls_endpoint_method
      from: this_node
      to:
        template: 'drupal{target}|GET'
  confidence: inferred
