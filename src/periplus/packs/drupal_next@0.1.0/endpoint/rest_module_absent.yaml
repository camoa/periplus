$schema: https://periplus.dev/schema/0/pack-file.schema.json

# core.extension lists no rest module, so a REST resource plugin is never served.

rules:
- rule: rest_module_absent
  reads: file
  in: [config]
  match: {file: 'core.extension', filetype: drupal_next_yml_text, text: '(?m)\A(?![\s\S]*^  rest: -?\d)'}
  id: {template: 'rest'}
  emits: [{node: {type: drupal_next.module_absent}}]
  confidence: declared
