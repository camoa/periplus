$schema: https://periplus.dev/schema/0/pack-file.schema.json

# The first three methods of a methods list written one item per line, as
# methods:
#   - GET
#   - POST
# A fourth item is not read.

rules:
- rule: endpoint_method_listed_first_node
  reads: file
  in: [module_root]
  match:
    file: '*.routing'
    filetype: drupal_next_yml_text
    text: (?m)^(?<route>[\w.]+):\n(?:[ \t][^\n]*\n)*?[ \t]+path:[ \t]*['"]?(?<path>/[^'"\n]*)['"]?\n(?:[ \t][^\n]*\n)*?[ \t]+methods:[ \t]*\n[ \t]+-[ \t]*['"]?(?<m>[A-Z]+)
  values:
    target: {template: '{path}', normalize: [{replace: '\{[^}]+\}', with: '{}'}, {replace: '(?<=.)/$', with: ''}]}
  id: {template: 'drupal{target}|{m}'}
  line: {capture: m}
  emits:
  - node: {type: drupal_next.endpoint_method}
  confidence: declared
- rule: endpoint_method_listed_first
  reads: file
  in: [module_root]
