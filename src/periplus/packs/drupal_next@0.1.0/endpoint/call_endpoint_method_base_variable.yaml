$schema: https://periplus.dev/schema/0/pack-file.schema.json

# fetch(`${base}/path`, { method: 'POST' }) through a variable the file binds to the Drupal base URL.
# A method written outside the options object, or by a variable, is not read.

rules:
- rule: call_endpoint_method_base_variable
  reads: file
  in:
  - typescript_source
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: |-
      fetch\(\s*`\$\{(?<var>\w+)\}(?<path>/(?!jsonapi\b)[^`?]*)[^`]*`\s*,\s*\{(?:[^{}]|\{[^{}]*\})*?\bmethod:\s*['\"](?<m>[A-Z]+)
  values:
    target:
      template: '{path}'
      normalize:
      - replace: \$\{[^}]*$
        with: ''
      - replace: (?<=[^/])\$\{[^}]*\}$
        with: ''
      - replace: \$\{[^}]*\}
        with: '{}'
      - replace: (?<=.)/$
        with: ''
  id:
    template: '{module}'
  line:
    capture: path
  emits:
  - edge:
      kind: calls_endpoint_method
      from: this_node
      to:
        template: '{var}{target}|{m}'
        resolve:
        - bound_first_segment
        separator: /
  confidence: inferred
