$schema: https://periplus.dev/schema/0/pack-file.schema.json

# The revalidator plugin the config names.

edge_kinds:
- kind: next_config_uses_revalidator
  from: drupal_next.entity_type_config
  to: drupal_next.revalidator
rules:
- rule: next_entity_type_config_revalidator
  reads: file
  in:
  - config
  - module_config
  match:
    file: next.next_entity_type_config.*
    filetype: yaml
  id:
    from: file_stem
    normalize:
    - replace: ^next\.next_entity_type_config\.
      with: ''
  emits:
  - edge:
      kind: next_config_uses_revalidator
      from: this_node
      to:
        from:
          key: revalidator
  confidence: declared
