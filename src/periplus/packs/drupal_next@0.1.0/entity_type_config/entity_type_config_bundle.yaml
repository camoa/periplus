$schema: https://periplus.dev/schema/0/pack-file.schema.json

# The bundle the config is for: its id.

edge_kinds:
- kind: next_config_for_bundle
  from: drupal_next.entity_type_config
  to: drupal.bundle
rules:
- rule: next_entity_type_config_bundle
  reads: file
  in:
  - config
  - module_config
  match:
    file: next.next_entity_type_config.*
    filetype: yaml
  id:
    from: file_stem
    normalize:
    - replace: ^next\.next_entity_type_config\.
      with: ''
  emits:
  - edge:
      kind: next_config_for_bundle
      from: this_node
      to:
        from:
          key: id
  confidence: declared
