$schema: https://periplus.dev/schema/0/pack-file.schema.json

# drupal.fetch('/path'): the client prefixes its base URL to a path that starts with /. The client
# is known by its variable name only.

rules:
- rule: call_through_client_fetch
  reads: file
  in:
  - typescript_source
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: \bdrupal\w*\.fetch\(\s*[`'"](?<path>/(?!jsonapi\b)[^`'"?]*)
  values:
    target:
      template: '{path}'
      normalize:
      - replace: \$\{[^}]*$
        with: ''
      - replace: (?<=[^/])\$\{[^}]*\}$
        with: ''
      - replace: \$\{[^}]*\}
        with: '{}'
      - replace: (?<=.)/$
        with: ''
  id:
    template: '{module}'
  line:
    capture: path
  emits:
  - edge:
      kind: calls_endpoint
      from: this_node
      to:
        template: drupal{target}
  confidence: inferred
