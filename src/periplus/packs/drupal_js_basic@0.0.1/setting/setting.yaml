$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

node_types:
- name: drupal.js_setting
  description: "A drupalSettings key, the first key after drupalSettings, that PHP attaches to a page and a behavior reads"
  id_namespace: drupal.js_setting

edge_kinds:
- kind: provides_setting
  cause: from
  description: "the PHP class or function attaches that drupalSettings key to the page through #attached"
  from: [php.class, php.function]
  to: drupal.js_setting
- kind: reads_setting
  cause: from
  description: "the behavior reads that drupalSettings key as drupalSettings.key, in its own code or in a class it holds"
  from: [drupal.js_behavior, drupal.js_class]
  to: drupal.js_setting
