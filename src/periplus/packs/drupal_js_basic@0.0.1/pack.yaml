$schema: "https://periplus.dev/schema/0/pack-manifest.schema.json"

# Known gaps. This pack maps the Drupal side of a project's JavaScript and what joins it to
# Drupal. Each line below was seen on real code or on a planted file.
#
# Behaviors. Drupal.behaviors.name = {...} is a node named by its name, and
# Drupal.behaviors.other.attach(...) inside a behavior object is an edge to the other behavior.
# - Any object assigned to Drupal.behaviors.name is a behavior, with or without an attach
#   member: Drupal.behaviors.empty = {} gives a node.
# - Drupal.behaviors['name'] = {...} and window.Drupal.behaviors.name = {...}: no node.
# - An arrow function or a function expression gives the node, Drupal.behaviors.trapFocus =
#   (element) => {...}; a value of any other kind, such as a variable, gives none.
# - Two scripts that declare one behavior name give one node holding both locations. Drupal
#   keeps only the one loaded last on a page.
# - Drupal.behaviors.other.detach(...): no edge.
# - js_basic maps each function of a behavior as a member function too: attach in
#   Drupal.behaviors.name = { attach() {} } is js.member_function::Drupal.behaviors.name.attach,
#   and a function assigned to Drupal.behaviors.name is js.member_function::Drupal.behaviors.name.
#   A rutter cannot drop a node the rutter it depends on makes, so both stay beside the behavior
#   node. Drupal.behaviors.other.attach(context) is also js_basic's js_calls edge between the two
#   attach functions.
# - once(), $() and jQuery(): this pack adds the three names to js_basic's table library_globals,
#   so a call that no function of its script declares is one unresolved node for every script,
#   js.function::once, js.function::$ or js.function::jQuery. No edge joins it to the library
#   core/once or core/jquery. A call to a core member, such as Drupal.t(), gives an edge only
#   where a mapped script assigns that name.
#
# Settings. $build['#attached']['drupalSettings']['key'] = ... in PHP is a setting node named by
# that first key, and drupalSettings.key inside a behavior object is an edge to it. A key that
# no mapped PHP file attaches is a referenced node.
# - Only the first name after drupalSettings is the key. drupalSettings.a.b reads the key a.
# - drupalSettings['key'], and a read through the second parameter of attach,
#   attach(context, settings) { settings.key }: no edge.
#
# Paths in scripts. A path a script requests is a script_links_to_path edge from its js.file node
# to the drupal.url_path node a route serves: a path written whole in a quoted string
# (behavior/behavior.yaml), and, in url/script_url.yaml, Drupal.url('my/path') as /my/path and a
# template literal that starts with one /.
# - A template literal keeps each ${...} as written, `/my/item/${id}`, so it meets no route whose
#   path holds a placeholder. One joined with +, one holding a space, and one after return or any
#   character other than ( [ , = : ?, give nothing.
# - Drupal.url('a/' + id) and a text holding a space: no edge.
# - fetch(x), $.ajax(x), $.get(x), $.getJSON(x), $.post(x), the same through jQuery, and
#   Drupal.url(x), whose first argument starts with no quote, backtick or brace, is a js.url_call
#   node marked resolution runtime, named <script path>|<callee>, with a script_requests_url edge
#   from the script. Two such calls in one script to one callee are one node with two locations.
#   $.getJSON(Drupal.url('x')) gives both the path edge and the runtime node.
# - $.ajax({url: x}) with a variable, window.fetch(x), and fetch(`/a/${id}` + x): no node.
# - Each edge starts at the script, not at the function that holds the call.
#
# The two text file types this pack reads, drupal_template_text and drupal_php_text, are declared
# by drupal_basic, so every Drupal pack reads them the same way. This pack declares them again to
# add a path value and the spans its rules read.
#
# Library attachments. In PHP, $build['#attached']['library'][] = 'module/library' is an edge
# from the class or the function around it. The array form,
# '#attached' => ['library' => ['module/library', ...]], is an edge from the class of its file,
# one for each text in the list. In Twig, attach_library('module/library') in a
# <name>.html.twig file is an edge from the template.
# - The array form is read as text. Its class is named from the file's path, by Drupal's PSR-4
#   layout: <module>/src/A/B.php is Drupal\<module>\A\B. So the rule is inferred, and a file
#   whose class is named otherwise gets an edge from a class that does not exist. In a .module,
#   .theme, .inc, .install or .profile file the edge starts at the function around the list.
# - The array form with something between => and the array makes nothing:
#   '#attached' => $flag ? ['library' => [...]] : [].
# - A library named by a constant, a variable or a joined text: no edge.
# - '#attached' => ['drupalSettings' => ['key' => ...]] is read as text the same way: a setting
#   node for each first-level key, from the class or the function. A key named by a variable, or
#   below the first level, makes nothing.
# - A component's components/<name>/<name>.twig gives its attach_library edge from
#   drupal.component::<name>, under the mirror kind component_attaches_library; the path value
#   component_name is drupal_basic's. Any other Twig file not named .html.twig: no edge.
# - A call inside a Twig comment makes nothing. A call inside a quoted text or a verbatim block
#   still gives an edge.
# - A script a library lists under js: is an edge from the library to the script's js.file node.
#   The script's path is the libraries file's folder joined with the key. A key that is a URL
#   (http:, https: or //) makes no edge and no node. A key that starts with /, such as
#   /core/misc/drupal.js, is read from the Drupal root, the folder above the first modules, themes
#   or profiles folder; a file outside the mapped folders gets a referenced node. In a project
#   whose top folder is the Drupal root itself, such a key makes no edge.
#   Chain: library -> script -> behavior. A script is linked to each behavior object it assigns,
#   by a script_declares_behavior edge from its js.file node.
# - A stylesheet a library lists under css:, in any group, is an edge from the library to a
#   css.file node named by the same joined path, with the same URL filter. Each .css file in a
#   module or theme is a css.file node named by its path, so a listed file that does not exist
#   gets a referenced node. A key that starts with / is read from the Drupal root, as for a script.
# - A second pack that claims libraries files, by a file type of its own for the ending yml, is
#   refused (exit 19: the ending yml is claimed by different file types), because libraries
#   files are read through this pack's type yml and drupal_basic's library rules. A pack that
#   declares the type yml again in full, under the same name and with a path value of its own,
#   merges with it and keeps the library edges. Two themes or modules that keep a script at one
#   path meet at one js.file node.
#
# An edge that starts at what is around a match needs a behavior object in JavaScript, and a
# class or a function in PHP. A behavior call or a settings read outside a behavior object makes
# no edge and is listed under skipped: no value for enclosing_class. A class written inside a
# behavior's function ends that walk, since js_basic ends the walk to an object at a class: a
# settings read in one of its methods is listed the same way. In PHP an attachment in a
# function, such as a hook in a .module file, starts at the function, and one in a method starts
# at the class, not at the method. An attachment outside both makes no edge and is listed the
# same way; its setting node is still made. In a procedural file, such as a .module or .inc file,
# an attachment in the array form inside a class method now makes no edge and one skipped row,
# no value for fn, as one outside any class or function does; its setting node is still made.
pack: drupal_js_basic
version: 0.0.1
depends: [js_basic, drupal_basic]
# The globals Drupal core's libraries core/once and core/jquery define. A call to one that no
# function of the script declares is one unresolved node of that name, not one per script.
add_table_rows:
  js_basic:
    library_globals:
      once: once
      $: $
      jQuery: jQuery
files:
  types:
    # yaml_basic's type yml, read as data, given the path value libraries_dir: the folder the file
    # sits in, which a libraries file's js: keys are written from.
    yml:
      endings: [yml]
      reader: data
      format: yaml
      path_values:
        libraries_dir:
          pattern: '^(?<dir>.+)/[^/]+$'
          template: '{dir}'
        # The folder above the first modules, themes or profiles folder: the Drupal root, which a
        # js: or css: key that starts with / is written from. A file with no folder above it has
        # no value.
        drupal_root:
          pattern: '^(?<root>.*?)/(?:modules|themes|profiles)/'
          template: '{root}'
    # drupal_basic's type drupal_php_text, given more spans: the array after each quoted,
    # constant or variable key and =>, to any depth. The array-form setting rules read the keys
    # around a match from it.
    drupal_php_text:
      endings: [php, module, theme, inc, install, profile]
      reader: text
      spans:
      # The body of a named function; name is the name as written.
      - name: function_body
        open: '\b(?<mark>function)\s+(?<name>\w+)\s*\([^)]*\)[^{;]*(?=\{)'
        balance: ['{', '}']
      # The body of a named class, trait, interface or enum, so a rule can tell a method from a
      # function in a file that has no PSR-4 class.
      - name: class_body
        open: '(?<![$:>])\b(?<mark>class|trait|interface|enum)\s+\w+[^{;]*(?=\{)'
        balance: ['{', '}']
      # The array after 'drupalSettings' =>.
      - name: settings_list
        open: '[\[,(\s][''"](?<mark>drupalSettings)[''"]\s*=>\s*(?=\[)'
        balance: ['[', ']']
      - name: keyed_array
        open: '[\[,]\s*(?<key>[''"][\w.-]+[''"]|[^\s\[\](),''"=>|]+(?:\[[^\[\]]*\])*)\s*=>\s*(?=\[)'
        balance: ['[', ']']
      # The same name for an array that is not the whole value after =>, such as one inside a
      # ternary, a call's argument or a list, and for old array( ). Its key is the character before
      # the bracket, or the word array, so a key inside it is below the first level.
      - name: keyed_array
        open: '(?<key>[^\s\w$\]])(?<!=>)\s*(?=\[)'
        balance: ['[', ']']
      - name: keyed_array
        open: '\b(?<key>array)\s*(?=\()'
        balance: ['(', ')']
    # A stylesheet, read as text only to be named by its path from the project folder.
    css_text:
      endings: [css]
      reader: text
      path_values:
        stylesheet:
          pattern: '^(?<file>.+)$'
          template: '{file}'
    # A script read as text, to find a path written whole in a string (behavior/behavior.yaml). Named
    # by its path from the project folder, as js_basic names its js.file node.
    js_text:
      endings: [js]
      reader: text
      path_values:
        script:
          pattern: '^(?<file>.+)$'
          template: '{file}'
      sections:
      - name: block_comment
        open: '/\*'
        close: '\*/'
      - name: line_comment
        open: '//'
        close: '\n'
      - name: string
        open: ''''
        close: '(?:[^''\\\n]|\\.)*'''
      - name: string
        open: '"'
        close: '(?:[^"\\\n]|\\.)*"'
      - name: template_string
        open: '`'
        close: '(?:[^`\\]|\\(?s:.))*`'
