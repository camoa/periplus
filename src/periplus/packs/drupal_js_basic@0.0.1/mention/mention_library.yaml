$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A PHP method or function that holds a string literal equal to a library's id, my_module/cart, as
# a mentions_library edge to the library, with confidence mentioned, as drupal_basic's
# mention/mention_php.yaml joins the other things a literal names. A method or function that
# already attaches that library gets no mention. A template that holds the library's id as a
# quoted text, outside attach_library(), mentions it the same way.

edge_kinds:
- kind: mentions_library
  from: [php.method, php.function, drupal.template]
  to: drupal.library
  description: "the code or template holds a text equal to that library's id outside an attachment; it names the library as text, and what it does with it is not known"

rules:
- rule: code_mentions_library
  reads: map
  match:
    node_type: php.callable
    where: [{id_matches: '^(?<caller>.+)$'}]
    follow:
    - edge: names_literal
    - id_matches: '^drupal\.literal::(?<text>.+)$'
    - node: 'drupal.library::{text}'
    unless_matched:
    - [{incoming_edge: attaches_library}, {id_matches: '^{caller}$'}]
  emits: [{edge: {kind: mentions_library, from: this_node, to: matched_node}}]
  confidence: mentioned

- rule: template_mentions_library
  reads: map
  match:
    node_type: drupal.template
    where: [{id_matches: '^(?<caller>.+)$'}]
    follow:
    - edge: template_names_literal
    - id_matches: '^drupal\.literal::(?<text>.+)$'
    - node: 'drupal.library::{text}'
    unless_matched:
    - [{incoming_edge: template_attaches_library}, {id_matches: '^{caller}$'}]
  emits: [{edge: {kind: mentions_library, from: this_node, to: matched_node}}]
  confidence: mentioned
