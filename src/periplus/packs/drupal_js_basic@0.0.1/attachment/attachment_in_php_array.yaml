$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

rules:
# '#attached' => ['library' => ['module/library', ...]] in a class file under src: each text in
# the list is a library the class attaches. The id names both spans, so a text outside either
# one makes nothing.
- rule: library_attached_in_array
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: &library_text '[\[,\s][''"](?<library>[A-Za-z0-9_]+/[\w.-]+)[''"]\s*[,\]]'
  values:
    in_attached: &in_attached {from: {enclosing: attached, capture: mark}}
    in_library: &in_library {from: {enclosing: library_list, capture: mark}}
  id: &library_id
    template: '{in_attached}|{in_library}|{library}'
    normalize:
    - {replace: '^.*\|', with: ''}
  line: {capture: library}
  emits:
  - edge:
      kind: attaches_library
      from: {template: '{psr4_class}', types: [php.class]}
      to: this_node
  confidence: inferred
# The same list in a function of a procedural file, such as a hook in a .module file: the
# function attaches the library. Its node is the one php_basic makes for the function.
- rule: library_attached_in_array_in_function
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [module, theme, inc, install, profile]
    text: *library_text
  values:
    in_attached: *in_attached
    in_library: *in_library
    fn_name: {from: {enclosing: function_body, capture: name}}
    in_class: {from: {enclosing: class_body, capture: mark}}
    fn: {template: '{in_class}|{fn_name}', normalize: [{replace: '^[^|]+\|.*$', with: ''}, {replace: '^\|', with: ''}]}
  id: *library_id
  line: {capture: library}
  emits:
  - edge:
      kind: attaches_library
      from: {template: '{fn}', types: [php.function]}
      to: this_node
  confidence: inferred
