$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

rules:
# {{ attach_library('module/library') }}: the template attaches the library.
- rule: library_attached_in_template
  reads: file
  in: [module_root, theme_root]
  match:
    file: '*.html'
    filetype: drupal_template_text
    text: 'attach_library\(\s*[''"](?<library>[^''"\s]+)[''"]\s*\)'
  id: {template: '{template_name}'}
  emits: [{edge: {kind: template_attaches_library, from: this_node, to: {from: {capture: library}}}}]
  confidence: declared
# {{ attach_library('module/library') }} in a component's <name>.twig: the component attaches the
# library. A file with no component_name, such as a <name>.html.twig template, makes nothing.
- rule: library_attached_in_component
  reads: file
  in: [module_root, theme_root]
  match:
    file: '*'
    filetype: drupal_template_text
    text: 'attach_library\(\s*[''"](?<library>[^''"\s]+)[''"]\s*\)'
  id: {template: '{component_name}'}
  emits: [{edge: {kind: component_attaches_library, from: this_node, to: {from: {capture: library}}}}]
  confidence: declared
