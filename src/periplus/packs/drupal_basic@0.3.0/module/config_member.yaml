$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Each configuration file a module or theme ships in config/install or config/optional, field
# storages and field instances among them, as config_in_module or config_in_theme to the module or
# theme of the nearest folder above the file that holds an info file, found by
# module/member_folder.yaml. The folder decides, not the file's name: shop.settings shipped by
# my_module belongs to my_module, while config_object.yaml's config_provided_by still reads the
# name. Each single-directory component, by its component file, as component_in_module or
# component_in_theme the same way.

edge_kinds:
- kind: config_in_module
  from: drupal.config_object
  to: drupal.module
- kind: config_in_theme
  from: drupal.config_object
  to: drupal.theme
- kind: component_in_module
  from: drupal.component
  to: drupal.module
- kind: component_in_theme
  from: drupal.component
  to: drupal.theme

rules:
- rule: config_claim
  reads: file
  in: [module_config]
  match: {file: '*', filetype: yml}
  id: {template: '{file_dir}|config|{file_stem}'}
  emits: [{node: {type: drupal.member_claim}}]
  confidence: declared

- rule: config_in_module
  reads: map
  match:
    node_type: drupal.member_claim
    where: [{id_matches: '^[^|]+\|config\|(?<config>.+)$'}]
    follow: [{edge: claim_in_folder}, {edge: folder_of_module}]
  emits: [{edge: {kind: config_in_module, from: {template: '{config}', type: drupal.config_object}, to: matched_node}}]
  confidence: declared

- rule: config_in_theme
  reads: map
  match:
    node_type: drupal.member_claim
    where: [{id_matches: '^[^|]+\|config\|(?<config>.+)$'}]
    follow: [{edge: claim_in_folder}, {edge: folder_of_theme}]
  emits: [{edge: {kind: config_in_theme, from: {template: '{config}', type: drupal.config_object}, to: matched_node}}]
  confidence: declared

- rule: component_claim
  reads: file
  in: [module_root, theme_root]
  match: {file: '*.component', filetype: yml}
  id: {template: '{file_dir}|component|{file_stem}', normalize: [{replace: '\.component$', with: ''}]}
  emits: [{node: {type: drupal.member_claim}}]
  confidence: declared

- rule: component_in_module
  reads: map
  match:
    node_type: drupal.member_claim
    where: [{id_matches: '^[^|]+\|component\|(?<component>.+)$'}]
    follow: [{edge: claim_in_folder}, {edge: folder_of_module}]
  emits: [{edge: {kind: component_in_module, from: {template: '{component}', type: drupal.component}, to: matched_node}}]
  confidence: declared

- rule: component_in_theme
  reads: map
  match:
    node_type: drupal.member_claim
    where: [{id_matches: '^[^|]+\|component\|(?<component>.+)$'}]
    follow: [{edge: claim_in_folder}, {edge: folder_of_theme}]
  emits: [{edge: {kind: component_in_theme, from: {template: '{component}', type: drupal.component}, to: matched_node}}]
  confidence: declared
