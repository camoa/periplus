$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Whether a module or theme is installed, read from the exported core.extension. Each module that
# core.extension lists gives installs_module from drupal.config::core.extension to it, a referenced
# node for a core or contributed module, as core_extension_installs_theme does for themes
# (config/config_object.yaml). A mapped module or theme that core.extension does not list gives
# not_installed_by to core.extension: its code is in the codebase and switched off. The same two
# rules write the attribute installed, value no, on that module or theme. It spreads through the
# grouping kinds to everything inside it, a function, class, route or template, so every row that
# names one of them prints [not installed]. It also goes from a class, interface or trait to its
# methods and properties along php_basic's contains and declares_property, which run from the class
# to the member and do not group. The edge stays: it names the config that decides. A project
# with no exported core.extension gets neither edge nor attribute. installs_module is declared by
# the file; not_installed_by and installed are inferred, because they are drawn from a name the
# list does not hold.

attributes:
- name: installed
  on: [drupal.module, drupal.theme]
  spreads: true
  spreads_along:
  - {kind: contains, to: to}
  - {kind: declares_property, to: to}
  - {kind: has_call_site, to: to}
  - {kind: property_typed_as, to: to}
  - {kind: manager_call_in, to: from}
  mark: not installed
  description: "no on a module or theme in the codebase that core.extension does not list, and on everything inside it"

edge_kinds:
- kind: installs_module
  from: drupal.config_object
  to: drupal.module
  description: "core.extension lists that module as installed"
- kind: not_installed_by
  from: [drupal.module, drupal.theme]
  to: drupal.config_object
  description: "the module or theme is in the codebase, but core.extension does not list it, so it is not installed"

rules:
- rule: core_extension_installs_module
  reads: file
  in: [config]
  match: {file: core.extension, filetype: yaml}
  id: {from: file_stem}
  emits: [{edge: {kind: installs_module, from: this_node, to: {from: [{each: module.*}], template: '{key}', type: drupal.module}}}]
  confidence: declared

- rule: module_not_installed
  reads: map
  match:
    node_type: drupal.module
    follow: [{node: 'drupal.config::core.extension'}]
    unless: [[{incoming_edge: installs_module}]]
  emits:
  - {edge: {kind: not_installed_by, from: this_node, to: matched_node}}
  - {attribute: {name: installed, template: 'no'}}
  confidence: inferred

- rule: theme_not_installed
  reads: map
  match:
    node_type: drupal.theme
    follow: [{node: 'drupal.config::core.extension'}]
    unless: [[{incoming_edge: installs_theme}]]
  emits:
  - {edge: {kind: not_installed_by, from: this_node, to: matched_node}}
  - {attribute: {name: installed, template: 'no'}}
  confidence: inferred
