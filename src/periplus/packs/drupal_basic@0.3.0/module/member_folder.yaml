    node_type: drupal.member_claim
    where: [{id_matches: '^[^:]+::(?<d0>(?<d1>(?<d2>(?<d3>(?<d4>(?<d5>[^|]+)/[^/|]+)/[^/|]+)/[^/|]+)/[^/|]+)/[^/|]+)\|'}]
    follow: [{node: 'drupal.extension_folder::{d5}'}]
    unless:
    - [{node: 'drupal.extension_folder::{d0}'}]
    - [{node: 'drupal.extension_folder::{d1}'}]
    - [{node: 'drupal.extension_folder::{d2}'}]
    - [{node: 'drupal.extension_folder::{d3}'}]
    - [{node: 'drupal.extension_folder::{d4}'}]
  emits: [{edge: {kind: claim_in_folder, from: this_node, to: matched_node}}]
  confidence: declared

- rule: claim_folder_6
  reads: map
  match:
    node_type: drupal.member_claim
    where: [{id_matches: '^[^:]+::(?<d0>(?<d1>(?<d2>(?<d3>(?<d4>(?<d5>(?<d6>[^|]+)/[^/|]+)/[^/|]+)/[^/|]+)/[^/|]+)/[^/|]+)/[^/|]+)\|'}]
    follow: [{node: 'drupal.extension_folder::{d6}'}]
    unless:
    - [{node: 'drupal.extension_folder::{d0}'}]
    - [{node: 'drupal.extension_folder::{d1}'}]
    - [{node: 'drupal.extension_folder::{d2}'}]
    - [{node: 'drupal.extension_folder::{d3}'}]
    - [{node: 'drupal.extension_folder::{d4}'}]
    - [{node: 'drupal.extension_folder::{d5}'}]
  emits: [{edge: {kind: claim_in_folder, from: this_node, to: matched_node}}]
  confidence: declared

- rule: claim_folder_7
  reads: map
  match:
    node_type: drupal.member_claim
    where: [{id_matches: '^[^:]+::(?<d0>(?<d1>(?<d2>(?<d3>(?<d4>(?<d5>(?<d6>(?<d7>[^|]+)/[^/|]+)/[^/|]+)/[^/|]+)/[^/|]+)/[^/|]+)/[^/|]+)/[^/|]+)\|'}]
    follow: [{node: 'drupal.extension_folder::{d7}'}]
    unless:
    - [{node: 'drupal.extension_folder::{d0}'}]
    - [{node: 'drupal.extension_folder::{d1}'}]
    - [{node: 'drupal.extension_folder::{d2}'}]
    - [{node: 'drupal.extension_folder::{d3}'}]
    - [{node: 'drupal.extension_folder::{d4}'}]
    - [{node: 'drupal.extension_folder::{d5}'}]
    - [{node: 'drupal.extension_folder::{d6}'}]
  emits: [{edge: {kind: claim_in_folder, from: this_node, to: matched_node}}]
  confidence: declared
