$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A method or function that holds a string literal equal to the id of a route, a service, a
# configuration object or a queue worker, as a mentions_<thing> edge to that thing,
# with confidence mentioned: the code names the thing as text, and the map does not know what the
# code does with the name. The literal is the internal node of mention/php_literal.yaml. A literal
# joins only a thing the map holds, found or referenced, under exactly that id; any other literal
# makes nothing. A service id joins only when it holds a dot, since a service named like a module,
# such as my_module, shares its name with array keys and channels. drupal_js_basic joins a library
# the same way, in mention/mention_library.yaml.
#
# A literal that equals the ids of two of a route, a service and a configuration object, as a
# route and a service both named my_module.mailer, mentions neither: the text alone cannot say
# which it names. Where a rule already draws an edge from the same method or function to the same
# thing, a route link, a service call, a configuration read or write or a queue use, the mention
# adds nothing. A literal equal to a theme hook's name is no join: in PHP it is as often a render
# element's #type, a plugin id or a mapping id that shares the hook's name.

# One kind per thing named: an end that a map rule reaches keeps the type its kind names, so a kind
# with several end types would retype a referenced route or service.
edge_kinds:
- kind: mentions_route
  cause: touch
  from: [php.method, php.function, drupal.template]
  to: drupal.route
  description: "the code or template holds a text equal to that route's name; it names the route as text, and what it does with it is not known"
- kind: mentions_service
  cause: touch
  from: [php.method, php.function]
  to: drupal.service
  description: "the code holds a text equal to that service's id; it names the service as text, and what it does with it is not known"
- kind: mentions_config
  cause: touch
  from: [php.method, php.function, drupal.template]
  to: drupal.config_object
  description: "the code or template holds a text equal to that configuration object's name; it names the config as text, and what it does with it is not known"
- kind: mentions_queue
  cause: touch
  from: [php.method, php.function]
  to: drupal.queue_worker_plugin
  description: "the code holds a text equal to that queue's name; it names the queue as text, and what it does with it is not known"

rules:
- rule: code_mentions_route
  reads: map
  match:
    node_type: php.callable
    where: [{id_matches: '^(?<caller>.+)$'}]
    follow:
    - edge: names_literal
    - id_matches: '^drupal\.literal::(?<text>.+)$'
    - node: 'drupal.route::{text}'
    unless_matched:
    - [{incoming_edge: links_to_route}, {id_matches: '^{caller}$'}]
    - [{node: 'drupal.service::{text}'}]
    - [{node: 'drupal.config::{text}'}]
  emits: [{edge: {kind: mentions_route, from: this_node, to: matched_node}}]
  confidence: mentioned

- rule: code_mentions_service
  reads: map
  match:
    node_type: php.callable
    where: [{id_matches: '^(?<caller>.+)$'}]
    follow:
    - edge: names_literal
    - id_matches: '^drupal\.literal::(?<text>[^.]+\..+)$'
    - node: 'drupal.service::{text}'
    unless_matched:
    - [{incoming_edge: uses_service}, {id_matches: '^{caller}$'}]
    - [{node: 'drupal.route::{text}'}]
    - [{node: 'drupal.config::{text}'}]
  emits: [{edge: {kind: mentions_service, from: this_node, to: matched_node}}]
  confidence: mentioned

- rule: code_mentions_config
  reads: map
  match:
    node_type: php.callable
    where: [{id_matches: '^(?<caller>.+)$'}]
    follow:
    - edge: names_literal
    - id_matches: '^drupal\.literal::(?<text>.+)$'
    - node: 'drupal.config::{text}'
    unless_matched:
    - [{incoming_edge: reads_config_object}, {id_matches: '^{caller}$'}]
    - [{incoming_edge: edits_config_object}, {id_matches: '^{caller}$'}]
    - [{node: 'drupal.route::{text}'}]
    - [{node: 'drupal.service::{text}'}]
  emits: [{edge: {kind: mentions_config, from: this_node, to: matched_node}}]
  confidence: mentioned

- rule: code_mentions_queue
  reads: map
  match:
    node_type: php.callable
    where: [{id_matches: '^(?<caller>.+)$'}]
    follow:
    - edge: names_literal
    - id_matches: '^drupal\.literal::(?<text>.+)$'
    - node: 'drupal.plugin.queue_worker::{text}'
    unless_matched:
    - [{incoming_edge: uses_queue}, {id_matches: '^{caller}$'}]
  emits: [{edge: {kind: mentions_queue, from: this_node, to: matched_node}}]
  confidence: mentioned
