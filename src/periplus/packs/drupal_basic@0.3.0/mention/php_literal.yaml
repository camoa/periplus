$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A PHP string literal shaped like a Drupal id, as a names_literal edge from the method or function
# around it to an internal drupal.literal node whose id is the literal's text. The map rules of
# mention/mention_php.yaml join that node to the route, service, configuration or other thing whose
# id equals the text; the written map keeps only those joins.
#
# The literal passes only when its whole text is a specific name: it starts with a lowercase letter,
# holds only lowercase letters, digits and the separators . : / _ -, ends with a letter or a digit,
# holds at least one separator, so it has two parts or more, and is at least 8 characters long.
# Short common words, 'cart' or 'status', and text with a space, a capital or a variable in front
# pass over, so a word that only happens to equal an id makes nothing. The rule reads string nodes
# of the parse tree, so text in a comment is never read. A double-quoted string is read up to its
# first variable: "my_module.$name" holds my_module. and passes over, as its text ends in a dot.
# A literal in a class constant or a property default links from the class.

node_types:
- name: drupal.literal
  id_namespace: drupal.literal
  internal: true
  description: "internal: a quoted text shaped like a Drupal id, which map rules join to the thing of that id"

edge_kinds:
- kind: names_literal
  cause: none
  from: [php.method, php.function, php.class_like]
  to: drupal.literal
  description: "internal: the method, function or class holds a string literal shaped like a Drupal id, with that text"

rules:
- rule: php_literal
  reads: file
  in: [source]
  match:
    reference: string
    name_child: string_content
    filetype: php
    where: &literal_where
    - name_matches:
        child: string_content
        pattern: '(?=.{8})(?<text>[a-z][a-z0-9]*(?:[._:/-][a-z0-9]+)+)'
  emits: &literal_emits
  - edge: {kind: names_literal, from: enclosing_declaration, to: {template: '{text}', type: drupal.literal}}
  confidence: mentioned

- rule: php_literal_double_quoted
  reads: file
  in: [source]
  match:
    reference: encapsed_string
    name_child: string_content
    filetype: php
    where: *literal_where
  emits: *literal_emits
  confidence: mentioned
