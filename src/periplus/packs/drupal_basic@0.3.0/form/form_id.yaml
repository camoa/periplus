$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A form id: the name a form class's getFormId returns, as my_form, and the name configuration
# gives a form by. A class under src whose getFormId returns a quoted literal declares the id and
# links to it, read as text as '#theme' is. The configuration that switches a form's protection on
# or off, a captcha point or honeypot.settings, is read in form/form_protection.yaml. A form id no
# class returns, such as a core form's, ends at a referenced node. A getFormId that returns a
# constant or a concatenation gives nothing.
node_types:
- name: drupal.form_id
  description: "A form id: the literal a form class's getFormId returns, or a form name that a form alter hook or a config file gives, which may be a base form id"
  id_namespace: drupal.form_id

edge_kinds:
- kind: form_has_id
  cause: to
  description: "The form class returns that form id as a quoted literal from getFormId()"
  from: php.class
  to: drupal.form_id

rules:
- rule: form_id_returned
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bfunction\s+getFormId\s*\(\s*\)[^{;]*\{\s*return\s+[''"](?<form>[A-Za-z0-9_]+)[''"]\s*;'
  id: {template: '{form}'}
  line: {capture: form}
  emits: [{node: {type: drupal.form_id}}]
  confidence: declared

- rule: form_class_has_id
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bfunction\s+getFormId\s*\(\s*\)[^{;]*\{\s*return\s+[''"](?<form>[A-Za-z0-9_]+)[''"]\s*;'
  id: {template: '{form}'}
  line: {capture: form}
  emits:
  - edge:
      kind: form_has_id
      from: {template: '{psr4_class}', types: [php.class]}
      to: this_node
  confidence: declared
