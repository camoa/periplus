$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A form id: the name a form class's getFormId returns, as my_form, and the name configuration
# gives a form by. A class under src whose getFormId returns a quoted literal declares the id and
# links to it, read as text as '#theme' is. Three contributed configuration keys name core and
# custom form ids, so they are read here: a captcha point's formId, and honeypot.settings'
# unprotected_forms list and form_settings keys. A form id no class returns, such as a core form's,
# ends at a referenced node. A getFormId that returns a constant or a concatenation gives nothing.
node_types:
- name: drupal.form_id
  id_namespace: drupal.form_id

edge_kinds:
- kind: form_has_id
  from: php.class
  to: drupal.form_id
- kind: config_names_form
  from: drupal.config_object
  to: drupal.form_id

rules:
- rule: form_id_returned
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bfunction\s+getFormId\s*\(\s*\)[^{;]*\{\s*return\s+[''"](?<form>[A-Za-z0-9_]+)[''"]\s*;'
  id: {template: '{form}'}
  line: {capture: form}
  emits: [{node: {type: drupal.form_id}}]
  confidence: declared

- rule: form_class_has_id
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bfunction\s+getFormId\s*\(\s*\)[^{;]*\{\s*return\s+[''"](?<form>[A-Za-z0-9_]+)[''"]\s*;'
  id: {template: '{form}'}
  line: {capture: form}
  emits:
  - edge:
      kind: form_has_id
      from: {template: '{psr4_class}', types: [php.class]}
      to: this_node
  confidence: declared

- rule: captcha_point_form
  reads: file
  in: [config, module_config]
  match:
    file: captcha.captcha_point.*
    filetype: yaml
  id: {from: file_stem}
  emits:
  - edge:
      kind: config_names_form
      from: this_node
      to: {from: {key: formId}}
  confidence: declared

- rule: honeypot_forms
  reads: file
  in: [config, module_config]
  match:
    file: honeypot.settings
    filetype: yaml
  id: {from: file_stem}
  emits:
  - edge:
      kind: config_names_form
      from: this_node
      to: {from: {key: unprotected_forms}, each: true}
  - edge:
      kind: config_names_form
      from: this_node
      to: {from: [{each: form_settings.*}], template: '{key}'}
  confidence: declared
