$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A hook_preprocess_HOOK implementation, a function or a method that implements the hook
# preprocess_<hook> (hook/hook.yaml, hook/hook_attribute.yaml, hook/hook_theme_include.yaml), gives
# preprocesses_theme_hook to the theme hook <hook>. A preprocess of a suggestion,
# preprocess_<hook>__<suggestion>, preprocesses its base hook <hook>. The edge is made only when the
# map holds the theme hook, declared by a hook_theme or given by a theme's template of a core
# hook (theme_hook/core_theme_hook.yaml), so a function that only reads as a hook, such as a
# helper named <module>_preprocess_<words>, links to nothing unless a theme hook has that name.
# Inferred, because the hook's name is a convention. hook_preprocess, with no hook, gives nothing.

edge_kinds:
- kind: preprocesses_theme_hook
  from: [php.method, php.function]
  to: drupal.theme_hook

rules:
- rule: preprocess_hook_preprocesses_theme_hook
  reads: map
  match:
    node_type: php.callable
    follow:
    - edge: implements_hook
    - id_matches: '^drupal\.hook::preprocess_(?<hook>[a-z0-9_]+?)(?:__\w+)?$'
    - node: 'drupal.theme_hook::{hook}'
  emits: [{edge: {kind: preprocesses_theme_hook, from: this_node, to: matched_node}}]
  confidence: inferred
