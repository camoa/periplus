$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# '#theme' => 'my_card': the method around it renders the theme hook, of the class the file's path
# names by Drupal's PSR-4 layout, so the rule is inferred. In a module, install, inc, theme or
# profile file the function around it renders the hook. Read as text, as the '#attached' array is.
# A render array in a closure counts the named function around it. One outside any named
# function, as a property default, gives no edge and a skipped row, never a method with no name.
# A method of a class kept in a module file reads as a function of the method's name.
rules:
- rule: theme_hook_rendered_in_method
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '[\[,(\s][''"]#theme[''"]\s*=>\s*[''"](?<hook>[A-Za-z][A-Za-z0-9_]*)[''"]'
  values:
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{hook}'}
  line: {capture: hook}
  emits:
  - edge:
      kind: renders_theme_hook
      from: {template: '{psr4_class}::{method}', types: [php.method]}
      to: this_node
  confidence: inferred

- rule: theme_hook_rendered_in_function
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [module, install, inc, theme, profile]
    text: '[\[,(\s][''"]#theme[''"]\s*=>\s*[''"](?<hook>[A-Za-z][A-Za-z0-9_]*)[''"]'
  values:
    function: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{hook}'}
  line: {capture: hook}
  emits:
  - edge:
      kind: renders_theme_hook
      from: {template: '{function}', types: [php.function]}
      to: this_node
  confidence: inferred
