$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A render array key that hands a theme hook one of its variables: in a method or function that
# renders a hook (renders_theme_hook), a key '#x' equal to a variable the hook declares
# (theme_variable.yaml) is a passes_theme_variable edge to <hook>.x. A reference rule writes each
# '#x' key of an array as a names_render_key edge to the internal node x; a map rule joins it only
# to a variable of a hook the same method or function renders, so '#cache', '#attached' and a key
# the hook does not declare make nothing: Drupal drops a key its hook does not declare.
#
# Inferred: the key and the '#theme' are joined by their method or function, not by their array.
# A method that renders two hooks which declare the same variable links the key to both. A key
# written in double quotes, a key built at run time, and $build['#x'] = ... give nothing.

node_types:
- name: drupal.render_key
  description: "internal: a key '#x' of a render array, before the map joins it to a variable of the hook the same code renders"
  id_namespace: drupal.render_key
  internal: true

edge_kinds:
- kind: names_render_key
  cause: none
  description: "internal: the method or function writes an array key '#x' with that name"
  from: [php.method, php.function]
  to: drupal.render_key
- kind: passes_theme_variable
  cause: from
  description: "the method or function renders that theme hook and writes a render array key '#x' named for that variable of the hook"
  from: [php.method, php.function]
  to: drupal.theme_variable

rules:
- rule: render_key_in_array
  reads: file
  in: [source]
  match:
    reference: array_element_initializer
    name_child: string
    filetype: php
    where: [{name_matches: {child: string, pattern: '''#(?<key>[A-Za-z_][A-Za-z0-9_]*)'''}}]
  emits: [{edge: {kind: names_render_key, from: enclosing_declaration, to: {template: '{key}', type: drupal.render_key}}}]
  confidence: declared

- rule: code_passes_theme_variable
  reads: map
  match:
    node_type: php.callable
    where: [{id_matches: '^(?<caller>.+)$'}]
    follow:
    - edge: names_render_key
    - id_matches: '^drupal\.render_key::(?<key>.+)$'
    - node: '{caller}'
    - edge: renders_theme_hook
    - id_matches: '^drupal\.theme_hook::(?<hook>.+)$'
    - node: 'drupal.theme_variable::{hook}.{key}'
  emits: [{edge: {kind: passes_theme_variable, from: this_node, to: matched_node}}]
  confidence: inferred
