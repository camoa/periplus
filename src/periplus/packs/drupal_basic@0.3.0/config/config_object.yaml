$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Every file in the config folders becomes a node, and a rule that understands more refines it.
# Its dependencies key lists modules, configuration and themes, and its enforced key the same
# three lists; an enforced dependency is a dependency, each cited at its item's line. A file with
# no top-level uuid, in the site's exported configuration folder, is simple configuration,
# provided by the module its name starts with; a configuration entity (it has a uuid) has no owner
# edge. Drupal strips the uuid from a module's config/install and config/optional files, so the
# test cannot tell the two apart there and those files get no owner edge. core.* names no module.
# The owner is the theme of that name when the map holds one, mapped or referenced, as
# mytheme.settings of a custom theme or claro.settings of a theme core.extension lists, by
# config_provided_by_theme; else the mapped or referenced module of that name; else, inferred, a
# referenced module of that name, by config_provided_by. Drupal keeps module and theme names
# apart, so a name the map holds as both makes both edges. core.extension's theme list gives
# installs_theme to each theme it names.
node_types:
- name: drupal.config_object
  id_namespace: drupal.config
# The owner a simple configuration file's name gives, before the map says whether it is a module
# or a theme.
- name: drupal.config_owner
  id_namespace: drupal.config_owner
  internal: true

edge_kinds:
- kind: config_depends
  from: drupal.config_object
  to: drupal.config_object
- kind: depends_on_module
  from:
  - drupal.module
  - drupal.config_object
  to: drupal.module
- kind: depends_on_theme
  from: drupal.config_object
  to: drupal.theme
- kind: config_provided_by
  from: drupal.config_object
  to: drupal.module
- kind: config_provided_by_theme
  from: drupal.config_object
  to: drupal.theme
- kind: config_owner_named
  from: drupal.config_object
  to: drupal.config_owner
- kind: installs_theme
  from: drupal.config_object
  to: drupal.theme

rules:
- rule: any_config_file
  reads: file
  in:
  - config
  - module_config
  match:
    file: '*'
    filetype: yaml
  id:
    from: file_stem
  emits:
  - node:
      type: drupal.config_object
  confidence: declared
- rule: any_config_file_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: '*'
    filetype: yaml
  id:
    from: file_stem
  emits:
  - edge:
      kind: config_depends
      from: this_node
      to:
        from:
          key: dependencies.config
        each: true
  - edge:
      kind: depends_on_module
      from: this_node
      to:
        from:
          key: dependencies.module
        each: true
  - edge:
      kind: config_depends
      from: this_node
      to:
        from:
          key: dependencies.enforced.config
        each: true
  - edge:
      kind: depends_on_module
      from: this_node
      to:
        from:
          key: dependencies.enforced.module
        each: true
  - edge:
      kind: depends_on_theme
      from: this_node
      to:
        from:
          key: dependencies.theme
        each: true
  - edge:
      kind: depends_on_theme
      from: this_node
      to:
        from:
          key: dependencies.enforced.theme
        each: true
  confidence: declared
- rule: simple_config_owner
  reads: file
  in:
  - config
  match:
    file: '*'
    filetype: yml
    where:
    - key:
        name: uuid
        equals: null
  id:
    from: file_stem
  emits:
  - edge:
      kind: config_owner_named
      from: this_node
      to:
        from: []
        template: '{config_owner}'
  confidence: declared
- rule: core_extension_installs_theme
  reads: file
  in: [config]
  match: {file: core.extension, filetype: yaml}
  id: {from: file_stem}
  emits: [{edge: {kind: installs_theme, from: this_node, to: {from: [{each: theme.*}], template: '{key}', type: drupal.theme}}}]
  confidence: declared
- rule: simple_config_provided_by_theme
  reads: map
  match:
    node_type: drupal.config_object
    follow:
    - edge: config_owner_named
    - id_matches: '^drupal\.config_owner::(?<owner>.+)$'
    - node: 'drupal.theme::{owner}'
  emits: [{edge: {kind: config_provided_by_theme, from: this_node, to: matched_node}}]
  confidence: declared
- rule: simple_config_provided_by_module
  reads: map
  match:
    node_type: drupal.config_object
    follow:
    - edge: config_owner_named
    - id_matches: '^drupal\.config_owner::(?<owner>.+)$'
    - node: 'drupal.module::{owner}'
  emits: [{edge: {kind: config_provided_by, from: this_node, to: matched_node}}]
  confidence: declared
# notheme is captured only where the map holds no theme of the name, and nomodule only where it
# holds no module.
- rule: simple_config_provided_by_guess
  reads: map
  match:
    node_type: drupal.config_object
    follow:
    - edge: config_owner_named
    - id_matches: '^drupal\.config_owner::(?<owner>.+)$'
    - try: [{node: 'drupal.theme::{owner}'}]
    - id_matches: '^(?:drupal\.theme::|drupal\.config_owner::(?<notheme>))'
    - node: 'drupal.config_owner::{owner}'
    - try: [{node: 'drupal.module::{owner}'}]
    - id_matches: '^(?:drupal\.module::|drupal\.config_owner::(?<nomodule>))'
  emits: [{edge: {kind: config_provided_by, from: this_node, to: {template: '{owner}{notheme}{nomodule}', type: drupal.module}}}]
  confidence: inferred
