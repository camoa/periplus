$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A configuration object named by self::X or static::X in \Drupal::config(), $this->config(), or
# get() or getEditable() on a config factory, as config_call.yaml reads them: an edge from the
# method or function around the call to the internal drupal.class_constant node <class>::X of the
# class around it. The map rules walk from that class to its parents and interfaces, take the text
# of the nearest one that declares X (constant/constant_text.yaml), and give reads_config_object
# or edits_config_object to that configuration object, an unresolved one when no file declares
# it. A constant the class itself declares also gives config_call.yaml's edge.

edge_kinds:
- kind: names_read_config_constant
  from: [php.method, php.function]
  to: drupal.class_constant
- kind: names_edited_config_constant
  from: [php.method, php.function]
  to: drupal.class_constant

rules:
- rule: config_constant_read_by_drupal
  reads: file
  in: [source]
  match:
    reference: scoped_call_expression
    name_child: [scope, name]
    filetype: php
    where:
    - name_matches: {child: scope, pattern: '\\?Drupal'}
    - name_matches: {child: name, pattern: config}
    - &config_constant {name_matches: {child: arguments, pattern: '\(\s*(?:self|static)::(?<config_constant>[A-Z_][A-Z0-9_]*)\s*\)'}}
  emits: [{edge: {kind: names_read_config_constant, from: enclosing_declaration, to: &config_constant_end {template: '{enclosing_type}::{config_constant}', types: [drupal.class_constant]}}}]
  confidence: declared

- rule: config_constant_read_by_own_method
  reads: file
  in: [source]
  match:
    reference: member_call_expression
    name_child: name
    filetype: php
    where:
    - name_matches: {child: object, pattern: '\$this'}
    - name_matches: {child: name, pattern: config}
    - *config_constant
  emits: [{edge: {kind: names_read_config_constant, from: enclosing_declaration, to: *config_constant_end}}]
  confidence: inferred

- rule: config_constant_read_from_factory
  reads: file
  in: [source]
  match:
    reference: member_call_expression
    name_child: name
    filetype: php
    where:
    - name_matches: {child: object, pattern: &factory_object '(?s).*(?:configFactory|config_factory)(?:\(\))?|(?:\$container|\$this->container|\\?Drupal::getContainer\(\))->get\([''"]config\.factory[''"]\)|\\?Drupal::service\([''"]config\.factory[''"]\)'}
    - name_matches: {child: name, pattern: get}
    - *config_constant
  emits: [{edge: {kind: names_read_config_constant, from: enclosing_declaration, to: *config_constant_end}}]
  confidence: inferred

- rule: config_constant_edited_from_factory
  reads: file
  in: [source]
  match:
    reference: member_call_expression
    name_child: name
    filetype: php
    where:
    - name_matches: {child: object, pattern: *factory_object}
    - name_matches: {child: name, pattern: getEditable}
    - *config_constant
  emits: [{edge: {kind: names_edited_config_constant, from: enclosing_declaration, to: *config_constant_end}}]
  confidence: inferred

- rule: config_read_by_class_constant
  reads: map
  match:
    node_type: php.callable
    follow:
    - edge: names_read_config_constant
    - &class_constant {id_matches: '^drupal\.class_constant::(?<class>[^:]+)::(?<constant>\w+)$'}
    - node: 'php.type::{class}'
    - ancestors: [inherits, implements]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'drupal.class_constant::{owner}::{constant}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<config>.+)$'
  emits: [{edge: {kind: reads_config_object, from: this_node, to: {template: '{config}', types: [drupal.config_object], on_miss: unresolved}}}]
  confidence: inferred

- rule: config_edited_by_class_constant
  reads: map
  match:
    node_type: php.callable
    follow:
    - edge: names_edited_config_constant
    - *class_constant
    - node: 'php.type::{class}'
    - ancestors: [inherits, implements]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'drupal.class_constant::{owner}::{constant}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<config>.+)$'
  emits: [{edge: {kind: edits_config_object, from: this_node, to: {template: '{config}', types: [drupal.config_object], on_miss: unresolved}}}]
  confidence: inferred
