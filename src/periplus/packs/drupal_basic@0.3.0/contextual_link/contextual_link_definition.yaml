$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A contextual link read from a links.contextual file, one per top-level key. Two rules because a
# rule that emits an edge emits no node. A leading backslash on a class or a deriver is dropped.

rules:
- rule: contextual_link_from_links_file
  reads: file
  in: [module_root]
  match: {file: '*.links.contextual', filetype: yaml, each: '*'}
  id: {from: key}
  emits:
  - node: {type: drupal.contextual_link}
  - attribute: {name: title, from: {key: title}}
  - attribute: {name: group, from: {key: group}}
  confidence: declared
- rule: contextual_link_from_links_file_edges
  reads: file
  in: [module_root]
  match: {file: '*.links.contextual', filetype: yaml, each: '*'}
  id: {from: key}
  emits:
  - edge: {kind: links_to_route, from: this_node, to: {from: {key: route_name}}}
  - edge: {kind: link_class, from: this_node, to: {from: {key: class}, pattern: '^\\?(?<class>[^\\].*)$', template: '{class}'}}
  - edge: {kind: link_deriver, from: this_node, to: {from: {key: deriver}, pattern: '^\\?(?<class>[^\\].*)$', template: '{class}'}}
  confidence: declared
