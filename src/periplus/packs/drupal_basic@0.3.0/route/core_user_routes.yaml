$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Routes of core's user module, which no mapped routing file declares: user.login serves
# /user/login and builds the form user_login_form, and user.register serves /user/register and
# builds the form user_register_form, the user entity's register form. user.pass serves
# /user/password and builds user_pass; user.page serves /user; user.logout serves /user/logout;
# user.reset.form serves /user/reset/{uid} and builds user_pass_reset; user.reset and
# user.reset.login serve the one-time login links; user.cancel_confirm serves the account
# cancellation link; and the user entity's routes entity.user.canonical and entity.user.edit_form
# serve /user/{user} and /user/{user}/edit, the second building the entity's default form
# user_form. A path with placeholders also gets a shape_of_route edge from its shape, each {x}
# written as *, as url/path_route.yaml gives a mapped route, so a template's path of that shape
# links to it. A path with placeholders is the id of a rule of its own, which builds each brace in
# normalize, since a template reads {x} as a value's name. user.logout.confirm, which core added in 10.3, is left out: core.extension does
# not say which core release a site runs. Read from core.extension,
# where the module user is listed when it is installed, so a site with exported configuration gets
# them whether or not its code links them. The route, the path and the form id end at referenced
# nodes unless a mapped file declares them, and meet the nodes that links, templates and form
# alters already reach. The fact is core's, written in this rutter, so each edge is inferred. The
# edges sit at core.extension's line for the module.

edge_kinds:
- kind: route_uses_form_id
  cause: from
  from: drupal.route
  to: drupal.form_id
  description: "the core route builds that form, as user.login builds user_login_form"

rules:
- rule: core_user_login_route
  reads: file
  in: [config]
  match: {file: core.extension, filetype: yaml}
  id: {from: file_stem, normalize: [{replace: '^core\.extension$', with: 'user.login'}]}
  emits:
  - edge:
      kind: route_serves_path
      from: this_node
      to: {from: {key: module.user}, template: '/user/login', type: drupal.url_path}
  - edge:
      kind: route_uses_form_id
      from: this_node
      to: {from: {key: module.user}, template: 'user_login_form', type: drupal.form_id}
  confidence: inferred

