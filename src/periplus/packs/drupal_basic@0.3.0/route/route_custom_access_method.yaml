$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A route whose requirements write _custom_access: 'my_module.checker:canView' is checked by the
# method canView of the service's class: an access_checked_by edge to that method, beside the
# access_checked_by_service edge route_requirements.yaml gives to the service. The routing file
# gives an internal drupal.custom_access_method <service>|<method>; a map rule walks from the
# route to the service, to the class its services file gives it, and to the method on that class
# or its nearest ancestor that declares it. Each hop is declared, so the edge is declared. A
# method the map holds on neither, as one a core parent declares, ends at the unresolved
# <class>::<method>; a service no mapped services file declares gives no edge. A value written
# Class::method gives the internal node <class>|:<method>, which the map rule passes over, since
# route_requirements.yaml gives its access_checked_by edge.

node_types:
- name: drupal.custom_access_method
  id_namespace: drupal.custom_access_method
  internal: true

edge_kinds:
- kind: route_names_access_method
  from: drupal.route
  to: drupal.custom_access_method

rules:
- rule: route_custom_access_method
  reads: file
  in: [module_root]
  match:
    file: '*.routing'
    filetype: yaml
    each: '*'
    where: [{has_key: {path: path}}]
  id: {from: key}
  emits:
  - edge:
      kind: route_names_access_method
      from: this_node
      to:
        from: {key: requirements._custom_access}
        pattern: '^\\?(?<service>[^\\:][^:]*):(?<written>:?)(?<method>[^:]+)$'
        template: '{service}|{written}{method}'
        type: drupal.custom_access_method
  confidence: declared

- rule: route_access_checked_by_service_method
  reads: map
  match:
    node_type: drupal.route
    where: [{id_matches: '^drupal\.route::(?<route>.+)$'}]
    follow:
    - edge: route_names_access_method
    - id_matches: '^drupal\.custom_access_method::(?<service>[^|]+)\|(?<method>[^:]+)$'
    - node: 'drupal.service::{service}'
    - edge: service_class
    - id_matches: '^php\.type::(?<type>(?<declarer>.+))$'
    - try:
      - ancestors: [inherits]
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - node: 'php.method::{declarer}::{method}'
    - node: 'drupal.route::{route}'
  emits: [{edge: {kind: access_checked_by, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}}}]
  confidence: declared
