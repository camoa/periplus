$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A route, named by its key in a routing file, and the PHP method or form class that answers it. A
# route requires a permission or a role it needs, and accepts each of permissions or roles any one
# of which lets in. A route's title comes from a PHP method, its access from a service or a PHP
# method, and a parameter's value is loaded as an entity of an entity type.

node_types:
- name: drupal.route
  description: "a route, named by its key in a routing file, or view.<view>.<display> for a page display of a view"
  id_namespace: drupal.route

edge_kinds:
- kind: requires_permission
  cause: touch
  description: "the route's _permission requirement names that permission as needed; permissions joined by commas are each needed"
  from: drupal.route
  to: drupal.permission
- kind: accepts_permission
  cause: touch
  description: "the route's _permission requirement lists that permission joined by plus signs, so any one of the listed permissions lets a user in"
  from: drupal.route
  to: drupal.permission
- kind: handled_by
  description: "the route is handled by that controller method, as the route definition names it"
  from: drupal.route
  to: php.method
  # realizes: to, the to end is the code that carries out the from end; a walk that
  # reaches the from end adds the to end at the same hop.
  realizes: to
- kind: uses_form
  description: "the route's _form default names that form class"
  from: drupal.route
  to: php.class
  # realizes: to, the to end is the code that carries out the from end; a walk that
  # reaches the from end adds the to end at the same hop.
  realizes: to
- kind: titled_by
  cause: from
  description: "the route's _title_callback names that method, written Class::method, which gives the page title"
  from: drupal.route
  to: php.method
- kind: requires_role
  cause: touch
  description: "the route's _role requirement names that role as needed; roles joined by commas are each needed"
  from: drupal.route
  to: drupal.role
- kind: accepts_role
  cause: touch
  description: "the route's _role requirement lists that role joined by plus signs, so any one of the listed roles lets a user in"
  from: drupal.route
  to: drupal.role
- kind: access_checked_by_service
  cause: from
  description: "that service checks access to the route: _custom_access names it as service:method, or its tag's applies_to answers a key in the route's requirements"
  from: drupal.route
  to: drupal.service
- kind: access_checked_by
  cause: from
  description: "the route's _custom_access requirement names that method, written Class::method, to check access"
  from: drupal.route
  to: php.method
- kind: loads_entity_type
  cause: from
  description: "a route parameter of type entity:<type> is loaded as an entity of that type"
  from: drupal.route
  to: drupal.entity_type
