$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A call site $svc->send() or $svc?->send() to Mailer::send, when the method around the call
# assigns $svc = \Drupal::service('my_module.mailer'), $container->get('my_module.mailer') or
# $this->container->get('my_module.mailer'), and a services file gives that service its class. The
# rules read php_basic's call site, local variable and the assigned value as written; the method is
# looked up on the class and then its ancestors through extends. A method no class in the map
# declares lands unresolved under the service's class. The id is read in single or double quotes.
# Inferred: the services file, not the call, names the class.
#
# Limits: a variable also assigned a value that is not one of these three forms gives no edge here.
# A variable assigned two services in one method joins each call to both classes, so one of the two
# edges is false. A service the services files do not declare, a service named by a variable, and
# a call in a plain function such as a hook give no edge; the call site stays.
rules:

- rule: calls_through_local_service
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<class>[^:]+)::(?<meth>[^:]+)::\$(?<var>(?!this->)\w+)->(?<method>\w+))$'}]
    follow: &service_walk
    - node: 'php.local_variable::{class}::{meth}::${var}'
    - edge: local_assigned
    - id_matches: '^php\.local_value::[^:]+::\$\w+=(?:\\?Drupal::service|\$container->get|\$this->container->get)\(\s*[''"](?<svc>[\w.-]+)[''"]\s*\)$'
    - node: 'drupal.service::{svc}'
    - edge: service_class
    - id_matches: '^php\.type::(?<type>(?<declarer>.+))$'
    - try:
      - node: 'php.type::{type}'
      - ancestors: [inherits]
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - node: 'php.method::{declarer}::{method}'
    - node: 'php.call_site::{site}'
    - edge: call_site_in
    unless: &other_value
    - - node: 'php.local_variable::{class}::{meth}::${var}'
      - edge: local_assigned
      - id_matches: '^php\.local_value::[^:]+::\$\w+=(?!(?:\\?Drupal::service|\$container->get|\$this->container->get)\(\s*[''"][\w.-]+[''"]\s*\)$)'
  emits: &calls_edge [{edge: {kind: calls, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}}}]
  confidence: inferred

- rule: calls_through_local_service_nullsafe
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<class>[^:]+)::(?<meth>[^:]+)::\$(?<var>(?!this\?->)\w+)\?->(?<method>\w+))$'}]
    follow: *service_walk
    unless: *other_value
  emits: *calls_edge
  confidence: inferred
