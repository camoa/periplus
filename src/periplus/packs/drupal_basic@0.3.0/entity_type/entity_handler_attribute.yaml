$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# The handlers of an entity type declared by the ContentEntityType or ConfigEntityType attribute:
# each key of the handlers argument whose value is written Name::class, resolved through the
# file's imports and namespace, as a names_<key> edge from the class the attribute sits on. One
# rule per key, and one per form operation; entity_handler.yaml joins them to the entity type.
#
# Limits: a value written as text, such as 'Drupal\mymod\MyStorage', gives no edge.

rules:
- rule: access_handler_from_attribute
  reads: file
  in: [entity_type_classes]
  match:
    reference: argument
    name_child: name
    filetype: php
    where:
    - name_matches: {child: name, pattern: handlers}
    - name_matches: {child: array_creation_expression, pattern: '(?s)\[.*''access''\s*=>\s*(?<handler>\\?[A-Za-z_][\w\\]*)::class.*'}
  emits:
  - edge:
      kind: names_access_handler
      from: enclosing_declaration
      to: {template: '{handler}', resolve: [full_if_prefixed: "\\", bound_first_segment, prefix_with: namespace], types: [drupal.class_ref]}
  confidence: declared

