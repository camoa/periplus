$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A menu link, named by its key in a links.menu file. links_to_route starts at a menu link, a
# local action, a local task, a contextual link, or the method or function that names a route in a
# call (route/route_call.yaml).

node_types:
- name: drupal.menu_link
  id_namespace: drupal.menu_link

edge_kinds:
- kind: links_to_route
  from:
  - drupal.menu_link
  - drupal.local_action
  - drupal.local_task
  - drupal.contextual_link
  - php.class
  - php.function
  - php.method
  to: drupal.route
- kind: child_of_link
  from: drupal.menu_link
  to: drupal.menu_link
