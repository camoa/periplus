$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A queue worker plugin declared by the QueueWorker attribute on its class. Two rules because a rule
# that emits an edge emits no node. An id that is not a text literal makes no plugin and is listed
# under skipped in the map report.

rules:
- rule: queue_worker_from_attribute
  reads: file
  in:
  - queue_worker_classes
  match:
    attribute: Drupal\Core\Queue\Attribute\QueueWorker
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.queue_worker_plugin
  confidence: declared
- rule: queue_worker_from_attribute_edges
  reads: file
  in:
  - queue_worker_classes
  match:
    attribute: Drupal\Core\Queue\Attribute\QueueWorker
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
