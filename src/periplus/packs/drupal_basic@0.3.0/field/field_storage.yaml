$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A storage is the field itself, one per entity type; many instances point at one storage.
# An instance belongs to a bundle; a block type is one. A storage belongs to an entity type.

node_types:
- name: drupal.field_storage
  parent: drupal.config_object
- name: drupal.field_instance
  parent: drupal.config_object

edge_kinds:
- kind: stored_by
  from: drupal.field_instance
  to: drupal.field_storage
- kind: field_of
  from: drupal.field_instance
  to: drupal.bundle
- kind: storage_of
  from: drupal.field_storage
  to: drupal.entity_type
