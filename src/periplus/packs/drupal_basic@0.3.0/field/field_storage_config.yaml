$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A field storage read from its config file, and the entity type its entity_type key names.

rules:
- rule: field_storage_from_config
  reads: file
  in:
  - config
  - module_config
  match:
    file: field.storage.*
    filetype: yaml
  id:
    from: file_stem
  emits:
  - node:
      type: drupal.field_storage
  - attribute:
      name: field_type
      from:
        key: type
  - attribute:
      name: cardinality
      from:
        key: cardinality
  confidence: declared
- rule: field_storage_from_config_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: field.storage.*
    filetype: yaml
  id:
    from: file_stem
  emits:
  - edge:
      kind: storage_of
      from: this_node
      to:
        from:
          key: entity_type
  confidence: declared
