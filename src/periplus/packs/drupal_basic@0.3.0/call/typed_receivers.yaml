$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A Drupal call whose object is known by its declared type, not by its name, to the same ends the
# name-based rules of call/call.yaml, config/config_call.yaml and queue_worker/queue_call.yaml
# reach. The object is a parameter of the class or trait method, or plain function, around the
# call, $etm, or a property of $this, $this->types. The first argument is a text literal.
#
# - An entity type manager: getStorage, getViewBuilder, getListBuilder, getFormObject,
#   getAccessControlHandler, getHandler and getDefinition give uses_entity_type.
# - A service container: get gives uses_service. Symfony's ContainerInterface, Drupal's
#   ContainerInterface and Container, and the PSR ContainerInterface all count: Drupal's container
#   implements each, and get takes a service id on every one of them.
# - A config factory: get gives reads_config_object and getEditable gives edits_config_object.
# - A queue factory: get gives uses_queue.
#
# The types are Drupal core's, Symfony's and PSR's, outside the mapped code, so the join is on the
# full name the declared type resolves to through the file's imports and namespace. The anchors
# manager_type, container_type, config_type and queue_type hold the names, one list per family, on
# the first rule that reads each. A module's own class of the same short name resolves to its own
# full name and joins nothing.
#
# Each call on a parameter or a property of $this to one of these methods, with a quoted first
# argument, is kept as an internal drupal.typed_call node, <class>::<method>::<object>-><called
# method>(<arguments>), or <function>::<object>-><called method>(<arguments>) in a plain function,
# joined to the method or function around it. The map rules read the object's declared type in
# three ways: a parameter's type; a property's declared type, on the property, on a promoted
# constructor parameter or in a @var docblock, on the call's class or its nearest ancestor that
# declares the property; and the type of the parameter an untyped property is assigned from,
# $this->etm = $etm, in the call's class or its nearest ancestor that declares the property. The
# edge runs from the method or function around the call, at the call's line. Inferred: the
# declared type is a claim about what runs. The five manager methods on a typed property are
# call/call.yaml's entity_call_through_typed_manager's. A call another rule maps by its object's
# name, such as $entity_type_manager->getStorage('node'), gets the same edge, which the map holds
# once with a provenance row from each rule.
#
# A call gets no edge when the map cannot tell which object it runs on: a parameter assigned in
# the body; a parameter whose name a closure or arrow function in the same method or function
# declares as its own; and an untyped property assigned more
# than one value. The internal drupal.closure_parameter node, <class>::<method>::$<name> or
# <function>::$<name>, marks such a name. A variable or constant argument makes no node here, and
# php_basic's call site for the call stays.

node_types:
- name: drupal.typed_call
  id_namespace: drupal.typed_call
  internal: true
- name: drupal.closure_parameter
  id_namespace: drupal.closure_parameter
  internal: true

edge_kinds:
- kind: typed_call_in
  from: drupal.typed_call
  to: [php.method, php.function]

rules:
# $etm->getStorage('node') and $this->types->getDefinition('user') in a class's method. The
# holder keeps a named function nested in a method to the function twin below.
- rule: typed_call
  reads: file
  in: [source]
  match: &method_match
    declaration: member_call_expression
    name_child: object
    filetype: php
    holder: class_declaration
    where: &call_where
    - name_matches: {child: object, pattern: '\$(?!this$)\w+|\$this->\w+'}
    - name_matches: {child: name, pattern: 'getStorage|getViewBuilder|getListBuilder|getFormObject|getAccessControlHandler|getHandler|getDefinition|get|getEditable'}
    - name_matches: {child: arguments, pattern: '(?s)\(\s*[''"].*'}
  id: &method_id
    from: [enclosing_type, enclosing_method, declared_name, name, arguments]
    template: "{enclosing_type}::{enclosing_method}::{declared_name}->{name}{arguments}"
  emits: [{node: {type: drupal.typed_call}}]
  confidence: declared

- rule: typed_call_in
  reads: file
  in: [source]
  match: *method_match
  id: *method_id
  emits: [{edge: {kind: typed_call_in, from: this_node, to: enclosing_method}}]
  confidence: declared

# The same call in a trait's method.
- rule: typed_call_in_trait
  reads: file
  in: [source]
  match: &trait_match
    declaration: member_call_expression
    name_child: object
    filetype: php
    holder: trait_declaration
    where: *call_where
  id: *method_id
  emits: [{node: {type: drupal.typed_call}}]
  confidence: declared

- rule: typed_call_in_trait_in
  reads: file
  in: [source]
  match: *trait_match
  id: *method_id
  emits: [{edge: {kind: typed_call_in, from: this_node, to: enclosing_method}}]
  confidence: declared

# The same call in a plain function, such as a hook in a .module file.
- rule: typed_call_in_function
  reads: file
  in: [source]
  match: &function_match
    declaration: member_call_expression
    name_child: object
    filetype: php
    holder: function_definition
    where: *call_where
  id: &function_id
    from: [enclosing_type, declared_name, name, arguments]
    template: "{enclosing_type}::{declared_name}->{name}{arguments}"
  emits: [{node: {type: drupal.typed_call}}]
  confidence: declared

- rule: typed_call_in_function_in
  reads: file
  in: [source]
  match: *function_match
  id: *function_id
  emits: [{edge: {kind: typed_call_in, from: this_node, to: enclosing_class}}]
  confidence: declared

# A parameter of a closure or arrow function, in a method or in a plain function. A call in a
# closure keeps the id of the same call in the method or function around it, so the closure's own
# parameter of that name marks the name.
- rule: closure_parameter
  reads: file
  in: [source]
  match:
    declaration: simple_parameter
    name_child: name
    filetype: php
    where: [{within: &closures [anonymous_function, arrow_function]}]
  id:
    from: [enclosing_type, enclosing_method, declared_name]
    template: "{enclosing_type}::{enclosing_method}::{declared_name}"
  emits: [{node: {type: drupal.closure_parameter}}]
  confidence: declared

- rule: closure_parameter_in_function
  reads: file
  in: [source]
  match:
    declaration: simple_parameter
    name_child: name
    filetype: php
    holder: function_definition
    where: [{within: *closures}]
  id:
    from: [enclosing_type, declared_name]
    template: "{enclosing_type}::{declared_name}"
  emits: [{node: {type: drupal.closure_parameter}}]
  confidence: declared

# --- Entity type manager -----------------------------------------------------------------------

# $etm->getStorage('node') on a parameter typed EntityTypeManagerInterface. The holder is the
# method, <class>::<method>, or the function.
- rule: entity_call_on_typed_parameter
  reads: map
  match:
    node_type: drupal.typed_call
    where:
    - id_matches: '^drupal\.typed_call::(?<call>(?<holder>[^$]+)::\$(?<var>\w+)->(?:getStorage|getViewBuilder|getListBuilder|getFormObject|getAccessControlHandler|getHandler|getDefinition)\(\s*[''"](?<name>[\w.]+)[''"].*)$'
    follow:
    - node: 'php.parameter::{holder}::${var}'
    - edge: parameter_typed_as
    - id_matches: &manager_type '^php\.(?:parameter|property)_type::[^:]+::\$\w+::\\?Drupal\\Core\\Entity\\EntityTypeManager(?:Interface)?$'
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
    unless: &parameter_unless
    - [{node: 'php.local_variable::{holder}::${var}'}]
    - [{node: 'drupal.closure_parameter::{holder}::${var}'}]
  emits: &entity_edge [{edge: {kind: uses_entity_type, from: matched_node, to: {template: '{name}', types: [drupal.entity_type]}}}]
  confidence: inferred

# $this->types->getDefinition('user') on a property typed EntityTypeManagerInterface.
- rule: entity_call_on_typed_property
  reads: map
  match:
    node_type: drupal.typed_call
    where:
    - id_matches: '^drupal\.typed_call::(?<call>(?<class>[^:]+)::[^:]+::\$this->(?<member>\w+)->(?:getHandler|getDefinition)\(\s*[''"](?<name>[\w.]+)[''"].*)$'
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - edge: property_typed_as
    - id_matches: *manager_type
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
  emits: *entity_edge
  confidence: inferred

# $this->etm->getStorage('node') on an untyped property, $this->etm = $etm, assigned from a
# parameter typed EntityTypeManagerInterface. A second assigned value, from another parameter or
# another method, or not a parameter at all, stops the edge.
- rule: entity_call_on_assigned_property
  reads: map
  match:
    node_type: drupal.typed_call
    where:
    - id_matches: '^drupal\.typed_call::(?<call>(?<class>[^:]+)::[^:]+::\$this->(?<member>\w+)->(?:getStorage|getViewBuilder|getListBuilder|getFormObject|getAccessControlHandler|getHandler|getDefinition)\(\s*[''"](?<name>[\w.]+)[''"].*)$'
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - node: 'php.member_assignment::{owner}::$this->{member}'
    - edge: assigned_value
    - id_matches: &assigned_from_parameter '^php\.member_assignment_value::[^:]+::(?<setter>[^:]+)::\$this->\w+=\$(?<parameter>\w+)$'
    - node: 'php.parameter::{owner}::{setter}::${parameter}'
    - edge: parameter_typed_as
    - id_matches: *manager_type
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
    unless_matched: &assigned_twice
    - [{node: 'php.member_assignment::{owner}::$this->{member}'}, {edge: assigned_value}, {id_matches: '^php\.member_assignment_value::[^:]+::(?:(?!{setter}::)[^:]+::\$this->\w+=|[^:]+::\$this->\w+=(?!\${parameter}$))'}]
  emits: *entity_edge
  confidence: inferred

# --- Service container -------------------------------------------------------------------------

# $c->get('my_module.helper') on a parameter typed by a container interface.
- rule: service_get_on_typed_parameter
  reads: map
  match:
    node_type: drupal.typed_call
    where:
    - id_matches: &get_on_parameter '^drupal\.typed_call::(?<call>(?<holder>[^$]+)::\$(?<var>\w+)->get\(\s*[''"](?<name>[\w.]+)[''"].*)$'
    follow:
    - node: 'php.parameter::{holder}::${var}'
    - edge: parameter_typed_as
    - id_matches: &container_type '^php\.(?:parameter|property)_type::[^:]+::\$\w+::\\?(?:Symfony\\Component\\DependencyInjection\\ContainerInterface|Drupal\\Component\\DependencyInjection\\Container(?:Interface)?|Psr\\Container\\ContainerInterface)$'
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
    unless: *parameter_unless
  emits: &service_edge [{edge: {kind: uses_service, from: matched_node, to: {template: '{name}', types: [drupal.service]}}}]
  confidence: inferred

- rule: service_get_on_typed_property
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: &get_on_property '^drupal\.typed_call::(?<call>(?<class>[^:]+)::[^:]+::\$this->(?<member>\w+)->get\(\s*[''"](?<name>[\w.]+)[''"].*)$'}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - edge: property_typed_as
    - id_matches: *container_type
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
  emits: *service_edge
  confidence: inferred

- rule: service_get_on_assigned_property
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: *get_on_property}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - node: 'php.member_assignment::{owner}::$this->{member}'
    - edge: assigned_value
    - id_matches: *assigned_from_parameter
    - node: 'php.parameter::{owner}::{setter}::${parameter}'
    - edge: parameter_typed_as
    - id_matches: *container_type
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
    unless_matched: *assigned_twice
  emits: *service_edge
  confidence: inferred

# --- Config factory ----------------------------------------------------------------------------

# $cf->get('my_module.settings') on a parameter typed ConfigFactoryInterface.
- rule: config_get_on_typed_parameter
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: *get_on_parameter}]
    follow:
    - node: 'php.parameter::{holder}::${var}'
    - edge: parameter_typed_as
    - id_matches: &config_type '^php\.(?:parameter|property)_type::[^:]+::\$\w+::\\?Drupal\\Core\\Config\\ConfigFactory(?:Interface)?$'
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
    unless: *parameter_unless
  emits: &read_edge [{edge: {kind: reads_config_object, from: matched_node, to: {template: '{name}', types: [drupal.config_object], on_miss: unresolved}}}]
  confidence: inferred

- rule: config_get_on_typed_property
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: *get_on_property}]
    follow: &config_typed_property
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - edge: property_typed_as
    - id_matches: *config_type
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
  emits: *read_edge
  confidence: inferred

- rule: config_get_on_assigned_property
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: *get_on_property}]
    follow: &config_assigned_property
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - node: 'php.member_assignment::{owner}::$this->{member}'
    - edge: assigned_value
    - id_matches: *assigned_from_parameter
    - node: 'php.parameter::{owner}::{setter}::${parameter}'
    - edge: parameter_typed_as
    - id_matches: *config_type
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
    unless_matched: *assigned_twice
  emits: *read_edge
  confidence: inferred

# $cf->getEditable('my_module.settings'), as the three rules above.
- rule: config_edit_on_typed_parameter
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: '^drupal\.typed_call::(?<call>(?<holder>[^$]+)::\$(?<var>\w+)->getEditable\(\s*[''"](?<name>[\w.]+)[''"].*)$'}]
    follow:
    - node: 'php.parameter::{holder}::${var}'
    - edge: parameter_typed_as
    - id_matches: *config_type
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
    unless: *parameter_unless
  emits: &edit_edge [{edge: {kind: edits_config_object, from: matched_node, to: {template: '{name}', types: [drupal.config_object], on_miss: unresolved}}}]
  confidence: inferred

- rule: config_edit_on_typed_property
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: &edit_on_property '^drupal\.typed_call::(?<call>(?<class>[^:]+)::[^:]+::\$this->(?<member>\w+)->getEditable\(\s*[''"](?<name>[\w.]+)[''"].*)$'}]
    follow: *config_typed_property
  emits: *edit_edge
  confidence: inferred

- rule: config_edit_on_assigned_property
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: *edit_on_property}]
    follow: *config_assigned_property
    unless_matched: *assigned_twice
  emits: *edit_edge
  confidence: inferred

# --- Queue factory -----------------------------------------------------------------------------

# $q->get('my_queue') on a parameter typed QueueFactory or QueueFactoryInterface.
- rule: queue_get_on_typed_parameter
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: *get_on_parameter}]
    follow:
    - node: 'php.parameter::{holder}::${var}'
    - edge: parameter_typed_as
    - id_matches: &queue_type '^php\.(?:parameter|property)_type::[^:]+::\$\w+::\\?Drupal\\Core\\Queue\\QueueFactory(?:Interface)?$'
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
    unless: *parameter_unless
  emits: &queue_edge [{edge: {kind: uses_queue, from: matched_node, to: {template: '{name}', types: [drupal.queue_worker_plugin]}}}]
  confidence: inferred

- rule: queue_get_on_typed_property
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: *get_on_property}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - edge: property_typed_as
    - id_matches: *queue_type
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
  emits: *queue_edge
  confidence: inferred

- rule: queue_get_on_assigned_property
  reads: map
  match:
    node_type: drupal.typed_call
    where: [{id_matches: *get_on_property}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - node: 'php.member_assignment::{owner}::$this->{member}'
    - edge: assigned_value
    - id_matches: *assigned_from_parameter
    - node: 'php.parameter::{owner}::{setter}::${parameter}'
    - edge: parameter_typed_as
    - id_matches: *queue_type
    - node: 'drupal.typed_call::{call}'
    - edge: typed_call_in
    unless_matched: *assigned_twice
  emits: *queue_edge
  confidence: inferred
