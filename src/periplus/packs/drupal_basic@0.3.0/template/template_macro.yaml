$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A Twig file of macros not named .html.twig, as misc/macros.twig, is a template named by its stem,
# macros, when it defines a macro; the node sits at the line of each macro. A template or a
# component that imports it, {% import "x.twig" as m %} or {% from "x.twig" import a, b %}, gets
# template_includes or component_includes_template to it, as an include of a .html.twig file does
# (template/template.yaml). Read as text; a name with a dot before .twig, an import of _self or of
# a variable, and an import in a Twig file that is neither a .html.twig template nor a component
# give nothing.

rules:
- rule: macro_file
  reads: file
  in: [module_root, theme_root]
  match: {file: '*', filetype: drupal_template_text, text: '\{%-?\s*macro\s+\w+'}
  values:
    stem: {template: '{file_stem}', normalize: [{replace: '^.*\..*$', with: ''}]}
  id: {template: '{stem}'}
  emits: [{node: {type: drupal.template}}]
  confidence: declared

- rule: macro_file_imported_in_template
  reads: file
  in: [module_root, theme_root]
  match:
    file: '*.html'
    filetype: drupal_template_text
    text: '\b(?:import|from)\b\s*[''"](?:[^''"]*/)?(?<name>[^''"/:.]+)\.twig[''"]'
  id: {template: '{template_name}'}
  emits: [{edge: {kind: template_includes, from: this_node, to: {from: {capture: name}}}}]
  confidence: declared

- rule: macro_file_imported_in_component
  reads: file
  in: [module_root, theme_root]
  match:
    file: '*'
    filetype: drupal_template_text
    text: '\b(?:import|from)\b\s*[''"](?:[^''"]*/)?(?<name>[^''"/:.]+)\.twig[''"]'
  id: {template: '{component_name}'}
  emits: [{edge: {kind: component_includes_template, from: this_node, to: {from: {capture: name}}}}]
  confidence: declared
