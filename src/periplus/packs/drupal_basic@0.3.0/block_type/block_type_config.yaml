$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A block type read from its config file, as the bundle rules read theirs: block_content.type.basic
# is the bundle block_content.basic.

rules:
- rule: block_type_from_config
  reads: file
  in:
  - config
  - module_config
  match:
    file: block_content.type.*
    filetype: yaml
  id:
    from: file_stem
    normalize:
    - {replace: '^block_content\.type\.', with: 'block_content.'}
  emits:
  - node:
      type: drupal.block_type
  - attribute:
      name: label
      from:
        key: label
  confidence: declared
- rule: block_type_from_config_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: block_content.type.*
    filetype: yaml
  id:
    from: file_stem
    normalize:
    - {replace: '^block_content\.type\.', with: 'block_content.'}
  emits:
  - edge:
      kind: configured_by
      from: this_node
      to:
        from:
          key: id
        template: 'block_content.type.{id}'
  - edge:
      kind: bundle_of
      from: this_node
      to:
        from:
          key: id
        template: 'block_content'
  confidence: declared
