$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A display says how a bundle is edited or rendered, one config object per mode. A form display
# and a view display of one bundle carry the same internal id, so the id comes from the file name.
# A view mode or a form mode is the config object core.entity_view_mode.<entity type>.<mode>; the
# mode default has no config object, so a display in it has no in_mode edge.

node_types:
- name: drupal.form_display
  parent: drupal.config_object
- name: drupal.view_display
  parent: drupal.config_object
- name: drupal.form_mode
  parent: drupal.config_object
- name: drupal.view_mode
  parent: drupal.config_object

edge_kinds:
- kind: displays
  from: [drupal.form_display, drupal.view_display]
  to: drupal.bundle
- kind: shows_field
  from: [drupal.form_display, drupal.view_display]
  to: drupal.field_instance
- kind: in_mode
  from: [drupal.form_display, drupal.view_display]
  to: [drupal.form_mode, drupal.view_mode]
- kind: mode_of
  from: [drupal.form_mode, drupal.view_mode]
  to: drupal.entity_type
