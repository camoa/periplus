    entity_form_display: entity_form_display, entity_form_mode: entity_form_mode,
    entity_view_display: entity_view_display, entity_view_mode: entity_view_mode,
    field_config: field_config, field_storage_config: field_storage_config, file: file,
    filter_format: filter_format, image_style: image_style,
    language_content_settings: language_content_settings, media: media, media_type: media_type,
