$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A library, named module/name as every dependency on it writes it.

node_types:
- name: drupal.library
  description: "An asset library, one top-level key of a libraries.yml file, named <extension>/<key>"
  id_namespace: drupal.library

edge_kinds:
- kind: depends_on_library
  cause: from
  description: "The library lists that library under its dependencies key in a libraries.yml file"
  from: drupal.library
  to: drupal.library
