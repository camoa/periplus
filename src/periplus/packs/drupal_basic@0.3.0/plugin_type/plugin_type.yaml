$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A plugin type: an attribute class that extends core's attribute Plugin, or an annotation class
# that extends core's annotation Plugin, named by that class's full name. Each class that carries
# its attribute or annotation is a plugin of that type, and a plugin manager's constructor names it.

node_types:
- name: drupal.plugin_type
  description: "A plugin type, named by the full class name of its attribute or annotation class, which extends core's Plugin attribute or annotation"
  id_namespace: drupal.plugin_type

edge_kinds:
- kind: plugin_type_attribute
  cause: none
  description: "The plugin type is defined by that attribute class, which extends core's Plugin attribute"
  from: drupal.plugin_type
  to: php.class
- kind: plugin_of_type
  cause: to
  description: "The class is a plugin of that plugin type: it carries the type's attribute, or the first annotation of its docblock is the type's annotation class"
  from: php.class
  to: drupal.plugin_type
- kind: manages_plugin_type
  cause: from
  description: "The constructor of a plugin manager names that plugin type's attribute class as the fifth argument of parent::__construct"
  from: php.method
  to: drupal.plugin_type
