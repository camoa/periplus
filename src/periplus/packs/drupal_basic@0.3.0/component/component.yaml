$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A single-directory component, named by its component file: way_card.component is way_card.

node_types:
- name: drupal.component
  id_namespace: drupal.component

rules:
- rule: component_file
  reads: file
  in:
  - module_root
  - theme_root
  match:
    file: '*.component'
    filetype: yaml
  id:
    from: file_stem
    normalize:
    - replace: \.component$
      with: ''
  emits:
  - node:
      type: drupal.component
  - attribute:
      name: name
      from:
        key: name
  confidence: declared
