$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A local action, named by its key in a links.action file.

node_types:
- name: drupal.local_action
  description: "A local action, one top-level key of a module's links.action.yml file"
  id_namespace: drupal.local_action

edge_kinds:
- kind: appears_on_route
  description: "The local action shows on that route, named in its appears_on list"
  from: drupal.local_action
  to: drupal.route
