$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A views field plugin declared by the ViewsField attribute on its class. The id is the first argument,
# written alone or named id, and an attribute rule reads one of the two, so there is one node rule
# and one edge rule for each. An id that is not a text literal makes no plugin and is listed under
# skipped in the map report.

rules:
- rule: views_field_from_attribute
  reads: file
  in:
  - views_field_classes
  match:
    attribute: Drupal\views\Attribute\ViewsField
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: '0'
    must_be: string_literal
  emits:
  - node:
      type: drupal.views_field_plugin
  confidence: declared
- rule: views_field_from_named_attribute
  reads: file
  in:
  - views_field_classes
  match:
    attribute: Drupal\views\Attribute\ViewsField
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.views_field_plugin
  confidence: declared
- rule: views_field_from_attribute_edges
  reads: file
  in:
  - views_field_classes
  match:
    attribute: Drupal\views\Attribute\ViewsField
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: '0'
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
- rule: views_field_from_named_attribute_edges
  reads: file
  in:
  - views_field_classes
  match:
    attribute: Drupal\views\Attribute\ViewsField
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
