$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A generic entity hook that acts on one entity type by testing it, as
#
#   function my_module_entity_presave(EntityInterface $entity) {
#     if ($entity->getEntityTypeId() === 'user') { ... }
#   }
#
# gives an acts_on_entity_type edge from the function to drupal.entity_type::user. hook/hook.yaml
# links hook_ENTITY_TYPE_<operation> hooks to their type by name; the generic entity_ hooks act on
# every type and get that link only from a test like this one.
#
# Two rules. A file rule reads an if whose whole condition is $entity->getEntityTypeId() compared
# with == or === to a quoted name, and whose block does not open with return, in a function of a
# module, install, inc, theme or profile file, and writes an internal node <function>|<type>. The
# function is the nearest function around the test; a test inside a closure writes function|<type>,
# which names no PHP function and joins nothing. A map rule joins that node to the function only
# when the function implements one of the generic entity hooks: entity_create, entity_presave,
# entity_insert, entity_update, entity_predelete, entity_delete, entity_load, entity_view,
# entity_view_alter, entity_build_defaults_alter, entity_prepare_form, entity_access and
# entity_translation_insert. A test with != or !==, which leaves the type out, a type held in a
# variable or a constant, a receiver named other than $entity, a test joined to another with && or
# ||, and a test outside an if, as in an arrow function, give nothing.
#
# Mentioned: a quoted name compared in a condition, not a declaration, says which type it is.

node_types:
# One entity type one function tests, its id <function>|<type>.
- name: drupal.entity_type_test
  id_namespace: drupal.entity_type_test
  internal: true
  description: "internal: a function's test of $entity->getEntityTypeId() against a quoted entity type name"

edge_kinds:
- kind: acts_on_entity_type
  from: php.function
  to: drupal.entity_type
  description: "the generic entity hook acts on that entity type only, as it tests $entity->getEntityTypeId() against its name; a name written as text"

rules:
- rule: entity_type_tested_in_function
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [module, install, inc, theme, profile]
    text: '\bif\s*\(\s*\$entity->getEntityTypeId\(\)\s*===?\s*[''"](?<etype>[a-z][a-z0-9_]*)[''"]\s*\)\s*\{(?!\s*return\b)'
  values:
    function: {from: {enclosing: any_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}, {replace: '^function\s+', with: ''}]}
  id: {template: '{function}|{etype}'}
  line: {capture: etype}
  emits: [{node: {type: drupal.entity_type_test}}]
  confidence: mentioned

- rule: entity_hook_acts_on_tested_type
  reads: map
  match:
    node_type: drupal.entity_type_test
    where: [{id_matches: '^drupal\.entity_type_test::(?<fn>\w+)\|(?<etype>\w+)$'}]
    follow:
    - node: 'php.function::{fn}'
    - edge: implements_hook
    - id_matches: '^drupal\.hook::entity_(?:create|presave|insert|update|predelete|delete|load|view|view_alter|build_defaults_alter|prepare_form|access|translation_insert)$'
    - incoming_edge: implements_hook
    - id_matches: '^php\.function::{fn}$'
  emits: [{edge: {kind: acts_on_entity_type, from: matched_node, to: {template: '{etype}', types: [drupal.entity_type]}}}]
  confidence: mentioned
