$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A bundle read from its config file, two rules per bundle entity type's config prefix: the node
# with its label, and its edges. The prefix names the entity type, so node.type.article is the
# bundle node.article of the entity type node. An edge rule's this_node is the bundle, and its
# ends are built from the key holding the bundle's machine name. The block type is read by its own
# rules.

rules:
- rule: bundle_comment_from_config
  reads: file
  in:
  - config
  - module_config
  match:
    file: comment.type.*
    filetype: yaml
  id:
    from: file_stem
    normalize:
    - {replace: '^comment\.type\.', with: 'comment.'}
  emits:
  - node:
      type: drupal.bundle
  - attribute:
      name: label
      from:
        key: label
  confidence: declared
- rule: bundle_comment_from_config_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: comment.type.*
    filetype: yaml
  id:
    from: file_stem
    normalize:
    - {replace: '^comment\.type\.', with: 'comment.'}
  emits:
  - edge:
      kind: configured_by
      from: this_node
      to:
        from:
          key: id
        template: 'comment.type.{id}'
  - edge:
      kind: bundle_of
      from: this_node
      to:
        from:
          key: id
        template: 'comment'
  confidence: declared
