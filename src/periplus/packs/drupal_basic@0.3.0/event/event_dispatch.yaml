- rule: dispatch_first_q_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{r_ev}|disp~{recv}|{owner}|n#{key}', resolve: [{full_if_prefixed: '\'}, bound_first_segment], separator: '\'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{r_ev}', resolve: [{full_if_prefixed: '\'}, bound_first_segment], separator: '\', types: [drupal.event_text]}}}]
  confidence: inferred

- rule: dispatch_first_h
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{here_ns}{h_ev}|disp_here~{recv}|{owner}|n#{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_first_h_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{here_ns}{h_ev}|disp_here~{recv}|{owner}|n#{key}'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{here_ns}{h_ev}', types: [drupal.event_text]}}}]
  confidence: inferred

- rule: dispatch_first_n
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{en_all}|disp~{recv}|{owner}|n#{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_first_n_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{en_all}|disp~{recv}|{owner}|n#{key}'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{en_all}', resolve: [{lookup_last_segment_in: core_event_names}, as_written], separator: ' ', types: [drupal.event]}}}]
  confidence: inferred

- rule: dispatch_first_c
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{ec}::class|disp~{recv}|{owner}|n#{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_first_c_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{ec}::class|disp~{recv}|{owner}|n#{key}'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{cls}', resolve: [{full_if_prefixed: '\'}, bound_first_segment, {prefix_with: nsv}, as_written], separator: '\', types: [drupal.event_text]}}}]
  confidence: inferred

# parent::NAME or parent::class written first, or new parent dispatched.
- rule: dispatch_first_parent
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{this_class}::{pform}|disp_parent~{recv}|{owner}|{named}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

# new X(...) dispatched: the event of X's full name.
- rule: dispatch_object_new
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{nc}::new|disp~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_object_new_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{nc}::new|disp~{recv}|{owner}|{key}'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{ncls}', resolve: [{full_if_prefixed: '\'}, bound_first_segment, {prefix_with: nsv}, as_written], separator: '\', types: [drupal.event_text]}}}]
  confidence: inferred

- rule: dispatch_object_variable
