# A call's second argument: a comma at the call's own level of parentheses, the innermost
# call_paren span around it being the call's. A call whose first argument is a name gives none.
- rule: dispatch_second_k
  reads: file
  in: [source]
  match: &second
    file: '**'
    filetype: drupal_php_text
    text: ',\s*(?:(?:(?<ek>\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*)|(?<eo>(?:self|static)::[A-Z][A-Z0-9_]*)|parent::(?<pf>class|[A-Z][A-Z0-9_]*)|(?!parent::)(?<ec>\\?(?:[A-Za-z_]\w*\\)*[A-Za-z_]\w*)::class|''(?<en>[^''\\]+)''|"(?<eq>[^"\\$]+)")(?=\s*\)))'
  values: &second_values
    fn: *fn
    in_class: *in_class
    fns: *fns
    m_src: *m_src
    m_mod: *m_mod
    f_own: *f_own
    meth: *meth
    owner: *owner
    this_class: *this_class
    here_ns: *here_ns
    nsv: *nsv
    r_ev: *r_ev
    h_ev: *h_ev
    cls: *cls
    en_all: *en_all
    pform: {template: '§{pf}§', normalize: [{replace: '^§class§$', with: 'class'}, {replace: '^§', with: 'c:'}, {replace: '§$', with: ''}]}
    # The innermost call_paren around the comma, empty unless it is a dispatch call's own, and
    # empty for a call whose first argument is a name.
    top: {from: {enclosing: call_paren, capture: k}, join: '§§', normalize: [{replace: '^[\s\S]*§§', with: ''}, {replace: '^\($', with: ''}]}
    call2: {template: '{top}', normalize: [{replace: '^[\s\S]*?->\s*dispatch\s*\(\s*(?:\\?(?:[A-Za-z_]\w*\\)*[A-Za-z_]\w*::[A-Za-z_]\w*|''[^'']*''|"[^"]*")\s*[,)][\s\S]*$', with: ''}]}
    recv: {template: '{call2}', normalize: [{replace: '->\s*dispatch\s*\([\s\S]*$', with: '¤'}, {replace: '\s+', with: ''}, {replace: '^¤$', with: 'x'}, {replace: '¤$', with: ''}, {replace: '^\$this->', with: 'p:'}, {replace: '^\$this$', with: 't'}, {replace: '^\$', with: 'v:'}]}
    key: {template: '{call2}', normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
  id: {template: '{r_ev}|disp~{recv}|{owner}|n#{key}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_second_k_event
  reads: file
  in: [source]
  match: *second
  values: *second_values
  id: {template: '{r_ev}|disp~{recv}|{owner}|n#{key}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{r_ev}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::', types: [drupal.event_text]}}}]
