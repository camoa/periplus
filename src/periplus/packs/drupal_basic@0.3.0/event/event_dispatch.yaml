$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# ->dispatch($event, X::NAME): a dispatched_by edge from the event to the method around the call,
# of the class the file's path names by Drupal's PSR-4 layout, so the rules are inferred. In a
# module, install, inc, theme or profile file it is a dispatched_by_function edge to the function
# around the call. A call in a closure counts the named function around it. Each call is an
# internal drupal.event_use at its line, and X and the event are read as in event_subscriber.yaml:
# the event of the constant's text when a mapped file declares it with one, else of the constant;
# X through the file's use statements, as self or static, or in the file's own namespace when a
# mapped class of that namespace declares the constant. The first argument may hold three levels
# of parentheses, as new MyEvent(f(g($x))). dispatch($event) with no name, the name written first,
# a name held in a variable, and a call in a plain PHP file outside a src folder give nothing. A
# method of a class kept in a module file reads as a function of the method's name.

rules:
- rule: event_dispatched_use
  reads: file
  in: [source]
  match: &event_dispatched_use
    file: '**'
    filetype: drupal_php_text
    text: '->dispatch\(\s*(?:[^,()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))+,\s*(?<key>[A-Z]\w*::[A-Z][A-Z0-9_]*)\s*\)'
  values:
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{key}|dispatched|{psr4_class}::{method}', resolve: [bound_first_segment], separator: '::'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_dispatched_use_listener
  reads: file
  in: [source]
  match: *event_dispatched_use
  values:
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{key}|dispatched|{psr4_class}::{method}', resolve: [bound_first_segment], separator: '::'}
  emits: [{edge: {kind: use_names_listener, from: this_node, to: {template: '{psr4_class}::{method}', types: [php.method]}}}]
  confidence: inferred

- rule: event_dispatched_use_in_function
  reads: file
  in: [source]
  match: &event_dispatched_use_in_function
    file: '**'
    filetype: drupal_php_text
    ending: [module, install, inc, theme, profile]
    text: '->dispatch\(\s*(?:[^,()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))+,\s*(?<key>[A-Z]\w*::[A-Z][A-Z0-9_]*)\s*\)'
  values:
    function: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{key}|dispatched_function|{function}', resolve: [bound_first_segment], separator: '::'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_dispatched_use_in_function_listener
  reads: file
  in: [source]
  match: *event_dispatched_use_in_function
  values:
    function: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{key}|dispatched_function|{function}', resolve: [bound_first_segment], separator: '::'}
  emits: [{edge: {kind: use_names_function, from: this_node, to: {template: '{function}', types: [php.function]}}}]
  confidence: inferred

- rule: event_dispatched_use_own_class
  reads: file
  in: [source]
  match: &event_dispatched_use_own_class
    file: '**'
    filetype: drupal_php_text
    text: '->dispatch\(\s*(?:[^,()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))+,\s*(?:self|static)::(?<constant>[A-Z][A-Z0-9_]*)\s*\)'
  values:
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{psr4_class}::{constant}|dispatched_here|{psr4_class}::{method}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_dispatched_use_own_class_listener
  reads: file
  in: [source]
  match: *event_dispatched_use_own_class
  values:
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{psr4_class}::{constant}|dispatched_here|{psr4_class}::{method}'}
  emits: [{edge: {kind: use_names_listener, from: this_node, to: {template: '{psr4_class}::{method}', types: [php.method]}}}]
  confidence: inferred

- rule: event_dispatch_in_namespace
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '->dispatch\(\s*(?:[^,()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))+,\s*(?<class>[A-Z]\w*)::(?<constant>[A-Z][A-Z0-9_]*)\s*\)'
  values:
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{psr4_namespace}{class}::{constant}|dispatched_here|{psr4_class}::{method}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_dispatched_by_text
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|dispatched(?:_here)?\|(?<listener>[^|]+)$'}]
    follow:
    - node: 'drupal.class_constant::{event}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - node: 'php.method::{listener}'
  emits: [{edge: {kind: dispatched_by, from: {template: '{text}', types: [drupal.event]}, to: matched_node}}]
  confidence: inferred

# untexted is captured only where no mapped file gives the constant a text.
- rule: event_dispatched_by_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|dispatched\|(?<listener>[^|]+)$'}]
    follow:
    - try: [{node: 'drupal.class_constant::{event}'}, {edge: has_constant_text}]
    - id_matches: '^(?:drupal\.constant_text::|drupal\.event_use::(?<untexted>))'
    - node: 'php.method::{listener}'
  emits: [{edge: {kind: dispatched_by, from: {template: '{event}{untexted}', types: [drupal.event]}, to: matched_node}}]
  confidence: inferred

- rule: event_dispatched_in_namespace
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|dispatched_here\|(?<listener>[^|]+)$'}]
    follow:
    - node: 'drupal.class_constant::{event}'
    - try: [{edge: has_constant_text}]
    - id_matches: '^(?:drupal\.constant_text::|drupal\.class_constant::(?<untexted>))'
    - node: 'php.method::{listener}'
  emits: [{edge: {kind: dispatched_by, from: {template: '{event}{untexted}', types: [drupal.event]}, to: matched_node}}]
  confidence: inferred

- rule: event_dispatched_by_function_text
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|dispatched_function\|(?<listener>[^|]+)$'}]
    follow:
    - node: 'drupal.class_constant::{event}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - node: 'php.function::{listener}'
  emits: [{edge: {kind: dispatched_by_function, from: {template: '{text}', types: [drupal.event]}, to: matched_node}}]
  confidence: inferred

- rule: event_dispatched_by_function_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|dispatched_function\|(?<listener>[^|]+)$'}]
    follow:
    - try: [{node: 'drupal.class_constant::{event}'}, {edge: has_constant_text}]
    - id_matches: '^(?:drupal\.constant_text::|drupal\.event_use::(?<untexted>))'
    - node: 'php.function::{listener}'
  emits: [{edge: {kind: dispatched_by_function, from: {template: '{event}{untexted}', types: [drupal.event]}, to: matched_node}}]
  confidence: inferred
