$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# ->dispatch(): a dispatched_by edge from the event to the method around the call, or a
# dispatched_by_function edge to the function around it. The method is one of a class under src,
# named by Drupal's PSR-4 layout, or of a class a module, install, inc, theme, profile or plain
# .php file keeps, named by the file's namespace; the function is one of such a file outside a
# class. A call in a closure counts the named function around it. An .api.php file, a test outside
# tests/src and any other file give nothing. All inferred.
#
# The event, as Symfony names it:
# - the second argument, read at the call's own level of parentheses however deep the first one
#   nests (the span call_paren, pack.yaml): a class constant, X::NAME through the file's use
#   statements, \A\B::NAME or A\B::NAME, self::NAME or static::NAME, a constant of the file's
#   namespace when a mapped class declares it, each named by the text a mapped file gives the
#   constant, on X or its nearest mapped ancestor or interface that declares it, else by the
#   declaring class's constant; parent::NAME the same on the class's parent; a quoted name,
#   through the table core_event_names for a core name; or a class, X::class, self::class or
#   parent::class, the event of the class's full name;
# - with no second argument, the class of the object, as Symfony names it: new X(...) through the
#   file's use statements or namespace, new self, new static or new parent; a variable of the
#   method or function a new X assigned once there, or a parameter typed with a class and not
#   assigned in the body nor named by a closure; or a property of $this typed with a class, or
#   assigned once from such a parameter. A typed parameter or property gives its declared class:
#   an object of a subclass passed at run time names its own;
# - the name written first, the order of Symfony before 4.3, dispatch('name', $event) or
#   dispatch(X::NAME, $event), read as above; Symfony 5 and later refuse that order.
# A name held in a variable or written as an expression, an object whose class the map does not
# show, an anonymous class and parent:: in a class the map does not hold are decided only when the
# code runs: the edge starts at a drupal.runtime_event <owner>|<expression>~<object>, marked as an
# unknown boundary.
#
# dispatch() is a common method name, so the object the call runs on is read as for addListener
# (event/listener_registration.yaml): a known type that is not an event dispatcher, PSR-14's
# among them, gives nothing; a known dispatcher holds receiver: an event dispatcher; and an object
# of no known type, as a call's result, holds receiver: not known to be an event dispatcher.
#
# Each call is an internal drupal.event_use site at its line, <event>|<use>~<object>|<owner>|<key>,
# the key the call's text from its object, which ties a call's first argument to its second.

node_types:
- name: drupal.runtime_event
  description: "an event a ->dispatch() call names only when the code runs, <owner>|<expression>~<object>"
  parent: drupal.event
  id_namespace: drupal.runtime_event

edge_kinds:
- kind: use_typed
  cause: none
  description: "a self-link marking a dispatch whose object's class the map shows"
  from: drupal.event_use
  to: drupal.event_use
- kind: use_expression
  cause: none
  description: "a self-link on a dispatch's second argument holding it as written, when it is neither a constant, a name nor a class"
  from: drupal.event_use
  to: drupal.event_use
- kind: use_type_ready
  cause: none
  description: "a self-link on a dispatch of a variable or property, so its runtime rule reads use_typed one pass later"
  from: drupal.event_use
  to: drupal.event_use

rules:

# A call's first argument, from its object: a name written first, or the object dispatched.
- rule: dispatch_first_k
  reads: file
  line: {capture: call}
  in: [source]
  match: &start
    file: '**'
    filetype: drupal_php_text
    text: '(?=[$-])(?=(?<sig>(?:(?<![\w$>:\\])\$this\s*->\s*\w+\s*|(?<![\w$>:\\])\$\w+\s*)?->\s*dispatch\s*\([^;]{0,240}))(?:(?<![\w$>:\\])(?<rv>\$(?!this\b)\w+)\s*|(?<![\w$>:\\])\$this\s*->\s*(?<rp>\w+)\s*|(?<![\w$>:\\])(?<rt>\$this)\s*)?->\s*(?<call>dispatch)\s*\(\s*(?:(?:(?<ek>\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*)|(?<eo>(?:self|static)::[A-Z][A-Z0-9_]*)|parent::(?<pf>class|[A-Z][A-Z0-9_]*)|(?!parent::)(?<ec>\\?(?:[A-Za-z_]\w*\\)*[A-Za-z_]\w*)::class|''(?<en>[^''\\]+)''|"(?<eq>[^"\\$]+)")(?=\s*[,)])|new\s+(?<npar>parent)\b|new\s+(?!(?:class|parent)\b)(?<nc>\\?[A-Za-z_][\w\\]*)(?=\s*[(,)])|(?<ov>\$(?!this\b)\w+)(?=\s*[,)])|\$this\s*->\s*(?<op>\w+)(?=\s*[,)])|(?<oe>(?:''[^'']*''|"[^"]*"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''"])+?)(?=\s*[,)])|(?<of>[^;]{1,200}?)(?=\s*\)))'
  values: &start_values
    fn: &fn {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    in_class: &in_class {from: {enclosing: class_like_body, capture: class}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    fns: &fns {from: {enclosing: php_namespace, capture: ns}, join: '|', normalize: [{replace: '^.*\|', with: ''}, {replace: '(?<=.)$', with: '\'}]}
    # The method around the call, <class>::<method>, of a class under src or kept elsewhere; the
    # function around it in a file that keeps functions; the owner, either as a node id.
    m_src: &m_src {template: '§{in_class}§{fn}', normalize: [{replace: '^§§.*$', with: ''}, {replace: '^§[^§]*§', with: '{psr4_class}::'}, {replace: '^§.*$', with: ''}]}
    m_mod: &m_mod {template: '{fns}§{in_class}§{fn}', normalize: [{replace: '^[^§]*§§[\s\S]*$', with: ''}, {replace: '^', with: '¤{procedural_owner}'}, {replace: '^(?!¤)[\s\S]*$', with: ''}, {replace: '^¤php\.function::', with: ''}, {replace: '§(?=[^§]*§)', with: ''}, {replace: '§', with: '::'}]}
    f_own: &f_own {template: '§{in_class}§{fn}', normalize: [{replace: '^§[^§]+§.*$', with: ''}, {replace: '^§§', with: '¤{procedural_owner}'}, {replace: '^¤php\.function::', with: ''}, {replace: '^[§¤].*$', with: ''}]}
    meth: &meth {template: '{m_src}{m_mod}'}
    owner: &owner {template: '§{meth}§{f_own}', normalize: [{replace: '^§§$', with: ''}, {replace: '^§§', with: 'php.function::'}, {replace: '^§', with: 'php.method::'}, {replace: '§$', with: ''}]}
    this_class: &this_class {template: '{meth}', normalize: [{replace: '::\w+$', with: ''}]}
    here_ns: &here_ns {template: '§{fns}', normalize: [{replace: '^§.*$', with: '{psr4_namespace}'}, {replace: '^§', with: ''}]}
    nsv: &nsv {template: '{here_ns}', normalize: [{replace: '\\$', with: ''}]}
    r_ev: &r_ev {template: '§K{ek}§T{this_class}§O{eo}', normalize: [{replace: '§T[^§]*§O$', with: ''}, {replace: '^§K', with: ''}, {replace: '§O(?:self|static)', with: ''}, {replace: '^§T', with: '@'}, {replace: '^(?![\s\S]*::[A-Z])[\s\S]*$', with: ''}]}
    h_ev: &h_ev {from: {capture: ek}, normalize: [{replace: '^\\.*$', with: ''}]}
    cls: &cls {template: '§E{ec}§T{this_class}', normalize: [{replace: '^§E(?:self|static)§T', with: '\'}, {replace: '§T[\s\S]*$', with: ''}, {replace: '^§E', with: ''}]}
    en_all: &en_all {template: '{en}{eq}'}
    pform: &pform {template: '§{pf}§{npar}', normalize: [{replace: '^§§parent$', with: 'class'}, {replace: '^§class§$', with: 'class'}, {replace: '^§', with: 'c:'}, {replace: '§$', with: ''}]}
    # The object the call runs on: v:<parameter>, p:<property of $this>, t for $this, x for any
    # other, as a call's result.
    recv: {template: '§{call}§V{rv}§P{rp}§T{rt}', normalize: [{replace: '^§\w+', with: ''}, {replace: '§[VPT](?=§|$)', with: ''}, {replace: '^$', with: 'x'}, {replace: '^§V\$', with: 'v:'}, {replace: '^§P', with: 'p:'}, {replace: '^§T.*$', with: 't'}]}
    key: {from: {capture: sig}, normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    # n# before the key of a name, so no second argument of the call takes it back.
    named: {template: '§{pf}§{npar}§{key}', normalize: [{replace: '^§§[^§]+§', with: ''}, {replace: '^§[^§]*§§', with: 'n#'}]}
    unknown: {template: '{oe}{of}', normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    ncls: {template: '§E{nc}§T{this_class}', normalize: [{replace: '^§E(?:self|static)§T', with: '\'}, {replace: '§T[\s\S]*$', with: ''}, {replace: '^§E', with: ''}]}
  id: {template: '{r_ev}|disp~{recv}|{owner}|n#{key}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_first_k_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{r_ev}|disp~{recv}|{owner}|n#{key}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{r_ev}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::', types: [drupal.event_text]}}}]
  confidence: inferred

- rule: dispatch_first_q
  reads: file
