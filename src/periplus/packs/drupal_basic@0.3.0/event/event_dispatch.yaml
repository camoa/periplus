# Any second argument: a self-link on a marker keyed by the call's text, which takes the object of
# the first argument back from naming the event, holding the argument as written when it is
# neither a constant, a name nor a class, so the map rules give the runtime event. Only the
# innermost call_paren span is read here, as this pattern meets nearly every last argument of a
# call.
- rule: dispatch_second_expression
  reads: file
  in: [source]
  match: &second_any
    file: '**'
    filetype: drupal_php_text
    text: ',\s*(?:(?:(?<ek>\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*)|(?<eo>(?:self|static)::[A-Z][A-Z0-9_]*)|parent::(?<pf>class|[A-Z][A-Z0-9_]*)|(?!parent::)(?<ec>\\?(?:[A-Za-z_]\w*\\)*[A-Za-z_]\w*)::class|''(?<en>[^''\\]+)''|"(?<eq>[^"\\$]+)")(?=\s*\))|(?<ex>(?:''[^'']*''|"[^"]*"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''"])+?)(?=\s*\))|(?<ey>[^;,]{1,200}?)(?=\s*\)))'
  values: &second_any_values
    top: {from: {enclosing: call_paren, capture: k}, join: '§§', normalize: [{replace: '^[\s\S]*§§', with: ''}, {replace: '^\($', with: ''}]}
    call2: {template: '{top}', normalize: [{replace: '^[\s\S]*?->\s*dispatch\s*\(\s*(?:\\?(?:[A-Za-z_]\w*\\)*[A-Za-z_]\w*::[A-Za-z_]\w*|''[^'']*''|"[^"]*")\s*[,)][\s\S]*$', with: ''}]}
    key: {template: '{call2}', normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    unknown: {template: '{ex}{ey}', normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
  id: {template: 'has2|{key}'}
  emits: [{edge: {kind: use_expression, from: this_node, to: {template: 'has2|{key}', type: drupal.event_use}, attributes: {expression: {template: '{unknown}'}}}}]
  confidence: inferred

# The map rules: each site's event, named by the text a mapped file gives a constant, from the
# method or function around the call, with what is known of the object it runs on.
- rule: dispatched_by_named
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp~[^|]*\|(?<owner>php\.method::[^|]+)\|(?<rest>.*)$'}]
    follow: &named_event
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - edge: use_names_event
    - id_matches: '^drupal\.event::(?<ev>.+)$'
    - try: [{id_matches: '^drupal\.event::(?<cc>[^|]+)::(?<cn>[A-Z][A-Z0-9_]*)$'}, {node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<ev>.+)$'}]
    - try: [{node: 'drupal.class_constant::{ev}'}, {edge: has_constant_text}, {id_matches: '^drupal\.constant_text::(?<ev>.+)$'}]
    - node: '{owner}'
    unless: &has_second [[{node: 'drupal.event_use::has2|{rest}'}]]
  emits:
  - &by_unknown {edge: {kind: dispatched_by, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - &by_dispatcher {edge: {kind: dispatched_by, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

- rule: dispatched_by_function_named
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp~[^|]*\|(?<owner>php\.function::[^|]+)\|(?<rest>.*)$'}]
    follow: *named_event
    unless: *has_second
  emits:
  - &fn_unknown {edge: {kind: dispatched_by_function, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - &fn_dispatcher {edge: {kind: dispatched_by_function, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

# A constant of the file's own namespace: only when a mapped class declares it.
- rule: dispatched_by_here
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp_here~[^|]*\|(?<owner>php\.method::[^|]+)\|(?<rest>.*)$'}]
    follow: &here_event
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - edge: use_names_event
    - id_matches: '^drupal\.event::(?<ev>.+)$'
    - try: [{id_matches: '^drupal\.event::(?<cc>[^|]+)::(?<cn>[A-Z][A-Z0-9_]*)$'}, {node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<ev>.+)$'}]
    - node: 'drupal.class_constant::{ev}'
    - try: [{edge: has_constant_text}, {id_matches: '^drupal\.constant_text::(?<ev>.+)$'}]
    - node: '{owner}'
  emits: [*by_unknown, *by_dispatcher]
  confidence: inferred

- rule: dispatched_by_function_here
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp_here~[^|]*\|(?<owner>php\.function::[^|]+)\|(?<rest>.*)$'}]
    follow: *here_event
  emits: [*fn_unknown, *fn_dispatcher]
  confidence: inferred

# parent::class or new parent: the class's parent, which a class the map holds names by extends.
- rule: dispatched_by_parent_class
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<child>[^|]+)::class\|disp_parent~[^|]*\|(?<owner>php\.method::[^|]+)\|(?<rest>.*)$'}]
    follow:
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.type::{child}'
    - edge: inherits
    - id_matches: '^php\.type::(?<ev>.+)$'
    - node: '{owner}'
    unless: *has_second
  emits: [*by_unknown, *by_dispatcher]
  confidence: inferred

# parent::NAME: that constant on the parent or its nearest mapped ancestor or interface that
# declares it, named by its text when a mapped file gives one, else by the declaring constant.
- rule: dispatched_by_parent_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<child>[^|]+)::c:(?<cn>[A-Z][A-Z0-9_]*)\|disp_parent~[^|]*\|(?<owner>php\.method::[^|]+)\|(?<rest>.*)$'}]
    follow:
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.type::{child}'
    - edge: inherits
    - id_matches: '^php\.type::(?<cd>.+)$'
    - try: [{ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}]
    - try: [{node: 'drupal.class_constant::{cd}::{cn}'}, {edge: has_constant_text}, {id_matches: '^drupal\.constant_text::(?<text>.+)$'}]
    - id_matches: '^(?:drupal\.constant_text::|(?<untexted>))'
    - node: '{owner}'
    unless: *has_second
  emits:
  - {edge: {kind: dispatched_by, from: {template: '{text}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - {edge: {kind: dispatched_by, from: {template: '{text}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  - {edge: {kind: dispatched_by, from: {template: '{cd}::{cn}{untexted}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - {edge: {kind: dispatched_by, from: {template: '{cd}::{cn}{untexted}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

# The object's class, with no second argument: a new X assigned once to the variable in the method
# or function; a parameter typed with a class, not assigned in the body nor named by a closure;
# a property of $this typed with a class on the class or its nearest ancestor, or assigned once
# from such a parameter. Each also marks its site use_typed, which the runtime rules read.
- rule: dispatched_by_local_new
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$(?<var>\w+)\|disp_var~[^|]*\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: &local_new
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.local_variable::{holder}::${var}'
    - edge: local_assigned
    - id_matches: '(?s)^php\.local_value::(?<value>.+)$'
    - edge: local_value_typed_as
    - id_matches: '^php\.local_type::[^:]+::\$\w+::\\?(?<ev>[A-Za-z_][\w\\]*)$'
    - node: '{owner}'
    unless: *has_second
    unless_matched: &another_value [[{node: 'php.local_variable::{holder}::${var}'}, {edge: local_assigned}, {id_matches: '(?s)^php\.local_value::(?!{value}$)'}]]
  emits: [*by_unknown, *by_dispatcher, &typed {edge: {kind: use_typed, from: this_node, to: this_node}}]
  confidence: inferred

- rule: dispatched_by_function_local_new
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$(?<var>\w+)\|disp_var~[^|]*\|(?<owner>php\.function::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *local_new
    unless: *has_second
    unless_matched: *another_value
  emits: [*fn_unknown, *fn_dispatcher, *typed]
  confidence: inferred

- rule: dispatched_by_typed_parameter
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$(?<var>\w+)\|disp_var~[^|]*\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: &typed_parameter
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.parameter::{holder}::${var}'
    - edge: parameter_typed_as
    - id_matches: '^php\.parameter_type::.*::\$\w+::\\?(?<ev>[A-Za-z_][\w\\]*)$'
    - node: '{owner}'
    unless: &not_parameter
    - [{node: 'drupal.event_use::has2|{rest}'}]
    - [{node: 'php.local_variable::{holder}::${var}'}]
    - [{node: 'drupal.closure_parameter::{holder}::${var}'}]
  emits: [*by_unknown, *by_dispatcher, *typed]
  confidence: inferred

- rule: dispatched_by_function_typed_parameter
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$(?<var>\w+)\|disp_var~[^|]*\|(?<owner>php\.function::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *typed_parameter
    unless: *not_parameter
  emits: [*fn_unknown, *fn_dispatcher, *typed]
  confidence: inferred

- rule: dispatched_by_typed_property
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$this->(?<member>\w+)\|disp_prop~[^|]*\|(?<owner>php\.method::(?<class>[^|]+)::\w+)\|(?<rest>.*)$'}]
    follow:
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'php.property::{declarer}::${member}'
    - edge: property_typed_as
    - id_matches: '^php\.property_type::.*::\$\w+::\\?(?<ev>[A-Za-z_][\w\\]*)$'
    - node: '{owner}'
    unless: *has_second
  emits: [*by_unknown, *by_dispatcher, *typed]
  confidence: inferred

- rule: dispatched_by_assigned_property
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$this->(?<member>\w+)\|disp_prop~[^|]*\|(?<owner>php\.method::(?<class>[^|]+)::\w+)\|(?<rest>.*)$'}]
    follow:
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'php.member_assignment::{declarer}::$this->{member}'
    - edge: assigned_value
    - id_matches: '^php\.member_assignment_value::[^:]+::(?<setter>[^:]+)::\$this->\w+=\$(?<parameter>\w+)$'
    - node: 'php.parameter::{declarer}::{setter}::${parameter}'
    - edge: parameter_typed_as
    - id_matches: '^php\.parameter_type::.*::\$\w+::\\?(?<ev>[A-Za-z_][\w\\]*)$'
    - node: '{owner}'
    unless: *has_second
    unless_matched:
    - [{node: 'php.property::{declarer}::${member}'}, {edge: property_typed_as}]
    - [{node: 'php.member_assignment::{declarer}::$this->{member}'}, {edge: assigned_value}, {id_matches: '^php\.member_assignment_value::[^:]+::(?:(?!{setter}::)[^:]+::\$this->\w+=|[^:]+::\$this->\w+=(?!\${parameter}$))'}]
  emits: [*by_unknown, *by_dispatcher, *typed]
  confidence: inferred

# What only the running code names: a name held in a variable or written as an expression, any
# other object, and a variable or property whose class the rules above do not give. A variable's
# or property's site is marked use_type_ready in one pass and read in the next, when use_typed
# shows whether a rule above gave its class.
- rule: dispatch_type_ready
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp_(?:var|prop)~'}]
  emits: [{edge: {kind: use_type_ready, from: this_node, to: this_node}}]
  confidence: inferred

- rule: dispatched_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<expr>[^|]*)\|disp_rt~(?<recv>[^|]*)\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: &runtime_event
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: '{owner}'
    unless: *has_second
  emits:
  - &rt_unknown {edge: {kind: dispatched_by, from: {template: '{holder}|{expr}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - &rt_dispatcher {edge: {kind: dispatched_by, from: {template: '{holder}|{expr}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

- rule: dispatched_by_function_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<expr>[^|]*)\|disp_rt~(?<recv>[^|]*)\|(?<owner>php\.function::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *runtime_event
    unless: *has_second
  emits:
  - &rt_fn_unknown {edge: {kind: dispatched_by_function, from: {template: '{holder}|{expr}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - &rt_fn_dispatcher {edge: {kind: dispatched_by_function, from: {template: '{holder}|{expr}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

# A second argument written as an expression or a variable: read from the site of the first, which
# knows the object the call runs on and the method or function around it.
- rule: dispatched_by_expression_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp(?:_rt|_var|_prop|_parent)?~(?<recv>[^|]*)\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>(?!n#).*)$'}]
    follow: &expression_event
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'drupal.event_use::has2|{rest}'
    - edge: use_expression
    - edge_attribute: expression
    - node: '{owner}'
  emits:
  - {edge: {kind: dispatched_by, from: {template: '{holder}|{expression}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - {edge: {kind: dispatched_by, from: {template: '{holder}|{expression}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

- rule: dispatched_by_function_expression_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp(?:_rt|_var|_prop|_parent)?~(?<recv>[^|]*)\|(?<owner>php\.function::(?<holder>[^|]+))\|(?<rest>(?!n#).*)$'}]
    follow: *expression_event
  emits:
  - {edge: {kind: dispatched_by_function, from: {template: '{holder}|{expression}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - {edge: {kind: dispatched_by_function, from: {template: '{holder}|{expression}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

- rule: dispatched_untyped_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<expr>[^|]*)\|disp_(?:var|prop)~(?<recv>[^|]*)\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: &untyped_event
    - edge: use_type_ready
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: '{owner}'
    unless: &typed_or_second [[{node: 'drupal.event_use::has2|{rest}'}], [{edge: use_typed}]]
  emits: [*rt_unknown, *rt_dispatcher]
  confidence: inferred

- rule: dispatched_by_function_untyped_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<expr>[^|]*)\|disp_var~(?<recv>[^|]*)\|(?<owner>php\.function::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *untyped_event
    unless: *typed_or_second
  emits: [*rt_fn_unknown, *rt_fn_dispatcher]
  confidence: inferred

# parent:: in a class the map holds no parent for.
- rule: dispatched_by_unknown_parent
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<child>[^|]+)::(?<form>class|c:[A-Z][A-Z0-9_]*)\|disp_parent~(?<recv>[^|]*)\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *runtime_event
    unless: [[{node: 'drupal.event_use::has2|{rest}'}], [{node: 'php.type::{child}'}, {edge: inherits}]]
  emits:
  - {edge: {kind: dispatched_by, from: {template: '{holder}|parent::{form}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - {edge: {kind: dispatched_by, from: {template: '{holder}|parent::{form}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred
