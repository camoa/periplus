$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# ->dispatch(): a dispatched_by edge from the event to the method around the call, or a
# dispatched_by_function edge to the function around it, at the line of ->dispatch. The method is
# one of a class under src, named by Drupal's PSR-4 layout, or of a class a module, install, inc,
# theme, profile or plain .php file keeps, named by the file's namespace; the function is one of
# such a file outside a class. A call in a closure counts the named function around it. An .api.php
# file, a test outside tests/src and any other file give nothing. All inferred.
#
# The call is read whole from ->dispatch to its closing parenthesis, whatever line breaks and
# comments stand between its parts, each argument at the call's own level of brackets, up to six
# levels deep; a call nested in another's arguments is read on its own. The event, as Symfony
# names it:
# - the second argument: a class constant, X::NAME through the file's use statements, \A\B::NAME,
#   A\B::NAME through the use statement of A, self::NAME or static::NAME, each named by the text a
#   mapped file gives the constant, on X or its nearest mapped ancestor or interface that declares
#   it, else by the declaring class's constant; X::NAME or A\B::NAME that no use statement binds,
#   the constant of the file's own namespace, as PHP reads it, unresolved when no mapped file
#   declares it; parent::NAME the same on the class's parent; a quoted name, through the table
#   core_event_names for a core name; or a class, X::class, self::class or parent::class, the
#   event of the class's full name;
# - with no second argument, the class of the object, as Symfony names it: new X(...) through the
#   file's use statements or namespace, new self, new static or new parent; a variable of the
#   method or function a new X assigned once there, or a parameter typed with a class and not
#   assigned in the body nor named by a closure; a property of $this typed with a class, or
#   assigned once from such a parameter; or $this, the class the call is written in. A typed
#   parameter or property and $this give the declared class, and their edge holds
#   event_from: declared type, since an object of a subclass names its own class when the code runs;
# - the name written first, the order of Symfony before 4.3, dispatch('name', $event) or
#   dispatch(X::NAME, $event), read as above; Symfony 5 and later refuse that order.
# A name held in a variable or written as an expression, an object whose class the map does not
# show, $this in a trait, an anonymous class and parent:: in a class the map does not hold are
# decided only when the code runs: the edge starts at a drupal.runtime_event
# <owner>|<expression>~<object>, marked as an unknown boundary. A call whose arguments are not
# read, nested more than six levels deep, with a third argument or with a heredoc that breaks
# them, gets the same mark with the expression (unread). A call with no argument dispatches no
# event and gives nothing.
#
# dispatch() is a common method name, so the object the call runs on is read as for addListener
# (event/listener_registration.yaml): a known type that is not an event dispatcher, PSR-14's
# among them, gives nothing; a known dispatcher holds receiver: an event dispatcher; and an object
# of no known type, as a call's result, holds receiver: not known to be an event dispatcher.
#
# Each call is an internal drupal.event_use site at its line, <event>|<use>~<object>|<owner>|<key>,
# the key the call's text from its object.

node_types:
- name: drupal.runtime_event
  description: "an event a ->dispatch() call names only when the code runs, <owner>|<expression>~<object>"
  parent: drupal.event
  id_namespace: drupal.runtime_event

edge_kinds:
- kind: use_typed
  cause: none
  description: "a self-link marking a dispatch whose object's class the map shows"
  from: drupal.event_use
  to: drupal.event_use
- kind: use_type_ready
  cause: none
  description: "a self-link on a dispatch of a variable or property, so its runtime rule reads use_typed one pass later"
  from: drupal.event_use
  to: drupal.event_use
- kind: use_bound
  cause: none
  description: "a dispatch's X::NAME or A\\B::NAME whose X or A a use statement binds, so it is no constant of the file's own namespace"
  from: drupal.event_use
  to: drupal.event_use

edge_attributes:
- name: event_from
  on: [dispatched_by, dispatched_by_function]
  description: "declared type when the event is the declared class of a typed parameter or property, or of $this: an object of a subclass names its own class when the code runs"

rules:

# The event a call names, from its second argument, a name written first, or the object
# dispatched; the object the call runs on; the method or function around it.
- rule: dispatch_k
  reads: file
  line: {capture: call}
  in: [source]
  match: &start
    file: '**'
    filetype: drupal_php_text
    text: '(?=[$-])(?=(?<sig>(?:(?<![\w$>:\\])\$this\s*->\s*\w+\s*|(?<![\w$>:\\])\$\w+\s*)?->\s*dispatch\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\([^;]{0,240}))(?:(?<![\w$>:\\])(?<rv>\$(?!this\b)\w+)\s*|(?<![\w$>:\\])\$this\s*->\s*(?<rp>\w+)\s*|(?<![\w$>:\\])(?<rt>\$this)\s*)?->\s*(?<call>dispatch)\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\((?=\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?:(?:(?<ek>\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*)|(?<eo>(?:self|static)::[A-Z][A-Z0-9_]*)|parent::(?<pf>class|[A-Z][A-Z0-9_]*)|(?!parent::)(?<ec>\\?(?:[A-Za-z_]\w*\\)*[A-Za-z_]\w*)::class|''(?<en>[^''\\]+)''|"(?<eq>[^"\\$]+)")(?=\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*[,)])|(?:(?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,)*[)\]}])*[)\]}])*[)\]}])*[)\]}])*[)\]}])*[)\]}])+),\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?:(?:(?<ek2>\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*)|(?<eo2>(?:self|static)::[A-Z][A-Z0-9_]*)|parent::(?<pf2>class|[A-Z][A-Z0-9_]*)|(?!parent::)(?<ec2>\\?(?:[A-Za-z_]\w*\\)*[A-Za-z_]\w*)::class|''(?<en2>[^''\\]+)''|"(?<eq2>[^"\\$]+)")(?=\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?:,\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*)?\))|(?<ex2>(?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,)*[)\]}])*[)\]}])*[)\]}])*[)\]}])*[)\]}])*[)\]}])+)(?:,\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*)?\))|(?=new\s+(?<npar>parent)\b|new\s+(?!(?:class|parent)\b)(?<nc>\\?[A-Za-z_][\w\\]*)(?=\s*[(,)])|(?<ov>\$(?!this\b)\w+)(?=\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*[,)])|\$this\s*->\s*(?<op>\w+)(?=\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*[,)])|(?<ot>\$this)(?=\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*[,)])|(?<oe>(?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,)*[)\]}])*[)\]}])*[)\]}])*[)\]}])*[)\]}])*[)\]}])+))(?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,|[(\[{](?:[^()\[\]{}''",/#]|/(?![/*])|//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*|#(?=\[)|''(?:[^''\\]|\\[\s\S])*''|"(?:[^"\\]|\\[\s\S])*\"|,)*[)\]}])*[)\]}])*[)\]}])*[)\]}])*[)\]}])*[)\]}])+(?:,\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*)?\)|\)|(?<deep>)))'
  values: &start_values
    fn: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    kind: {from: {enclosing: class_like_body, capture: kind}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    fns: {from: {enclosing: php_namespace, capture: ns}, join: '|', normalize: [{replace: '^.*\|', with: ''}, {replace: '(?<=.)$', with: '\'}]}
    # The method around the call, <class>::<method>, of a class under src or kept elsewhere; the
    # function around it in a file that keeps functions; the owner, either as a node id.
    m_src: {template: '§{in_class}§{fn}', normalize: [{replace: '^§§.*$', with: ''}, {replace: '^§[^§]*§', with: '{psr4_class}::'}, {replace: '^§.*$', with: ''}]}
    m_mod: {template: '{fns}§{in_class}§{fn}', normalize: [{replace: '^[^§]*§§[\s\S]*$', with: ''}, {replace: '^', with: '¤{procedural_owner}'}, {replace: '^(?!¤)[\s\S]*$', with: ''}, {replace: '^¤php\.function::', with: ''}, {replace: '§(?=[^§]*§)', with: ''}, {replace: '§', with: '::'}]}
    f_own: {template: '§{in_class}§{fn}', normalize: [{replace: '^§[^§]+§.*$', with: ''}, {replace: '^§§', with: '¤{procedural_owner}'}, {replace: '^¤php\.function::', with: ''}, {replace: '^[§¤].*$', with: ''}]}
    meth: {template: '{m_src}{m_mod}'}
    owner: {template: '§{meth}§{f_own}', normalize: [{replace: '^§§$', with: ''}, {replace: '^§§', with: 'php.function::'}, {replace: '^§', with: 'php.method::'}, {replace: '§$', with: ''}]}
    this_class: {template: '{meth}', normalize: [{replace: '::\w+$', with: ''}]}
    here_ns: {template: '§{fns}', normalize: [{replace: '^§.*$', with: '{psr4_namespace}'}, {replace: '^§', with: ''}]}
    nsv: {template: '{here_ns}', normalize: [{replace: '\\$', with: ''}]}
    # The event as a name, from the second argument or the first; each form one capture.
    r_ev: {template: '§K{ek}{ek2}§T{this_class}§O{eo}{eo2}', normalize: [{replace: '§T[^§]*§O$', with: ''}, {replace: '^§K', with: ''}, {replace: '§O(?:self|static)', with: ''}, {replace: '^§T', with: '@'}, {replace: '^(?![\s\S]*::[A-Z])[\s\S]*$', with: ''}]}
    h_ev: {template: '{ek}{ek2}', normalize: [{replace: '^\\.*$', with: ''}]}
    ec_all: {template: '{ec}{ec2}'}
    cls: {template: '§E{ec}{ec2}§T{this_class}', normalize: [{replace: '^§E(?:self|static)§T', with: '\'}, {replace: '§T[\s\S]*$', with: ''}, {replace: '^§E', with: ''}]}
    en_all: {template: '{en}{eq}{en2}{eq2}'}
    pform: {template: '§{pf}{pf2}§{npar}', normalize: [{replace: '^§§parent$', with: 'class'}, {replace: '^§class§$', with: 'class'}, {replace: '^§', with: 'c:'}, {replace: '§$', with: ''}]}
    ncls: {template: '§E{nc}§T{this_class}', normalize: [{replace: '^§E(?:self|static)§T', with: '\'}, {replace: '§T[\s\S]*$', with: ''}, {replace: '^§E', with: ''}]}
    # $this dispatched in a class or an enum: the class.
    this_ev: {template: '§{ot}§{kind}§{this_class}', normalize: [{replace: '^§\$this§(?:class|enum)§(?=.)', with: ''}, {replace: '^§[\s\S]*$', with: ''}]}
    # What only the running code names: the second argument as an expression, any other object,
    # $this outside a class or enum, or arguments not read.
    unknown: {template: '§{ex2}§{oe}§{deep}§{ot}§K{kind}§C{this_class}', normalize: [{replace: '^§§§§\$this§K(?:class|enum)§C.+$', with: ''}, {replace: '^§§§§\$this§K[\s\S]*$', with: '$this'}, {replace: '^§§§§§K[\s\S]*$', with: '(unread)'}, {replace: '§K[\s\S]*$', with: ''}, {replace: '§', with: ''}, {replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    # The object the call runs on: v:<parameter>, p:<property of $this>, t for $this, x for any
    # other, as a call's result.
    recv: {template: '§{call}§V{rv}§P{rp}§T{rt}', normalize: [{replace: '^§\w+', with: ''}, {replace: '§[VPT](?=§|$)', with: ''}, {replace: '^$', with: 'x'}, {replace: '^§V\$', with: 'v:'}, {replace: '^§P', with: 'p:'}, {replace: '^§T.*$', with: 't'}]}
    key: {from: {capture: sig}, normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
  id: {template: '{r_ev}|disp~{recv}|{owner}|{key}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_k_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{r_ev}|disp~{recv}|{owner}|{key}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits:
  - {edge: {kind: use_names_event, from: this_node, to: {template: '{r_ev}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::', types: [drupal.event_text]}}}
  - {edge: {kind: use_bound, from: this_node, to: {template: 'bound|{recv}|{owner}|{key}', type: drupal.event_use}}}
  confidence: inferred

# A\B::NAME, A through the file's use statements.
- rule: dispatch_q
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{r_ev}|disp~{recv}|{owner}|{key}', resolve: [{full_if_prefixed: '\'}, bound_first_segment], separator: '\'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_q_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{r_ev}|disp~{recv}|{owner}|{key}', resolve: [{full_if_prefixed: '\'}, bound_first_segment], separator: '\'}
  emits:
  - {edge: {kind: use_names_event, from: this_node, to: {template: '{r_ev}', resolve: [{full_if_prefixed: '\'}, bound_first_segment], separator: '\', types: [drupal.event_text]}}}
  - {edge: {kind: use_bound, from: this_node, to: {template: 'bound|{recv}|{owner}|{key}', type: drupal.event_use}}}
  confidence: inferred

# X::NAME or A\B::NAME as the constant of the file's own namespace, which the map rules keep only
# when no use statement binds X or A.
- rule: dispatch_h
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{here_ns}{h_ev}|disp_here~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_h_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{here_ns}{h_ev}|disp_here~{recv}|{owner}|{key}'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{here_ns}{h_ev}', types: [drupal.event_text]}}}]
  confidence: inferred

- rule: dispatch_n
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{en_all}|disp~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_n_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{en_all}|disp~{recv}|{owner}|{key}'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{en_all}', resolve: [{lookup_last_segment_in: core_event_names}, as_written], separator: ' ', types: [drupal.event]}}}]
  confidence: inferred

- rule: dispatch_c
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{ec_all}::class|disp~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_c_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{ec_all}::class|disp~{recv}|{owner}|{key}'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{cls}', resolve: [{full_if_prefixed: '\'}, bound_first_segment, {prefix_with: nsv}, as_written], separator: '\', types: [drupal.event_text]}}}]
  confidence: inferred

# parent::NAME or parent::class, or new parent dispatched.
- rule: dispatch_parent
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{this_class}::{pform}|disp_parent~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

# new X(...) dispatched: the event of X's full name.
- rule: dispatch_object_new
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{nc}::new|disp~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_object_new_event
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{nc}::new|disp~{recv}|{owner}|{key}'}
  emits: [{edge: {kind: use_names_event, from: this_node, to: {template: '{ncls}', resolve: [{full_if_prefixed: '\'}, bound_first_segment, {prefix_with: nsv}, as_written], separator: '\', types: [drupal.event_text]}}}]
  confidence: inferred

# $this dispatched in a class or an enum.
- rule: dispatch_object_this
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{this_ev}|disp_this~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_object_variable
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{ov}|disp_var~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_object_property
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '$this->{op}|disp_prop~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_object_runtime
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
  values: *start_values
  id: {template: '{unknown}|disp_rt~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

# The map rules: each site's event, named by the text a mapped file gives a constant, from the
# method or function around the call, with what is known of the object it runs on.
- rule: dispatched_by_named
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp~[^|]*\|(?<owner>php\.method::[^|]+)\|(?<rest>.*)$'}]
    follow: &named_event
    - try: [{id_matches: '^drupal\.event_use::[^|]*::(?:class|new)\|disp~(?<wc>)'}]
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - edge: use_names_event
    - id_matches: '^drupal\.event::(?<ev>.+)$'
    - try: [{id_matches: '^drupal\.event::(?<cc>[^|]+)::(?<cn>[A-Z][A-Z0-9_]*)$'}, {node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<ev>.+)$'}]
    - try: [{node: 'drupal.class_constant::{ev}'}, {edge: has_constant_text}, {id_matches: '^drupal\.constant_text::(?<ev>.+)$'}]
    - node: '{owner}'
  emits:
  - &by_unknown {edge: {kind: dispatched_by, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}, event_from: {template: 'written class{wc}'}}}}
  - &by_dispatcher {edge: {kind: dispatched_by, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}, event_from: {template: 'written class{wc}'}}}}
  confidence: inferred

- rule: dispatched_by_function_named
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp~[^|]*\|(?<owner>php\.function::[^|]+)\|(?<rest>.*)$'}]
    follow: *named_event
  emits:
  - &fn_unknown {edge: {kind: dispatched_by_function, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}, event_from: {template: 'written class{wc}'}}}}
  - &fn_dispatcher {edge: {kind: dispatched_by_function, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}, event_from: {template: 'written class{wc}'}}}}
  confidence: inferred

# X::NAME or A\B::NAME that no use statement binds: the constant of the file's own namespace, as
# PHP reads it, named as above, unresolved when no mapped file declares it.
- rule: dispatched_by_here
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp_here~(?<recv>[^|]*)\|(?<owner>php\.method::[^|]+)\|(?<rest>.*)$'}]
    follow: *named_event
    unless: &bound [[{node: 'drupal.event_use::bound|{recv}|{owner}|{rest}'}]]
  emits: [*by_unknown, *by_dispatcher]
  confidence: inferred

- rule: dispatched_by_function_here
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp_here~(?<recv>[^|]*)\|(?<owner>php\.function::[^|]+)\|(?<rest>.*)$'}]
    follow: *named_event
    unless: *bound
  emits: [*fn_unknown, *fn_dispatcher]
  confidence: inferred

# parent::class or new parent: the class's parent, which a class the map holds names by extends.
- rule: dispatched_by_parent_class
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<child>[^|]+)::class\|disp_parent~[^|]*\|(?<owner>php\.method::[^|]+)\|(?<rest>.*)$'}]
    follow:
    - id_matches: '(?<wc>)'
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.type::{child}'
    - edge: inherits
    - id_matches: '^php\.type::(?<ev>.+)$'
    - node: '{owner}'
  emits: [*by_unknown, *by_dispatcher]
  confidence: inferred

# parent::NAME: that constant on the parent or its nearest mapped ancestor or interface that
# declares it, named by its text when a mapped file gives one, else by the declaring constant.
- rule: dispatched_by_parent_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<child>[^|]+)::c:(?<cn>[A-Z][A-Z0-9_]*)\|disp_parent~[^|]*\|(?<owner>php\.method::[^|]+)\|(?<rest>.*)$'}]
    follow:
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.type::{child}'
    - edge: inherits
    - id_matches: '^php\.type::(?<cd>.+)$'
    - try: [{ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}]
    - try: [{node: 'drupal.class_constant::{cd}::{cn}'}, {edge: has_constant_text}, {id_matches: '^drupal\.constant_text::(?<text>.+)$'}]
    - id_matches: '^(?:drupal\.constant_text::|(?<untexted>))'
    - node: '{owner}'
  emits:
  - {edge: {kind: dispatched_by, from: {template: '{text}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - {edge: {kind: dispatched_by, from: {template: '{text}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  - {edge: {kind: dispatched_by, from: {template: '{cd}::{cn}{untexted}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - {edge: {kind: dispatched_by, from: {template: '{cd}::{cn}{untexted}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

# The object's class, with no second argument: a new X assigned once to the variable in the method
# or function; a parameter typed with a class, not assigned in the body nor named by a closure;
# a property of $this typed with a class on the class or its nearest ancestor, or assigned once
# from such a parameter. Each also marks its site use_typed, which the runtime rules read.
- rule: dispatched_by_local_new
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$(?<var>\w+)\|disp_var~[^|]*\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: &local_new
    - id_matches: '(?<wc>)'
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.local_variable::{holder}::${var}'
    - edge: local_assigned
    - id_matches: '(?s)^php\.local_value::(?<value>.+)$'
    - edge: local_value_typed_as
    - id_matches: '^php\.local_type::[^:]+::\$\w+::\\?(?<ev>[A-Za-z_][\w\\]*)$'
    - node: '{owner}'
    unless_matched: &another_value [[{node: 'php.local_variable::{holder}::${var}'}, {edge: local_assigned}, {id_matches: '(?s)^php\.local_value::(?!{value}$)'}]]
  emits: [*by_unknown, *by_dispatcher, &typed {edge: {kind: use_typed, from: this_node, to: this_node}}]
  confidence: inferred

- rule: dispatched_by_function_local_new
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$(?<var>\w+)\|disp_var~[^|]*\|(?<owner>php\.function::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *local_new
    unless_matched: *another_value
  emits: [*fn_unknown, *fn_dispatcher, *typed]
  confidence: inferred

- rule: dispatched_by_typed_parameter
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$(?<var>\w+)\|disp_var~[^|]*\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: &typed_parameter
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.parameter::{holder}::${var}'
    - edge: parameter_typed_as
    - id_matches: '^php\.parameter_type::.*::\$\w+::\\?(?<ev>[A-Za-z_][\w\\]*)$'
    - node: '{owner}'
    unless: &not_parameter
    - [{node: 'php.local_variable::{holder}::${var}'}]
    - [{node: 'drupal.closure_parameter::{holder}::${var}'}]
  emits: [&by_unknown_declared {edge: {kind: dispatched_by, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}, event_from: {template: 'declared type'}}}}, &by_dispatcher_declared {edge: {kind: dispatched_by, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}, event_from: {template: 'declared type'}}}}, *typed]
  confidence: inferred

- rule: dispatched_by_function_typed_parameter
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$(?<var>\w+)\|disp_var~[^|]*\|(?<owner>php\.function::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *typed_parameter
    unless: *not_parameter
  emits: [{edge: {kind: dispatched_by_function, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}, event_from: {template: 'declared type'}}}}, {edge: {kind: dispatched_by_function, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}, event_from: {template: 'declared type'}}}}, *typed]
  confidence: inferred

- rule: dispatched_by_typed_property
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$this->(?<member>\w+)\|disp_prop~[^|]*\|(?<owner>php\.method::(?<class>[^|]+)::\w+)\|(?<rest>.*)$'}]
    follow:
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'php.property::{declarer}::${member}'
    - edge: property_typed_as
    - id_matches: '^php\.property_type::.*::\$\w+::\\?(?<ev>[A-Za-z_][\w\\]*)$'
    - node: '{owner}'
  emits: [*by_unknown_declared, *by_dispatcher_declared, *typed]
  confidence: inferred

- rule: dispatched_by_assigned_property
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::\$this->(?<member>\w+)\|disp_prop~[^|]*\|(?<owner>php\.method::(?<class>[^|]+)::\w+)\|(?<rest>.*)$'}]
    follow:
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'php.member_assignment::{declarer}::$this->{member}'
    - edge: assigned_value
    - id_matches: '^php\.member_assignment_value::[^:]+::(?<setter>[^:]+)::\$this->\w+=\$(?<parameter>\w+)$'
    - node: 'php.parameter::{declarer}::{setter}::${parameter}'
    - edge: parameter_typed_as
    - id_matches: '^php\.parameter_type::.*::\$\w+::\\?(?<ev>[A-Za-z_][\w\\]*)$'
    - node: '{owner}'
    unless_matched:
    - [{node: 'php.property::{declarer}::${member}'}, {edge: property_typed_as}]
    - [{node: 'php.member_assignment::{declarer}::$this->{member}'}, {edge: assigned_value}, {id_matches: '^php\.member_assignment_value::[^:]+::(?:(?!{setter}::)[^:]+::\$this->\w+=|[^:]+::\$this->\w+=(?!\${parameter}$))'}]
  emits: [*by_unknown_declared, *by_dispatcher_declared, *typed]
  confidence: inferred

# $this dispatched in a class or an enum: the class, which a subclass object replaces when the code
# runs.
- rule: dispatched_by_this
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<ev>[^|]+)\|disp_this~[^|]*\|(?<owner>php\.method::[^|]+)\|'}]
    follow:
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: '{owner}'
  emits: [*by_unknown_declared, *by_dispatcher_declared]
  confidence: inferred

# What only the running code names: a name held in a variable or written as an expression, any
# other object, and a variable or property whose class the rules above do not give. A variable's
# or property's site is marked use_type_ready in one pass and read in the next, when use_typed
# shows whether a rule above gave its class.
- rule: dispatch_type_ready
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::[^|]*\|disp_(?:var|prop)~'}]
  emits: [{edge: {kind: use_type_ready, from: this_node, to: this_node}}]
  confidence: inferred

- rule: dispatched_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<expr>[^|]*)\|disp_rt~(?<recv>[^|]*)\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: &runtime_event
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: '{owner}'
  emits:
  - &rt_unknown {edge: {kind: dispatched_by, from: {template: '{holder}|{expr}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - &rt_dispatcher {edge: {kind: dispatched_by, from: {template: '{holder}|{expr}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

- rule: dispatched_by_function_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<expr>[^|]*)\|disp_rt~(?<recv>[^|]*)\|(?<owner>php\.function::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *runtime_event
  emits:
  - &rt_fn_unknown {edge: {kind: dispatched_by_function, from: {template: '{holder}|{expr}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - &rt_fn_dispatcher {edge: {kind: dispatched_by_function, from: {template: '{holder}|{expr}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred

- rule: dispatched_untyped_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<expr>[^|]*)\|disp_(?:var|prop)~(?<recv>[^|]*)\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: &untyped_event
    - edge: use_type_ready
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - node: '{owner}'
    unless: &was_typed [[{edge: use_typed}]]
  emits: [*rt_unknown, *rt_dispatcher]
  confidence: inferred

- rule: dispatched_by_function_untyped_at_runtime
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<expr>[^|]*)\|disp_var~(?<recv>[^|]*)\|(?<owner>php\.function::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *untyped_event
    unless: *was_typed
  emits: [*rt_fn_unknown, *rt_fn_dispatcher]
  confidence: inferred

# parent:: in a class the map holds no parent for.
- rule: dispatched_by_unknown_parent
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<child>[^|]+)::(?<form>class|c:[A-Z][A-Z0-9_]*)\|disp_parent~(?<recv>[^|]*)\|(?<owner>php\.method::(?<holder>[^|]+))\|(?<rest>.*)$'}]
    follow: *runtime_event
    unless: [[{node: 'php.type::{child}'}, {edge: inherits}]]
  emits:
  - {edge: {kind: dispatched_by, from: {template: '{holder}|parent::{form}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}
  - {edge: {kind: dispatched_by, from: {template: '{holder}|parent::{form}~{recv}', types: [drupal.runtime_event], on_miss: unknown_boundary}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}
  confidence: inferred
