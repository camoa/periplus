  id: {template: '$this->{op}|disp_prop~{recv}|{owner}|{key}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: dispatch_object_runtime
  reads: file
  line: {capture: call}
  in: [source]
  match: *start
