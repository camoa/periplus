  id: {template: '{in_services}|{service}|{method}|tagged_param|{event_param}', normalize: [{replace: '^services\|', with: ''}]}
  emits:
  - {edge: {kind: use_has_priority, from: this_node, to: {template: '{service}|{method}|tagged_param|{event_param}', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}}
  - {edge: {kind: use_dispatcher, from: this_node, to: {template: '{service}|{method}|tagged_param|{event_param}', type: drupal.event_use}, attributes: {dispatcher: {template: '{disp}'}}}}
  confidence: declared

- rule: listener_tag_parameter_derived
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_method}|{service}|-|tagged_param|{event_param}', normalize: [{replace: '^services\|none\|', with: ''}]}
