$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A listener registered without getSubscribedEvents, by a kernel.event_listener tag in a services
# file. Symfony's RegisterListenersPass, which Drupal's container runs, reads each such tag: its
# event, its method and its priority, 0 when none is written. Each tag is a subscribed_by edge from
# the event to the method, holding the priority, the same edge a subscriber's key gives, so every
# listener of an event is found in one place.
#
# A tag item is read as text, in the flow form - { name: kernel.event_listener, event: x }, an
# inline list tags: [{...}, {...}], or the block form, one key a line under the dash, in any key
# order, inside one service of the services block, into an internal drupal.event_use node at the
# item's line. A child service with no class takes its parent's, through parent:. An event written
# !php/const A\B::NAME is that constant's event, named by its text when a mapped file gives it one;
# with no method, Symfony derives the method from that text, so the edge ends at a
# drupal.runtime_listener marked as an unknown boundary. The event is the name as
# written: one the table core_event_names lists, as kernel.request, is the event of its core
# constant, as a subscriber's KernelEvents::REQUEST is; any other, as my_module.paid, is the event
# of that name, which a mapped constant of that text also names. The method is looked up on the
# service's class, then on its mapped ancestors, and ends at an unresolved method of the class when
# none declares it; a service the map holds no class for ends at an unresolved method named by the
# service id.
#
# With no method, Symfony names it on<Event>, each letter at the start or after a character other
# than a letter or a digit made upper case and those characters dropped: kernel.response gives
# onKernelResponse; PHP finds a method in any letter case, so the name is matched in lower case
# (event/listener_method.yaml). When the class and its mapped ancestors declare no method of that
# name but one declares __invoke, __invoke listens; when neither is declared, the edge ends at the
# unresolved derived name. With no event, Symfony takes the class that types the method's first
# parameter, __invoke when no method is written, as the event's name: each class of a union, and
# never a later parameter. A tag of another name, as event_subscriber, gives nothing.

# A method an AsEventListener attribute registers holds listens_by_attribute: AsEventListener,
# printed [AsEventListener, not wired by core]. Drupal core, as of 11.4, registers no listener from
# the attribute by itself, so the method listens only where something registers attribute
# listeners; its subscribed_by edge holds what the attribute declares.
attributes:
- name: listens_by_attribute
  on: [php.method]
  mark: AsEventListener, not wired by core

node_types:
# A method an AsEventListener attribute names, <class>::<method>, kept so a map rule can write
# listens_by_attribute on it when the map holds it.
- name: drupal.attribute_listener
  description: "a method an AsEventListener attribute names, <class>::<method>"
  id_namespace: drupal.attribute_listener
  internal: true
# A listener whose method Symfony names from the event's text, which a class constant holds.
- name: drupal.runtime_listener
  description: "a listener whose method Symfony derives from an event constant's text, <class>|<event as written>"
  parent: php.method

edge_kinds:
# The event a listener tag or attribute names, the name as written or the core constant the table
# gives, holding its priority.
- kind: use_names_event
  cause: none
  description: "the listener tag or attribute names that event"
  from: drupal.event_use
  to: drupal.event

rules:
- rule: listener_tag
  reads: file
  in: [module_root]
  match: &listener_tag
    file: '*.services'
    filetype: drupal_yml_text
    text: '(?m)(?:^(?<ind>[ \t]*)-[ \t]+|(?<=[\[,])[ \t]*(?=\{))(?=(?:[^\n{}]*?[{,][ \t]*|[^\n]*\n(?P=ind)[ \t]+)*?name:[ \t]*[''"]?(?<tag>kernel\.event_listener)[''"]?[ \t]*(?:[,}#]|$))(?=(?:(?:[^\n{}]*?[{,][ \t]*|[^\n]*\n(?P=ind)[ \t]+)*?event:[ \t]*(?:!php/const[ \t]+(?<event_const>\\?[\w\\]+::[A-Z][A-Z0-9_]*)|[''"]?(?<event>(?!!)[^''",}\s#]+)))?)(?=(?:(?:[^\n{}]*?[{,][ \t]*|[^\n]*\n(?P=ind)[ \t]+)*?method:[ \t]*[''"]?(?<method>\w+))?)(?=(?:(?:[^\n{}]*?[{,][ \t]*|[^\n]*\n(?P=ind)[ \t]+)*?priority:[ \t]*[''"]?(?<priority>[+-]?[\w:\\]+))?)'
  values: &tag_values
    in_services: {from: {enclosing: services_block, capture: mark}}
    service: {from: {enclosing: service_entry, capture: service}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    prio: {template: '{tag}|{priority}', normalize: [{replace: '^[^|]*\|$', with: '0'}, {replace: '^[^|]*\|', with: ''}]}
    no_method: {template: '{tag}|{method}', normalize: [{replace: '^[^|]*\|$', with: 'none'}, {replace: '^[^|]*\|.+$', with: ''}]}
    no_event: {template: '{tag}|{event}{event_const}', normalize: [{replace: '^[^|]*\|$', with: 'none'}, {replace: '^[^|]*\|.+$', with: ''}]}
    econst: {from: {capture: event_const}, normalize: [{replace: '^\\', with: ''}]}
    typed_method: {template: '{tag}|{method}', normalize: [{replace: '^[^|]*\|$', with: '__invoke'}, {replace: '^[^|]*\|', with: ''}]}
    derived: &derived
      template: '{tag}|{event}'
      normalize: &camelize
      - {replace: '^[^|]*\|', with: ''}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))a', with: 'A'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))b', with: 'B'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))c', with: 'C'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))d', with: 'D'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))e', with: 'E'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))f', with: 'F'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))g', with: 'G'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))h', with: 'H'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))i', with: 'I'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))j', with: 'J'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))k', with: 'K'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))l', with: 'L'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))m', with: 'M'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))n', with: 'N'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))o', with: 'O'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))p', with: 'P'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))q', with: 'Q'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))r', with: 'R'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))s', with: 'S'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))t', with: 'T'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))u', with: 'U'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))v', with: 'V'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))w', with: 'W'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))x', with: 'X'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))y', with: 'Y'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))z', with: 'Z'}
      - {replace: '[^A-Za-z0-9]', with: ''}
      - {replace: '^', with: 'on'}
    derived_lower: {template: '{tag}|{event}', normalize: *camelize, case: lower}
  id: {template: '{in_services}|{service}|{method}|tagged|{event}', normalize: [{replace: '^services\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_event
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|{method}|tagged|{event}', normalize: [{replace: '^services\|', with: ''}]}
  emits: &names_event
  - edge:
      kind: use_names_event
      from: this_node
      to: {template: '{event}', resolve: [{lookup_last_segment_in: core_event_names}, as_written], separator: ' ', types: [drupal.event]}
      attributes: {priority: {template: '{prio}'}}
  confidence: declared

- rule: listener_tag_derived
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_method}|{service}|{derived}|{derived_lower}|tagged_derived|{event}', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_derived_event
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_method}|{service}|{derived}|{derived_lower}|tagged_derived|{event}', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits: *names_event
  confidence: declared

- rule: listener_tag_typed
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_event}|{service}|{typed_method}|tagged_typed', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_typed_priority
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_event}|{service}|{typed_method}|tagged_typed', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits:
  - edge:
      kind: use_has_priority
      from: this_node
      to: {template: '{service}|{typed_method}|tagged_typed', type: drupal.event_use}
      attributes: {priority: {template: '{prio}'}}
  confidence: declared

# An event written !php/const A\B::NAME is the class constant, named by its text when a mapped file
# declares it with one, else by the constant. With no method, Symfony derives it from that text,
# which the tag does not hold: the edge ends at a drupal.runtime_listener <service>|<constant>
# marked as an unknown boundary.
- rule: listener_tag_constant
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|{method}|tagged_const|{econst}', normalize: [{replace: '^services\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_constant_edges
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|{method}|tagged_const|{econst}', normalize: [{replace: '^services\|', with: ''}]}
  emits: &constant_tag_edges
  - edge:
      kind: use_has_priority
      from: this_node
      to: {template: '{service}|{method}|tagged_const|{econst}', type: drupal.event_use}
      attributes: {priority: {template: '{prio}'}}
  - edge: {kind: use_names_event, from: this_node, to: {template: '{econst}', types: [drupal.event_text]}}
  confidence: declared

- rule: listener_tag_constant_runtime
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_method}|{service}|-|tagged_const|{econst}', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_constant_runtime_edges
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_method}|{service}|-|tagged_const|{econst}', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits:
  - edge:
      kind: use_has_priority
      from: this_node
      to: {template: '{service}|-|tagged_const|{econst}', type: drupal.event_use}
      attributes: {priority: {template: '{prio}'}}
  - edge: {kind: use_names_event, from: this_node, to: {template: '{econst}', types: [drupal.event_text]}}
  confidence: declared

- rule: listener_tag_constant_subscribed_by_text
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<declarer>(?<service>[^|]+))\|(?<method>\w+)\|tagged_const\|(?<constant>.+)$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'drupal.class_constant::{constant}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - try: &tag_declarer
      - node: 'drupal.service::{service}'
      - ancestors: [extends_service]
      - edge: service_class
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - try:
        - ancestors: [inherits]
        - id_matches: '^php\.type::(?<declarer>.+)$'
        - node: 'php.method::{declarer}::{method}'
    - node: 'drupal.event::{text}'
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_tag_constant_subscribed_by_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<declarer>(?<service>[^|]+))\|(?<method>\w+)\|tagged_const\|(?<constant>.+)$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - try: *tag_declarer
    - node: 'drupal.event::{constant}'
    unless: [[{node: 'drupal.class_constant::{constant}'}, {edge: has_constant_text}]]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_tag_constant_runtime_by_text
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|-\|tagged_const\|(?<constant>.+)$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'drupal.class_constant::{constant}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - node: 'drupal.event::{text}'
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{service}|{constant}', types: [drupal.runtime_listener], on_miss: unknown_boundary}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_tag_constant_runtime_by_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|-\|tagged_const\|(?<constant>.+)$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'drupal.event::{constant}'
    unless: [[{node: 'drupal.class_constant::{constant}'}, {edge: has_constant_text}]]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{service}|{constant}', types: [drupal.runtime_listener], on_miss: unknown_boundary}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# The method a tag names, on the service's class or the nearest mapped ancestor that declares it,
# else unresolved on the service's class.
- rule: listener_tag_subscribed_by
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|(?<method>[^|]+)\|tagged\|'}]
    follow:
    - edge: use_names_event
    - edge_attribute: priority
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'drupal.service::{service}'
    - ancestors: [extends_service]
    - edge: service_class
    - id_matches: '^php\.type::(?<type>(?<declarer>.+))$'
    - try:
      - ancestors: [inherits]
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - node: 'php.method::{declarer}::{method}'
    - node: 'drupal.event::{event}'
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# A tag of a service the map holds no class for: an unresolved method named by the service id.
- rule: listener_tag_subscribed_by_service
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|(?<method>[^|]+)\|(?:[^|]+\|)?tagged(?:_derived)?\|'}]
    follow:
    - edge: use_names_event
    - edge_attribute: priority
    unless: [[{node: 'drupal.service::{service}'}, {ancestors: [extends_service]}, {edge: service_class}]]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{service}::{method}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# With no method: on<Event> when the class or a mapped ancestor declares it, else __invoke when
# one declares that, else the unresolved on<Event> of the service's class.
- rule: listener_tag_subscribed_by_derived
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|(?<derived>[^|]+)\|(?<lower>[^|]+)\|tagged_derived\|'}]
    follow:
    - edge: use_names_event
    - edge_attribute: priority
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'drupal.service::{service}'
    - ancestors: [extends_service]
    - edge: service_class
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'drupal.method_name::{declarer}::{lower}'
    - edge: method_name_of
    - id_matches: '^drupal\.method_ref::(?<found>.+)$'
    - node: 'php.method::{found}'
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_tag_subscribed_by_invoke
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|(?<derived>[^|]+)\|(?<lower>[^|]+)\|tagged_derived\|'}]
    follow:
    - edge: use_names_event
    - edge_attribute: priority
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'drupal.service::{service}'
    - ancestors: [extends_service]
    - edge: service_class
    - id_matches: '^php\.type::(?<type>.+)$'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'drupal.method_name::{declarer}::__invoke'
    - edge: method_name_of
    - id_matches: '^drupal\.method_ref::(?<found>.+)$'
    - node: 'php.method::{found}'
    unless_matched: [[{node: 'php.type::{type}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<named>.+)$'}, {node: 'drupal.method_name::{named}::{lower}'}, {edge: method_name_of}, {id_matches: '^drupal\.method_ref::(?<found>.+)$'}, {node: 'php.method::{found}'}]]
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_tag_subscribed_by_derived_unresolved
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|(?<derived>[^|]+)\|(?<lower>[^|]+)\|tagged_derived\|'}]
    follow:
    - edge: use_names_event
    - edge_attribute: priority
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'drupal.service::{service}'
    - ancestors: [extends_service]
    - edge: service_class
    - id_matches: '^php\.type::(?<type>.+)$'
    - node: 'drupal.event::{event}'
    unless_matched:
    - [{node: 'php.type::{type}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<named>.+)$'}, {node: 'drupal.method_name::{named}::{lower}'}, {edge: method_name_of}, {id_matches: '^drupal\.method_ref::(?<found>.+)$'}, {node: 'php.method::{found}'}]
    - [{node: 'php.type::{type}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<named>.+)$'}, {node: 'drupal.method_name::{named}::__invoke'}, {edge: method_name_of}, {id_matches: '^drupal\.method_ref::(?<found>.+)$'}, {node: 'php.method::{found}'}]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{type}::{derived}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# With no event: the class that types a parameter of the method, as Symfony reads its first one.
- rule: listener_tag_subscribed_by_type
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|(?<method>[^|]+)\|tagged_typed$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'drupal.service::{service}'
    - ancestors: [extends_service]
    - edge: service_class
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'php.method::{declarer}::{method}'
    - node: 'drupal.method_ref::{declarer}::{method}'
    - edge: first_parameter_typed_as
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'php.method::{declarer}::{method}'
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# Symfony's AsEventListener attribute, #[AsEventListener(event: X, method: 'm', priority: 10)], on
# a method or on a class, read as text in a file under src, as the Hook attribute is: any
# attribute written AsEventListener, with or without its namespace, alone or in a group such as
# #[Hook('x'), AsEventListener(...)], counts, and an attribute of another name, as
# AsEventListenerish, gives nothing. Arguments may hold parentheses two levels deep. An argument is read by its name or by its
# place, event first, method second, priority third; a priority not written is 0. The node sits at
# the attribute's line, and its edge is a subscribed_by edge as a subscriber's key gives.
#
# The event: a class constant, X::NAME, \A\B::NAME, self::NAME or static::NAME, is read as a
# subscriber's key is (event/event_subscriber.yaml); a quoted name as a tag's event is. With no
# event, the class that types the listener method's first parameter is the event's name, as
# Symfony takes it, read from event/listener_method.yaml. The method: on a method, that method; on a class, the method
# argument, else, for a quoted event, on<Event> as for a tag, then __invoke, then the unresolved
# derived name; for a constant, whose text the attribute does not hold, a
# drupal.runtime_listener node marked resolution: runtime; and with no event either, __invoke.
- rule: listener_attribute_use
  reads: file
  in: [source]
  match: &listener_attribute
    file: '**'
    filetype: drupal_php_text
    text: '(?:#\[(?:(?:[^\[\]()]|\[[^\[\]]*\]|\((?:[^()]|\([^()]*\))*\))*?,\s*)??|(?<=,)\s*)\\?(?:[\w\\]*\\)?(?<tag>AsEventListener)(?:\((?<args>(?:[^()]|\((?:[^()]|\([^()]*\))*\))*)\))?(?=\s*(?:,(?:[^\[\]()]|\[[^\[\]]*\]|\((?:[^()]|\([^()]*\))*\))*)?\](?:\s*#\[(?:[^\[\]]|\[[^\[\]]*\])*\])*\s*(?:(?:public|protected|private|static|final|abstract|readonly)\s+)*(?:function\s+(?<method>\w+)\s*\(|class\s))'
  values: &attribute_values
    ev:
      template: '{tag}@{args}'
      normalize:
      - {replace: '^[^@]*@', with: ''}
      - {replace: '(?s)^.*?\bevent:\s*', with: ''}
      - {replace: '^\s+', with: ''}
      - {replace: '(?s)^\w+:(?!:).*$', with: ''}
      - {replace: '(?s)[\s,].*$', with: ''}
      - {replace: '^null$', with: ''}
    key: {template: '{tag}|{ev}', normalize: [{replace: '^[^|]*\|', with: ''}, {replace: '^(?!\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*$).*$', with: ''}]}
    class: {template: '{tag}|{key}', normalize: [{replace: '^[^|]*\|', with: ''}, {replace: '::.*$', with: ''}, {replace: '^\\.*$', with: ''}]}
    constant: {template: '{tag}|{key}', normalize: [{replace: '^[^|]*\|', with: ''}, {replace: '^.*::', with: ''}]}
    own: {template: '{tag}|{ev}', normalize: [{replace: '^[^|]*\|', with: ''}, {replace: '^(?!(?:self|static)::[A-Z][A-Z0-9_]*$).*$', with: ''}, {replace: '^\w+::', with: ''}]}
    const_ev: {template: '{tag}|{ev}', normalize: [{replace: '^[^|]*\|', with: ''}, {replace: '^(?!(?:\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*|self|static)::[A-Z][A-Z0-9_]*$).*$', with: ''}]}
    text: {template: '{tag}|{ev}', normalize: [{replace: '^[^|]*\|', with: ''}, {replace: '^(?!''[^'']*''$|"[^"]*"$).*$', with: ''}, {replace: '^.|.$', with: ''}]}
    no_event: {template: '{tag}|{ev}', normalize: [{replace: '^[^|]*\|$', with: 'none'}, {replace: '^[^|]*\|.+$', with: ''}]}
    meth:
      template: '{tag}@{args}'
      normalize:
      - {replace: '^[^@]*@', with: '@'}
      - {replace: '(?s)^@.*?\bmethod:\s*[''"]', with: ''}
      - {replace: '(?s)^@\s*(?:[^,:''"]|::|''[^'']*''|"[^"]*")+,\s*[''"]', with: ''}
      - {replace: '(?s)^@.*$', with: ''}
      - {replace: '(?s)[''"].*$', with: ''}
    listener: {template: '{tag}|{method}{meth}', normalize: [{replace: '^[^|]*\|', with: ''}]}
    no_method: {template: '{tag}|{method}{meth}', normalize: [{replace: '^[^|]*\|$', with: 'none'}, {replace: '^[^|]*\|.+$', with: ''}]}
    typed_method: {template: '{tag}|{method}{meth}', normalize: [{replace: '^[^|]*\|$', with: '__invoke'}, {replace: '^[^|]*\|', with: ''}]}
    prio:
      template: '{tag}@{args}'
      normalize:
      - {replace: '^[^@]*@', with: '@'}
      - {replace: '(?s)^@.*?\bpriority:\s*', with: ''}
      - {replace: '(?s)^@\s*(?:(?:[^,:''"()]|::|''[^'']*''|"[^"]*")+,\s*){2}', with: ''}
      - {replace: '(?s)^@.*$', with: '0'}
      - {replace: '(?s)\s*,.*$', with: ''}
      - {replace: '\s+$', with: ''}
    derived: {template: '{tag}|{text}', normalize: *camelize}
    derived_lower: {template: '{tag}|{text}', normalize: *camelize, case: lower}
    ns: {template: '{psr4_namespace}', normalize: [{replace: '\\$', with: ''}]}
  id: {template: '{key}|subscribed|{psr4_class}::{listener}', resolve: [{full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

