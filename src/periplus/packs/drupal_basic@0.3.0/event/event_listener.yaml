  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|-\|tagged_const\|(?<constant>(?<cc>.+)::(?<cn>[A-Z][A-Z0-9_]*))$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - try: [{edge: use_dispatcher}, {edge_attribute: dispatcher}]
    - edge: use_has_priority
    - edge_attribute: priority
    - try: [{node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<constant>.+)$'}]
    - node: 'drupal.event::{constant}'
    - id_matches: '^(?<target_id>[\s\S]+)$'
    - try: [{node: '{use_id}'}, {edge: use_priority_constant}, {id_matches: '^drupal\.class_constant::(?<pc>.+)::(?<pn>[A-Z_][A-Z0-9_]*)$'}, {node: 'php.type::{pc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<pcd>.+)$'}, {node: 'drupal.class_constant::{pcd}::{pn}'}, {edge: has_constant_int}, {id_matches: '^drupal\.constant_int::(?<priority>-?\d+)$'}, {node: '{target_id}'}]
    unless: [[{node: 'drupal.class_constant::{constant}'}, {edge: has_constant_text}], [{node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {edge: has_constant_text}]]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{service}|{cc}::{cn}', types: [drupal.runtime_listener], on_miss: unknown_boundary}, attributes: {priority: {template: '{priority}'}, dispatcher: {template: '{dispatcher}'}}}}]
  confidence: inferred

# An event written as a container parameter, event: '%my_module.event%', is the text the services
# file's parameters block gives that parameter, read by the rule below, when one mapped file gives
# it one literal value; the event is named as a tag's quoted event is. Symfony's
# RegisterListenersPass reads the tag as written and passes '%name%' on to the dispatcher's
# addListener call, whose argument the built container replaces with the parameter's value; with
# no method, the pass derives the method from the text as written, so from the parameter's name,
# on<Name>, then __invoke. A parameter no mapped file gives a value, or that two
# give different values, is decided when the container is built: the tag is then a
# drupal.runtime_subscription <service>|%<parameter>%, marked resolution: runtime, with a
# registers_listener_at_runtime edge from the service.
- rule: container_parameter
  reads: file
  in: [module_root]
  match: &container_parameter
    file: '*.services'
    filetype: drupal_yml_text
    text: '(?m)^  (?<name>[A-Za-z0-9_][\w.\-]*):[ \t]*(?:''(?<single>(?:[^''\n%]|'''')+)''|"(?<double>(?:[^"\\\n%]|\\[\\"])+)"|(?<plain>[^\s''"#\[{&*!|>%@`,][^\n#%]*?))[ \t]*(?:#[^\n]*)?$'
  values: &parameter_values
    in_parameters: {from: {enclosing: parameters_block, capture: mark}}
    # '' is a quote in single quotes, before the first §; \\ a backslash and \" a quote in double
    # quotes, between the two.
    text: {template: '{single}§{double}§{plain}', normalize: [{replace: '''''(?=[^§]*§[^§]*§)', with: ''''}, {replace: '\\\\(?=[^§]*§[^§]*$)', with: '¤'}, {replace: '\\"(?=[^§]*§[^§]*$)', with: '"'}, {replace: '¤', with: '\'}, {replace: '§', with: ''}]}
    # Symfony derives the method from the tag's text as written, %name%, before the container
    # gives the parameter its value, so from the parameter's name.
    derived:
      template: '{name}'
      normalize:
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))a', with: 'A'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))b', with: 'B'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))c', with: 'C'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))d', with: 'D'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))e', with: 'E'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))f', with: 'F'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))g', with: 'G'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))h', with: 'H'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))i', with: 'I'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))j', with: 'J'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))k', with: 'K'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))l', with: 'L'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))m', with: 'M'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))n', with: 'N'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))o', with: 'O'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))p', with: 'P'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))q', with: 'Q'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))r', with: 'R'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))s', with: 'S'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))t', with: 'T'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))u', with: 'U'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))v', with: 'V'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))w', with: 'W'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))x', with: 'X'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))y', with: 'Y'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))z', with: 'Z'}
      - {replace: '[^A-Za-z0-9]', with: ''}
      - {replace: '^', with: 'on'}
    lower: {template: '{derived}', case: lower}
  id: {template: '{in_parameters}|{name}', normalize: [{replace: '^parameters\|', with: ''}]}
  emits: [{node: {type: drupal.container_parameter}}]
  confidence: declared

- rule: container_parameter_value
  reads: file
  in: [module_root]
  match: *container_parameter
  values: *parameter_values
  id: {template: '{in_parameters}|{name}', normalize: [{replace: '^parameters\|', with: ''}]}
  emits:
  - edge: {kind: parameter_names_event, from: this_node, to: {template: '{text}', resolve: [{lookup_last_segment_in: core_event_names}, as_written], separator: ' ', types: [drupal.event_text]}}
  - edge: {kind: parameter_derives_listener, from: this_node, to: {template: '{derived}|{lower}', types: [drupal.derived_listener]}}
  confidence: declared

- rule: listener_tag_parameter
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|{method}|tagged_param|{event_param}', normalize: [{replace: '^services\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_parameter_edges
