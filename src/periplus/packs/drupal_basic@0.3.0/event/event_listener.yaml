  emits:
  - {edge: {kind: use_has_priority, from: this_node, to: {template: '{service}|-|tagged_param|{event_param}', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}}
  - {edge: {kind: use_dispatcher, from: this_node, to: {template: '{service}|-|tagged_param|{event_param}', type: drupal.event_use}, attributes: {dispatcher: {template: '{disp}'}}}}
  confidence: declared

- rule: listener_tag_parameter_runtime
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|%{event_param}%', normalize: [{replace: '^services\|', with: ''}]}
  emits:
  - node: {type: drupal.runtime_subscription}
  - attribute: {name: resolution, template: runtime}
  confidence: declared

- rule: listener_tag_parameter_runtime_from
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|%{event_param}%', normalize: [{replace: '^services\|', with: ''}]}
  emits: [{edge: {kind: registers_listener_at_runtime, from: {template: '{service}', types: [drupal.service]}, to: this_node}}]
  confidence: declared

# One literal value: the runtime mark is taken back, before the passes.
- rule: listener_tag_parameter_given
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|[^|]+\|tagged_param\|(?<param>.+)$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - node: 'drupal.container_parameter::{param}'
    - edge: parameter_names_event
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'drupal.runtime_subscription::{service}|%{param}%'
    unless_matched: [[{node: 'drupal.container_parameter::{param}'}, {edge: parameter_names_event}, {id_matches: '^drupal\.event::(?!{event}$)'}]]
  emits: [{withhold: matched_node}]
  confidence: inferred

- rule: listener_tag_parameter_subscribed_by
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|(?<method>\w+)\|tagged_param\|(?<param>.+)$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - try: [{edge: use_dispatcher}, {edge_attribute: dispatcher}]
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'drupal.container_parameter::{param}'
    - edge: parameter_names_event
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - try:
      - node: 'drupal.service::{service}'
      - ancestors: [extends_service]
      - edge: service_class
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - try:
        - ancestors: [inherits]
        - id_matches: '^php\.type::(?<declarer>.+)$'
        - node: 'php.method::{declarer}::{method}'
    - node: 'drupal.event::{event}'
    - id_matches: '^(?<target_id>[\s\S]+)$'
    - try: [{node: '{use_id}'}, {edge: use_priority_constant}, {id_matches: '^drupal\.class_constant::(?<pc>.+)::(?<pn>[A-Z_][A-Z0-9_]*)$'}, {node: 'php.type::{pc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<pcd>.+)$'}, {node: 'drupal.class_constant::{pcd}::{pn}'}, {edge: has_constant_int}, {id_matches: '^drupal\.constant_int::(?<priority>-?\d+)$'}, {node: '{target_id}'}]
    unless_matched: [[{node: 'drupal.container_parameter::{param}'}, {edge: parameter_names_event}, {id_matches: '^drupal\.event::(?!{event}$)'}]]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}, dispatcher: {template: '{dispatcher}'}}}}]
  confidence: inferred

- rule: listener_tag_parameter_subscribed_by_service
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|(?<method>\w+)\|tagged_param\|(?<param>.+)$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    unless: [[{node: 'drupal.service::{service}'}, {ancestors: [extends_service]}, {edge: service_class}]]
