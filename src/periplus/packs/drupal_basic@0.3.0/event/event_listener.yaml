  values: *attribute_values
  id: {template: '{key}|subscribed|{psr4_class}::{listener}', resolve: [{full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits: [{edge: {kind: use_names_listener, from: this_node, to: {template: '{psr4_class}::{listener}', types: [php.method]}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: declared

