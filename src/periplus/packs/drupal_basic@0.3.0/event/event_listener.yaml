# On a class with no event: the map rule reads the type of the method's parameter.
- rule: listener_attribute_class_typed
  reads: file
  in: [source]
  match: *listener_attribute
  values: *attribute_values
  id: {template: '{no_event}|{on_class}|{psr4_class}|{typed_method}|listens_typed', normalize: [{replace: '^none\|class\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_attribute_class_typed_priority
  reads: file
  in: [source]
  match: *listener_attribute
  values: *attribute_values
  id: {template: '{no_event}|{on_class}|{psr4_class}|{typed_method}|listens_typed', normalize: [{replace: '^none\|class\|', with: ''}]}
  emits: [{edge: {kind: use_has_priority, from: this_node, to: {template: '{psr4_class}|{typed_method}|listens_typed', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: declared

- rule: listener_attribute_subscribed_by
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<class>[^|]+)\|(?<method>[^|]+)\|listens\|'}]
    follow:
    - edge: use_names_event
    - edge_attribute: priority
    - id_matches: '^drupal\.event::(?<event>.+)$'
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{class}::{method}', types: [php.method]}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_attribute_subscribed_by_derived
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<class>[^|]+)\|(?<derived>[^|]+)\|listens_derived\|'}]
    follow:
    - edge: use_names_event
    - edge_attribute: priority
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'php.method::{declarer}::{derived}'
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_attribute_subscribed_by_invoke
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<class>[^|]+)\|(?<derived>[^|]+)\|listens_derived\|'}]
    follow:
    - edge: use_names_event
    - edge_attribute: priority
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'php.method::{declarer}::__invoke'
    unless_matched: [[{node: 'php.type::{class}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<named>.+)$'}, {node: 'php.method::{named}::{derived}'}]]
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_attribute_subscribed_by_derived_unresolved
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<class>[^|]+)\|(?<derived>[^|]+)\|listens_derived\|'}]
    follow:
    - edge: use_names_event
    - edge_attribute: priority
    unless:
    - [{node: 'php.type::{class}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<named>.+)$'}, {node: 'php.method::{named}::{derived}'}]
    - [{node: 'php.type::{class}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<named>.+)$'}, {node: 'php.method::{named}::__invoke'}]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{class}::{derived}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# The runtime listener's event, named as a subscriber's key names it: by the constant's text when
# a mapped file declares it, else by the constant.
- rule: listener_attribute_runtime_by_text
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|subscribed_runtime(?:_here)?\|(?<class>[^|]+)\|(?<written>[^|]+)$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'drupal.class_constant::{event}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - node: 'php.method::{class}|{written}'
  emits: [{edge: {kind: subscribed_by, from: {template: '{text}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_attribute_runtime_by_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|subscribed_runtime\|(?<class>[^|]+)\|(?<written>[^|]+)$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'php.method::{class}|{written}'
    unless: [[{node: 'drupal.class_constant::{event}'}, {edge: has_constant_text}]]
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# A constant of the file's own namespace with no text: only when a mapped class declares it.
- rule: listener_attribute_runtime_in_namespace_by_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|subscribed_runtime_here\|(?<class>[^|]+)\|(?<written>[^|]+)$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'drupal.class_constant::{event}'
    - node: 'php.method::{class}|{written}'
    unless: [[{node: 'drupal.class_constant::{event}'}, {edge: has_constant_text}]]
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: listener_attribute_subscribed_by_type
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<class>[^|]+)\|(?<method>[^|]+)\|listens_typed$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'php.method::{declarer}::{method}'
    - edge: has_parameter
    - edge: parameter_typed_as
    - id_matches: '^php\.parameter_type::.+::\$\w+::(?<event>.+)$'
    - node: 'php.method::{declarer}::{method}'
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred
