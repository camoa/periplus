  in: [source]
  match: *listener_attribute
  values: *attribute_values
  id: {template: '{no_method}|{psr4_class}|{const_ev}', normalize: [{replace: '^none\|', with: ''}]}
  emits:
  - node: {type: drupal.runtime_listener}
  - attribute: {name: resolution, template: runtime}
  confidence: declared

- rule: listener_attribute_runtime_use
