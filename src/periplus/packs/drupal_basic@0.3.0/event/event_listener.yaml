$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A listener registered without getSubscribedEvents, by a kernel.event_listener tag in a services
# file. Symfony's RegisterListenersPass, which Drupal's container runs, reads each such tag: its
# event, its method and its priority, 0 when none is written. Each tag is a subscribed_by edge from
# the event to the method, holding the priority, the same edge a subscriber's key gives, so every
# listener of an event is found in one place.
#
# A tag item is read as text, in the flow form - { name: kernel.event_listener, event: x }, an
# inline list tags: [{...}, {...}], or the block form, one key a line under the dash or the dash
# alone on its line, in any key order, inside one service of the services block, into an internal
# drupal.event_use node at the item's line. A child service with no class takes its parent's,
# through parent:. An event written !php/const A\B::NAME is that constant's event, named by its text
# when a mapped file gives it one, a constant read through a class that inherits it being its
# declaring class's; with no method, the method Symfony derives from that text, as below, or, when
# no mapped file gives the text, a drupal.runtime_listener <service>|<constant> marked as an
# unknown boundary. An event written as a container parameter, '%name%', is the value a mapped
# parameters block gives it, as the rules below say. The event is the name as written, in double
# quotes \\, \" and \/ read as a backslash, a quote and a slash; a double-quoted name with any
# other escape, as "a\tb", holds a character no event name holds and is a runtime registration of
# the service, a drupal.runtime_subscription <service>|"<name as written>". One the table
# core_event_names lists, as kernel.request, is the
# event of its core constant, as a subscriber's KernelEvents::REQUEST is; any other, as
# my_module.paid, or a class's full name, as Drupal\my_module\Event\Paid, the name of an event
# dispatched as an object, is the event of that name, which a mapped constant of that text also
# names. The method is looked up on the
# service's class, then on its mapped ancestors, and ends at an unresolved method of the class when
# none declares it; a service the map holds no class for ends at an unresolved method named by the
# service id.
#
# With no method, Symfony names it on<Event>, each letter at the start or after a character other
# than a letter or a digit made upper case and those characters dropped: kernel.response gives
# onKernelResponse; PHP finds a method in any letter case, so the name is matched in lower case
# (event/listener_method.yaml). When the class and its mapped ancestors declare no method of that
# name but one declares __invoke, __invoke listens; when neither is declared, the edge ends at the
# unresolved derived name. With no event, Symfony takes the class that types the method's first
# parameter, __invoke when no method is written, as the event's name: each class of a union, and
# never a later parameter. A tag of another name, as event_subscriber, gives nothing.
#
# A tag's dispatcher key names the dispatcher service the listener is added to, in place of the
# main event_dispatcher. Each such tag writes it on a use_dispatcher self-link, and every
# listener map rule carries it to the subscribed_by edge as the edge attribute dispatcher, as
# written; a tag without the key writes none, so an edge without it is on the main dispatcher.

# An AsEventListener attribute is read across lines and comments. Its event X::NAME that no use
# statement binds is the constant of the file's own namespace, unresolved when no mapped file
# declares it; parent::NAME and parent::class read the parent the class extends, for an attribute
# on a class through the span attributed_class; a priority written as a constant holds the integer
# a mapped file declares it with (event/event_subscriber.yaml). A dispatcher key stays the service
# id as written: no edge kind of the pack says a listener is added to another dispatcher.
#
# A method an AsEventListener attribute registers holds listens_by_attribute: AsEventListener,
# printed [AsEventListener, not wired by core]. Drupal core, as of 11.4, registers no listener from
# the attribute by itself, so the method listens only where something registers attribute
# listeners; its subscribed_by edge holds what the attribute declares.
attributes:
- name: listens_by_attribute
  on: [php.method]
  mark: AsEventListener, not wired by core

node_types:
# A container parameter a services file's parameters block gives a value, by its name.
- name: drupal.container_parameter
  description: "a container parameter a services file's parameters block gives a value, by its name"
  id_namespace: drupal.container_parameter
  internal: true
# A method an AsEventListener attribute names, <class>::<method>, kept so a map rule can write
# listens_by_attribute on it when the map holds it.
- name: drupal.attribute_listener
  description: "a method an AsEventListener attribute names, <class>::<method>"
  id_namespace: drupal.attribute_listener
  internal: true
# A listener whose method Symfony names from the event's text, which a class constant holds.
- name: drupal.runtime_listener
  description: "a listener whose method Symfony derives from an event constant's text, <class>|<event as written>"
  parent: php.method

edge_attributes:
- name: dispatcher
  on: [use_dispatcher, subscribed_by, subscribed_by_function]
  description: "the event dispatcher service a listener tag or attribute names under dispatcher, as written, when it names one; a listener without it is on the main event_dispatcher"

edge_kinds:
- kind: parameter_names_event
  cause: none
  description: "the container parameter's value, as a services file's parameters block gives it, names that event"
  from: drupal.container_parameter
  to: drupal.event
- kind: parameter_derives_listener
  cause: none
  description: "a listener tag whose event is this parameter, with no method, is that derived method"
  from: drupal.container_parameter
  to: drupal.derived_listener
# A listener tag's or attribute's site to itself, holding the dispatcher it names, which the map
# rules carry to the subscribed_by edge.
- kind: use_dispatcher
  cause: none
  description: "the listener tag or attribute names the dispatcher this self-link holds"
  from: drupal.event_use
  to: drupal.event_use
# The event a listener tag or attribute names, the name as written or the core constant the table
# gives, holding its priority.
- kind: use_names_event
  cause: none
  description: "the listener tag or attribute names that event"
  from: drupal.event_use
  to: drupal.event

rules:
- rule: listener_tag
  reads: file
  in: [module_root]
  match: &listener_tag
    file: '*.services'
    filetype: drupal_yml_text
    text: '(?m)(?:^(?<ind>[ \t]*)-(?:[ \t]+(?![ \t])|(?=\n))|(?<=[\[,])[ \t]*(?=\{))(?=(?:[^\n]*\n(?P=ind)[ \t]+(?![ \t]))*?(?:[^\n{},]*[{,][ \t]*)*?name:[ \t]*[''"]?(?<tag>kernel\.event_listener)[''"]?[ \t]*(?:[,}#]|$))(?=(?:(?:[^\n]*\n(?P=ind)[ \t]+(?![ \t]))*?(?:[^\n{},]*[{,][ \t]*)*?event:[ \t]*(?:!php/const[ \t]+(?<event_const>\\?[\w\\]+::[A-Z][A-Z0-9_]*)|[''"]?%(?<event_param>[^%''",}\s#]+)%[''"]?(?=[ \t]*(?:[,}#]|$))|"(?<event_esc>(?:[^"\\\n]|\\[\\"/])*\\[^\\"/\n](?:[^"\\\n]|\\[^\n])*)"(?=[ \t]*(?:[,}#]|$))|"(?<event_dq>(?:[^"\\\n]|\\[\\"/])*\\[\\"/](?:[^"\\\n]|\\[\\"/])*)"(?=[ \t]*(?:[,}#]|$))|(?<event_quote>[''"]?)(?<event_raw>(?!!)[^''",}\s#]+)))?)(?=(?:(?:[^\n]*\n(?P=ind)[ \t]+(?![ \t]))*?(?:[^\n{},]*[{,][ \t]*)*?method:[ \t]*[''"]?(?<method>\w+))?)(?=(?:(?:[^\n]*\n(?P=ind)[ \t]+(?![ \t]))*?(?:[^\n{},]*[{,][ \t]*)*?priority:[ \t]*[''"]?(?<priority>(?:(?=(?:(?<pcref>(?:self|static|\\?(?:[A-Za-z_]\w*\\)+[A-Z]\w*)::[A-Z][A-Z0-9_]*)|(?<pcu>[A-Z]\w*::[A-Z][A-Z0-9_]*))\s*[,\]\)]))?[+-]?[\w:\\]+))?)(?=(?:(?:[^\n]*\n(?P=ind)[ \t]+(?![ \t]))*?(?:[^\n{},]*[{,][ \t]*)*?dispatcher:[ \t]*[''"]?(?<dispatcher>[^''",}\s#]+))?)'
  values: &tag_values
    # The event as YAML reads it: in double quotes \\ is one backslash, and \" and \/ a quote
    # and a slash. Any other escape gives a character no event name holds, and is read below as a
    # runtime registration.
    event: {template: '{event_raw}{event_dq}§{event_quote}§{event_dq}', normalize: [{replace: '\\\\(?=[^§]*§"§$)', with: '¤'}, {replace: '\\\\(?=[^§]*§§.)', with: '¤'}, {replace: '\\"(?=[^§]*§§.)', with: '"'}, {replace: '\\/(?=[^§]*§§.)', with: '/'}, {replace: '¤', with: '\'}, {replace: '§[''"]?§[\s\S]*$', with: ''}]}
    in_services: {from: {enclosing: services_block, capture: mark}}
    service: {from: {enclosing: service_entry, capture: service}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    prio: {template: '{tag}|{priority}', normalize: [{replace: '^[^|]*\|$', with: '0'}, {replace: '^[^|]*\|', with: ''}]}
    no_method: {template: '{tag}|{method}', normalize: [{replace: '^[^|]*\|$', with: 'none'}, {replace: '^[^|]*\|.+$', with: ''}]}
    no_event: {template: '{tag}|{event_raw}{event_dq}{event_esc}{event_const}{event_param}', normalize: [{replace: '^[^|]*\|$', with: 'none'}, {replace: '^[^|]*\|.+$', with: ''}]}
    econst: {from: {capture: event_const}, normalize: [{replace: '^\\', with: ''}]}
    disp: {from: {capture: dispatcher}}
    typed_method: {template: '{tag}|{method}', normalize: [{replace: '^[^|]*\|$', with: '__invoke'}, {replace: '^[^|]*\|', with: ''}]}
    derived: &derived
      template: '{tag}|{event}'
      normalize: &camelize
      - {replace: '^[^|]*\|', with: ''}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))a', with: 'A'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))b', with: 'B'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))c', with: 'C'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))d', with: 'D'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))e', with: 'E'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))f', with: 'F'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))g', with: 'G'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))h', with: 'H'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))i', with: 'I'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))j', with: 'J'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))k', with: 'K'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))l', with: 'L'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))m', with: 'M'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))n', with: 'N'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))o', with: 'O'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))p', with: 'P'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))q', with: 'Q'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))r', with: 'R'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))s', with: 'S'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))t', with: 'T'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))u', with: 'U'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))v', with: 'V'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))w', with: 'W'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))x', with: 'X'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))y', with: 'Y'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))z', with: 'Z'}
      - {replace: '[^A-Za-z0-9]', with: ''}
      - {replace: '^', with: 'on'}
    derived_lower: {template: '{tag}|{event}', normalize: *camelize, case: lower}
  id: {template: '{in_services}|{service}|{method}|tagged|{event}', normalize: [{replace: '^services\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

# A double-quoted event with an escape other than \\, \" and \/, as "a\tb", names an event
# whose text holds a character no event name holds; the built container alone knows it.
- rule: listener_tag_escaped
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|"{event_esc}"', normalize: [{replace: '^services\|', with: ''}]}
  emits:
  - node: {type: drupal.runtime_subscription}
  - attribute: {name: resolution, template: runtime}
  confidence: declared

- rule: listener_tag_escaped_from
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|"{event_esc}"', normalize: [{replace: '^services\|', with: ''}]}
  emits: [{edge: {kind: registers_listener_at_runtime, from: {template: '{service}', types: [drupal.service]}, to: this_node}}]
  confidence: declared

- rule: listener_tag_event
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|{method}|tagged|{event}', normalize: [{replace: '^services\|', with: ''}]}
  emits:
  - &names_event_edge
    edge:
      kind: use_names_event
      from: this_node
      to: {template: '{event}', resolve: [{lookup_last_segment_in: core_event_names}, as_written], separator: ' ', types: [drupal.event]}
      attributes: {priority: {template: '{prio}'}}
  - {edge: {kind: use_dispatcher, from: this_node, to: {template: '{service}|{method}|tagged|{event}', type: drupal.event_use}, attributes: {dispatcher: {template: '{disp}'}}}}
  confidence: declared

- rule: listener_tag_derived
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_method}|{service}|{derived}|{derived_lower}|tagged_derived|{event}', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_derived_event
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_method}|{service}|{derived}|{derived_lower}|tagged_derived|{event}', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits:
  - *names_event_edge
  - {edge: {kind: use_dispatcher, from: this_node, to: {template: '{service}|{derived}|{derived_lower}|tagged_derived|{event}', type: drupal.event_use}, attributes: {dispatcher: {template: '{disp}'}}}}
  confidence: declared

- rule: listener_tag_typed
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_event}|{service}|{typed_method}|tagged_typed', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_typed_priority
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_event}|{service}|{typed_method}|tagged_typed', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits:
  - edge:
      kind: use_has_priority
      from: this_node
      to: {template: '{service}|{typed_method}|tagged_typed', type: drupal.event_use}
      attributes: {priority: {template: '{prio}'}}
  - {edge: {kind: use_dispatcher, from: this_node, to: {template: '{service}|{typed_method}|tagged_typed', type: drupal.event_use}, attributes: {dispatcher: {template: '{disp}'}}}}
  confidence: declared

# An event written !php/const A\B::NAME is the class constant, named by its text when a mapped file
# declares it with one, on the class or the nearest mapped ancestor or interface that declares it,
# else by the constant.
- rule: listener_tag_constant
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|{method}|tagged_const|{econst}', normalize: [{replace: '^services\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_constant_edges
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{service}|{method}|tagged_const|{econst}', normalize: [{replace: '^services\|', with: ''}]}
  emits: &constant_tag_edges
  - edge:
      kind: use_has_priority
      from: this_node
      to: {template: '{service}|{method}|tagged_const|{econst}', type: drupal.event_use}
      attributes: {priority: {template: '{prio}'}}
  - edge: {kind: use_names_event, from: this_node, to: {template: '{econst}', types: [drupal.event_text]}}
  - {edge: {kind: use_dispatcher, from: this_node, to: {template: '{service}|{method}|tagged_const|{econst}', type: drupal.event_use}, attributes: {dispatcher: {template: '{disp}'}}}}
  confidence: declared

- rule: listener_tag_constant_runtime
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_method}|{service}|-|tagged_const|{econst}', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: declared

- rule: listener_tag_constant_runtime_edges
  reads: file
  in: [module_root]
  match: *listener_tag
  values: *tag_values
  id: {template: '{in_services}|{no_method}|{service}|-|tagged_const|{econst}', normalize: [{replace: '^services\|none\|', with: ''}]}
  emits:
  - edge:
      kind: use_has_priority
      from: this_node
      to: {template: '{service}|-|tagged_const|{econst}', type: drupal.event_use}
      attributes: {priority: {template: '{prio}'}}
  - edge: {kind: use_names_event, from: this_node, to: {template: '{econst}', types: [drupal.event_text]}}
  - {edge: {kind: use_dispatcher, from: this_node, to: {template: '{service}|-|tagged_const|{econst}', type: drupal.event_use}, attributes: {dispatcher: {template: '{disp}'}}}}
  confidence: declared

- rule: listener_tag_constant_subscribed_by_text
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<declarer>(?<service>[^|]+))\|(?<method>\w+)\|tagged_const\|(?<constant>(?<cc>.+)::(?<cn>[A-Z][A-Z0-9_]*))$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - try: [{edge: use_dispatcher}, {edge_attribute: dispatcher}]
    - edge: use_has_priority
    - edge_attribute: priority
    - try: [{node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<constant>.+)$'}]
    - node: 'drupal.class_constant::{constant}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - try: &tag_declarer
      - node: 'drupal.service::{service}'
      - ancestors: [extends_service]
      - edge: service_class
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - try:
        - ancestors: [inherits]
        - id_matches: '^php\.type::(?<declarer>.+)$'
        - node: 'php.method::{declarer}::{method}'
    - node: 'drupal.event::{text}'
    - id_matches: '^(?<target_id>[\s\S]+)$'
    - try: [{node: '{use_id}'}, {edge: use_priority_constant}, {id_matches: '^drupal\.class_constant::(?<pc>.+)::(?<pn>[A-Z_][A-Z0-9_]*)$'}, {node: 'php.type::{pc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<pcd>.+)$'}, {node: 'drupal.class_constant::{pcd}::{pn}'}, {edge: has_constant_int}, {id_matches: '^drupal\.constant_int::(?<priority>-?\d+)$'}, {node: '{target_id}'}]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}, dispatcher: {template: '{dispatcher}'}}}}]
  confidence: inferred

- rule: listener_tag_constant_subscribed_by_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<declarer>(?<service>[^|]+))\|(?<method>\w+)\|tagged_const\|(?<constant>(?<cc>.+)::(?<cn>[A-Z][A-Z0-9_]*))$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - try: [{edge: use_dispatcher}, {edge_attribute: dispatcher}]
    - edge: use_has_priority
    - edge_attribute: priority
    - try: *tag_declarer
    - try: [{node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<constant>.+)$'}]
    - node: 'drupal.event::{constant}'
    - id_matches: '^(?<target_id>[\s\S]+)$'
    - try: [{node: '{use_id}'}, {edge: use_priority_constant}, {id_matches: '^drupal\.class_constant::(?<pc>.+)::(?<pn>[A-Z_][A-Z0-9_]*)$'}, {node: 'php.type::{pc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<pcd>.+)$'}, {node: 'drupal.class_constant::{pcd}::{pn}'}, {edge: has_constant_int}, {id_matches: '^drupal\.constant_int::(?<priority>-?\d+)$'}, {node: '{target_id}'}]
    unless: [[{node: 'drupal.class_constant::{constant}'}, {edge: has_constant_text}], [{node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {edge: has_constant_text}]]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}, dispatcher: {template: '{dispatcher}'}}}}]
  confidence: inferred

# With no method and a constant whose text a mapped file gives, the method Symfony derives from
# that text (event/event_name.yaml): on<Event> when the class or a mapped ancestor declares it,
# else __invoke, else the unresolved derived name; with a service the map holds no class for, the
# unresolved derived name on the service id.
- rule: listener_tag_constant_derived
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|-\|tagged_const\|(?<constant>(?<cc>.+)::(?<cn>[A-Z][A-Z0-9_]*))$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - try: [{edge: use_dispatcher}, {edge_attribute: dispatcher}]
    - edge: use_has_priority
    - edge_attribute: priority
    - try: [{node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<constant>.+)$'}]
    - node: 'drupal.class_constant::{constant}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - edge: derives_listener
    - id_matches: '^drupal\.derived_listener::(?<derived>[^|]+)\|(?<lower>.+)$'
    - node: 'drupal.service::{service}'
    - ancestors: [extends_service]
    - edge: service_class
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'drupal.method_name::{declarer}::{lower}'
    - edge: method_name_of
    - id_matches: '^drupal\.method_ref::(?<found>.+)$'
    - node: 'php.method::{found}'
    - id_matches: '^(?<target_id>[\s\S]+)$'
