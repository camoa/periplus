# Symfony's AsEventListener attribute, #[AsEventListener(event: X, method: 'm', priority: 10)], on
# a method or on a class, read as text in a file under src, as the Hook attribute is: any
# attribute written AsEventListener, with or without its namespace, alone or in a group such as
# #[Hook('x'), AsEventListener(...)], counts, and an attribute of another name, as
# AsEventListenerish, gives nothing. Arguments may hold parentheses two levels deep. Each argument
# is read whole, by its name or by its place, event first, method second, priority third and
# dispatcher fourth; a priority not written is 0, and a dispatcher is kept, without its quotes, in
# the edge attribute dispatcher. The node sits at the attribute's line, and its edge is a
# subscribed_by edge as a subscriber's key gives. An event or method written as an expression, as
# 'a' . 'b' or self::PREFIX . '.x', which only the running code turns into a name, is a
# drupal.runtime_subscription <class>::<method>|<expression> on a method, or <class>|<expression>
# on a class, marked resolution: runtime, with a registers_listener_at_runtime edge from the method
# or the class; a method argument on a method, which Symfony refuses, is not read.
#
# The event: a class constant, X::NAME, \A\B::NAME, self::NAME or static::NAME, is read as a
# subscriber's key is (event/event_subscriber.yaml); a quoted name as a tag's event is. With no
# event, the class that types the listener method's first parameter is the event's name, as
# Symfony takes it, read from event/listener_method.yaml. An event written X::class, the name of an
# event dispatched as an object, is the event of the class's full name, through the file's use
# statements, its namespace, or self. The method: on a method, that method; on a class, the method
# argument, else on<Event> derived from the event's text, a quoted name's, a constant's when a
# mapped file gives it, or a class's full name when a file gives it (event/event_name.yaml), then
# __invoke, then the unresolved derived name; when no mapped file gives the text, a
# drupal.runtime_listener node marked resolution: runtime; and with no event either, __invoke.
- rule: listener_attribute_use
  reads: file
  in: [source]
  match: &listener_attribute
    file: '**'
    filetype: drupal_php_text
