# gives: the runtime listener the file rule made is taken back, and the method is the one Symfony
# derives from that text (event/event_name.yaml): on<Event> when the class or a mapped ancestor
# declares it, else __invoke, else the unresolved derived name.
- rule: listener_attribute_runtime_named_by_text
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>(?<cc>[^|]+)::(?<cn>[A-Z][A-Z0-9_]*))\|subscribed_runtime(?<flavor>_here|)\|(?<class>[^|]+)\|(?<written>[^|]+)$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    unless: [[{node: 'drupal.event_use::bound|{written}|{class}|{flavor}'}]]
    follow:
    - try: [{node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<event>.+)$'}]
    - node: 'drupal.class_constant::{event}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - node: 'php.method::{class}|{written}'
  emits: [{withhold: matched_node}]
  confidence: inferred

