    - node: 'drupal.container_parameter::{param}'
    - edge: parameter_names_event
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'drupal.event::{event}'
    - id_matches: '^(?<target_id>[\s\S]+)$'
    - try: [{node: '{use_id}'}, {edge: use_priority_constant}, {id_matches: '^drupal\.class_constant::(?<pc>.+)::(?<pn>[A-Z_][A-Z0-9_]*)$'}, {node: 'php.type::{pc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<pcd>.+)$'}, {node: 'drupal.class_constant::{pcd}::{pn}'}, {edge: has_constant_int}, {id_matches: '^drupal\.constant_int::(?<priority>-?\d+)$'}, {node: '{target_id}'}]
    unless_matched: [[{node: 'drupal.container_parameter::{param}'}, {edge: parameter_names_event}, {id_matches: '^drupal\.event::(?!{event}$)'}]]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{service}::{method}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}, dispatcher: {template: '{dispatcher}'}}}}]
  confidence: inferred

- rule: listener_tag_parameter_derived_method
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<service>[^|]+)\|-\|tagged_param\|(?<param>.+)$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - try: [{edge: use_dispatcher}, {edge_attribute: dispatcher}]
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'drupal.container_parameter::{param}'
    - edge: parameter_names_event
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'drupal.container_parameter::{param}'
    - edge: parameter_derives_listener
    - id_matches: '^drupal\.derived_listener::(?<derived>[^|]+)\|(?<lower>.+)$'
    - node: 'drupal.service::{service}'
    - ancestors: [extends_service]
    - edge: service_class
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'drupal.method_name::{declarer}::{lower}'
    - edge: method_name_of
    - id_matches: '^drupal\.method_ref::(?<found>.+)$'
