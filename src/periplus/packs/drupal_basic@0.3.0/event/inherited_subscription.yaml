# A service tagged event_subscriber whose class extends another and neither declares
# getSubscribedEvents() nor inherits it from a mapped class or a core base the rutter knows: its
# events come from a base outside the map, so the class registers listeners the map cannot name, ending at a drupal.runtime_subscription
# marked as an unknown boundary.
- rule: subscriber_of_unknown_base
  reads: map
  match:
    node_type: drupal.service
    where: [{id_matches: '^drupal\.service::(?<service>.+)$'}]
    follow:
    - edge: tagged_as
    - id_matches: '^drupal\.service_tag::event_subscriber$'
    - node: 'drupal.service::{service}'
    - ancestors: [extends_service]
    - edge: service_class
    - id_matches: '^php\.type::(?<cls>.+)$'
    - edge: inherits
    - node: 'php.type::{cls}'
    unless_matched:
    - [{node: 'php.type::{cls}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<d>.+)$'}, {node: 'php.method::{d}::getSubscribedEvents'}]
    - [{node: 'php.type::{cls}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<d>.+)$'}, {node: 'drupal.base_subscriptions::{d}'}]
    - [{node: 'php.type::{cls}'}, {ancestors: [inherits]}, {edge: inherits}, {id_matches: '^php\.type::Drupal\\Core\\EventSubscriber\\HttpExceptionSubscriberBase$'}]
  emits: [{edge: {kind: registers_listener_at_runtime, from: matched_node, to: {template: '{cls}', types: [drupal.runtime_subscription], on_miss: unknown_boundary}}}]
  confidence: inferred
