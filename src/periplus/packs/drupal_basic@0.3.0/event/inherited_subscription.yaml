$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A subscriber whose events its base class keys. HttpExceptionSubscriberBase subscribes its own
# onException to KernelEvents::EXCEPTION, then calls on<status>, as on403, or else
# on<first digit>xx, as on4xx, by a name built at run time. Each such method of a class that
# descends from the base, through mapped parents, is a subscribed_by edge from the event of that
# constant. The rule reads the method's name, so it is inferred. A method of that name in a class
# that does not descend from the base gives nothing, nor does a name such as onward or onJson404.
# Another core base that keys its subscriber's events takes its own rule here.
#
# The edge holds the priority the base keys with static::getPriority(). The base returns 0, as of
# Drupal core 11.4 (and 10.4 and 11.1 alike), so a class whose line of mapped ancestors declares
# no getPriority() holds 0. The nearest class of the line that declares one decides: one whose body
# is return <integer>; holds that integer, and one that computes the value holds priority: computed.

edge_attributes:
- name: listens_to
  on: [inherits_subscription, inherits_subscription_by_priority]
  description: "the event the core base keys that method to, as its constant"

node_types:
# A class's own getPriority(), by the class's name, kept so map rules can read its value.
- name: drupal.priority_override
  description: "a class's own getPriority(), <class>, read to give its exception handlers their priority"
  id_namespace: drupal.priority_override
  internal: true

# A class that extends a core subscriber base, by its name, with an edge to each listener method
# the base keys; and a class whose getSubscribedEvents() does not call parent::getSubscribedEvents().
- name: drupal.base_subscriptions
  description: "the core subscriber base a class extends, <class>, with the listeners that base keys"
  id_namespace: drupal.base_subscriptions
  internal: true
- name: drupal.parent_subscriptions
  description: "a class whose getSubscribedEvents() calls parent::getSubscribedEvents(), by the class"
  id_namespace: drupal.parent_subscriptions
  internal: true
- name: drupal.own_subscriptions
  description: "a class whose getSubscribedEvents() keys its events without its parent's, <class>"
  id_namespace: drupal.own_subscriptions
  internal: true

edge_kinds:
- kind: inherits_subscription
  cause: none
  description: "the core base keys that method, at a fixed priority, for each class that extends it"
  from: drupal.base_subscriptions
  to: php.method
- kind: inherits_subscription_by_priority
  cause: none
  description: "the core base keys that method at static::getPriority(), for each class that extends it"
  from: drupal.base_subscriptions
  to: php.method
- kind: priority_declared_by
  cause: none
  description: "the class declares that getPriority()"
  from: drupal.priority_override
  to: php.class
- kind: has_literal_priority
  cause: none
  description: "a self-link holding the integer that getPriority() returns as written, or computed when its body computes it"
  from: drupal.priority_override
  to: drupal.priority_override

rules:
- rule: exception_priority_override
  reads: file
  in: [source]
  match: &priority_override
    file: '**'
    filetype: drupal_php_text
    text: '\bfunction\s+getPriority\s*\(\s*\)'
  id: {template: '{psr4_class}'}
  emits: [{node: {type: drupal.priority_override}}]
  confidence: inferred

- rule: exception_priority_override_class
  reads: file
  in: [source]
  match: *priority_override
  id: {template: '{psr4_class}'}
  emits: [{edge: {kind: priority_declared_by, from: this_node, to: {template: '{psr4_class}', types: [php.class]}}}]
  confidence: inferred

- rule: exception_priority_literal
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bfunction\s+getPriority\s*\(\s*\)\s*(?::\s*\??int\s*)?\{\s*return\s+(?<priority>[+-]?\d+)\s*;\s*\}'
  id: {template: '{psr4_class}'}
  emits: [{edge: {kind: has_literal_priority, from: this_node, to: {template: '{psr4_class}', type: drupal.priority_override}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# A getPriority() whose body is anything else computes its value when the code runs: its handlers
# hold priority: computed, so a reader does not take a missing priority for 0.
- rule: exception_priority_computed
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bfunction\s+getPriority\s*\(\s*\)(?!\s*(?::\s*\??int\s*)?\{\s*return\s+[+-]?\d+\s*;\s*\})'
  id: {template: '{psr4_class}'}
  emits: [{edge: {kind: has_literal_priority, from: this_node, to: {template: '{psr4_class}', type: drupal.priority_override}, attributes: {priority: {template: 'computed'}}}}]
  confidence: inferred

# No class of the line declares getPriority(): the value of the core base it extends, 0, -128 for
# DefaultExceptionHtmlSubscriber and -50 for CustomPageExceptionHtmlSubscriber.
- rule: exception_handler_subscribed_by_base
  reads: map
  match:
    node_type: php.method
    where: [{id_matches: '^php\.method::(?<class>.+)::on[1-5](?:\d\d|xx)$'}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - edge: inherits
    - id_matches: '^php\.type::Drupal\\Core\\EventSubscriber\\HttpExceptionSubscriberBase$'
    unless: [[{node: 'php.type::{class}'}, {ancestors: [inherits]}, {incoming_edge: priority_declared_by}]]
  emits: [{edge: {kind: subscribed_by, from: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION', types: [drupal.event]}, to: this_node, attributes: {priority: {template: '0'}}}}]
  confidence: inferred

- rule: exception_handler_subscribed_by_base_default_html
  reads: map
  match:
    node_type: php.method
    where: [{id_matches: '^php\.method::(?<class>.+)::on[1-5](?:\d\d|xx)$'}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - edge: inherits
    - id_matches: '^php\.type::Drupal\\Core\\EventSubscriber\\DefaultExceptionHtmlSubscriber$'
    unless: [[{node: 'php.type::{class}'}, {ancestors: [inherits]}, {incoming_edge: priority_declared_by}]]
  emits: [{edge: {kind: subscribed_by, from: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION', types: [drupal.event]}, to: this_node, attributes: {priority: {template: '-128'}}}}]
  confidence: inferred

- rule: exception_handler_subscribed_by_base_custom_page
  reads: map
  match:
    node_type: php.method
    where: [{id_matches: '^php\.method::(?<class>.+)::on[1-5](?:\d\d|xx)$'}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - edge: inherits
    - id_matches: '^php\.type::Drupal\\Core\\EventSubscriber\\CustomPageExceptionHtmlSubscriber$'
    unless: [[{node: 'php.type::{class}'}, {ancestors: [inherits]}, {incoming_edge: priority_declared_by}]]
  emits: [{edge: {kind: subscribed_by, from: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION', types: [drupal.event]}, to: this_node, attributes: {priority: {template: '-50'}}}}]
  confidence: inferred

# The nearest class of the line that declares getPriority(), the method's own class first, gives
# its literal, or computed for one that computes the value.
- rule: exception_handler_subscribed_by_override
  reads: map
  match:
    node_type: php.method
    where: [{id_matches: '^php\.method::(?<class>.+)::on[1-5](?:\d\d|xx)$'}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - incoming_edge: priority_declared_by
    - try: [{edge: has_literal_priority}, {edge_attribute: priority}]
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - edge: inherits
    - id_matches: '^php\.type::Drupal\\Core\\EventSubscriber\\(?:HttpExceptionSubscriberBase|DefaultExceptionHtmlSubscriber|CustomPageExceptionHtmlSubscriber)$'
  emits: [{edge: {kind: subscribed_by, from: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION', types: [drupal.event]}, to: this_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# A class that extends a core subscriber base inherits that base's keys, which core holds outside
# the map, so the rutter carries them as data, read from Drupal 11.4 core: RouteSubscriberBase keys
# RoutingEvents::ALTER to onAlterRoutes at 0, ConfigImportValidateEventSubscriberBase
# ConfigEvents::IMPORT_VALIDATE to onConfigImporterValidate at 20, ConfigFactoryOverrideBase
# COLLECTION_INFO to addCollections at 0 and SAVE, DELETE and RENAME to onConfigSave,
# onConfigDelete and onConfigRename at 20, StaticRouteDiscoveryBase RoutingEvents::STATIC to
# onRouteBuild at static::getPriority(), and DefaultExceptionHtmlSubscriber (-128) and
# CustomPageExceptionHtmlSubscriber (-50), through HttpExceptionSubscriberBase, KernelEvents::EXCEPTION
# to their own on4xx, on401, on403 and on404 handlers at static::getPriority(). A file rule reads
# the class that writes extends <base>, by the base's short name, and the map rules give each class
# of its line the listener: the method the class or its nearest mapped ancestor declares, else the
# base's own method, outside the map. A getPriority() priority is read as for the exception handlers
# above: the nearest literal override, computed for a computed one, else the base's value.
- rule: core_subscriber_base
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bclass\s+\w+\s+extends\s+\\?(?:[\w\\]*\\)?(?:(?<b_route>RouteSubscriberBase)|(?<b_validate>ConfigImportValidateEventSubscriberBase)|(?<b_override>ConfigFactoryOverrideBase)|(?<b_static>StaticRouteDiscoveryBase)|(?<b_html>DefaultExceptionHtmlSubscriber)|(?<b_page>CustomPageExceptionHtmlSubscriber))\b'
  values:
    b_route_0: {from: {capture: b_route}, normalize: [{replace: '^.*$', with: 'Drupal\Core\Routing\RouteSubscriberBase::onAlterRoutes'}]}
    b_validate_0: {from: {capture: b_validate}, normalize: [{replace: '^.*$', with: 'Drupal\Core\Config\ConfigImportValidateEventSubscriberBase::onConfigImporterValidate'}]}
    b_override_0: {from: {capture: b_override}, normalize: [{replace: '^.*$', with: 'Drupal\Core\Config\ConfigFactoryOverrideBase::addCollections'}]}
    b_override_1: {from: {capture: b_override}, normalize: [{replace: '^.*$', with: 'Drupal\Core\Config\ConfigFactoryOverrideBase::onConfigSave'}]}
    b_override_2: {from: {capture: b_override}, normalize: [{replace: '^.*$', with: 'Drupal\Core\Config\ConfigFactoryOverrideBase::onConfigDelete'}]}
    b_override_3: {from: {capture: b_override}, normalize: [{replace: '^.*$', with: 'Drupal\Core\Config\ConfigFactoryOverrideBase::onConfigRename'}]}
    b_static_0: {from: {capture: b_static}, normalize: [{replace: '^.*$', with: 'Drupal\Core\Routing\StaticRouteDiscoveryBase::onRouteBuild'}]}
    b_html_0: {from: {capture: b_html}, normalize: [{replace: '^.*$', with: 'Drupal\Core\EventSubscriber\DefaultExceptionHtmlSubscriber::on4xx'}]}
    b_html_1: {from: {capture: b_html}, normalize: [{replace: '^.*$', with: 'Drupal\Core\EventSubscriber\DefaultExceptionHtmlSubscriber::on401'}]}
    b_html_2: {from: {capture: b_html}, normalize: [{replace: '^.*$', with: 'Drupal\Core\EventSubscriber\DefaultExceptionHtmlSubscriber::on403'}]}
    b_html_3: {from: {capture: b_html}, normalize: [{replace: '^.*$', with: 'Drupal\Core\EventSubscriber\DefaultExceptionHtmlSubscriber::on404'}]}
    b_page_0: {from: {capture: b_page}, normalize: [{replace: '^.*$', with: 'Drupal\Core\EventSubscriber\CustomPageExceptionHtmlSubscriber::on403'}]}
    b_page_1: {from: {capture: b_page}, normalize: [{replace: '^.*$', with: 'Drupal\Core\EventSubscriber\CustomPageExceptionHtmlSubscriber::on404'}]}
    b_page_2: {from: {capture: b_page}, normalize: [{replace: '^.*$', with: 'Drupal\Core\EventSubscriber\DefaultExceptionHtmlSubscriber::on4xx'}]}
    b_page_3: {from: {capture: b_page}, normalize: [{replace: '^.*$', with: 'Drupal\Core\EventSubscriber\DefaultExceptionHtmlSubscriber::on401'}]}
  id: {template: '{psr4_class}'}
  emits:
  - edge: {kind: inherits_subscription, from: this_node, to: {template: '{b_route_0}', types: [php.method]}, attributes: {listens_to: {template: 'Drupal\Core\Routing\RoutingEvents::ALTER'}, priority: {template: '0'}}}
  - edge: {kind: inherits_subscription, from: this_node, to: {template: '{b_validate_0}', types: [php.method]}, attributes: {listens_to: {template: 'Drupal\Core\Config\ConfigEvents::IMPORT_VALIDATE'}, priority: {template: '20'}}}
  - edge: {kind: inherits_subscription, from: this_node, to: {template: '{b_override_0}', types: [php.method]}, attributes: {listens_to: {template: 'Drupal\Core\Config\ConfigCollectionEvents::COLLECTION_INFO'}, priority: {template: '0'}}}
  - edge: {kind: inherits_subscription, from: this_node, to: {template: '{b_override_1}', types: [php.method]}, attributes: {listens_to: {template: 'Drupal\Core\Config\ConfigEvents::SAVE'}, priority: {template: '20'}}}
  - edge: {kind: inherits_subscription, from: this_node, to: {template: '{b_override_2}', types: [php.method]}, attributes: {listens_to: {template: 'Drupal\Core\Config\ConfigEvents::DELETE'}, priority: {template: '20'}}}
  - edge: {kind: inherits_subscription, from: this_node, to: {template: '{b_override_3}', types: [php.method]}, attributes: {listens_to: {template: 'Drupal\Core\Config\ConfigEvents::RENAME'}, priority: {template: '20'}}}
  - edge: {kind: inherits_subscription_by_priority, from: this_node, to: {template: '{b_static_0}', types: [php.method]}, attributes: {listens_to: {template: 'Drupal\Core\Routing\RoutingEvents::STATIC'}}}
  - edge: {kind: inherits_subscription_by_priority, from: this_node, to: {template: '{b_html_0}', types: [php.method]}, attributes: {listens_to: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION'}, priority: {template: '-128'}}}
  - edge: {kind: inherits_subscription_by_priority, from: this_node, to: {template: '{b_html_1}', types: [php.method]}, attributes: {listens_to: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION'}, priority: {template: '-128'}}}
  - edge: {kind: inherits_subscription_by_priority, from: this_node, to: {template: '{b_html_2}', types: [php.method]}, attributes: {listens_to: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION'}, priority: {template: '-128'}}}
  - edge: {kind: inherits_subscription_by_priority, from: this_node, to: {template: '{b_html_3}', types: [php.method]}, attributes: {listens_to: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION'}, priority: {template: '-128'}}}
  - edge: {kind: inherits_subscription_by_priority, from: this_node, to: {template: '{b_page_0}', types: [php.method]}, attributes: {listens_to: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION'}, priority: {template: '-50'}}}
  - edge: {kind: inherits_subscription_by_priority, from: this_node, to: {template: '{b_page_1}', types: [php.method]}, attributes: {listens_to: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION'}, priority: {template: '-50'}}}
  - edge: {kind: inherits_subscription_by_priority, from: this_node, to: {template: '{b_page_2}', types: [php.method]}, attributes: {listens_to: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION'}, priority: {template: '-50'}}}
  - edge: {kind: inherits_subscription_by_priority, from: this_node, to: {template: '{b_page_3}', types: [php.method]}, attributes: {listens_to: {template: 'Symfony\Component\HttpKernel\KernelEvents::EXCEPTION'}, priority: {template: '-50'}}}
  confidence: inferred

- rule: core_base_listener_class
  reads: map
  match:
    node_type: php.class
    where: [{id_matches: '^php\.type::(?<sub>.+)$'}]
    follow:
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<anc>.+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription
    - edge_attribute: listens_to
    - id_matches: '^php\.method::(?<base>.+)::(?<m>\w+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription
    - edge_attribute: priority
    - id_matches: '^php\.method::{base}::{m}$'
    unless_matched: [[{node: 'php.type::{sub}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?!{base}$)(?<d>.+)$'}, {node: 'php.method::{d}::{m}'}]]
  emits: [{edge: {kind: subscribed_by, from: {template: '{listens_to}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: core_base_listener_method
  reads: map
  match:
    node_type: php.method
    where: [{id_matches: '^php\.method::(?<cls>.+)::(?<m>addCollections|on401|on403|on404|on4xx|onAlterRoutes|onConfigDelete|onConfigImporterValidate|onConfigRename|onConfigSave|onRouteBuild)$'}]
    follow:
    - node: 'php.type::{cls}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<anc>.+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription
    - edge_attribute: listens_to
    - id_matches: '::{m}$'
    - id_matches: '^php\.method::(?<target>.+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription
    - edge_attribute: priority
    - id_matches: '^php\.method::{target}$'
  emits: [{edge: {kind: subscribed_by, from: {template: '{listens_to}', types: [drupal.event]}, to: this_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: core_base_listener_class_by_priority_default
  reads: map
  match:
    node_type: php.class
    where: [{id_matches: '^php\.type::(?<sub>.+)$'}]
    follow:
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<anc>.+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription_by_priority
    - edge_attribute: listens_to
    - id_matches: '^php\.method::(?<base>.+)::(?<m>\w+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription_by_priority
    - edge_attribute: priority
    - id_matches: '^php\.method::{base}::{m}$'
    unless_matched: [[{node: 'php.type::{sub}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?!{base}$)(?<d>.+)$'}, {node: 'php.method::{d}::{m}'}]]
    unless: [[{node: 'php.type::{sub}'}, {ancestors: [inherits]}, {incoming_edge: priority_declared_by}]]
  emits: [{edge: {kind: subscribed_by, from: {template: '{listens_to}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: core_base_listener_class_by_priority_override
  reads: map
  match:
    node_type: php.class
    where: [{id_matches: '^php\.type::(?<sub>.+)$'}]
    follow:
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<anc>.+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription_by_priority
    - edge_attribute: listens_to
    - id_matches: '^php\.method::(?<base>.+)::(?<m>\w+)$'
    - node: 'php.type::{sub}'
    - ancestors: [inherits]
    - incoming_edge: priority_declared_by
    - try: [{edge: has_literal_priority}, {edge_attribute: priority}]
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription_by_priority
    - id_matches: '^php\.method::{base}::{m}$'
    unless_matched: [[{node: 'php.type::{sub}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?!{base}$)(?<d>.+)$'}, {node: 'php.method::{d}::{m}'}]]
  emits: [{edge: {kind: subscribed_by, from: {template: '{listens_to}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: core_base_listener_method_by_priority_default
  reads: map
  match:
    node_type: php.method
    where: [{id_matches: '^php\.method::(?<cls>.+)::(?<m>addCollections|on401|on403|on404|on4xx|onAlterRoutes|onConfigDelete|onConfigImporterValidate|onConfigRename|onConfigSave|onRouteBuild)$'}]
    follow:
    - node: 'php.type::{cls}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<anc>.+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription_by_priority
    - edge_attribute: listens_to
    - id_matches: '::{m}$'
    - id_matches: '^php\.method::(?<target>.+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription_by_priority
    - edge_attribute: priority
    - id_matches: '^php\.method::{target}$'
    unless: [[{node: 'php.type::{cls}'}, {ancestors: [inherits]}, {incoming_edge: priority_declared_by}]]
  emits: [{edge: {kind: subscribed_by, from: {template: '{listens_to}', types: [drupal.event]}, to: this_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: core_base_listener_method_by_priority_override
  reads: map
  match:
    node_type: php.method
    where: [{id_matches: '^php\.method::(?<cls>.+)::(?<m>addCollections|on401|on403|on404|on4xx|onAlterRoutes|onConfigDelete|onConfigImporterValidate|onConfigRename|onConfigSave|onRouteBuild)$'}]
    follow:
    - node: 'php.type::{cls}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<anc>.+)$'
    - node: 'drupal.base_subscriptions::{anc}'
    - edge: inherits_subscription_by_priority
    - edge_attribute: listens_to
    - id_matches: '::{m}$'
    - node: 'php.type::{cls}'
    - ancestors: [inherits]
    - incoming_edge: priority_declared_by
    - try: [{edge: has_literal_priority}, {edge_attribute: priority}]
  emits: [{edge: {kind: subscribed_by, from: {template: '{listens_to}', types: [drupal.event]}, to: this_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# A subclass of a mapped subscriber whose getSubscribedEvents() it does not override, or overrides
# calling parent::getSubscribedEvents(), inherits the nearest mapped ancestor's keys: each from its
# event, named as that key names it, to the method the subclass or its nearest mapped ancestor
# declares. own_subscriptions marks a getSubscribedEvents() whose body never calls the parent's. A
# mapped ancestor between the subclass and the one whose keys it reads stops the inheritance when it
# overrides getSubscribedEvents() without the parent's.
- rule: own_subscriptions
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bfunction\s+getSubscribedEvents\s*\(\s*\)[^{;]*\{'
  id: {template: '{psr4_class}'}
  emits: [{node: {type: drupal.own_subscriptions}}]
  confidence: inferred

# parent::getSubscribedEvents() inside the body, read in the span subscribed_events, which counts
# braces at any depth and skips strings and comments.
- rule: parent_subscriptions
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bparent::getSubscribedEvents\s*\('
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
  id: {template: '{in_subscriber}|{psr4_class}', normalize: [{replace: '^[^|]*\|', with: ''}]}
  emits: [{node: {type: drupal.parent_subscriptions}}]
  confidence: inferred

- rule: own_subscriptions_with_parent
  reads: map
  match:
    node_type: drupal.own_subscriptions
    where: [{id_matches: '^drupal\.own_subscriptions::(?<cls>.+)$'}]
    follow: [{node: 'drupal.parent_subscriptions::{cls}'}]
  emits: [{withhold: this_node}]
  confidence: inferred

- rule: inherited_key
  reads: map
  match:
    node_type: php.class
    where: [{id_matches: '^php\.type::(?<sub>.+)$'}]
    follow:
    - edge: inherits
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<keyer>.+)$'
    - edge: contains
    - incoming_edge: use_names_listener
    - edge_attribute: priority
    - id_matches: '^(?<use_id>[\s\S]+)$'
