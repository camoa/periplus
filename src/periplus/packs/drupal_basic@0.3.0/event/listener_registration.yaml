    ek: {from: {enclosing: qualified_listener_list, capture: key}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    r_ev: {template: '{ek}'}
    h_ev: {template: '{ek}', normalize: [{replace: '^\\.*$', with: ''}]}

  id: {template: '{r_ev}|reg|{owner}|{pl}|{in_subscriber}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '\', normalize: [{replace: '\|function$', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: key_qualified_later_q_edges
  reads: file
  in: [source]
  match: *key_qualified_later_match
  values: *key_qualified_later_values
  id: {template: '{r_ev}|reg|{owner}|{pl}|{in_subscriber}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '\', normalize: [{replace: '\|function$', with: ''}]}
  emits:
  - edge: {kind: use_has_priority, from: this_node, to: {template: '{r_ev}|reg|{owner}|{pl}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '\', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}
  - edge: {kind: use_names_event, from: this_node, to: {template: '{r_ev}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '\', types: [drupal.event_text]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{self_class}', types: [php.class_like]}}
  confidence: inferred

- rule: key_qualified_later_h
  reads: file
  in: [source]
  match: *key_qualified_later_match
  values: *key_qualified_later_values
  id: {template: '{psr4_namespace}{h_ev}|reg_here|{owner}|{pl}|{in_subscriber}', normalize: [{replace: '\|function$', with: ''}]}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: key_qualified_later_h_edges
