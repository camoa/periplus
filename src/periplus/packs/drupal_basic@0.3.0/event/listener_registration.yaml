    h_ev: {template: '{ekx}', normalize: [{replace: '^\\.*$', with: ''}]}
    prio: {template: '{tag}|{priority}', normalize: [{replace: '^[^|]*\|$', with: '0'}, {replace: '^[^|]*\|', with: ''}]}
    pk: {template: '§{this_cls}§{pcref}{pcu}‡{anon}', normalize: [{replace: '^§[^§]*§(?=[^‡]*‡.)', with: ''}, {replace: '‡[\s\S]*$', with: ''}, {replace: '§(?:self|static)(?=::)', with: ''}, {replace: '^§[^§]*§', with: ''}, {replace: '^§', with: '@'}]}
    ph: {template: '§{here_ns}§{pcu}', normalize: [{replace: '§', with: ''}]}
    unknown: {template: '§{ex}§{ek}{eo}{ec}{en}§{mx}', normalize: [{replace: '^§§[^§]+§.*$', with: ''}, {replace: '^§§§', with: ''}, {replace: '(?<=.)§.*$', with: ''}, {replace: '^§', with: ''}, {replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    no_event: {template: '{tag}|{ek}{eo}{ec}{en}{ep}{ex}', normalize: [{replace: '^[^|]*\|$', with: 'tag-with-no-event'}, {replace: '^[^|]*\|.+$', with: ''}]}
    pl_unused:
      template: '§M{e1}§X{mx}§K{ek}{eo}{ec}§V{dv}§W{d1}{d2}{sid}§Z{tag}'
      normalize:
      - {replace: '§[MXKVW](?=§)', with: ''}
      - {replace: '^.*§V', with: 'r:'}
      - {replace: '^§X', with: 'r:'}
      - {replace: '\|', with: '¦'}
      - {replace: '^§K[^§]*§W', with: 'r:no-method~'}
      - {replace: '§K[^§]*', with: ''}
      - {replace: '§W[^§]*', with: ''}
      - {replace: '§Z.*$', with: ''}
      - {replace: '^§M', with: 'c:'}
      - {replace: '\s+', with: ''}
    pd:
      template: '§X{e1}{mx}{dv}§E{en}'
      normalize:
      - {replace: '^§X§E', with: ''}
      - {replace: '^§X.*$', with: ''}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))a', with: 'A'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))b', with: 'B'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))c', with: 'C'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))d', with: 'D'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))e', with: 'E'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))f', with: 'F'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))g', with: 'G'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))h', with: 'H'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))i', with: 'I'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))j', with: 'J'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))k', with: 'K'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))l', with: 'L'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))m', with: 'M'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))n', with: 'N'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))o', with: 'O'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))p', with: 'P'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))q', with: 'Q'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))r', with: 'R'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))s', with: 'S'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))t', with: 'T'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))u', with: 'U'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))v', with: 'V'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))w', with: 'W'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))x', with: 'X'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))y', with: 'Y'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))z', with: 'Z'}
      - {replace: '[^A-Za-z0-9]', with: ''}
      - {replace: '^(?=.)', with: 'on'}
    pdl:
      template: '§X{e1}{mx}{dv}§E{en}'
      case: lower
      normalize:
      - {replace: '^§X§E', with: ''}
      - {replace: '^§X.*$', with: ''}
      - {replace: '[^A-Za-z0-9]', with: ''}
      - {replace: '^(?=.)', with: 'on'}
    typed: {template: '§X{dv}{mx}§E{ek}{eo}{ec}{en}{ep}{ex}§T{tag}', normalize: [{replace: '^§X§E§T.*$', with: 'typed'}, {replace: '^§X.*$', with: ''}]}
    tm: {template: '{tag}|{e1}', normalize: [{replace: '^[^|]*\|$', with: '__invoke'}, {replace: '^[^|]*\|', with: ''}]}
    pl: {template: 't:{tm}'}

  id: {template: '{typed}|reg_typed|{owner}|{pl}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

