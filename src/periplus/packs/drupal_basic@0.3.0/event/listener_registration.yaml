# An event written as a container parameter, 'event' => '%name%': Symfony's RegisterListenersPass
# passes the text on to the dispatcher's addListener call and the built container gives that call
# the parameter's value, so the event is the value one mapped parameters block gives the parameter
# (event/event_listener.yaml), named as a quoted name is. With no method, Symfony derives it from
# the text as written, so on<Name> of the parameter's name, then __invoke. A parameter no mapped
# file gives a value, or that two give different values, is decided when the container is built:
# a drupal.runtime_subscription <owner>|%<name>%~<class or service>, marked resolution: runtime.
- rule: listener_tag_added_param
  reads: file
  in: [source]
  match: *listener_tag_added_match
  values: &listener_tag_param_values
    <<: *listener_tag_added_values
    pp: {template: '§M{e1}§X{mx}§E{ep}', normalize: [{replace: '^§M§X§E.*$', with: 'd'}, {replace: '^§M§X', with: 'r:'}, {replace: '^§M', with: 'c:'}, {replace: '§[XE].*$', with: ''}, {replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    who: {template: '{d1}{d2}{sid}{dv}', normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
  id: {template: '{ep}|reg_param|{owner}|{pp}~{who}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

