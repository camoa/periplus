# The map rules: each site's listener, on the class or a mapped ancestor, from its event, named by
# the constant's text when a mapped file gives it one.
- rule: registered_listener_c_named
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>[^|]*\|reg(?:_named)?\|(?<owner>(?:php\.method|php\.function)::(?<bare>[^|]+))\|c:(?<payload>.*))$'}]
    follow:
    - edge: use_has_priority
    - edge_attribute: priority
    - edge: use_names_class
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - try:
      - ancestors: [inherits]
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - node: 'php.method::{declarer}::{payload}'
    - node: 'drupal.event_use::{site}'
    - edge: use_names_event
    - id_matches: '^drupal\.event::(?<ev>.+)$'
    - try: [{node: 'drupal.class_constant::{ev}'}, {edge: has_constant_text}, {id_matches: '^drupal\.constant_text::(?<ev>.+)$'}]
    - node: 'drupal.event::{ev}'
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{declarer}::{payload}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

