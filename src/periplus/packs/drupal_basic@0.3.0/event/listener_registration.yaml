$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Listeners registered by a call or by a key the subscriber rules do not read, each read as text
# into one internal drupal.event_use site, reg|<owner>|<listener>, with three edges the map rules
# below read: use_has_priority, a self-link holding the priority as written, 0 when none is
# written; use_names_event, to the event; and use_names_class or use_names_service, to the class
# or service whose method listens. The owner is the method around the call, of a class under src
# named by Drupal's PSR-4 layout or of a class a module, install, inc, theme, profile or plain .php
# file keeps, named by the file's namespace, or the function around it in such a file; an .api.php
# file, a test outside tests/src and any other file give nothing. An addListener, addTag or
# addSubscriber call in a method of an anonymous class is owned by the named method or function
# that creates the outermost such class, since no rule maps a method of an anonymous class; one
# created outside any function gives nothing. Each argument, key and value is
# read whole, so an expression such as 'a' . 'b' or self::PREFIX . '.x' is never cut down to a
# name.
#
# A call is read whatever line breaks and comments stand between its name, its parenthesis and its
# arguments. The forms:
# - ->addListener(EVENT, CALLABLE, PRIORITY): the event a class constant, X::NAME
#   through the file's use statements, \A\B::NAME, self::NAME, parent::NAME on the class's
#   written parent, X::NAME that no use statement binds as the constant of the file's namespace,
#   unresolved when no mapped file declares it, a quoted name, or a class, X::class, \A\B::class,
#   self::class or parent::class, the class the class extends, the event of the class's full name,
#   as Symfony names an event dispatched as an object; the callable [$this, 'm'], [self::class, 'm'],
#   $this->m(...), [Foo::class, 'm'], Foo::m(...) or 'Foo::m', a method of that class or of its
#   nearest mapped ancestor that declares it, else unresolved on the class; 'name', a function, by a
#   subscribed_by_function edge; any other callable, a closure, an arrow function or a variable,
#   ends at a drupal.runtime_listener <owner>|<callable> marked as an unknown boundary.
# - ->addTag('kernel.event_listener', ['event' => ..., 'method' => ..., 'priority' => ...]) on
#   ->register('id', Foo::class), new Definition(Foo::class) or ->getDefinition('id'), the class
#   or the mapped service's class through its parents, the event read as addListener's; with no
#   method, the method Symfony derives from the event's text, a constant's when a mapped file gives
#   it or a class's full name when a file gives it, on<Event>, then __invoke, then the unresolved
#   derived name; a definition held in a variable, or no method with no such text, ends at a
#   drupal.runtime_listener <owner>|no-method~<class or service as written>, one per class or
#   service. An event written as a container parameter, '%name%', is the value one mapped
#   parameters block gives it, as below. The tag name, which Symfony's RegisterListenersPass
#   reads, marks the call, on whatever object it runs. A 'dispatcher' key is kept in the edge
#   attribute dispatcher (event/event_listener.yaml).
# - ->addSubscriber(new Foo()) or ->addSubscriber($this): a registers_subscriber edge to the class,
#   whose getSubscribedEvents() the subscriber rules read, from an internal site,
#   sub~<object>|<owner>|<class>.
# - A getSubscribedEvents() key written as a name, 'kernel.request' => ..., with its namespace,
#   \A\B::NAME or A\B::NAME, or as a class, X::class => ..., parent::class among them, where an
#   array element starts, each listener of a list of lists its own; the listener is a method of
#   the subscriber's class or a mapped ancestor.
#
# A priority written as a constant holds the integer a mapped file declares it with, as for a
# key (event/event_subscriber.yaml).
#
# The object an addListener, addSubscriber or dispatch call (event/event_dispatch.yaml) runs on is
# in its site's id: v:<parameter>,
# p:<property of $this>, t for $this, x for anything else. The map rules read its type from what
# php_basic maps: a parameter's declared type; a property's, typed, promoted or in a @var docblock,
# on the class or its nearest ancestor that declares it; the parameter an untyped property is
# assigned from once; and, for $this, the class. A known type that is not an event dispatcher gives
# nothing: the site, and its runtime node, are withheld. A dispatcher is Symfony's
# EventDispatcherInterface of the contracts or the component, Symfony's EventDispatcher, Drupal's
# ContainerAwareEventDispatcher, PSR-14's EventDispatcherInterface, which core aliases to the event
# dispatcher, or a mapped class or interface that implements or extends one of them. With no type known, as for an untyped parameter, one assigned in the body or declared by a
# closure, an undeclared property, a call's result such as \Drupal::service('event_dispatcher'),
# or any object in a method of an anonymous class, the registration stays, and its edge holds receiver: not known to be an event dispatcher; one on
# a known event dispatcher holds receiver: an event dispatcher, so an edge two registrations share
# holds each place's value under differs. The node sits at the call's line.
# An event or a listener only the running code names - a variable, an expression, a key or a
# listener value built in a loop or by a call, a body returning what a helper builds, a key
# parent::NAME with no written parent, in a trait or a class that extends nothing, a subscriber
# or a definition held in a variable, and in a method of an anonymous class an event self::NAME,
# static::NAME, parent::NAME, self::class, static::class or parent::class and a subscriber
# $this - is a drupal.runtime_subscription <owner>|<expression>, the
# expression as written without its spaces, and for an addListener or addSubscriber call
# <owner>|<expression>~<object>, the object as above, so two calls on objects known differently
# are two nodes, marked resolution: runtime, with
# a registers_listener_at_runtime edge from the method or function that makes it. The event is named
# as a subscriber's key names it: by the text a mapped constant holds, a core name through the
# table core_event_names, else as written. In a method of an anonymous class, the callable
# [$this, 'm'], [self::class, 'm'] or $this->m(...) ends at the drupal.runtime_listener
# <owner>|<callable>, and a priority self::NAME or static::NAME stays as written.

node_types:
- name: drupal.runtime_subscription
  description: "a listener registration whose event or listener only the running code names, <owner>|<expression>"
  id_namespace: drupal.runtime_subscription

edge_kinds:
- kind: use_names_class
  cause: none
  description: "the registration's listener is a method of that class"
  from: drupal.event_use
  to: php.class_like
- kind: use_names_service
  cause: none
  description: "the registration's listener is a method of that service's class"
  from: drupal.event_use
  to: drupal.service
- kind: subscribed_by_function
  cause: from
  description: "the function listens to that event: an addListener call names it"
  from: drupal.event
  to: php.function
- kind: registers_listener_at_runtime
  cause: from
  description: "the method, function, class or service registers a listener whose event or listener only the running code names"
  from: [php.method, php.function, php.class, drupal.service]
  to: drupal.runtime_subscription
- kind: registers_subscriber
  cause: from
  description: "the method or function adds that class as an event subscriber, by addSubscriber"
  from: [php.method, php.function]
  to: php.class
- kind: use_on_dispatcher
  cause: none
  description: "the addListener or addSubscriber call runs on an object whose known type is an event dispatcher"
  from: drupal.event_use
  to: drupal.event_use
- kind: use_by_method_name
  cause: none
  description: "the addListener or addSubscriber call runs on an object the map shows no type for, so it is read by the method's name alone"
  from: drupal.event_use
  to: drupal.event_use

edge_attributes:
- name: receiver
  on: [subscribed_by, subscribed_by_function, registers_subscriber, registers_listener_at_runtime, dispatched_by, dispatched_by_function]
  description: "the object an addListener, addSubscriber or dispatch call runs on: not known to be an event dispatcher, or an event dispatcher"

rules:

# ->addListener(EVENT, CALLABLE, PRIORITY), with the object it runs on.
- rule: listener_added_r
  reads: file
  line: {capture: call}
  in: [source]
  match: &listener_added_match
    file: '**'
    filetype: drupal_php_text
    text: '(?=[$-])(?:(?<![\w$>:\\])(?<rv>\$(?!this\b)\w+)|(?<![\w$>:\\])\$this\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*->\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?<rp>\w+)|(?<![\w$>:\\])(?<rt>\$this))?\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*->\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?<call>addListener)\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\(\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?:parent::(?<epc>[A-Z][A-Z0-9_]*)|(?<ek>\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*)|(?<eo>(?:self|static)::[A-Z][A-Z0-9_]*)|(?<ec>\\?(?:[A-Za-z_]\w*\\)*[A-Za-z_]\w*)::class(?=\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*,)|[''\"](?<en>[^''\"$]+)[''\"]|(?<ex>(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?))\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*,\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?:(?<cs>\[\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\$this\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*,\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*[''\"](?<a1>\w+)[''\"]\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\]|\[\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?:self|static)::class\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*,\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*[''\"](?<a2>\w+)[''\"]\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\]|\$this\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*->\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?<a3>\w+)\(\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\.\.\.\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\))|\[\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?<d1>\\?[A-Za-z_][\w\\]*)::class\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*,\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*[''\"](?<e1>\w+)[''\"]\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\]|(?<d2>\\?[A-Za-z_][\w\\]*)::(?<e2>\w+)\(\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\.\.\.\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\)|[''\"](?<b1>\\?[A-Za-z_][\w\\]*)::(?<e3>\w+)[''\"]|[''\"](?<f1>\\?[A-Za-z_][\w\\]*)[''\"]|(?<g1>(?:static\s+)?function\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\([^)]*\)(?:\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*use\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\([^)]*\))?(?:\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*:\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\??[\w\\]+)?\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\}|(?:static\s+)?fn\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\([^)]*\)\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*=>(?:[^,()]|\((?:[^()]|\([^()]*\))*\))+|(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?))\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?:,\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?<priority>(?:(?=(?:(?<pcref>(?:self|static|\\?(?:[A-Za-z_]\w*\\)+[A-Z]\w*)::[A-Z][A-Z0-9_]*)|(?<pcu>[A-Z]\w*::[A-Z][A-Z0-9_]*))\s*[,\]\)]))?(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?))?\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\)'
  values: &listener_added_values
    # The object the call runs on: v:<parameter>, p:<property of $this>, t for $this, x for any
    # other, as a call's result; xmark, the mark, only for x.
    anon: {from: {enclosing: function_scope, capture: scope}, join: '|', normalize: [{replace: '^(?![\s\S]*\bnew\s+class\b)[\s\S]*$', with: ''}, {replace: '^[\s\S]+$', with: 'anon'}]}
    recv: {template: '§{call}§V{rv}§P{rp}§T{rt}‡{anon}', normalize: [{replace: '^[\s\S]*‡.+$', with: ''}, {replace: '‡$', with: ''}, {replace: '^§\w+', with: ''}, {replace: '§[VPT](?=§|$)', with: ''}, {replace: '^$', with: 'x'}, {replace: '^§V\$', with: 'v:'}, {replace: '^§P', with: 'p:'}, {replace: '^§T.*$', with: 't'}]}
    xmark: {template: '{recv}', normalize: [{replace: '^x$', with: 'not known to be an event dispatcher'}, {replace: '^(?!not ).*$', with: ''}]}
    fn: {from: {enclosing: function_scope, capture: scope}, join: '|', normalize: [{replace: '(?:^|\|)new\s+class\b[\s\S]*$', with: ''}, {replace: '^[\s\S]*\|', with: ''}, {replace: '^function\s+', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}, join: ','}
    fns: {from: {enclosing: php_namespace, capture: ns}, join: '|', normalize: [{replace: '^.*\|', with: ''}, {replace: '(?<=.)$', with: '\'}]}
    m_src: {template: '§{in_class}§{fn}', normalize: [{replace: '^§§.*$', with: ''}, {replace: '^§[^§]*§', with: '{psr4_class}::'}, {replace: '^§.*$', with: ''}]}
    m_mod: {template: '{fns}§{in_class}§{fn}', normalize: [{replace: '^[^§]*§§[\s\S]*$', with: ''}, {replace: '^', with: '¤{procedural_owner}'}, {replace: '^(?!¤)[\s\S]*$', with: ''}, {replace: '^¤php\.function::', with: ''}, {replace: '§(?=[^§]*§)', with: ''}, {replace: '§', with: '::'}]}
    f_own: {template: '§{in_class}§{fn}', normalize: [{replace: '^§[^§]+§.*$', with: ''}, {replace: '^§§', with: '¤{procedural_owner}'}, {replace: '^¤php\.function::', with: ''}, {replace: '^[§¤].*$', with: ''}]}
    meth: {template: '{m_src}{m_mod}'}
    this_cls: {template: '{meth}', normalize: [{replace: '::\w+$', with: ''}]}
    parent_cls: {from: {enclosing: class_like_body, capture: parent}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    here_ns: {template: '§{fns}', normalize: [{replace: '^§.*$', with: '{psr4_namespace}'}, {replace: '^§', with: ''}]}
    cls: {template: '§E{ec}§T{this_cls}§P{parent_cls}', normalize: [{replace: '^§Eparent§T[^§]*§P', with: ''}, {replace: '^§E(?:self|static)§T', with: '\'}, {replace: '§P[\s\S]*$', with: ''}, {replace: '§T[\s\S]*$', with: ''}, {replace: '^§E', with: ''}]}
    owner: {template: '§{meth}§{f_own}', normalize: [{replace: '^§§$', with: ''}, {replace: '^§§', with: 'php.function::'}, {replace: '^§', with: 'php.method::'}, {replace: '§$', with: ''}]}
    bare: {template: '{meth}{f_own}'}
    ns: {template: '{here_ns}', normalize: [{replace: '\\$', with: ''}]}
    ekx: {template: '{call}§{parent_cls}§{ek}§{epc}‡{anon}', normalize: [{replace: '§[^§‡]*‡.+$', with: '§'}, {replace: '‡$', with: ''}, {replace: '^[^§]*§', with: ''}, {replace: '^[^§]*§§$', with: ''}, {replace: '^[^§]*§(?=[^§])', with: ''}, {replace: '§$', with: ''}, {replace: '§§(?=[A-Z])', with: '::'}, {replace: '^::[\s\S]*$', with: ''}]}
    r_ev: {template: '{call}§K{ekx}§T{this_cls}§O{eo}‡{anon}', normalize: [{replace: '§O[^§‡]*‡.+$', with: '§O'}, {replace: '‡$', with: ''}, {replace: '^[^§]*(?=§K)', with: ''}, {replace: '§T[^§]*§O$', with: ''}, {replace: '^§K', with: ''}, {replace: '§O(?:self|static)', with: ''}, {replace: '^§T', with: '@'}, {replace: '^(?![\s\S]*::[A-Z])[\s\S]*$', with: ''}]}
    h_ev: {template: '{ekx}', normalize: [{replace: '^\\.*$', with: ''}]}
    prio: {template: '{call}|{priority}', normalize: [{replace: '^[^|]*\|$', with: '0'}, {replace: '^[^|]*\|', with: ''}]}
    pk: {template: '§{this_cls}§{pcref}{pcu}‡{anon}', normalize: [{replace: '^§[^§]*§(?=[^‡]*‡.)', with: ''}, {replace: '‡[\s\S]*$', with: ''}, {replace: '§(?:self|static)(?=::)', with: ''}, {replace: '^§[^§]*§', with: ''}, {replace: '^§', with: '@'}]}
    ec_ok: {template: '{ec}‡{anon}', normalize: [{replace: '^(?:self|static|parent)‡.+$', with: ''}, {replace: '‡[\s\S]*$', with: ''}]}
    ph: {template: '§{here_ns}§{pcu}', normalize: [{replace: '§', with: ''}]}
    unknown: {from: {capture: ex}, normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    self_class: {template: '§{a1}{a2}{a3}§{this_cls}‡{anon}', normalize: [{replace: '^§[^§]*§[^‡]*‡.+$', with: 'self'}, {replace: '‡$', with: ''}, {replace: '^§[^§]*§', with: ''}]}
    scoped: {template: '{call}‡{anon}§S{eo}§P{epc}§C{ec}§E', normalize: [{replace: '^[\w.]+‡§[\s\S]*$', with: ''}, {replace: '^[\w.]+‡\w+', with: ''}, {replace: '§C(?!(?:self|static|parent)§E)[^§]*', with: '§C'}, {replace: '§C§E', with: ''}, {replace: '§[SP](?=§|$)', with: ''}, {replace: '§P', with: 'parent::'}, {replace: '§E', with: '::class'}, {replace: '§[SC]', with: ''}]}
    pl:
      template: '§C{a1}{a2}{a3}{e1}{e2}{e3}§F{f1}§R{g1}‡{anon}§S{cs}'
      normalize:
      - {replace: '^[\s\S]*‡\w+§S(?=.)', with: '§R'}
      - {replace: '‡[\s\S]*$', with: ''}
      - {replace: '§[CFR](?=§|$)', with: ''}
      - {replace: '\s+', with: ''}
      - {replace: '\|', with: '¦'}
      - {replace: '^§C', with: 'c:'}
      - {replace: '^§F\\?', with: 'f:'}
      - {replace: '^§R', with: 'r:'}

  id: {template: '{r_ev}|reg~{recv}|{owner}|{pl}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: listener_added_r_edges
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{r_ev}|reg~{recv}|{owner}|{pl}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits:
  - {edge: {kind: use_priority_constant, from: this_node, to: {template: '{pk}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment, as_written], separator: '::', types: [drupal.class_constant]}}}
  - {edge: {kind: use_priority_constant, from: this_node, to: {template: '{ph}', types: [drupal.class_constant]}}}
  - {edge: {kind: use_bound, from: this_node, to: {template: 'bound|reg~{recv}|{owner}|{pl}', type: drupal.event_use}}}
