# The object a registration call runs on, as the header says: a known type that is not an event
# dispatcher withholds the site, and the runtime node a site names, before the passes.
- rule: registration_on_other_parameter
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>(?:[^|]*\|)?(?:reg|reg_named|reg_here|rt|sub|disp|disp_here|disp_parent|disp_var|disp_prop|disp_rt|disp_this)~v:(?<var>\w+)\|php\.(?:method|function)::(?<holder>[^|]+)\|(?<rest>.*))$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - node: 'php.parameter::{holder}::${var}'
    - edge: parameter_typed_as
    - node: 'drupal.event_use::{site}'
    - try: [{node: 'drupal.runtime_subscription::{rest}'}]
    unless: &shadowed
    - [{node: 'php.local_variable::{holder}::${var}'}]
    - [{node: 'drupal.closure_parameter::{holder}::${var}'}]
    unless_matched:
    - [{node: 'php.parameter::{holder}::${var}'}, {edge: parameter_typed_as}, {id_matches: '::\$\w+::\\?(?<rtype>.+)$'}, {try: [{node: 'php.type::{rtype}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher|Psr\\EventDispatcher\\EventDispatcherInterface)$'}]}, {id_matches: '(?:^php\.type::|::\$\w+::\\?)(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher|Psr\\EventDispatcher\\EventDispatcherInterface)$'}]
  emits: [{withhold: matched_node}]
  confidence: inferred

