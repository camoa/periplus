    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<declarer>.+)$'
    - node: 'drupal.method_name::{declarer}::{lower}'
    - edge: method_name_of
    - id_matches: '^drupal\.method_ref::(?<found>.+)$'
    - node: 'php.method::{found}'
  emits: [{edge: {kind: subscribed_by, from: {template: '{ev}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

