    ns: {template: '{here_ns}', normalize: [{replace: '\\$', with: ''}]}
    ekx: {template: '{tag}§{parent_cls}§{ek}§{epc}', normalize: [{replace: '^[^§]*§', with: ''}, {replace: '^[^§]*§§$', with: ''}, {replace: '^[^§]*§(?=[^§])', with: ''}, {replace: '§$', with: ''}, {replace: '§§(?=[A-Z])', with: '::'}, {replace: '^::[\s\S]*$', with: ''}]}
