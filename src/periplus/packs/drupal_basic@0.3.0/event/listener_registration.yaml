# ->addSubscriber(new X()) or ->addSubscriber($this): the class whose getSubscribedEvents() the
# subscriber rules read, through a site the map rule subscriber_registered reads; any other
# argument is a runtime registration.
- rule: subscriber_added
  reads: file
  line: {capture: call}
  in: [source]
  match: &subscriber_added_match
    file: '**'
    filetype: drupal_php_text
    text: '(?=[$-])(?:(?<![\w$>:\\])(?<rv>\$(?!this\b)\w+)|(?<![\w$>:\\])\$this\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*->\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?<rp>\w+)|(?<![\w$>:\\])(?<rt>\$this))?\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*->\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?<call>addSubscriber)\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\(\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?:new\s+(?<sc>\\?[A-Za-z_][\w\\]*)\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*(?:\(|\))|(?<st>\$this)\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\)|(?<sx>(?:[^()]|\((?:[^()]|\([^()]*\))*\))+?)\s*(?:(?://[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))\s*)*\))'
  values: &subscriber_added_values
    # The object the call runs on: v:<parameter>, p:<property of $this>, t for $this, x for any
    # other, as a call's result; xmark, the mark, only for x.
    anon: {from: {enclosing: function_scope, capture: scope}, join: '|', normalize: [{replace: '^(?![\s\S]*\bnew\s+class\b)[\s\S]*$', with: ''}, {replace: '^[\s\S]+$', with: 'anon'}]}
    recv: {template: '§{call}§V{rv}§P{rp}§T{rt}‡{anon}', normalize: [{replace: '^[\s\S]*‡.+$', with: ''}, {replace: '‡$', with: ''}, {replace: '^§\w+', with: ''}, {replace: '§[VPT](?=§|$)', with: ''}, {replace: '^$', with: 'x'}, {replace: '^§V\$', with: 'v:'}, {replace: '^§P', with: 'p:'}, {replace: '^§T.*$', with: 't'}]}
    xmark: {template: '{recv}', normalize: [{replace: '^x$', with: 'not known to be an event dispatcher'}, {replace: '^(?!not ).*$', with: ''}]}
    fn: {from: {enclosing: function_scope, capture: scope}, join: '|', normalize: [{replace: '(?:^|\|)new\s+class\b[\s\S]*$', with: ''}, {replace: '^[\s\S]*\|', with: ''}, {replace: '^function\s+', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}, join: ','}
    fns: {from: {enclosing: php_namespace, capture: ns}, join: '|', normalize: [{replace: '^.*\|', with: ''}, {replace: '(?<=.)$', with: '\'}]}
    m_src: {template: '§{in_class}§{fn}', normalize: [{replace: '^§§.*$', with: ''}, {replace: '^§[^§]*§', with: '{psr4_class}::'}, {replace: '^§.*$', with: ''}]}
    m_mod: {template: '{fns}§{in_class}§{fn}', normalize: [{replace: '^[^§]*§§[\s\S]*$', with: ''}, {replace: '^', with: '¤{procedural_owner}'}, {replace: '^(?!¤)[\s\S]*$', with: ''}, {replace: '^¤php\.function::', with: ''}, {replace: '§(?=[^§]*§)', with: ''}, {replace: '§', with: '::'}]}
    f_own: {template: '§{in_class}§{fn}', normalize: [{replace: '^§[^§]+§.*$', with: ''}, {replace: '^§§', with: '¤{procedural_owner}'}, {replace: '^¤php\.function::', with: ''}, {replace: '^[§¤].*$', with: ''}]}
    meth: {template: '{m_src}{m_mod}'}
    this_cls: {template: '{meth}', normalize: [{replace: '::\w+$', with: ''}]}
    parent_cls: {from: {enclosing: class_like_body, capture: parent}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    here_ns: {template: '§{fns}', normalize: [{replace: '^§.*$', with: '{psr4_namespace}'}, {replace: '^§', with: ''}]}
    owner: {template: '§{meth}§{f_own}', normalize: [{replace: '^§§$', with: ''}, {replace: '^§§', with: 'php.function::'}, {replace: '^§', with: 'php.method::'}, {replace: '§$', with: ''}]}
    bare: {template: '{meth}{f_own}'}
    ns: {template: '{here_ns}', normalize: [{replace: '\\$', with: ''}]}
    unknown: {from: {capture: sx}, normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    scoped: {template: '{st}‡{anon}', normalize: [{replace: '^[\s\S]*‡$', with: ''}, {replace: '‡\w+$', with: ''}]}
    this_class: {template: '§{st}§{this_cls}', normalize: [{replace: '^§[^§]*§', with: ''}]}
    target: {template: '§{sc}§{st}‡{anon}', normalize: [{replace: '^§§\$this‡.+$', with: ''}, {replace: '‡[\s\S]*$', with: ''}, {replace: '^§§\$this$', with: 'this'}, {replace: '^§(?=[^§])', with: 'c:'}, {replace: '§$', with: ''}, {replace: '^§.*$', with: ''}]}
  id: {template: 'sub~{recv}|{owner}|{target}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

