    unless: &untyped_property
    - [{node: 'php.type::{class}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<owner>.+)$'}, {node: 'php.property::{owner}::${member}'}, {edge: property_typed_as}]
    - [{node: 'php.type::{class}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<owner>.+)$'}, {node: 'php.member_assignment::{owner}::$this->{member}'}, {edge: assigned_value}, {id_matches: '^php\.member_assignment_value::[^:]+::(?<setter>[^:]+)::\$this->\w+=\$(?<parameter>\w+)$'}, {node: 'php.parameter::{owner}::{setter}::${parameter}'}, {edge: parameter_typed_as}]
  emits: [{edge: {kind: use_by_method_name, from: this_node, to: this_node}}]
