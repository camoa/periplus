    where: [{id_matches: '^drupal\.event_use::(?<site>[^|]*\|reg_here(?<tail>(?:~[^|]*)?)\|(?<owner>(?:php\.method|php\.function)::(?<bare>[^|]+))\|r:(?<payload>.*))$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    unless: [[{node: 'drupal.event_use::bound|reg{tail}|{owner}|r:{payload}'}]]
    follow:
    - try: [{edge: use_dispatcher}, {edge_attribute: dispatcher}]
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - edge: use_has_priority
    - edge_attribute: priority
    - node: 'drupal.event_use::{site}'
    - edge: use_names_event
    - id_matches: '^drupal\.event::(?<ev>.+)$'
    - try: [{id_matches: '^drupal\.event(?:_use)?::(?<cc>[^|]+)::(?<cn>[A-Z][A-Z0-9_]*)(?:\||$)'}, {node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<ev>.+)$'}]
    - try: [{node: 'drupal.class_constant::{ev}'}, {edge: has_constant_text}, {id_matches: '^drupal\.constant_text::(?<ev>.+)$'}]
    - node: 'drupal.event::{ev}'
    - id_matches: '^(?<target_id>[\s\S]+)$'
    - try: [{node: '{use_id}'}, {edge: use_priority_constant}, {id_matches: '^drupal\.class_constant::(?<pc>.+)::(?<pn>[A-Z_][A-Z0-9_]*)$'}, {node: 'php.type::{pc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<pcd>.+)$'}, {node: 'drupal.class_constant::{pcd}::{pn}'}, {edge: has_constant_int}, {id_matches: '^drupal\.constant_int::(?<priority>-?\d+)$'}, {node: '{target_id}'}]
    unless_matched: [[{node: 'drupal.event_use::{site}'}, {id_matches: '\|r:no-method~[^|]*$'}, {node: 'drupal.constant_text::{ev}'}]]
  emits: [{edge: {kind: subscribed_by, from: matched_node, to: {template: '{bare}|{payload}', types: [drupal.runtime_listener], on_miss: unknown_boundary}, attributes: {priority: {template: '{priority}'}, dispatcher: {template: '{dispatcher}'}, receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}, {edge: {kind: subscribed_by, from: matched_node, to: {template: '{bare}|{payload}', types: [drupal.runtime_listener], on_miss: unknown_boundary}, attributes: {priority: {template: '{priority}'}, dispatcher: {template: '{dispatcher}'}, receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}]
  confidence: inferred

# A PHP tag whose event is a container parameter one mapped file gives one value: the runtime mark
# is taken back, before the passes, and the listener is the method written, or the one Symfony
# derives from the parameter's name, on the class or the service's class.
- rule: added_tag_parameter_given
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<param>[^|]+)\|reg_param\|php\.(?:method|function)::(?<bare>[^|]+)\|[^~]*~(?<who>.*)$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - node: 'drupal.container_parameter::{param}'
    - edge: parameter_names_event
    - id_matches: '^drupal\.event::(?<event>.+)$'
    - node: 'drupal.runtime_subscription::{bare}|%{param}%~{who}'
    unless_matched: [[{node: 'drupal.container_parameter::{param}'}, {edge: parameter_names_event}, {id_matches: '^drupal\.event::(?!{event}$)'}]]
  emits: [{withhold: matched_node}]
  confidence: inferred

