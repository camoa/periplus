  emits: [{edge: {kind: registers_subscriber, from: {template: '{holder}', types: [php.method, php.function]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}]
  confidence: inferred

# A PHP tag's derived or typed listener, on the class or the service's class.
- rule: added_tag_derived_class
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>[^|]*\|reg_named\|(?<owner>[^|]+)\|d:(?<derived>\w+):(?<lower>\w+))$'}]
    follow:
    - try: [{edge: use_dispatcher}, {edge_attribute: dispatcher}]
    - edge: use_has_priority
    - edge_attribute: priority
    - edge: use_names_class
    - id_matches: '^php\.type::(?<type>.+)$'
    - node: 'drupal.event_use::{site}'
    - edge: use_names_event
    - id_matches: '^drupal\.event::(?<ev>.+)$'
    - try: [{node: 'drupal.class_constant::{ev}'}, {edge: has_constant_text}, {id_matches: '^drupal\.constant_text::(?<ev>.+)$'}]
