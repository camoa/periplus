    - [{node: 'php.type::{class}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher)$'}]
  emits: [{withhold: matched_node}]
