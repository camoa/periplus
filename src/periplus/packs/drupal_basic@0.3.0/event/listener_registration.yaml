  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>[^|]*\|reg_named\|(?<owner>[^|]+)\|d:(?<derived>\w+):(?<lower>\w+))$'}]
