- rule: registration_on_dispatcher_parameter
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>(?:[^|]*\|)?(?:reg|reg_named|reg_here|rt|sub|disp|disp_here|disp_parent|disp_var|disp_prop|disp_rt|disp_this)~v:(?<var>\w+)\|php\.(?:method|function)::(?<holder>[^|]+)\|(?<rest>.*))$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow: [{node: 'php.parameter::{holder}::${var}'}, {edge: parameter_typed_as}, {id_matches: '::\$\w+::\\?(?<rtype>.+)$'}, {try: [{node: 'php.type::{rtype}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher|Psr\\EventDispatcher\\EventDispatcherInterface)$'}]}, {id_matches: '(?:^php\.type::|::\$\w+::\\?)(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher|Psr\\EventDispatcher\\EventDispatcherInterface)$'}, {node: 'drupal.event_use::{site}'}]
    unless: *shadowed
  emits: [{edge: {kind: use_on_dispatcher, from: this_node, to: this_node}}]
  confidence: inferred

