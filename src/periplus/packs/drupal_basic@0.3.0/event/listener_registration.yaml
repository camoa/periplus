# A key held in a variable, built in a loop or by a call, or a body that returns what a helper
# builds.
- rule: key_runtime
  reads: file
  line: {capture: k2}
  in: [source]
  match: &key_runtime_match
    file: '**'
    filetype: drupal_php_text
    text: '\$\w+\[\s*(?<k1>(?![''\"][^''\"]*[''\"]\s*\]|\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*\s*\]|(?:self|static)::[A-Z][A-Z0-9_]*\s*\])[^\]\n]+?)\s*\](?:\s*\[\s*\])?\s*=(?![=>])|[\[,(](?:\s|//[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))*(?<k2>(?![\s/#])(?![^=\n]*?\bas\b)(?!(?:''[^'']*''|\"[^\"]*\"|\\?(?:[A-Za-z_]\w*\\)*[A-Za-z_]\w*::[A-Za-z_]\w*)\s*=>)(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|[^=\n,\[\]()''\"])+?)\s*=>|=>\s*(?:\[\s*){0,2}(?<k5>(?!\s|\[|array\s*\(|[''\"]\w+[''\"]\s*[,\]\);])(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|[^=\n,\[\]()''\"])+?)\s*[,\]\);](?!\s*[{:])|\breturn\s+(?<k3>(?!\[|array\s*\(|\$\w+\s*(?:;|\+)|parent::getSubscribedEvents\(\)\s*(?:;|\+)|array_merge\()[^;]+);|\$\w+\s*\+?=\s*(?<k4>(?!\[|array\s*\(|parent::getSubscribedEvents\(\))(?:[\w\\]+::|\$this->|self::|static::)?\w+\((?:[^()]|\([^()]*\))*\))\s*;'
  values: &key_runtime_values
    fn: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}, join: ','}
    owner: {template: '{in_class}|{fn}', normalize: [{replace: '^[^|]+\|.*$', with: '¤{procedural_owner}'}, {replace: '^[^|]*\|', with: ''}, {replace: '^', with: '§'}, {replace: '^§', with: 'php.method::{psr4_class}::'}, {replace: '^§', with: '{procedural_owner}'}, {replace: '^§.*$', with: ''}, {replace: '^.*¤.*$', with: ''}]}
    bare: {template: '{in_class}|{fn}', normalize: [{replace: '^[^|]+\|.*$', with: '¤{procedural_owner}'}, {replace: '^[^|]*\|', with: ''}, {replace: '^', with: '§'}, {replace: '^§', with: '{psr4_class}::'}, {replace: '^§(?={procedural_owner}|)', with: ''}, {replace: '^§.*$', with: ''}, {replace: '^.*¤.*$', with: ''}]}
    ns: {template: '{psr4_namespace}', normalize: [{replace: '\\$', with: ''}]}
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
    unknown: {template: '{k1}{k2}{k3}{k4}{k5}', normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}

  id: {template: '{in_subscriber}|{bare}|{unknown}', normalize: [{replace: '^function\|', with: ''}]}
  emits:
  - node: {type: drupal.runtime_subscription}
  - attribute: {name: resolution, template: runtime}
  confidence: inferred

- rule: key_runtime_in_method
  reads: file
  line: {capture: k2}
  in: [source]
  match: *key_runtime_match
  values: *key_runtime_values
  id: {template: '{in_subscriber}|{bare}|{unknown}', normalize: [{replace: '^function\|', with: ''}]}
  emits: [{edge: {kind: registers_listener_at_runtime, from: {template: '{psr4_class}::{fn}', types: [php.method]}, to: this_node}}]
  confidence: inferred

- rule: key_runtime_in_function
  reads: file
  line: {capture: k2}
  in: [source]
  match: {<<: *key_runtime_match, ending: [module, install, inc, theme, profile]}
  values: *key_runtime_values
  id: {template: '{in_subscriber}|{bare}|{unknown}', normalize: [{replace: '^function\|', with: ''}]}
  emits: [{edge: {kind: registers_listener_at_runtime, from: {template: '{fn}', types: [php.function]}, to: this_node}}]
  confidence: inferred

# The object a registration call runs on, as the header says: a known type that is not an event
# dispatcher withholds the site, and the runtime node a site names, before the passes.
- rule: registration_on_other_parameter
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>(?:[^|]*\|)?(?:reg|reg_named|reg_here|rt|sub)~v:(?<var>\w+)\|php\.(?:method|function)::(?<holder>[^|]+)\|(?<rest>.*))$'}]
    follow:
    - node: 'php.parameter::{holder}::${var}'
    - edge: parameter_typed_as
    - node: 'drupal.event_use::{site}'
    - try: [{node: 'drupal.runtime_subscription::{rest}'}]
    unless: &shadowed
    - [{node: 'php.local_variable::{holder}::${var}'}]
    - [{node: 'drupal.closure_parameter::{holder}::${var}'}]
    unless_matched:
    - [{node: 'php.parameter::{holder}::${var}'}, {edge: parameter_typed_as}, {id_matches: '::\$\w+::\\?(?<rtype>.+)$'}, {try: [{node: 'php.type::{rtype}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher)$'}]}, {id_matches: '(?:^php\.type::|::\$\w+::\\?)(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher)$'}]
  emits: [{withhold: matched_node}]
  confidence: inferred

- rule: registration_on_other_property
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>(?:[^|]*\|)?(?:reg|reg_named|reg_here|rt|sub)~p:(?<member>\w+)\|php\.method::(?<class>[^|]+)::\w+\|(?<rest>.*))$'}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - edge: property_typed_as
    - node: 'drupal.event_use::{site}'
    - try: [{node: 'drupal.runtime_subscription::{rest}'}]
    unless_matched:
    - [{node: 'php.property::{owner}::${member}'}, {edge: property_typed_as}, {id_matches: '::\$\w+::\\?(?<rtype>.+)$'}, {try: [{node: 'php.type::{rtype}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher)$'}]}, {id_matches: '(?:^php\.type::|::\$\w+::\\?)(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher)$'}]
  emits: [{withhold: matched_node}]
  confidence: inferred

- rule: registration_on_other_assigned_property
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>(?:[^|]*\|)?(?:reg|reg_named|reg_here|rt|sub)~p:(?<member>\w+)\|php\.method::(?<class>[^|]+)::\w+\|(?<rest>.*))$'}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.property::{owner}::${member}'
    - node: 'php.member_assignment::{owner}::$this->{member}'
    - edge: assigned_value
    - id_matches: '^php\.member_assignment_value::[^:]+::(?<setter>[^:]+)::\$this->\w+=\$(?<parameter>\w+)$'
    - node: 'php.parameter::{owner}::{setter}::${parameter}'
    - edge: parameter_typed_as
    - node: 'drupal.event_use::{site}'
    - try: [{node: 'drupal.runtime_subscription::{rest}'}]
    unless_matched:
    - [{node: 'php.parameter::{owner}::{setter}::${parameter}'}, {edge: parameter_typed_as}, {id_matches: '::\$\w+::\\?(?<rtype>.+)$'}, {try: [{node: 'php.type::{rtype}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher)$'}]}, {id_matches: '(?:^php\.type::|::\$\w+::\\?)(?:Symfony\\Component\\EventDispatcher\\EventDispatcherInterface|Symfony\\Contracts\\EventDispatcher\\EventDispatcherInterface|Symfony\\Component\\EventDispatcher\\EventDispatcher|Drupal\\Component\\EventDispatcher\\ContainerAwareEventDispatcher)$'}]
    - [{node: 'php.property::{owner}::${member}'}, {edge: property_typed_as}]
    - [{node: 'php.member_assignment::{owner}::$this->{member}'}, {edge: assigned_value}, {id_matches: '^php\.member_assignment_value::[^:]+::(?:(?!{setter}::)[^:]+::\$this->\w+=|[^:]+::\$this->\w+=(?!\${parameter}$))'}]
  emits: [{withhold: matched_node}]
  confidence: inferred

- rule: registration_on_other_this
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>(?:[^|]*\|)?(?:reg|reg_named|reg_here|rt|sub)~t\|php\.method::(?<class>[^|]+)::\w+\|(?<rest>.*))$'}]
    follow:
    - node: 'php.type::{class}'
