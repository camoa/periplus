# An addSubscriber site's class, from the method or function around the call.
- rule: subscriber_registered
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::sub~[^|]*\|php\.(?:method|function)::(?<holder>[^|]+)\|'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - try: [{edge: use_on_dispatcher}, {id_matches: '(?<on_dispatcher>)'}]
    - try: [{edge: use_by_method_name}, {id_matches: '(?<by_name>)'}]
    - edge: use_names_class
  emits: [{edge: {kind: registers_subscriber, from: {template: '{holder}', types: [php.method, php.function]}, to: matched_node, attributes: {receiver: {template: 'not known to be an event dispatcher{by_name}'}}}}, {edge: {kind: registers_subscriber, from: {template: '{holder}', types: [php.method, php.function]}, to: matched_node, attributes: {receiver: {template: 'an event dispatcher{on_dispatcher}'}}}}]
  confidence: inferred

