$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Listeners registered by a call or by a key the subscriber rules do not read, each read as text
# into one internal drupal.event_use site, reg|<owner>|<listener>, with three edges the map rules
# below read: use_has_priority, a self-link holding the priority as written, 0 when none is
# written; use_names_event, to the event; and use_names_class or use_names_service, to the class
# or service whose method listens. The owner is the method around the call in a class under src,
# or the function around it in a module, install, inc, theme or profile file; a call in a plain
# PHP file outside src, such as a test outside tests/src, or in a method of a class kept in a module
# file, gives nothing, as a subscriber there does. Each argument, key and value is read whole, so an
# expression such as 'a' . 'b' or self::PREFIX . '.x' is never cut down to a name.
#
# The forms:
# - ->addListener(EVENT, CALLABLE, PRIORITY): the event a class constant, X::NAME
#   through the file's use statements, \A\B::NAME, self::NAME, a constant of the file's namespace
#   when a mapped class declares it, or a quoted name; the callable [$this, 'm'], [self::class, 'm'],
#   $this->m(...), [Foo::class, 'm'], Foo::m(...) or 'Foo::m', a method of that class or of its
#   nearest mapped ancestor that declares it, else unresolved on the class; 'name', a function, by a
#   subscribed_by_function edge; any other callable, a closure, an arrow function or a variable,
#   ends at a drupal.runtime_listener <owner>|<callable> marked as an unknown boundary.
# - ->addTag('kernel.event_listener', ['event' => ..., 'method' => ..., 'priority' => ...]) on
#   ->register('id', Foo::class), new Definition(Foo::class) or ->getDefinition('id'), the class
#   or the mapped service's class through its parents; a definition held in a variable, or no
#   method, ends at a drupal.runtime_listener. The tag name, which Symfony's RegisterListenersPass
#   reads, marks the call, on whatever object it runs. A 'dispatcher' key is kept in the edge
#   attribute dispatcher (event/event_listener.yaml).
# - ->addSubscriber(new Foo()) or ->addSubscriber($this): a registers_subscriber edge to the class,
#   whose getSubscribedEvents() the subscriber rules read, from an internal site,
#   sub~<object>|<owner>|<class>.
# - A getSubscribedEvents() key written as a name, 'kernel.request' => ..., or with its namespace,
#   \A\B::NAME or A\B::NAME, where an array element starts, each listener of a list of lists its
#   own; the listener is a method of the subscriber's class or a mapped ancestor.
#
# The object an addListener or addSubscriber call runs on is in its site's id: v:<parameter>,
# p:<property of $this>, t for $this, x for anything else. The map rules read its type from what
# php_basic maps: a parameter's declared type; a property's, typed, promoted or in a @var docblock,
# on the class or its nearest ancestor that declares it; the parameter an untyped property is
# assigned from once; and, for $this, the class. A known type that is not an event dispatcher gives
# nothing: the site, and its runtime node, are withheld. A dispatcher is Symfony's
# EventDispatcherInterface of the contracts or the component, Symfony's EventDispatcher, Drupal's
# ContainerAwareEventDispatcher, or a mapped class or interface that implements or extends one of
# them. With no type known, as for an untyped parameter, one assigned in the body or declared by a
# closure, an undeclared property or a call's result such as \Drupal::service('event_dispatcher'),
# the registration stays, and its edge holds receiver: not known to be an event dispatcher. The
# node sits at the call's line.
# An event or a listener only the running code names - a variable, an expression, a key or a
# listener value built in a loop or by a call, a body returning what a helper builds, a subscriber
# or a definition held in a variable - is a drupal.runtime_subscription <owner>|<expression>, the
# expression as written without its spaces, marked resolution: runtime, with
# a registers_listener_at_runtime edge from the method or function that makes it. The event is named
# as a subscriber's key names it: by the text a mapped constant holds, a core name through the
# table core_event_names, else as written.

node_types:
- name: drupal.runtime_subscription
  description: "a listener registration whose event or listener only the running code names, <owner>|<expression>"
  id_namespace: drupal.runtime_subscription

edge_kinds:
- kind: use_names_class
  cause: none
  description: "the registration's listener is a method of that class"
  from: drupal.event_use
  to: php.class_like
- kind: use_names_service
  cause: none
  description: "the registration's listener is a method of that service's class"
  from: drupal.event_use
  to: drupal.service
- kind: subscribed_by_function
  cause: from
  description: "the function listens to that event: an addListener call names it"
  from: drupal.event
  to: php.function
- kind: registers_listener_at_runtime
  cause: from
  description: "the method, function or class registers a listener whose event or listener only the running code names"
  from: [php.method, php.function, php.class]
  to: drupal.runtime_subscription
- kind: registers_subscriber
  cause: from
  description: "the method or function adds that class as an event subscriber, by addSubscriber"
  from: [php.method, php.function]
  to: php.class
- kind: use_by_method_name
  cause: none
  description: "the addListener or addSubscriber call runs on an object the map shows no type for, so it is read by the method's name alone"
  from: drupal.event_use
  to: drupal.event_use

edge_attributes:
- name: receiver
  on: [subscribed_by, subscribed_by_function, registers_subscriber, registers_listener_at_runtime]
  description: "written when the addListener or addSubscriber call runs on an object of no type the map shows: the registration rests on the method's name alone"

rules:

# ->addListener(EVENT, CALLABLE, PRIORITY), with the object it runs on.
- rule: listener_added_r
  reads: file
  line: {capture: call}
  in: [source]
  match: &listener_added_match
    file: '**'
    filetype: drupal_php_text
    text: '(?:(?<![\w$>:\\])(?<rv>\$(?!this\b)\w+)|(?<![\w$>:\\])\$this\s*->\s*(?<rp>\w+)|(?<![\w$>:\\])(?<rt>\$this))?\s*->\s*(?<call>addListener)\(\s*(?:(?<ek>\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*)|(?<eo>(?:self|static)::[A-Z][A-Z0-9_]*)|[''\"](?<en>[^''\"$]+)[''\"]|(?<ex>(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?))\s*,\s*(?:\[\s*\$this\s*,\s*[''\"](?<a1>\w+)[''\"]\s*\]|\[\s*(?:self|static)::class\s*,\s*[''\"](?<a2>\w+)[''\"]\s*\]|\$this\s*->\s*(?<a3>\w+)\(\s*\.\.\.\s*\)|\[\s*(?<d1>\\?[A-Za-z_][\w\\]*)::class\s*,\s*[''\"](?<e1>\w+)[''\"]\s*\]|(?<d2>\\?[A-Za-z_][\w\\]*)::(?<e2>\w+)\(\s*\.\.\.\s*\)|[''\"](?<b1>\\?[A-Za-z_][\w\\]*)::(?<e3>\w+)[''\"]|[''\"](?<f1>\\?[A-Za-z_][\w\\]*)[''\"]|(?<g1>(?:static\s+)?function\s*\([^)]*\)(?:\s*use\s*\([^)]*\))?(?:\s*:\s*\??[\w\\]+)?\s*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\}|(?:static\s+)?fn\s*\([^)]*\)\s*=>(?:[^,()]|\((?:[^()]|\([^()]*\))*\))+|(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?))\s*(?:,\s*(?<priority>(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?))?\s*\)'
  values: &listener_added_values
    # The object the call runs on: v:<parameter>, p:<property of $this>, t for $this, x for any
    # other, as a call's result; xmark, the mark, only for x.
    recv: {template: '§{call}§V{rv}§P{rp}§T{rt}', normalize: [{replace: '^§\w+', with: ''}, {replace: '§[VPT](?=§|$)', with: ''}, {replace: '^$', with: 'x'}, {replace: '^§V\$', with: 'v:'}, {replace: '^§P', with: 'p:'}, {replace: '^§T.*$', with: 't'}]}
    xmark: {template: '{recv}', normalize: [{replace: '^x$', with: 'not known to be an event dispatcher'}, {replace: '^(?!not ).*$', with: ''}]}
    fn: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}, join: ','}
    owner: {template: '{in_class}|{fn}', normalize: [{replace: '^[^|]+\|.*$', with: '¤{procedural_owner}'}, {replace: '^[^|]*\|', with: ''}, {replace: '^', with: '§'}, {replace: '^§', with: 'php.method::{psr4_class}::'}, {replace: '^§', with: '{procedural_owner}'}, {replace: '^§.*$', with: ''}, {replace: '^.*¤.*$', with: ''}]}
    bare: {template: '{in_class}|{fn}', normalize: [{replace: '^[^|]+\|.*$', with: '¤{procedural_owner}'}, {replace: '^[^|]*\|', with: ''}, {replace: '^', with: '§'}, {replace: '^§', with: '{psr4_class}::'}, {replace: '^§(?={procedural_owner}|)', with: ''}, {replace: '^§.*$', with: ''}, {replace: '^.*¤.*$', with: ''}]}
    ns: {template: '{psr4_namespace}', normalize: [{replace: '\\$', with: ''}]}
    r_ev:
      template: '§K{ek}§O{eo}'
      normalize:
      - {replace: '§[KO](?=§|$)', with: ''}
      - {replace: '^§K', with: ''}
      - {replace: '^§O(?:self|static)::', with: '@{psr4_class}::'}
    h_ev: {from: {capture: ek}, normalize: [{replace: '^\\.*$', with: ''}]}
    prio: {template: '{call}|{priority}', normalize: [{replace: '^[^|]*\|$', with: '0'}, {replace: '^[^|]*\|', with: ''}]}
    unknown: {from: {capture: ex}, normalize: [{replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    self_class: {template: '{a1}{a2}{a3}', normalize: [{replace: '^.*$', with: '{psr4_class}'}]}
    pl:
      template: '§C{a1}{a2}{a3}{e1}{e2}{e3}§F{f1}§R{g1}'
      normalize:
      - {replace: '§[CFR](?=§|$)', with: ''}
      - {replace: '\s+', with: ''}
      - {replace: '\|', with: '¦'}
      - {replace: '^§C', with: 'c:'}
      - {replace: '^§F\\?', with: 'f:'}
      - {replace: '^§R', with: 'r:'}

  id: {template: '{r_ev}|reg~{recv}|{owner}|{pl}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: listener_added_r_edges
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{r_ev}|reg~{recv}|{owner}|{pl}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::'}
  emits:
  - edge: {kind: use_has_priority, from: this_node, to: {template: '{r_ev}|reg~{recv}|{owner}|{pl}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}
  - edge: {kind: use_names_event, from: this_node, to: {template: '{r_ev}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '::', types: [drupal.event_text]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{d1}{d2}', resolve: [{full_if_prefixed: '\'}, bound_first_segment, {prefix_with: ns}], separator: '\', types: [php.class_like]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{b1}', resolve: [{full_if_prefixed: '\'}, as_written], separator: '\', types: [php.class_like]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{self_class}', types: [php.class_like]}}
  confidence: inferred

- rule: listener_added_q
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{r_ev}|reg~{recv}|{owner}|{pl}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '\'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: listener_added_q_edges
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{r_ev}|reg~{recv}|{owner}|{pl}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '\'}
  emits:
  - edge: {kind: use_has_priority, from: this_node, to: {template: '{r_ev}|reg~{recv}|{owner}|{pl}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '\', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}
  - edge: {kind: use_names_event, from: this_node, to: {template: '{r_ev}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment], separator: '\', types: [drupal.event_text]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{d1}{d2}', resolve: [{full_if_prefixed: '\'}, bound_first_segment, {prefix_with: ns}], separator: '\', types: [php.class_like]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{b1}', resolve: [{full_if_prefixed: '\'}, as_written], separator: '\', types: [php.class_like]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{self_class}', types: [php.class_like]}}
  confidence: inferred

- rule: listener_added_h
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{psr4_namespace}{h_ev}|reg_here~{recv}|{owner}|{pl}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: listener_added_h_edges
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{psr4_namespace}{h_ev}|reg_here~{recv}|{owner}|{pl}'}
  emits:
  - edge: {kind: use_has_priority, from: this_node, to: {template: '{psr4_namespace}{h_ev}|reg_here~{recv}|{owner}|{pl}', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}
  - edge: {kind: use_names_event, from: this_node, to: {template: '{psr4_namespace}{h_ev}', types: [drupal.event_text]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{d1}{d2}', resolve: [{full_if_prefixed: '\'}, bound_first_segment, {prefix_with: ns}], separator: '\', types: [php.class_like]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{b1}', resolve: [{full_if_prefixed: '\'}, as_written], separator: '\', types: [php.class_like]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{self_class}', types: [php.class_like]}}
  confidence: inferred

- rule: listener_added_n
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{en}|reg_named~{recv}|{owner}|{pl}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: listener_added_n_edges
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{en}|reg_named~{recv}|{owner}|{pl}'}
  emits:
  - edge: {kind: use_has_priority, from: this_node, to: {template: '{en}|reg_named~{recv}|{owner}|{pl}', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}
  - edge: {kind: use_names_event, from: this_node, to: {template: '{en}', resolve: [{lookup_last_segment_in: core_event_names}, as_written], separator: ' ', types: [drupal.event]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{d1}{d2}', resolve: [{full_if_prefixed: '\'}, bound_first_segment, {prefix_with: ns}], separator: '\', types: [php.class_like]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{b1}', resolve: [{full_if_prefixed: '\'}, as_written], separator: '\', types: [php.class_like]}}
  - edge: {kind: use_names_class, from: this_node, to: {template: '{self_class}', types: [php.class_like]}}
  confidence: inferred

- rule: listener_added_runtime
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{bare}|{unknown}'}
  emits:
  - node: {type: drupal.runtime_subscription}
  - attribute: {name: resolution, template: runtime}
  confidence: inferred

- rule: listener_added_runtime_site
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: 'rt~{recv}|{owner}|{bare}|{unknown}'}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: listener_added_runtime_in_method
  reads: file
  line: {capture: call}
  in: [source]
  match: *listener_added_match
  values: *listener_added_values
  id: {template: '{bare}|{unknown}'}
  emits: [{edge: {kind: registers_listener_at_runtime, from: {template: '{psr4_class}::{fn}', types: [php.method]}, to: this_node, attributes: {receiver: {template: '{xmark}'}}}}]
  confidence: inferred

- rule: listener_added_runtime_in_function
  reads: file
  line: {capture: call}
  in: [source]
  match: {<<: *listener_added_match, ending: [module, install, inc, theme, profile]}
  values: *listener_added_values
  id: {template: '{bare}|{unknown}'}
  emits: [{edge: {kind: registers_listener_at_runtime, from: {template: '{fn}', types: [php.function]}, to: this_node, attributes: {receiver: {template: '{xmark}'}}}}]
  confidence: inferred

# ->addTag('kernel.event_listener', [...]) on a definition a service provider or a pass names.
- rule: listener_tag_added_r
  reads: file
  in: [source]
  match: &listener_tag_added_match
    file: '**'
    filetype: drupal_php_text
    text: '(?:->\s*register\(\s*[''\"][^''\"]+[''\"]\s*,\s*(?<d1>\\?[A-Za-z_][\w\\]*)::class\s*\)|new\s+Definition\(\s*(?<d2>\\?[A-Za-z_][\w\\]*)::class\s*\)|->\s*(?:getDefinition|findDefinition)\(\s*[''\"](?<sid>[^''\"]+)[''\"]\s*\)|(?<dv>\$\w+(?:->\w+)*)(?!\s*->\s*(?:register|getDefinition|findDefinition|setDefinition)\())(?:\s*->\s*\w+\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\s*->\s*addTag\(\s*[''\"](?<tag>kernel\.event_listener)[''\"]\s*,\s*(?:\[|array\s*\()(?=(?:(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^()\[\]''\"])*?[''\"]event[''\"]\s*=>\s*(?:(?<ek>\\?(?:[A-Za-z_]\w*\\)*[A-Z]\w*::[A-Z][A-Z0-9_]*)(?=\s*[,\]\)])|(?<eo>(?:self|static)::[A-Z][A-Z0-9_]*)(?=\s*[,\]\)])|[''\"](?<en>[^''\"$]+)[''\"](?=\s*[,\]\)])|(?<ex>(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?)(?=\s*[,\]\)])))?)(?=(?:(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^()\[\]''\"])*?[''\"]method[''\"]\s*=>\s*(?:[''\"](?<e1>\w+)[''\"](?=\s*[,\]\)])|(?<mx>(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?)(?=\s*[,\]\)])))?)(?=(?:(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^()\[\]''\"])*?[''\"]priority[''\"]\s*=>\s*(?<priority>(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?)\s*[,\]\)])?)(?=(?:(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^()\[\]''\"])*?[''\"]dispatcher[''\"]\s*=>\s*(?:[''\"](?<dispatcher>[^''\"]+)[''\"](?=\s*[,\]\)])|(?<dispx>(?:''[^'']*''|\"[^\"]*\"|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|[^,()\[\]''\"])+?)(?=\s*[,\]\)])))?)'
  values: &listener_tag_added_values
    disp: {template: '{dispatcher}{dispx}'}
    fn: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}, join: ','}
    owner: {template: '{in_class}|{fn}', normalize: [{replace: '^[^|]+\|.*$', with: '¤{procedural_owner}'}, {replace: '^[^|]*\|', with: ''}, {replace: '^', with: '§'}, {replace: '^§', with: 'php.method::{psr4_class}::'}, {replace: '^§', with: '{procedural_owner}'}, {replace: '^§.*$', with: ''}, {replace: '^.*¤.*$', with: ''}]}
    bare: {template: '{in_class}|{fn}', normalize: [{replace: '^[^|]+\|.*$', with: '¤{procedural_owner}'}, {replace: '^[^|]*\|', with: ''}, {replace: '^', with: '§'}, {replace: '^§', with: '{psr4_class}::'}, {replace: '^§(?={procedural_owner}|)', with: ''}, {replace: '^§.*$', with: ''}, {replace: '^.*¤.*$', with: ''}]}
    ns: {template: '{psr4_namespace}', normalize: [{replace: '\\$', with: ''}]}
    r_ev:
      template: '§K{ek}§O{eo}'
      normalize:
      - {replace: '§[KO](?=§|$)', with: ''}
      - {replace: '^§K', with: ''}
      - {replace: '^§O(?:self|static)::', with: '@{psr4_class}::'}
    h_ev: {from: {capture: ek}, normalize: [{replace: '^\\.*$', with: ''}]}
    prio: {template: '{tag}|{priority}', normalize: [{replace: '^[^|]*\|$', with: '0'}, {replace: '^[^|]*\|', with: ''}]}
    unknown: {template: '§{ex}§{ek}{eo}{en}§{mx}', normalize: [{replace: '^§§[^§]+§.*$', with: ''}, {replace: '^§§§', with: ''}, {replace: '(?<=.)§.*$', with: ''}, {replace: '^§', with: ''}, {replace: '\s+', with: ''}, {replace: '\|', with: '¦'}]}
    no_event: {template: '{tag}|{ek}{eo}{en}{ex}', normalize: [{replace: '^[^|]*\|$', with: 'tag-with-no-event'}, {replace: '^[^|]*\|.+$', with: ''}]}
    pl:
