- rule: added_tag_typed_service
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<site>[^|]*\|reg_typed\|(?<owner>[^|]+)\|t:(?<method>\w+))$'}]
