# A key whose method the subscriber's class does not declare and a mapped ancestor does: the
# method as written, which the _listener twin left as an end, is taken back at the key, so the
# edge above reaches the ancestor's method alone.
- rule: key_method_on_ancestor
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::.*\|subscribed(?:_here)?\|(?<lc>[^|]+)::(?<lm>\w+)$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    follow:
    - node: 'php.type::{lc}'
    - edge: inherits
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<d>.+)$'
    - node: 'php.method::{d}::{lm}'
    - node: 'php.method::{lc}::{lm}'
    unless: [[{node: 'php.type::{lc}'}, {edge: contains}, {id_matches: '^php\.method::{lc}::{lm}$'}]]
  emits: [{withhold: matched_node}]
  confidence: inferred
