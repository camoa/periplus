    m_src: {template: '§{in_class}§{fn}', normalize: [{replace: '^§§.*$', with: ''}, {replace: '^§[^§]*§', with: '{psr4_class}::'}, {replace: '^§.*$', with: ''}]}
    m_mod: {template: '{fns}§{in_class}§{fn}', normalize: [{replace: '^[^§]*§§[\s\S]*$', with: ''}, {replace: '^', with: '¤{procedural_owner}'}, {replace: '^(?!¤)[\s\S]*$', with: ''}, {replace: '^¤php\.function::', with: ''}, {replace: '§(?=[^§]*§)', with: ''}, {replace: '§', with: '::'}]}
    f_own: {template: '§{in_class}§{fn}', normalize: [{replace: '^§[^§]+§.*$', with: ''}, {replace: '^§§', with: '¤{procedural_owner}'}, {replace: '^¤php\.function::', with: ''}, {replace: '^[§¤].*$', with: ''}]}
    meth: {template: '{m_src}{m_mod}'}
    this_cls: {template: '{meth}', normalize: [{replace: '::\w+$', with: ''}]}
    here_ns: {template: '§{fns}', normalize: [{replace: '^§.*$', with: '{psr4_namespace}'}, {replace: '^§', with: ''}]}
    prio: {template: '{method}|{priority}', normalize: [{replace: '//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#[^\n]*', with: ''}, {replace: '\|\s+', with: '|'}, {replace: '\s+$', with: ''}, {replace: '^\w+\|$', with: '0'}, {replace: '^\w+\|', with: ''}]}
    pk: {template: '§{this_cls}§{pcref}{pcu}', normalize: [{replace: '§(?:self|static)(?=::)', with: ''}, {replace: '^§[^§]*§', with: ''}, {replace: '^§', with: '@'}]}
    ph: {template: '§{here_ns}§{pcu}', normalize: [{replace: '§', with: ''}]}
  id:
    template: '{in_subscriber}|{here_ns}{class}::{constant}|subscribed_here|{this_cls}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  emits: [{edge: {kind: use_priority_constant, from: this_node, to: {template: '{pk}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment, as_written], separator: '::', types: [drupal.class_constant]}}}, {edge: {kind: use_priority_constant, from: this_node, to: {template: '{ph}', types: [drupal.class_constant]}}}, {edge: {kind: use_has_priority, from: this_node, to: {template: '{here_ns}{class}::{constant}|subscribed_here|{this_cls}::{method}', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: inferred

# The second and later listeners of a list of lists, X::NAME => [['a', 10], ['b'], ['c', -5]]: each
# ['method', priority] after a comma inside the key's listener_list span (pack.yaml) is a use of
# the same shapes as above, at the method's line, so the same map rules make its edge.
- rule: event_subscribed_use_later
  reads: file
  in: [source]
  match: &later_listener
    file: '**'
    filetype: drupal_php_text
    text: ',\s*\[\s*[''"](?<method>\w+)[''"]\s*(?:,\s*(?<priority>(?:(?=(?:(?<pcref>(?:self|static|\\?(?:[A-Za-z_]\w*\\)+[A-Z]\w*)::[A-Z][A-Z0-9_]*)|(?<pcu>[A-Z]\w*::[A-Z][A-Z0-9_]*))\s*[,\]\)]))?[^\]\[''"=>;,]*?)\s*,?\s*)?\]'
  values: &later_values
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
    fn: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}, join: ','}
    fns: {from: {enclosing: php_namespace, capture: ns}, join: '|', normalize: [{replace: '^.*\|', with: ''}, {replace: '(?<=.)$', with: '\'}]}
    m_src: {template: '§{in_class}§{fn}', normalize: [{replace: '^§§.*$', with: ''}, {replace: '^§[^§]*§', with: '{psr4_class}::'}, {replace: '^§.*$', with: ''}]}
    m_mod: {template: '{fns}§{in_class}§{fn}', normalize: [{replace: '^[^§]*§§[\s\S]*$', with: ''}, {replace: '^', with: '¤{procedural_owner}'}, {replace: '^(?!¤)[\s\S]*$', with: ''}, {replace: '^¤php\.function::', with: ''}, {replace: '§(?=[^§]*§)', with: ''}, {replace: '§', with: '::'}]}
    f_own: {template: '§{in_class}§{fn}', normalize: [{replace: '^§[^§]+§.*$', with: ''}, {replace: '^§§', with: '¤{procedural_owner}'}, {replace: '^¤php\.function::', with: ''}, {replace: '^[§¤].*$', with: ''}]}
    meth: {template: '{m_src}{m_mod}'}
    this_cls: {template: '{meth}', normalize: [{replace: '::\w+$', with: ''}]}
    here_ns: {template: '§{fns}', normalize: [{replace: '^§.*$', with: '{psr4_namespace}'}, {replace: '^§', with: ''}]}
    wkey: {from: {enclosing: listener_list, capture: key}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    wclass: {from: {enclosing: listener_list, capture: class}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    constant: {from: {enclosing: listener_list, capture: constant}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    parent_cls: {from: {enclosing: class_like_body, capture: parent}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    key: {template: '{parent_cls}§{wkey}', normalize: [{replace: '^[^§]*§(?!parent::)', with: ''}, {replace: '^[^§]*\\[^§]*§parent::[\s\S]*$', with: ''}, {replace: '^§parent::[\s\S]*$', with: ''}, {replace: '§parent(?=::)', with: ''}]}
    class: {template: '{parent_cls}§{wclass}', normalize: [{replace: '^[^§]*§(?!parent$)', with: ''}, {replace: '^[^§]*\\[^§]*§parent$', with: ''}, {replace: '^§parent$', with: ''}, {replace: '§parent$', with: ''}]}
    own: {from: {enclosing: own_listener_list, capture: constant}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    prio: {template: '{method}|{priority}', normalize: [{replace: '//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#[^\n]*', with: ''}, {replace: '\|\s+', with: '|'}, {replace: '\s+$', with: ''}, {replace: '^\w+\|$', with: '0'}, {replace: '^\w+\|', with: ''}]}
    pk: {template: '§{this_cls}§{pcref}{pcu}', normalize: [{replace: '§(?:self|static)(?=::)', with: ''}, {replace: '^§[^§]*§', with: ''}, {replace: '^§', with: '@'}]}
    ph: {template: '§{here_ns}§{pcu}', normalize: [{replace: '§', with: ''}]}
  id:
    template: '{key}|{in_subscriber}|subscribed|{this_cls}::{method}'
    resolve: [bound_first_segment]
    separator: '::'
    normalize: [{replace: '\|[^|]*\|subscribed\|', with: '|subscribed|'}]
  line: {capture: method}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

