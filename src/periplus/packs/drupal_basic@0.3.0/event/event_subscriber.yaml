$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A subscriber keys its events in getSubscribedEvents(): X::NAME => 'method', X::NAME =>
# ['method', 10], or $events[X::NAME][] = ['method']. Each key is a subscribed_by edge from the
# event to that method of the class the file's path names by Drupal's PSR-4 layout, so the rules
# are inferred and a file outside a src folder gives nothing. Only a key inside the body of
# getSubscribedEvents counts. Every listener of a list of lists, as in
# X::NAME => [['first', 10], ['second']], is read: the first at the key's line, each later one at
# its own line by the _later rules below. Each subscribed_by edge holds the
# listener's priority as written, 10 or self::LATE, in the edge attribute priority, and 0 when none
# is written, the priority Symfony gives such a listener, so a reader compares the listeners of
# one event on one scale. The _listener twin writes it on its use_names_listener edge, a key of
# the file's own namespace on a use_has_priority self-link, and the map rules read it from there
# with an edge_attribute step.
#
# Each key is an internal drupal.event_use at its line (event/event.yaml), and the map rules make
# its edge there: from the event of the text the constant holds, when a mapped file declares it
# with a text, else from the event of the constant <class>::<NAME>. X is read through the file's
# use statements (event/use_binding.yaml). A class written with no use is in the file's own
# namespace and, as self::NAME and static::NAME, which name a constant of the subscriber's own
# class, gives an edge only when a mapped class declares the constant. A key written with its
# namespace, \A\B::NAME or A\B::NAME, or as a name, 'kernel.request', is read by
# event/listener_registration.yaml, and a subclass's inherited keys by
# event/inherited_subscription.yaml. Each use rule's _listener twin makes the
# listener a known end, so a listener no mapped file declares ends at a referenced method; a key
# in the file's own namespace is joined only when the map holds its method.

rules:
- rule: event_subscribed_use
  reads: file
  in: [source]
  match: &event_subscribed_use
    file: '**'
    filetype: drupal_php_text
    text: '(?<!\\)\b(?<key>[A-Z]\w*::[A-Z][A-Z0-9_]*)\s*(?:=>|\]\s*(?:\[\s*\]\s*)?=)\s*(?:\[\s*){0,2}[''"](?<method>\w+)[''"](?:\s*,\s*(?<priority>[^\]\[''"=>;,]*?)\s*,?\s*\])?'
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
  id:
    template: '{key}|{in_subscriber}|subscribed|{psr4_class}::{method}'
    resolve: [bound_first_segment]
    separator: '::'
    normalize: [{replace: '\|[^|]*\|subscribed\|', with: '|subscribed|'}]
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_subscribed_use_listener
  reads: file
  in: [source]
  match: *event_subscribed_use
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
    prio: {template: '{method}|{priority}', normalize: [{replace: '^\w+\|$', with: '0'}, {replace: '^\w+\|', with: ''}]}
  id:
    template: '{key}|{in_subscriber}|subscribed|{psr4_class}::{method}'
    resolve: [bound_first_segment]
    separator: '::'
    normalize: [{replace: '\|[^|]*\|subscribed\|', with: '|subscribed|'}]
  emits: [{edge: {kind: use_names_listener, from: this_node, to: {template: '{psr4_class}::{method}', types: [php.method]}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: inferred

- rule: event_subscribed_use_own_class
  reads: file
  in: [source]
  match: &event_subscribed_use_own_class
    file: '**'
    filetype: drupal_php_text
    text: '\b(?:self|static)::(?<constant>[A-Z][A-Z0-9_]*)\s*(?:=>|\]\s*(?:\[\s*\]\s*)?=)\s*(?:\[\s*){0,2}[''"](?<method>\w+)[''"](?:\s*,\s*(?<priority>[^\]\[''"=>;,]*?)\s*,?\s*\])?'
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
  id:
    template: '{in_subscriber}|{psr4_class}::{constant}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_subscribed_use_own_class_listener
  reads: file
  in: [source]
  match: *event_subscribed_use_own_class
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
    prio: {template: '{method}|{priority}', normalize: [{replace: '^\w+\|$', with: '0'}, {replace: '^\w+\|', with: ''}]}
  id:
    template: '{in_subscriber}|{psr4_class}::{constant}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  emits: [{edge: {kind: use_names_listener, from: this_node, to: {template: '{psr4_class}::{method}', types: [php.method]}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: inferred

- rule: event_key_in_namespace
  reads: file
  in: [source]
  match: &event_key_in_namespace
    file: '**'
    filetype: drupal_php_text
    text: '(?<!\\)\b(?<class>[A-Z]\w*)::(?<constant>[A-Z][A-Z0-9_]*)\s*(?:=>|\]\s*(?:\[\s*\]\s*)?=)\s*(?:\[\s*){0,2}[''"](?<method>\w+)[''"](?:\s*,\s*(?<priority>[^\]\[''"=>;,]*?)\s*,?\s*\])?'
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
  id:
    template: '{in_subscriber}|{psr4_namespace}{class}::{constant}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

# A key of the file's own namespace names its listener too, so a subclass reaches the key from the
# method (event/inherited_subscription.yaml); the self-link below carries its priority.
- rule: event_key_in_namespace_listener
  reads: file
  in: [source]
  match: *event_key_in_namespace
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
    prio: {template: '{method}|{priority}', normalize: [{replace: '^\w+\|$', with: '0'}, {replace: '^\w+\|', with: ''}]}
  id:
    template: '{in_subscriber}|{psr4_namespace}{class}::{constant}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  emits: [{edge: {kind: use_names_listener, from: this_node, to: {template: '{psr4_class}::{method}', types: [php.method]}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: inferred

- rule: event_key_in_namespace_priority
  reads: file
  in: [source]
  match: *event_key_in_namespace
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
    prio: {template: '{method}|{priority}', normalize: [{replace: '^\w+\|$', with: '0'}, {replace: '^\w+\|', with: ''}]}
  id:
    template: '{in_subscriber}|{psr4_namespace}{class}::{constant}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  emits: [{edge: {kind: use_has_priority, from: this_node, to: {template: '{psr4_namespace}{class}::{constant}|subscribed_here|{psr4_class}::{method}', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: inferred

# The second and later listeners of a list of lists, X::NAME => [['a', 10], ['b'], ['c', -5]]: each
# ['method', priority] after a comma inside the key's listener_list span (pack.yaml) is a use of
# the same shapes as above, at the method's line, so the same map rules make its edge.
- rule: event_subscribed_use_later
  reads: file
  in: [source]
  match: &later_listener
    file: '**'
    filetype: drupal_php_text
    text: ',\s*\[\s*[''"](?<method>\w+)[''"]\s*(?:,\s*(?<priority>[^\]\[''"=>;,]*?)\s*,?\s*)?\]'
  values: &later_values
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
    key: {from: {enclosing: listener_list, capture: key}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    class: {from: {enclosing: listener_list, capture: class}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    constant: {from: {enclosing: listener_list, capture: constant}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    own: {from: {enclosing: own_listener_list, capture: constant}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    prio: {template: '{method}|{priority}', normalize: [{replace: '^\w+\|$', with: '0'}, {replace: '^\w+\|', with: ''}]}
  id:
    template: '{key}|{in_subscriber}|subscribed|{psr4_class}::{method}'
    resolve: [bound_first_segment]
    separator: '::'
    normalize: [{replace: '\|[^|]*\|subscribed\|', with: '|subscribed|'}]
  line: {capture: method}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_subscribed_use_later_listener
  reads: file
  in: [source]
  match: *later_listener
  values: *later_values
  id:
    template: '{key}|{in_subscriber}|subscribed|{psr4_class}::{method}'
    resolve: [bound_first_segment]
    separator: '::'
    normalize: [{replace: '\|[^|]*\|subscribed\|', with: '|subscribed|'}]
  line: {capture: method}
  emits: [{edge: {kind: use_names_listener, from: this_node, to: {template: '{psr4_class}::{method}', types: [php.method]}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: inferred

- rule: event_subscribed_use_own_class_later
  reads: file
  in: [source]
  match: *later_listener
  values: *later_values
  id:
    template: '{in_subscriber}|{psr4_class}::{own}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  line: {capture: method}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_subscribed_use_own_class_later_listener
  reads: file
  in: [source]
  match: *later_listener
  values: *later_values
  id:
    template: '{in_subscriber}|{psr4_class}::{own}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  line: {capture: method}
  emits: [{edge: {kind: use_names_listener, from: this_node, to: {template: '{psr4_class}::{method}', types: [php.method]}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: inferred

- rule: event_key_in_namespace_later
  reads: file
  in: [source]
  match: *later_listener
  values: *later_values
  id:
    template: '{in_subscriber}|{psr4_namespace}{class}::{constant}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  line: {capture: method}
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_key_in_namespace_later_listener
  reads: file
  in: [source]
  match: *later_listener
  values: *later_values
  id:
    template: '{in_subscriber}|{psr4_namespace}{class}::{constant}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  line: {capture: method}
  emits: [{edge: {kind: use_names_listener, from: this_node, to: {template: '{psr4_class}::{method}', types: [php.method]}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: inferred

- rule: event_key_in_namespace_later_priority
  reads: file
  in: [source]
  match: *later_listener
  values: *later_values
  id:
    template: '{in_subscriber}|{psr4_namespace}{class}::{constant}|subscribed_here|{psr4_class}::{method}'
    normalize: [{replace: '^[^|]*\|', with: ''}]
  line: {capture: method}
  emits: [{edge: {kind: use_has_priority, from: this_node, to: {template: '{psr4_namespace}{class}::{constant}|subscribed_here|{psr4_class}::{method}', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}}]
  confidence: inferred

- rule: event_subscribed_by_text
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|subscribed(?:_here)?\|(?<listener>[^|]+)$'}]
    follow:
    - try: [{edge: use_names_listener}, {edge_attribute: priority}]
    - try: [{edge: use_has_priority}, {edge_attribute: priority}]
    - node: 'drupal.class_constant::{event}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - node: 'php.method::{listener}'
  emits: [{edge: {kind: subscribed_by, from: {template: '{text}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

# untexted is captured only where no mapped file gives the constant a text.
- rule: event_subscribed_by_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|subscribed\|(?<listener>[^|]+)$'}]
    follow:
    - try: [{edge: use_names_listener}, {edge_attribute: priority}]
    - node: 'drupal.event_use::{event}|subscribed|{listener}'
    - try: [{node: 'drupal.class_constant::{event}'}, {edge: has_constant_text}]
    - id_matches: '^(?:drupal\.constant_text::|drupal\.event_use::(?<untexted>))'
    - node: 'php.method::{listener}'
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}{untexted}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred

- rule: event_subscribed_in_namespace
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>[^|]+)\|subscribed_here\|(?<listener>[^|]+)$'}]
    follow:
    - try: [{edge: use_names_listener}, {edge_attribute: priority}]
    - try: [{edge: use_has_priority}, {edge_attribute: priority}]
    - node: 'drupal.class_constant::{event}'
    - try: [{edge: has_constant_text}]
    - id_matches: '^(?:drupal\.constant_text::|drupal\.class_constant::(?<untexted>))'
    - node: 'php.method::{listener}'
  emits: [{edge: {kind: subscribed_by, from: {template: '{event}{untexted}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}}}}]
  confidence: inferred
