$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A subscriber keys its events in getSubscribedEvents(): X::NAME => 'method', X::NAME =>
# ['method', 10], or $events[X::NAME][] = ['method']. Each key is a subscribed_by edge from the
# event to that method of the class, named by Drupal's PSR-4 layout under src, or by the file's
# namespace for a class a module, install, inc, theme, profile or plain .php file keeps outside
# src, so the rules are inferred: on the class or its nearest mapped ancestor that declares the
# method, else unresolved on the class as written. Only a key inside the body of
# getSubscribedEvents counts, read where an array element starts, after [, ( or a comma, so a
# constant inside an expression, as 'pre.' . X::NAME, is no key; such a key, and a listener written
# as an expression, is a runtime registration (event/listener_registration.yaml). Every listener of
# a list of lists, as in X::NAME => [['first', 10], ['second']], is read: the first at the key's
# line, each later one at its own line by the _later rules below. Each subscribed_by edge holds the
# listener's priority as written, 10 or self::LATE, in the edge attribute priority, and 0 when none
# is written, the priority Symfony gives such a listener, so a reader compares the listeners of
# one event on one scale. The _listener twin writes it on its use_names_listener edge, a key of
# the file's own namespace on a use_has_priority self-link, and the map rules read it from there
# with an edge_attribute step.
#
# Each key is an internal drupal.event_use at its line (event/event.yaml), and the map rules make
# its edge there: from the event of the text the constant holds, when a mapped file declares it
# with a text, on X or the nearest mapped ancestor or interface of X that declares it, else from
# the event of the constant <class>::<NAME> of the class that declares it. X is read through the
# file's use statements, a grouped one among them (event/use_binding.yaml). A class no use binds
# is in the file's own namespace, as PHP reads it, and so are self::NAME and static::NAME, which
# name a constant of the subscriber's own class: the event of that constant, unresolved when no
# mapped class declares it, and kept only when no use binds X (a use_bound edge from the bound
# key). parent::NAME is X::NAME with X the class's written parent, read here when the parent is
# written with no backslash and by event/listener_registration.yaml when it has one. A priority
# written as a constant, self::LATE or X::FIRST, holds the integer a mapped file declares it with
# (use_priority_constant, event/event.yaml), else stays as written; a comment around it is no part
# of it. A
# key written with its namespace, \A\B::NAME or A\B::NAME, as a name, 'kernel.request', or as a
# class, X::class, is read by event/listener_registration.yaml, and a subclass's inherited keys by
# event/inherited_subscription.yaml. Each use rule's _listener twin makes the listener a known end,
# so a listener no mapped file declares ends at an unresolved method; the map rule
# key_method_on_ancestor takes that end back when a mapped ancestor declares the method.

rules:
- rule: event_subscribed_use
  reads: file
  line: {capture: wkey}
  in: [source]
  match: &event_subscribed_use
    file: '**'
    filetype: drupal_php_text
    text: '[\[,(](?:\s|//[^\n]*(?![^\n])|/\*(?:[^*]|\*(?!/))*\*/|#(?!\[)[^\n]*(?![^\n]))*(?<!\\)\b(?<wkey>(?:[A-Z]\w*|parent)::[A-Z][A-Z0-9_]*)\s*(?:=>|\]\s*(?:\[\s*\]\s*)?=)\s*(?:\[\s*){0,2}[''"](?<method>\w+)[''"](?=\s*[,\]\);])(?:\s*,\s*(?<priority>(?:(?=(?:(?<pcref>(?:self|static|\\?(?:[A-Za-z_]\w*\\)+[A-Z]\w*)::[A-Z][A-Z0-9_]*)|(?<pcu>[A-Z]\w*::[A-Z][A-Z0-9_]*))\s*[,\]\)]))?[^\]\[''"=>;,]*?)\s*,?\s*\])?'
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
    fn: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}, join: ','}
    fns: {from: {enclosing: php_namespace, capture: ns}, join: '|', normalize: [{replace: '^.*\|', with: ''}, {replace: '(?<=.)$', with: '\'}]}
    m_src: {template: '§{in_class}§{fn}', normalize: [{replace: '^§§.*$', with: ''}, {replace: '^§[^§]*§', with: '{psr4_class}::'}, {replace: '^§.*$', with: ''}]}
    m_mod: {template: '{fns}§{in_class}§{fn}', normalize: [{replace: '^[^§]*§§[\s\S]*$', with: ''}, {replace: '^', with: '¤{procedural_owner}'}, {replace: '^(?!¤)[\s\S]*$', with: ''}, {replace: '^¤php\.function::', with: ''}, {replace: '§(?=[^§]*§)', with: ''}, {replace: '§', with: '::'}]}
    f_own: {template: '§{in_class}§{fn}', normalize: [{replace: '^§[^§]+§.*$', with: ''}, {replace: '^§§', with: '¤{procedural_owner}'}, {replace: '^¤php\.function::', with: ''}, {replace: '^[§¤].*$', with: ''}]}
    meth: {template: '{m_src}{m_mod}'}
    this_cls: {template: '{meth}', normalize: [{replace: '::\w+$', with: ''}]}
    here_ns: {template: '§{fns}', normalize: [{replace: '^§.*$', with: '{psr4_namespace}'}, {replace: '^§', with: ''}]}
    parent_cls: {from: {enclosing: class_like_body, capture: parent}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    key: {template: '{parent_cls}§{wkey}', normalize: [{replace: '^[^§]*§(?!parent::)', with: ''}, {replace: '^[^§]*\\[^§]*§parent::[\s\S]*$', with: ''}, {replace: '^§parent::[\s\S]*$', with: ''}, {replace: '§parent(?=::)', with: ''}]}
  id:
    template: '{key}|{in_subscriber}|subscribed|{this_cls}::{method}'
    resolve: [bound_first_segment]
    separator: '::'
    normalize: [{replace: '\|[^|]*\|subscribed\|', with: '|subscribed|'}]
  emits: [{node: {type: drupal.event_use}}]
  confidence: inferred

- rule: event_subscribed_use_listener
  reads: file
  line: {capture: wkey}
  in: [source]
  match: *event_subscribed_use
  values:
    in_subscriber: {from: {enclosing: subscribed_events, capture: mark}}
    fn: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}, join: ','}
    fns: {from: {enclosing: php_namespace, capture: ns}, join: '|', normalize: [{replace: '^.*\|', with: ''}, {replace: '(?<=.)$', with: '\'}]}
    m_src: {template: '§{in_class}§{fn}', normalize: [{replace: '^§§.*$', with: ''}, {replace: '^§[^§]*§', with: '{psr4_class}::'}, {replace: '^§.*$', with: ''}]}
    m_mod: {template: '{fns}§{in_class}§{fn}', normalize: [{replace: '^[^§]*§§[\s\S]*$', with: ''}, {replace: '^', with: '¤{procedural_owner}'}, {replace: '^(?!¤)[\s\S]*$', with: ''}, {replace: '^¤php\.function::', with: ''}, {replace: '§(?=[^§]*§)', with: ''}, {replace: '§', with: '::'}]}
    f_own: {template: '§{in_class}§{fn}', normalize: [{replace: '^§[^§]+§.*$', with: ''}, {replace: '^§§', with: '¤{procedural_owner}'}, {replace: '^¤php\.function::', with: ''}, {replace: '^[§¤].*$', with: ''}]}
    meth: {template: '{m_src}{m_mod}'}
    this_cls: {template: '{meth}', normalize: [{replace: '::\w+$', with: ''}]}
    here_ns: {template: '§{fns}', normalize: [{replace: '^§.*$', with: '{psr4_namespace}'}, {replace: '^§', with: ''}]}
    parent_cls: {from: {enclosing: class_like_body, capture: parent}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    key: {template: '{parent_cls}§{wkey}', normalize: [{replace: '^[^§]*§(?!parent::)', with: ''}, {replace: '^[^§]*\\[^§]*§parent::[\s\S]*$', with: ''}, {replace: '^§parent::[\s\S]*$', with: ''}, {replace: '§parent(?=::)', with: ''}]}
    prio: {template: '{method}|{priority}', normalize: [{replace: '//[^\n]*|/\*(?:[^*]|\*(?!/))*\*/|#[^\n]*', with: ''}, {replace: '\|\s+', with: '|'}, {replace: '\s+$', with: ''}, {replace: '^\w+\|$', with: '0'}, {replace: '^\w+\|', with: ''}]}
    pk: {template: '§{this_cls}§{pcref}{pcu}', normalize: [{replace: '§(?:self|static)(?=::)', with: ''}, {replace: '^§[^§]*§', with: ''}, {replace: '^§', with: '@'}]}
    ph: {template: '§{here_ns}§{pcu}', normalize: [{replace: '§', with: ''}]}
  id:
    template: '{key}|{in_subscriber}|subscribed|{this_cls}::{method}'
    resolve: [bound_first_segment]
    separator: '::'
    normalize: [{replace: '\|[^|]*\|subscribed\|', with: '|subscribed|'}]
  emits:
  - {edge: {kind: use_priority_constant, from: this_node, to: {template: '{pk}', resolve: [{full_if_prefixed: '@'}, {full_if_prefixed: '\'}, bound_first_segment, as_written], separator: '::', types: [drupal.class_constant]}}}
  - {edge: {kind: use_priority_constant, from: this_node, to: {template: '{ph}', types: [drupal.class_constant]}}}
  - {edge: {kind: use_bound, from: this_node, to: {template: 'bound|{key}|{this_cls}::{method}', type: drupal.event_use}}}
  - {edge: {kind: use_names_listener, from: this_node, to: {template: '{this_cls}::{method}', types: [php.method], on_miss: unresolved}, attributes: {priority: {template: '{prio}'}}}}
  - {edge: {kind: use_has_priority, from: this_node, to: {template: '{key}|subscribed|{this_cls}::{method}', resolve: [bound_first_segment], separator: '::', type: drupal.event_use}, attributes: {priority: {template: '{prio}'}}}}
  confidence: inferred

