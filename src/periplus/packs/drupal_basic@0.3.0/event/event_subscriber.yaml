- rule: event_subscribed_by_text_here
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>(?<cc>(?<ns>(?:[^|\\]*\\)*?)(?<wr>[^|]*?))::(?<cn>[A-Z][A-Z0-9_]*))\|subscribed_here\|(?<listener>(?<lc>(?P=ns)[^|\\]+)::(?<lm>\w+))$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
    unless: &key_bound [[{node: 'drupal.event_use::bound|{wr}::{cn}|{listener}'}]]
    follow:
    - try: [{edge: use_dispatcher}, {edge_attribute: dispatcher}]
    - try: [{edge: use_names_listener}, {edge_attribute: priority}]
    - try: [{edge: use_has_priority}, {edge_attribute: priority}]
    - try: [{node: 'php.type::{cc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<cd>.+)$'}, {node: 'drupal.class_constant::{cd}::{cn}'}, {id_matches: '^drupal\.class_constant::(?<event>.+)$'}]
    - node: 'drupal.class_constant::{event}'
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - try: [{node: 'php.type::{lc}'}, {ancestors: [inherits]}, {id_matches: '^php\.type::(?<lc>.+)$'}, {node: 'php.method::{lc}::{lm}'}]
    - node: 'php.method::{lc}::{lm}'
    - id_matches: '^(?<target_id>[\s\S]+)$'
    - try: [{node: '{use_id}'}, {edge: use_priority_constant}, {id_matches: '^drupal\.class_constant::(?<pc>.+)::(?<pn>[A-Z_][A-Z0-9_]*)$'}, {node: 'php.type::{pc}'}, {ancestors: [inherits, implements]}, {id_matches: '^php\.type::(?<pcd>.+)$'}, {node: 'drupal.class_constant::{pcd}::{pn}'}, {edge: has_constant_int}, {id_matches: '^drupal\.constant_int::(?<priority>-?\d+)$'}, {node: '{target_id}'}]
  emits: [{edge: {kind: subscribed_by, from: {template: '{text}', types: [drupal.event]}, to: matched_node, attributes: {priority: {template: '{priority}'}, dispatcher: {template: '{dispatcher}'}}}}]
  confidence: inferred

# untexted is captured only where no mapped file gives the constant a text.
- rule: event_subscribed_by_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<event>(?<cc>[^|]+)::(?<cn>[A-Z][A-Z0-9_]*))\|subscribed\|(?<listener>(?<lc>[^|]+)::(?<lm>\w+))$'}, {id_matches: '^(?<use_id>[\s\S]+)$'}]
