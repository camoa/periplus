$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# The edges written at a declaration. Each of the first three makes one edge per name written in
# the clause, at that name's line, to the full name the file's imports and namespace give it.
rules:

- rule: inherits_from_base_clause
  reads: file
  in: [source]
  match: {declaration: base_clause, filetype: php}
  emits: [{edge: {kind: inherits, from: enclosing_class, to: {from: qualified_name}}}]
  confidence: declared

- rule: implements_from_interface_clause
  reads: file
  in: [source]
  match: {declaration: class_interface_clause, filetype: php}
  emits: [{edge: {kind: implements, from: enclosing_class, to: {from: qualified_name}}}]
  confidence: declared

- rule: mixes_in_from_use_declaration
  reads: file
  in: [source]
  match: {declaration: use_declaration, filetype: php}
  emits: [{edge: {kind: mixes_in, from: enclosing_class, to: {from: qualified_name}}}]
  confidence: declared

# The twin of find_method: the same match, id and folders, so this_node is the method's node.
- rule: contains_method
  reads: file
  in: [source]
  match: {declaration: method_declaration, name_child: name, filetype: php}
  id:
    from: [enclosing_type, declared_name]
    template: "{enclosing_type}::{declared_name}"
  emits: [{edge: {kind: contains, from: enclosing_class, to: this_node}}]
  confidence: declared

# A call, from the function or method around it to the full name its written callee resolves to,
# at the call's line; unresolved when the project holds no such function or method. A plain call
# names a function. A static call, Class::method(), resolves the class through the imports and
# joins the method with ::, which is how find_method builds a method's id. A call on self, static
# or parent, a call on a variable and a call outside any function or method make nothing and go
# under skipped. A method call on an object, member_call_expression, is not stated: the class of
# $x in $x->m() is known only when the code runs. A function imported by use function x as y is
# not bound, because the imports bind type names only, so y() resolves under the namespace as y;
# and PHP's fallback of an unqualified call to a global function, as in strlen(), is not read.
# skip_names lists PHP's language constructs, as written: grammar 0.24.1 parses isset(, empty(,
# die( and eval( as function calls, and the rest are listed in case a release does too.
- rule: calls_function
  reads: file
  in: [source]
  match:
    reference: function_call_expression
    name_child: function
    filetype: php
    skip_names: [isset, empty, unset, list, array, echo, print, exit, die, eval, include, require,
      include_once, require_once]
  emits: [{edge: {kind: calls, from: enclosing_declaration, to: {types: [php.function], on_miss: unresolved}}}]
  confidence: declared

- rule: calls_static_method
  reads: file
  in: [source]
  match: {reference: scoped_call_expression, name_child: [scope, name], filetype: php}
  emits: [{edge: {kind: calls, from: enclosing_declaration, to: {types: [php.method], separator: "::", on_miss: unresolved}}}]
  confidence: declared
