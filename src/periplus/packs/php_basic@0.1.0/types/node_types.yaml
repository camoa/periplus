$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# The node types this pack declares. Finding them is in types/find_declarations.yaml.
#
# A function and a class may share a name in PHP, so functions and methods each have their own id
# namespace and do not share the class-likes' one.
node_types:

- name: php.class_like
  abstract: true
  id_namespace: php.type

- name: php.class
  parent: php.class_like

- name: php.interface
  parent: php.class_like

- name: php.trait
  parent: php.class_like

- name: php.enum
  parent: php.class_like

- name: php.callable
  abstract: true

- name: php.function
  parent: php.callable
  id_namespace: php.function

- name: php.method
  parent: php.callable
  id_namespace: php.method
