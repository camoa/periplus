$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A local variable inside a class method, $x = <value>, and the call made on it, $x->m() or
# $x?->m(). Each assignment to a plain variable keeps three internal nodes: the variable,
# <class>::<method>::$x, one for all its assignments in that method; the value, <class>::$x=<text
# written right of the =>, one per distinct text, joined from the variable by local_assigned; and,
# when the value is new Foo(), the type <class>::$x::<Foo resolved through the imports and
# namespace>, joined from the value by local_value_typed_as. A rule that knows what another kind of
# value gives reads the value's text with id_matches after local_assigned.
#
# The map rules give a call site of variable_calls.yaml its calls edge, inferred, when $x holds
# new Foo(): they look the method up on Foo and then its ancestors through extends. A method no
# class in the map declares, or a class outside the map, lands unresolved under the class.
#
# A variable with two different values in the method, new Foo() and new Bar(), or a new beside
# $x = make() or $x = $x ?? new Foo(), gets no edge: the map does not know which one holds at the
# call, so the call site stays without one. The same text assigned twice is one value.
#
# An assignment inside a closure or arrow function makes nothing here: the closure's variable is
# its own. A closure that captures the variable by reference, use (&$x), adds one more value, as it
# may assign the variable when it runs. No rule here types new self(), new static(), new parent()
# or new $class(), or reads a value set by foreach, list(), static or global.
node_types:
- name: php.local_variable
  description: "a local variable in a PHP method or function, one node for its assignments there"
  id_namespace: php.local_variable
  internal: true

- name: php.local_value
  description: "a value assigned to a local variable, as written, one node per distinct text"
  id_namespace: php.local_value
  internal: true

- name: php.local_type
  description: "the class a local variable gets from $x = new Foo()"
  id_namespace: php.local_type
  internal: true

edge_kinds:
- kind: local_assigned
  cause: none
  description: "the local variable is assigned that value somewhere in its method or function, one edge per distinct value"
  from: php.local_variable
  to: php.local_value

- kind: local_value_typed_as
  cause: none
  description: "the value assigned to a local variable is new of that class, $x = new Foo()"
  from: php.local_value
  to: php.local_type

rules:

- rule: find_local_variable
  reads: file
  in: [source]
  match: &local_match
    declaration: assignment_expression
    name_child: left
    filetype: php
    where:
    - name_matches: {child: left, pattern: &plain_variable '\$(?!this$)\w+'}
    - not_within: &closures [anonymous_function, arrow_function]
  id: &variable_id
    from: [enclosing_type, enclosing_method, declared_name]
    template: "{enclosing_type}::{enclosing_method}::{declared_name}"
  emits: [{node: {type: php.local_variable}}]
  confidence: declared

# The value and type ids leave the method out: an edge to a declared end whose id names the method
# gets no value. Two methods that assign one text to one name share the value and its type; the
# local_assigned edge starts at each method's own variable, so a call joins only its own method's.
- rule: find_local_value
  reads: file
  in: [source]
  match: *local_match
  id: &value_id
    from: [enclosing_type, declared_name, right]
    template: "{enclosing_type}::{declared_name}={right}"
  emits: [{node: {type: php.local_value}}]
  confidence: declared

- rule: local_assigned_value
  reads: file
  in: [source]
  match: *local_match
  id: *variable_id
  emits: [{edge: {kind: local_assigned, from: this_node, to: {declared: php.local_value}}}]
  confidence: declared

- rule: find_local_new_type
  reads: file
  in: [source]
  match: &new_match
    declaration: assignment_expression
    name_child: left
    filetype: php
    where:
    - name_matches: {child: left, pattern: *plain_variable}
    - name_matches: {child: right, pattern: '(?s)new\s+(?!(?i:self|static|parent)\b)\\?[A-Za-z_][\w\\]*\s*(?:\(.*\))?'}
    - not_within: *closures
  id:
    from: [enclosing_type, declared_name, {qualified: right}]
    template: "{enclosing_type}::{declared_name}::{right}"
  emits: [{node: {type: php.local_type}}]
  confidence: declared

- rule: local_value_typed_as
  reads: file
  in: [source]
  match: *new_match
  id: *value_id
  emits: [{edge: {kind: local_value_typed_as, from: this_node, to: {declared: php.local_type}}}]
  confidence: declared

# A closure that captures a variable by reference, use (&$x), may give it another value when it
# runs: the capture is one more value of the method's variable, <class>::$x=use (&$x), which no
# assignment writes.
- rule: find_variable_captured_by_reference
  reads: file
  in: [source]
  match: &capture_match
    declaration: by_ref
    name_child: [variable_name]
    filetype: php
    where: [{within: [anonymous_function_use_clause]}]
  id: *variable_id
  emits: [{node: {type: php.local_variable}}]
  confidence: declared

- rule: find_captured_by_reference_value
  reads: file
  in: [source]
  match: *capture_match
  id:
    from: [enclosing_type, declared_name]
    template: "{enclosing_type}::{declared_name}=use (&{declared_name})"
  emits: [{node: {type: php.local_value}}]
  confidence: declared

- rule: captured_by_reference_value
  reads: file
  in: [source]
  match: *capture_match
  id: *variable_id
  emits: [{edge: {kind: local_assigned, from: this_node, to: {declared: php.local_value}}}]
  confidence: declared

- rule: calls_through_local_new
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<class>[^:]+)::(?<meth>[^:]+)::\$(?<var>(?!this->)\w+)->(?<method>\w+))$'}]
    follow: &local_walk
    - node: 'php.local_variable::{class}::{meth}::${var}'
    - edge: local_assigned
    - id_matches: '(?s)^php\.local_value::(?<value>.+)$'
    - edge: local_value_typed_as
    - id_matches: '^php\.local_type::[^:]+::\$\w+::(?<type>(?<declarer>\\?[A-Za-z_][\w\\]*))$'
    - try:
      - node: 'php.type::{type}'
      - ancestors: [inherits]
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - node: 'php.method::{declarer}::{method}'
    - node: 'php.call_site::{site}'
    - edge: call_site_in
    unless_matched: &assigned_another_value
    - - node: 'php.local_variable::{class}::{meth}::${var}'
      - edge: local_assigned
      - id_matches: '(?s)^php\.local_value::(?!{value}$)'
  emits: &calls_edge [{edge: {kind: calls, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}}}]
  confidence: inferred

- rule: calls_through_local_new_nullsafe
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<class>[^:]+)::(?<meth>[^:]+)::\$(?<var>(?!this\?->)\w+)\?->(?<method>\w+))$'}]
    follow: *local_walk
    unless_matched: *assigned_another_value
  emits: *calls_edge
  confidence: inferred
