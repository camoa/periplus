$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A call $this->p->m() inside a trait method, through a property p the trait does not declare and
# a class that uses the trait declares with a type. Inside a trait, $this is the object of the
# class that uses it, so p is that class's property. For each class that uses the trait and
# declares p typed by a class name, the rule gives a calls edge, inferred, from the trait method to
# m on that type or its nearest ancestor through extends, at the call's line; two using classes
# with two types give two edges, each a true possibility. A type outside the map, or an m no mapped
# class declares, lands unresolved under the type. The call site is find_call_site's.
#
# A using class that does not declare p itself, or declares it with no type, gives no edge from
# that class. A trait that declares p itself is calls_through_typed_property's case, and this rule
# makes nothing for it. A class that uses the trait through another trait is not walked.
rules:

- rule: calls_through_user_typed_property
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<trait>[^:]+)::[^:]+::\$this->(?<member>\w+)->(?<method>\w+))$'}]
    follow:
    - node: 'php.type::{trait}'
    - incoming_edge: mixes_in
    - id_matches: '^php\.type::(?<user>.+)$'
    - node: 'php.property::{user}::${member}'
    - edge: property_typed_as
    - id_matches: '^php\.property_type::[^:]+::\$\w+::(?<type>(?<declarer>\\?[A-Za-z_][\w\\]*))$'
    - try:
      - node: 'php.type::{type}'
      - ancestors: [inherits]
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - node: 'php.method::{declarer}::{method}'
    - node: 'php.call_site::{site}'
    - edge: call_site_in
    unless:
    - [{node: 'php.property::{trait}::${member}'}]
  emits: [{edge: {kind: calls, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}}}]
  confidence: inferred
