$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A field instance read from its config file: one node rule and two edge rules, because a rule
# that emits an edge emits no node, and one field_of rule per bundle entity type. The storage and
# the bundle are named by the field's own keys.

rules:
- rule: field_instance_from_config
  reads: file
  in:
  - config
  - module_config
  match:
    file: field.field.*
    filetype: yaml
  id:
    from: file_stem
  emits:
  - node:
      type: drupal.field_instance
  - attribute:
      name: label
      from:
        key: label
  confidence: declared
- rule: field_instance_from_config_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: field.field.*
    filetype: yaml
  id:
    from: file_stem
  emits:
  - edge:
      kind: stored_by
      from: this_node
      to:
        from:
        - key: field_name
        - key: entity_type
        template: field.storage.{entity_type}.{field_name}
  confidence: declared
- rule: field_instance_block_type_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: field.field.*
    filetype: yaml
    where:
    - key:
        name: entity_type
        equals: block_content
  id:
    from: file_stem
  emits:
  - edge:
      kind: field_of
      from: this_node
      to:
        from:
        - key: entity_type
        - key: bundle
        template: '{entity_type}.type.{bundle}'
        type: drupal.block_type
  confidence: declared
