$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A validation constraint plugin declared by the Constraint attribute on its class, the twin of the
# annotation rule. Two rules because a rule that emits an edge emits no node. An id that is not a
# text literal makes no plugin and is listed under skipped.

rules:
- rule: constraint_from_attribute
  reads: file
  in:
  - constraint_classes
  match:
    attribute: Drupal\Core\Validation\Attribute\Constraint
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.constraint_plugin
  confidence: declared
- rule: constraint_from_attribute_edges
  reads: file
  in:
  - constraint_classes
  match:
    attribute: Drupal\Core\Validation\Attribute\Constraint
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
