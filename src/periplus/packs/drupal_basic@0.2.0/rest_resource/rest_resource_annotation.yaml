$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A REST resource plugin declared by the RestResource docblock annotation on its class. Two rules
# because a rule that emits an edge emits no node. An id that is not text in double quotes makes no
# plugin and is listed under skipped in the map report.

rules:
- rule: rest_resource_from_annotation
  reads: file
  in:
  - rest_resource_classes
  match:
    annotation: RestResource
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.rest_resource
  confidence: declared
- rule: rest_resource_from_annotation_edges
  reads: file
  in:
  - rest_resource_classes
  match:
    annotation: RestResource
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
