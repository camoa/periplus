$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# An AI agent plugin declared by the AiAgent attribute on its class. Two rules because a rule that
# emits an edge emits no node. An id that is not a text literal makes no plugin and is listed under
# skipped in the map report.

rules:
- rule: ai_agent_from_attribute
  reads: file
  in:
  - ai_agent_classes
  match:
    attribute: Drupal\ai_agents\Attribute\AiAgent
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.ai_agent
  confidence: declared
- rule: ai_agent_from_attribute_edges
  reads: file
  in:
  - ai_agent_classes
  match:
    attribute: Drupal\ai_agents\Attribute\AiAgent
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
