$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# An Advanced Queue job type plugin declared by the AdvancedQueueJobType attribute on its class. Two
# rules because a rule that emits an edge emits no node. An id that is not a text literal makes no
# plugin and is listed under skipped in the map report.

rules:
- rule: queue_job_type_from_attribute
  reads: file
  in:
  - queue_job_type_classes
  match:
    attribute: Drupal\advancedqueue\Attribute\AdvancedQueueJobType
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.queue_job_type
  confidence: declared
- rule: queue_job_type_from_attribute_edges
  reads: file
  in:
  - queue_job_type_classes
  match:
    attribute: Drupal\advancedqueue\Attribute\AdvancedQueueJobType
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
