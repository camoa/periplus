$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A block plugin declared by the Block docblock annotation on its class. It ends at the same type
# and id namespace as the attribute rule, so one plugin declared either way is the same node. An id
# that is not text in double quotes makes no plugin and is listed under skipped in the map report.

rules:
- rule: block_plugin_from_annotation
  reads: file
  in:
  - block_plugin_classes
  match:
    annotation: Block
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.block_plugin
  - attribute:
      name: admin_label
      from:
        annotation_key: admin_label
  confidence: declared
- rule: block_plugin_from_annotation_edges
  reads: file
  in:
  - block_plugin_classes
  match:
    annotation: Block
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
