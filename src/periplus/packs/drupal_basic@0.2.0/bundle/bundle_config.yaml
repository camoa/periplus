$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A bundle's configuration read from its config file, one rule per bundle entity type's config
# prefix: the provider module, the bundle entity type's config_prefix and the bundle. The block
# type is read by its own rule.

rules:
- rule: bundle_comment_from_config
  reads: file
  in:
  - config
  - module_config
  match:
    file: comment.type.*
    filetype: yaml
  id:
    from: file_stem
  emits:
  - node:
      type: drupal.bundle
  confidence: declared
