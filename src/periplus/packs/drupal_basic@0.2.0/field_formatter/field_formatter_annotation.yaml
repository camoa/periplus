$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A field formatter declared by the FieldFormatter docblock annotation on its class. An id that is
# not text in double quotes makes no formatter and is listed under skipped.

rules:
- rule: field_formatter_from_annotation
  reads: file
  in:
  - field_formatter_classes
  match:
    annotation: FieldFormatter
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.field_formatter
  - attribute:
      name: label
      from:
        annotation_key: label
  confidence: declared
- rule: field_formatter_from_annotation_edges
  reads: file
  in:
  - field_formatter_classes
  match:
    annotation: FieldFormatter
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
