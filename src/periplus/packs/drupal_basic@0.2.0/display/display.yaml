$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A display says how a bundle is edited or rendered, one config object per mode. A form display
# and a view display of one bundle carry the same internal id, so the id comes from the file name.

node_types:
- name: drupal.form_display
  parent: drupal.config_object
- name: drupal.view_display
  parent: drupal.config_object

edge_kinds:
- kind: displays
  from: [drupal.form_display, drupal.view_display]
  to: drupal.bundle
- kind: shows_field
  from: [drupal.form_display, drupal.view_display]
  to: drupal.field_instance
