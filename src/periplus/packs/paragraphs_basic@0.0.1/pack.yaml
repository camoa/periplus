$schema: "https://periplus.dev/schema/0/pack-manifest.schema.json"

# The Paragraphs contributed module: each paragraph type, from its config file, as the bundle
# paragraph.<id> with its label, a configured_by edge to that file and a bundle_of edge to the
# entity type paragraph.
# Paragraph and ParagraphsType join drupal_basic's table entity_classes, so drupal_basic's
# entity_class_static_call gives a static load, loadMultiple or create call on either an inferred
# uses_entity_type edge to its entity type.
#
# Known gaps: a paragraph type's behavior plugins, icon and description give nothing. The entity
# type paragraph is declared by the module's PHP, which is not mapped, so it stays referenced. A
# field's allowed paragraph types give no edge.
pack: paragraphs_basic
version: 0.0.1
depends: [drupal_basic]

add_table_rows:
  # The module's entity classes by fully qualified name, and the entity type id each declares,
  # read by drupal_basic's entity_class_static_call.
  drupal_basic:
    entity_classes:
      Drupal\paragraphs\Entity\Paragraph: paragraph
      Drupal\paragraphs\Entity\ParagraphsType: paragraphs_type
