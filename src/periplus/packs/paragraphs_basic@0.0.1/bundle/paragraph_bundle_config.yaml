$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A paragraph type read from its config file as the bundle paragraph.<id>, the id drupal_basic gives a field or
# display of it. Two rules: the node with its label, and its edges.

rules:
- rule: bundle_paragraph_from_config
  reads: file
  in:
  - config
  - module_config
  match:
    file: paragraphs.paragraphs_type.*
    filetype: yaml
  id:
    from: file_stem
    normalize:
    - {replace: '^paragraphs\.paragraphs_type\.', with: 'paragraph.'}
  emits:
  - node:
      type: drupal.bundle
  - attribute:
      name: label
      from:
        key: label
  confidence: declared
- rule: bundle_paragraph_from_config_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: paragraphs.paragraphs_type.*
    filetype: yaml
  id:
    from: file_stem
    normalize:
    - {replace: '^paragraphs\.paragraphs_type\.', with: 'paragraph.'}
  emits:
  - edge:
      kind: configured_by
      from: this_node
      to:
        from:
          key: id
        template: 'paragraphs.paragraphs_type.{id}'
  - edge:
      kind: bundle_of
      from: this_node
      to:
        from:
          key: id
        template: 'paragraph'
  confidence: declared
