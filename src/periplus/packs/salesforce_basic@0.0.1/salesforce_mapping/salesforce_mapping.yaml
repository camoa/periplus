$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A Salesforce mapping: a config entity that syncs one Drupal bundle with one Salesforce object.
# It refines the config object of its file, so it shares that node's id.

node_types:
- name: salesforce.mapping
  description: "A Salesforce mapping config, salesforce_mapping.salesforce_mapping.<id>, that syncs one Drupal bundle with one Salesforce object"
  parent: drupal.config_object

edge_kinds:
- kind: maps_bundle
  description: "The Salesforce mapping syncs that bundle, from its drupal_entity_type and drupal_bundle keys"
  from: salesforce.mapping
  to: drupal.bundle
- kind: maps_entity_type
  description: "The Salesforce mapping syncs entities of that entity type, from its drupal_entity_type key"
  from: salesforce.mapping
  to: drupal.entity_type
- kind: maps_field
  description: "Inferred: the Salesforce mapping lists that field instance under dependencies.config, which Salesforce writes from its field mappings"
  from: salesforce.mapping
  to: drupal.field_instance
