$schema: "https://periplus.dev/schema/0/pack-manifest.schema.json"

# The Salesforce contributed modules: their mapping field plugins, by annotation, each joined to
# its class by plugin_class; each mapping config file as a salesforce.mapping on its config node,
# with its Salesforce object and its push and pull standalone flags, a maps_bundle edge to
# <drupal_entity_type>.<drupal_bundle>, a maps_entity_type edge, and an inferred maps_field edge to
# each field instance its dependencies.config lists; and each SalesforceEvents constant a
# subscriber keys, as a salesforce.event, read as text through drupal_basic's drupal_php_text.
# MappedObject and SalesforceMapping join drupal_basic's table entity_classes, so drupal_basic's
# entity_class_static_call gives a static load, loadMultiple or create call on either an inferred
# uses_entity_type edge to its entity type.
#
# Known gaps:
# - The mapping field manager reads the generic Plugin annotation, so any class in the folder
#   below that carries a Plugin annotation is read as a mapping field. An id that is not text in
#   double quotes makes no plugin and is listed under skipped. The other Salesforce plugin types,
#   such as auth providers and pull queue workers, give nothing.
# - A mapping's field_mappings list is not read: a list source's each part names the key, not its
#   value. So a field mapped by a property path, such as field_my_date.value, which the
#   dependencies do not list, gives no maps_field edge, and nor does any mapping's Salesforce
#   field, direction or mapping field plugin. A mapping whose dependencies list no field instance,
#   as a webform submission mapping, is listed under skipped: fired and emitted nothing.
# - A mapping's sync triggers, pull settings and key give nothing. The auth provider config,
#   salesforce.salesforce_auth.*, and salesforce_logger.settings stay plain config objects.
# - An event is named by its constant as written, less any namespace. One used through an alias,
#   or as the event's own text, such as 'salesforce.pull_query', makes no event. drupal_basic's
#   event rules join a key of getSubscribedEvents to its listener method, by subscribed_by from
#   the referenced drupal.event::Drupal\salesforce\Event\SalesforceEvents::<CONST>, beside the
#   salesforce.event this pack names.
pack: salesforce_basic
version: 0.0.1
depends: [drupal_basic, php_basic]

folders:
  # The folder the mapping field manager discovers in, below a module's src folder.
  salesforce_mapping_field_classes: "{module_root}/src/Plugin/SalesforceMappingField/**"

add_table_rows:
  # The module's entity classes by fully qualified name, and the entity type id each declares,
  # read by drupal_basic's entity_class_static_call.
  drupal_basic:
    entity_classes:
      Drupal\salesforce_mapping\Entity\MappedObject: salesforce_mapped_object
      Drupal\salesforce_mapping\Entity\SalesforceMapping: salesforce_mapping
