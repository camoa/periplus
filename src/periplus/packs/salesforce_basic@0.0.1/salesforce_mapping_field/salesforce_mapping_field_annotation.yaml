$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A Salesforce mapping field plugin declared by the generic Plugin docblock annotation on its class,
# in the mapping field folder. Two rules because a rule that emits an edge emits no node. An id that
# is not text in double quotes makes no plugin and is listed under skipped in the map report.

rules:
- rule: salesforce_mapping_field_from_annotation
  reads: file
  in:
  - salesforce_mapping_field_classes
  match:
    annotation: Plugin
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.salesforce_mapping_field
  confidence: declared
- rule: salesforce_mapping_field_from_annotation_edges
  reads: file
  in:
  - salesforce_mapping_field_classes
  match:
    annotation: Plugin
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
