$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# The twin of local_types.yaml for a local variable inside a plain function, such as a hook in a
# .module file: $x = <value> and the call made on it, $x->m() or $x?->m(). The function holds its
# body, as variable_calls_in_function.yaml makes it, so each id here is the method twin's without
# the method part. Each assignment to a plain variable keeps the internal php.local_variable
# <function>::$x, one for all its assignments in that function, joined by local_assigned to the
# php.local_value <function>::$x=<text written right of the =>. local_types.yaml's value and type
# rules name no method, so they already mint that value and, for new Foo(), its php.local_type
# <function>::$x::<Foo resolved through the imports and namespace>; this file adds the variable,
# the edge to the value, and the joins.
#
# The map rules give a call site of variable_calls_in_function.yaml its calls edge, inferred, from
# the function, when $x holds new Foo(): they look the method up on Foo and then its ancestors
# through extends. A method no class in the map declares, or a class outside the map, lands
# unresolved under the class.
#
# A variable with two different values in the function, new Foo() and new Bar(), or a new beside
# $x = make(), gets no edge, and neither does a variable that is also a parameter of the function
# or of a closure or arrow function in it: the map does not know which one holds at the call, so
# the call site stays without one. The same text assigned twice is one value. An assignment inside
# a closure or arrow function makes nothing here, and a closure that captures the variable by
# reference, use (&$x), adds one more value, as local_types.yaml reads it.
node_types: []
edge_kinds: []

rules:

# holder: function_definition keeps a method's assignment to local_types.yaml alone.
- rule: find_function_local_variable
  reads: file
  in: [source]
  match: &local_match
    declaration: assignment_expression
    name_child: left
    filetype: php
    holder: function_definition
    where:
    - name_matches: {child: left, pattern: &plain_variable '\$(?!this$)\w+'}
    - not_within: [anonymous_function, arrow_function]
  id: &variable_id
    from: [enclosing_type, declared_name]
    template: "{enclosing_type}::{declared_name}"
  emits: [{node: {type: php.local_variable}}]
  confidence: declared

- rule: function_local_assigned_value
  reads: file
  in: [source]
  match: *local_match
  id: *variable_id
  emits: [{edge: {kind: local_assigned, from: this_node, to: {declared: php.local_value}}}]
  confidence: declared

# The function twins of local_types.yaml's capture by reference, use (&$x); its value rule names no
# method, so it already mints the value in a function.
- rule: find_function_variable_captured_by_reference
  reads: file
  in: [source]
  match: &capture_match
    declaration: by_ref
    name_child: [variable_name]
    filetype: php
    holder: function_definition
    where: [{within: [anonymous_function_use_clause]}]
  id: *variable_id
  emits: [{node: {type: php.local_variable}}]
  confidence: declared

- rule: function_captured_by_reference_value
  reads: file
  in: [source]
  match: *capture_match
  id: *variable_id
  emits: [{edge: {kind: local_assigned, from: this_node, to: {declared: php.local_value}}}]
  confidence: declared

# One :: before the variable, so a method's call site, <class>::<method>::$x->m, never matches.
- rule: calls_through_function_local_new
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<function>[^:]+)::\$(?<var>(?!this->)\w+)->(?<method>\w+))$'}]
    follow: &local_walk
    - node: 'php.local_variable::{function}::${var}'
    - edge: local_assigned
    - id_matches: '(?s)^php\.local_value::(?<value>.+)$'
    - edge: local_value_typed_as
    - id_matches: '^php\.local_type::[^:]+::\$\w+::(?<type>(?<declarer>\\?[A-Za-z_][\w\\]*))$'
    - try:
      - node: 'php.type::{type}'
      - ancestors: [inherits]
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - node: 'php.method::{declarer}::{method}'
    - node: 'php.call_site::{site}'
    - edge: call_site_in
    unless: &also_a_parameter
    - [{node: 'php.parameter::{function}::${var}'}]
    unless_matched: &assigned_another_value
    - - node: 'php.local_variable::{function}::${var}'
      - edge: local_assigned
      - id_matches: '(?s)^php\.local_value::(?!{value}$)'
  emits: &calls_edge [{edge: {kind: calls, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}}}]
  confidence: inferred

- rule: calls_through_function_local_new_nullsafe
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<function>[^:]+)::\$(?<var>(?!this\?->)\w+)\?->(?<method>\w+))$'}]
    follow: *local_walk
    unless: *also_a_parameter
    unless_matched: *assigned_another_value
  emits: *calls_edge
  confidence: inferred
