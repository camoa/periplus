$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# \A\B\Foo::class or Lib\Foo::class inside a function or method: a references_class edge from it
# to the class the qualified name names, resolved as PHP resolves a class name. A class the map
# does not hold is unresolved. \A\B\Foo::SOME_CONST makes nothing.
#
# Limits: a plain name, Foo::class, makes nothing. The tree gives Foo::class and Foo::SOME_CONST
# the same shape, two name children with no field, and a rule reads only the first, so it cannot
# keep ::class alone; after a qualified name the one name child is the part after ::.
# self::class, static::class, parent::class and $x::class make nothing. A qualified ::class in a
# class constant or a property default lists a skipped row: no enclosing declaration is mapped.
edge_kinds:

- kind: references_class
  from: [php.function, php.method]
  to: php.class_like

rules:

# \A\B\Foo::class and Lib\Foo::class. The first condition passes over a scope that is not a
# qualified name; the second keeps ::class, the name child after the qualified one.
- rule: references_class_qualified
  reads: file
  in: [source]
  match:
    reference: class_constant_access_expression
    name_child: [qualified_name]
    filetype: php
    where:
    - name_matches: {child: qualified_name, pattern: '.+'}
    - name_matches: {child: name, pattern: '(?i:class)'}
  emits: [{edge: {kind: references_class, from: enclosing_declaration, to: {types: [php.class_like], on_miss: unresolved}}}]
  confidence: declared
