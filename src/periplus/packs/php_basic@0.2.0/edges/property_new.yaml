$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A property of the object assigned a new of a written class, $this->helper = new Helper(), and a
# call through it, $this->helper->run(), to Helper::run. find_member_new_type keeps the created
# class on an internal node, <class>::$this-><name>::<full name>, the name resolved through the
# file's imports and namespace; member_new_typed_as joins the bundled php.member_assignment to it.
# The map rule walks from the call's class and its ancestors to an assignment of the property, then
# looks the method up on the created class and its ancestors, as calls_through_assigned_property
# does. A class outside the map, or a method no class in the map declares, lands unresolved under
# the created class.
#
# Inferred: another assignment may give the property another object. Each new of the property in
# the class or an ancestor gives its own edge, so new A() in one method and new B() in another give
# A::m and B::m. A property that also declares a type gets this edge beside
# calls_through_typed_property's: one edge when the two name the same class, two when the declared
# type is an interface or a parent of the created class.
#
# Limits: new self(), new static(), new parent(), an anonymous class and a class held in a variable
# give nothing here. A property assigned from a call or a variable gets nothing from these rules.
node_types:

- name: php.member_new_type
  description: "the class created by $this->name = new Foo(), named through the file's imports and namespace"
  id_namespace: php.member_new_type
  internal: true

edge_kinds:

- kind: member_new_typed_as
  description: "the assignment $this->name = new Foo() creates that class"
  from: php.member_assignment
  to: php.member_new_type

rules:

- rule: find_member_new_type
  reads: file
  in: [source]
  match: &member_new
    declaration: assignment_expression
    name_child: left
    filetype: php
    where:
    - name_matches: {child: left, pattern: '\$this->\w+'}
    - name_matches: {child: right, pattern: '(?s)new\s+(?!(?i:self|static|parent|class)\b)\\?[A-Za-z_][\w\\]*\s*(?:\(.*\))?'}
  id:
    from: [enclosing_type, declared_name, {qualified: right}]
    template: "{enclosing_type}::{declared_name}::{right}"
  emits: [{node: {type: php.member_new_type}}]
  confidence: declared

- rule: member_new_typed_as
  reads: file
  in: [source]
  match: *member_new
  id:
    from: [enclosing_type, declared_name]
    template: "{enclosing_type}::{declared_name}"
  emits: [{edge: {kind: member_new_typed_as, from: this_node, to: {declared: php.member_new_type}}}]
  confidence: declared

- rule: calls_through_property_assigned_new
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<class>[^:]+)::[^:]+::\$this->(?<member>\w+)->(?<method>\w+))$'}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - node: 'php.member_assignment::{owner}::$this->{member}'
    - edge: member_new_typed_as
    - id_matches: '^php\.member_new_type::[^:]+::\$this->\w+::(?<type>(?<declarer>\\?[A-Za-z_][\w\\]*))$'
    - try:
      - node: 'php.type::{type}'
      - ancestors: [inherits]
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - node: 'php.method::{declarer}::{method}'
    - node: 'php.call_site::{site}'
    - edge: call_site_in
  emits: [{edge: {kind: calls, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}}}]
  confidence: inferred
