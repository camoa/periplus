$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A method that replaces one its class inherits: overrides, from the child's method to the method
# of the nearest ancestor, through extends, that declares the same name. At each ancestor a method
# of a trait it uses comes before the ancestor's parents. A grandparent's method the middle class
# does not declare is the target. Both methods are declarations in the files, so the edge is
# declared. With it, what breaks if Base::step changes reaches Child::step, which a $this->step()
# call in Base does not show. method_nearest_declaration joins the method to that declaration on
# an internal slot node, one per method; method_overrides_ancestor, a pass later, emits the edge
# unless the declaration is private, which PHP does not treat as replaced.
#
# A method that implements an interface method, or replaces a method of a trait its own class
# uses, gets its edge from edges/implements_method.yaml. An ancestor that declares the method and
# also uses a trait that declares it gives the trait's method, though PHP keeps the class's own: a
# rule that reads the ancestor's own method before its traits would give the right one. No rule
# here gives an edge or a mark for a parent outside the map.
node_types:

- name: php.private_method
  description: "a private PHP method, kept so an ancestor's private method does not count as overridden"
  id_namespace: php.private_method
  internal: true

- name: php.method_slot
  description: "a method name on a class or trait, the step the overrides rule walks to find the nearest declaration"
  id_namespace: php.method_slot
  internal: true

edge_kinds:

- kind: overrides
  description: "the method replaces that same-named method of the nearest ancestor class, or of a trait its class uses"
  from: php.method
  to: php.method

- kind: nearest_declaration
  description: "the method joins the slot of the nearest ancestor that declares the same name, a step the overrides rule reads"
  from: php.method
  to: php.method_slot

rules:

# The private of a promoted constructor parameter, private X $x, belongs to the property.
- rule: find_private_method
  reads: file
  in: [source]
  match:
    declaration: visibility_modifier
    filetype: php
    where: [{has_child: private}, {not_within: [property_promotion_parameter]}]
  id: &slot_id
    from: [enclosing_type, enclosing_method]
    template: "{enclosing_type}::{enclosing_method}"
  emits: [{node: {type: php.private_method}}]
  confidence: declared

- rule: find_method_slot
  reads: file
  in: [source]
  match: {declaration: formal_parameters, filetype: php}
  id: *slot_id
  emits: [{node: {type: php.method_slot}}]
  confidence: declared

- rule: method_nearest_declaration
  reads: map
  match:
    node_type: php.method
    where: [{id_matches: '^php\.method::(?<class>[^:]+)::(?<method>\w+)$'}]
    follow:
    - node: 'php.type::{class}'
    - edge: inherits
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?<owner>.+)$'
    - try:
      - edge: mixes_in
      - id_matches: '^php\.type::(?<owner>.+)$'
      - node: 'php.method_slot::{owner}::{method}'
    - node: 'php.method_slot::{owner}::{method}'
  emits: [{edge: {kind: nearest_declaration, from: this_node, to: matched_node}}]
  confidence: declared

- rule: method_overrides_ancestor
  reads: map
  match:
    node_type: php.method
    where: [{id_matches: '^php\.method::(?<class>[^:]+)::(?<method>\w+)$'}]
    follow:
    - edge: nearest_declaration
    - id_matches: '^php\.method_slot::(?<owner>[^:]+)::\w+$'
    - node: 'php.method::{owner}::{method}'
    unless:
    - - edge: nearest_declaration
      - id_matches: '^php\.method_slot::(?<owner>[^:]+)::\w+$'
      - node: 'php.private_method::{owner}::{method}'
  emits: [{edge: {kind: overrides, from: this_node, to: matched_node}}]
  confidence: declared
