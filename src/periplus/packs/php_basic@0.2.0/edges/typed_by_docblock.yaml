- rule: calls_through_doc_param
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<class>[^:]+)::(?<meth>[^:]+)::\$(?<var>(?!this->)\w+)->(?<method>\w+))$'}]
    follow: &method_param_walk
    - node: 'php.parameter::{class}::{meth}::${var}'
    - node: 'php.method::{class}::{meth}'
    - edge: method_doc_param_name
    - id_matches: '^php\.doc_param_name::[^:]+::[^:]+::(?<pos>\d+)::\${var}$'
    - node: 'php.method::{class}::{meth}'
    - edge: method_doc_param_type
    - id_matches: '^php\.doc_param_type::[^:]+::[^:]+::{pos}::(?<type>(?<declarer>[A-Za-z_][\w\\]*))$'
    - try: &on_type
      - node: 'php.type::{type}'
      - ancestors: [inherits]
      - id_matches: '^php\.type::(?<declarer>.+)$'
      - node: 'php.method::{declarer}::{method}'
    - node: 'php.call_site::{site}'
    - edge: call_site_in
    unless: &method_param_unless
    - [{node: 'php.signature_typed::{class}::{meth}::${var}'}]
    - [{node: 'php.local_variable::{class}::{meth}::${var}'}]
    unless_matched: &method_named_twice
    - - node: 'php.method::{class}::{meth}'
      - edge: method_doc_param_name
      - id_matches: '::(?!{pos}::)\d+::\${var}$'
  emits: &calls_edge [{edge: {kind: calls, from: matched_node, to: {template: '{declarer}::{method}', types: [php.method], on_miss: unresolved}}}]
  confidence: inferred

- rule: calls_through_doc_param_nullsafe
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<class>[^:]+)::(?<meth>[^:]+)::\$(?<var>(?!this\?->)\w+)\?->(?<method>\w+))$'}]
    follow: *method_param_walk
    unless: *method_param_unless
    unless_matched: *method_named_twice
  emits: *calls_edge
  confidence: inferred

# One :: before the variable, so a method's call site never matches.
- rule: calls_through_function_doc_param
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<function>[^:]+)::\$(?<var>(?!this->)\w+)->(?<method>\w+))$'}]
    follow: &function_param_walk
    - node: 'php.parameter::{function}::${var}'
    - node: 'php.function::{function}'
    - edge: function_doc_param_name
    - id_matches: '^php\.doc_param_name::[^:]+::(?<pos>\d+)::\${var}$'
    - node: 'php.function::{function}'
    - edge: function_doc_param_type
    - id_matches: '^php\.doc_param_type::[^:]+::{pos}::(?<type>(?<declarer>[A-Za-z_][\w\\]*))$'
    - try: *on_type
    - node: 'php.call_site::{site}'
    - edge: call_site_in
    unless: &function_param_unless
    - [{node: 'php.signature_typed::{function}::${var}'}]
    unless_matched: &function_named_twice
    - - node: 'php.function::{function}'
      - edge: function_doc_param_name
      - id_matches: '::(?!{pos}::)\d+::\${var}$'
  emits: *calls_edge
  confidence: inferred

- rule: calls_through_function_doc_param_nullsafe
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<function>[^:]+)::\$(?<var>(?!this\?->)\w+)\?->(?<method>\w+))$'}]
    follow: *function_param_walk
    unless: *function_param_unless
    unless_matched: *function_named_twice
  emits: *calls_edge
  confidence: inferred

# The chains under unless_matched stop the edge when $x has another @var type in the method, two
# different values, a new Bar() value, or a $this->m() value whose method declares a return type,
# as calls_through_local_this_call reads it.
- rule: calls_through_doc_var
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<class>[^:]+)::(?<meth>[^:]+)::\$(?<var>(?!this->)\w+)->(?<method>\w+))$'}]
    follow: &doc_var_walk
    - node: 'php.doc_var_name::{class}::{meth}::${var}::${var}'
    - edge: doc_var_typed_as
    - id_matches: '^php\.doc_var_type::.+::(?<type>(?<declarer>[A-Za-z_][\w\\]*))$'
    - try: *on_type
    - node: 'php.call_site::{site}'
    - edge: call_site_in
    unless_matched: &doc_var_unless
    - - node: 'php.doc_var_name::{class}::{meth}::${var}::${var}'
      - edge: doc_var_typed_as
      - id_matches: '::(?!{type}$)[^:]+$'
    - - node: 'php.local_variable::{class}::{meth}::${var}'
      - edge: local_assigned
      - id_matches: '(?s)^php\.local_value::(?<first>.+)$'
      - node: 'php.local_variable::{class}::{meth}::${var}'
      - edge: local_assigned
      - id_matches: '(?s)^php\.local_value::(?!{first}$)'
    - - node: 'php.local_variable::{class}::{meth}::${var}'
      - edge: local_assigned
      - edge: local_value_typed_as
    - - node: 'php.local_variable::{class}::{meth}::${var}'
      - edge: local_assigned
      - id_matches: '^php\.local_value::[^:]+::\$\w+=\$this->(?<inner>\w+)\s*\([^()]*(?:\([^()]*\)[^()]*)*\)$'
      - node: 'php.type::{class}'
      - ancestors: [inherits, mixes_in]
      - id_matches: '^php\.type::(?<owner>.+)$'
      - node: 'php.method::{owner}::{inner}'
      - edge: returns_type
  emits: *calls_edge
  confidence: inferred

- rule: calls_through_doc_var_nullsafe
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>(?<class>[^:]+)::(?<meth>[^:]+)::\$(?<var>(?!this\?->)\w+)\?->(?<method>\w+))$'}]
    follow: *doc_var_walk
    unless_matched: *doc_var_unless
  emits: *calls_edge
  confidence: inferred
