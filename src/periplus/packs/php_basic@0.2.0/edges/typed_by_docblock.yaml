$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Types written in comments, and the calls they type.
#
# A @param line of the docblock before a method or a function, @param Foo $x, with the type written
# Foo, ?Foo, Foo|null or null|Foo. The rules count the docblock's @param lines in order and read the
# first five: the k-th that names a class keeps an internal php.doc_param_type,
# <class>::<method>::<k>::<Foo resolved through the imports and namespace>, and an internal
# php.doc_param_name, <class>::<method>::<k>::$x, each joined from the method; in a plain function
# the function's full name stands for <class>::<method>. The map rules give a call $x->m() or
# $x?->m() of variable_calls.yaml or variable_calls_in_function.yaml its calls edge, inferred, when
# $x is a parameter of that method or function and the @param at the same k names it: they look m up
# on the type and then its ancestors through extends. A method no class in the map declares, or a
# type outside the map, lands unresolved under the type.
#
# A parameter with a type in its signature, of any kind, keeps an internal php.signature_typed node,
# and the @param adds nothing for it. A @param for a name the signature lacks, a second @param for
# the same name, a variadic ...$x, a scalar, mixed, Foo[], array<Foo>, a generic, Foo|Bar, and a
# name with a backslash inside and none in front, Lib\Foo, give no edge. In a method, a parameter
# assigned anywhere in its body gives none either, as in variable_calls.yaml.
#
# A @var line in the docblock just before an assignment in a method, /** @var Foo $x */ $x = ...; or
# /** @var Foo */ $x = ...;, or before a foreach, /** @var Foo $x */ foreach (...): the variable
# keeps an internal php.doc_var_name, <class>::<method>::$x::$x, joined by doc_var_typed_as to an
# internal php.doc_var_type of the name resolved through the imports and namespace,
# <class>::$x::<type> for an assignment and <class>::<type> for a foreach. The comment must sit just
# before the statement, so one written after the assignment types the next statement when that one
# assigns the same variable. A foreach takes the variable the @var names, which the foreach is taken
# to bind. The map rules give a call on $x in that method its calls edge, inferred, by the same
# lookup. No edge comes when the map cannot tell which type holds at the call: a second @var with
# another type for $x, a local with two different values in the method, or one whose value already
# types it, new Bar() or a $this->m() with a declared return type. A @var, and a parameter's
# signature type, inside a closure or arrow function make nothing here.
node_types:
- name: php.doc_param_type
  id_namespace: php.doc_param_type
  internal: true

- name: php.doc_param_name
  id_namespace: php.doc_param_name
  internal: true

- name: php.signature_typed
  id_namespace: php.signature_typed
  internal: true

- name: php.doc_var_type
  id_namespace: php.doc_var_type
  internal: true

- name: php.doc_var_name
  id_namespace: php.doc_var_name
  internal: true

edge_kinds:
- kind: method_doc_param_type
  from: php.method
  to: php.doc_param_type

- kind: method_doc_param_name
  from: php.method
  to: php.doc_param_name

- kind: function_doc_param_type
  from: php.function
  to: php.doc_param_type

- kind: function_doc_param_name
  from: php.function
  to: php.doc_param_name

- kind: doc_var_typed_as
  from: php.doc_var_name
  to: php.doc_var_type

rules:

# The k-th rule of each pair skips k-1 @param lines from the docblock's start, so the type and the
# name of one pair always come from the same line.

- rule: find_method_doc_param_type_1
  reads: file
  in: [source]
  match: {declaration: method_declaration, name_child: name, filetype: php}
  id:
    from: [enclosing_type, declared_name, {qualified: {docblock: '(?s)\A(?:(?!@param\b).)*@param\s+\??(?i:null\|)?(?<type>(?!(?i:string|int|float|bool|boolean|integer|double|array|iterable|callable|mixed|object|void|null|false|true|self|static|parent|resource|never)\b)(?:\\[A-Za-z_][A-Za-z0-9_\\]*|[A-Za-z_][A-Za-z0-9_]*))(?i:\|null)?\s+(?:&\s*)?\$\w+'}}]
    template: "{enclosing_type}::{declared_name}::1::{type}"
  emits: [{node: {type: php.doc_param_type}}]
  confidence: declared

- rule: method_doc_param_type_1
  reads: file
  in: [source]
  match: {declaration: method_declaration, name_child: name, filetype: php}
  id:
    from: [enclosing_type, declared_name, {qualified: {docblock: '(?s)\A(?:(?!@param\b).)*@param\s+\??(?i:null\|)?(?<type>(?!(?i:string|int|float|bool|boolean|integer|double|array|iterable|callable|mixed|object|void|null|false|true|self|static|parent|resource|never)\b)(?:\\[A-Za-z_][A-Za-z0-9_\\]*|[A-Za-z_][A-Za-z0-9_]*))(?i:\|null)?\s+(?:&\s*)?\$\w+'}}]
    template: "{enclosing_type}::{declared_name}::1::{type}"
  emits: [{edge: {kind: method_doc_param_type, from: {declared: php.method}, to: this_node}}]
  confidence: declared

