$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# The node types this pack declares. Finding them is in types/find_declarations.yaml.
#
# A function and a class may share a name in PHP, so functions and methods each have their own id
# namespace and do not share the class-likes' one.
node_types:

- name: php.class_like
  abstract: true
  id_namespace: php.type

- name: php.class
  parent: php.class_like

- name: php.interface
  parent: php.class_like

- name: php.trait
  parent: php.class_like

- name: php.enum
  parent: php.class_like

- name: php.callable
  abstract: true

- name: php.function
  parent: php.callable
  id_namespace: php.function

- name: php.method
  parent: php.callable
  id_namespace: php.method

# The parts of a call through a property of the enclosing object, $this->mailer->send(), that
# edges/find_structure.yaml joins in the map rule calls_through_assigned_property. Each is found at
# its own line by a rule in types/find_declarations.yaml; its id is shaped there.
- name: php.property
  id_namespace: php.property

- name: php.parameter
  id_namespace: php.parameter

- name: php.parameter_type
  id_namespace: php.parameter_type

- name: php.member_assignment
  id_namespace: php.member_assignment

- name: php.member_assignment_value
  id_namespace: php.member_assignment_value

- name: php.call_site
  id_namespace: php.call_site
