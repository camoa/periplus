$schema: "https://periplus.dev/schema/0/pack-manifest.schema.json"

# The basic PHP pack: every class, interface, trait, enum, function and method becomes a node under
# its full name, and a class-like gets its inherits, implements, mixes_in and contains edges. A
# function or method also gets a calls edge for each $this->m() it holds, inferred, an instantiates
# edge for each new of a written class, self or static, and a references_class edge for each
# Foo::class, \A\B\Foo::class or Lib\Foo::class. A call on a variable, $x->m(), in a method or a
# function keeps a call site, with an inferred calls edge when the variable is a typed parameter, a
# parameter a @param types, a local assigned new Foo(), $this->m() or another typed call's result, a
# local a @var types, a catch variable, or a property assigned new Foo() or $this->m() of a declared
# return type, and a variable or property an instanceof test settles, in the block an if guards or
# after an early return or assert. A $this->p->m() in a trait joins m on the type of p in each
# class that uses the trait and declares p. A chain of up to three calls from $this, or two from a typed property, through
# declared return types, static among them, joins its last call. A $this->m() inside a trait also
# joins the m() of each class that uses it, a method that replaces an inherited one or one of its
# own class's traits gets an overrides edge to it, and a method that implements an interface method
# gets an implements_method edge. A method or function gets a has_parameter edge to each parameter
# outside a closure, and a class a declares_property edge to each property a promoted constructor
# parameter makes. A global written or read through $GLOBALS['name'] is a php.global
# node, with a writes_global or reads_global edge from the function or method that uses it.
#
# Not mapped yet. A call to a function PHP itself defines, such as strlen() or json_decode(), makes
# nothing: the rule calls_function lists the 2150 names get_defined_functions()['internal']
# returned in one run of PHP 8.5.11 (cli, NTS), beside PHP's language constructs; exit and die are
# in both and listed once. That run loaded
# these extensions: Core, date, lexbor, openssl, pcre, sqlite3, zlib, bcmath, bz2, calendar, ctype,
# curl, dba, uri, json, mbstring, SPL, FFI, fileinfo, filter, ftp, gd, gettext, gmp, hash, iconv,
# intl, session, ldap, standard, libxml, mysqlnd, mysqli, odbc, Zend OPcache, pcntl, PDO,
# pdo_dblib, pdo_mysql, PDO_ODBC, pdo_pgsql, pdo_sqlite, pgsql, Phar, posix, random, readline,
# Reflection, exif, shmop, SimpleXML, snmp, soap, sockets, sodium, sysvmsg, sysvsem, sysvshm, tidy,
# tokenizer, dom, xml, xmlreader, xmlwriter, xsl, zip. A function of an extension not loaded there
# is not listed.
#
# False results:
# - The names are compared with the text as written. A builtin called with a leading backslash,
#   \strlen(), or in another letter case, StrLen(), still gives an unresolved function node.
# - A function the project declares under a builtin name, function strlen() in its namespace, gets
#   no calls edge from an unqualified call to it: the name is in calls_function's skip list.
# - An unqualified call inside a namespace tries the namespaced name first and the global one
#   second, as PHP does. When the map holds neither, the call is unresolved under its global name,
#   so a namespaced function outside the map, called unqualified, is filed under the global name.
# - A use function alias does not bind: y() after use function x as y resolves as y.
# - Drupal's global functions, such as t(), drupal_flush_all_caches() and theme_get_setting(), are
#   not PHP builtins: a call to one still gives an unresolved function node, under its global name.
# - A static:: call is read as self::, though PHP binds static to the class the call runs on, and
#   inside a trait self:: and static:: name the trait, not the class that uses it.
# - A $this->m() call in a parent class to a method a child overrides lands on the parent's
#   method; the overrides edge joins the child's method to it. A method no mapped class or
#   ancestor declares lands unresolved under the calling class. new static() is read as the
#   enclosing class.
#
# Missing results:
# - A global named by the global statement, global $name, gets no writes_global or reads_global
#   edge, nor does $GLOBALS['name'] read as an array element, a foreach subject or a part of a
#   double-quoted string, nor $GLOBALS[$name].
# - A call on a variable gets no calls edge, and keeps its php.call_site node, when no rule knows
#   the variable's class: a foreach variable no @var types, an untyped parameter no @param types, a
#   local assigned a call no rule types, and a local with two different values in its method or
#   function. No rule reads a union parameter or return type, or a property typed by a union of
#   two or more class names, Helper|Other, nor a call in a parent class through a property only a
#   child assigns, nor a call at file level. An instanceof test joined by && or ||, in a ternary or
#   an arrow function, or followed by continue or break, settles nothing. The rule files' headers
#   name the rest.
# - No rule gives an overrides edge to a method of an ancestor outside the map.
# - A trait's $this->m() joins a subclass's own m() only one or two levels below the using class,
#   and an m() of another trait the class uses not at all.
# - A call whose method name or callee is a variable, $x->$name(), $x?->$name(), self::$name() or
#   $fn(), gets no calls edge: inside a class method it keeps a php.call_site node marked
#   resolution: runtime (types/find_runtime_calls.yaml); elsewhere a method name makes nothing. A
#   function callee that is not a written name, $fn(), f()() or $a['k'](), anywhere, also lists
#   the skipped row "function is not a written name" (calls_function_not_a_name).
# - A parent:: call in a class with no extends clause gets no calls edge; it keeps its
#   php.call_site node.
# - new parent(), an anonymous class and a class name built by an expression, new ($x)() or
#   new $this->cls(), make no instantiates edge. new $class() gets none either: inside a class
#   method it keeps a php.call_site node marked resolution: runtime. A new outside any function or
#   method, as in an attribute or a property default, lists a skipped row.
# - self::class, static::class, parent::class and $x::class make no references_class edge. A
#   ::class outside any function or method lists a skipped row.
# - A property whose @var names a class with a backslash inside and none in front, @var
#   Lib\Mailer, gets no found php.property_type node. edges/var_type_as_written.yaml gives it an
#   inferred property_typed_as edge to a referenced php.property_type end, and joins a call through
#   it to the name as written when the map holds it, else to the name resolved through the namespace
#   and imports; calls_through_typed_property does not read that edge.
pack: php_basic
version: 0.2.0
depends: []

# Detected by PHP source at the project folder or in src, never by composer.json alone: a framework
# project holds one too, and its rutter loads this one through depends.
detect:
  any_of:
    - path: "*.php"
    - path: "src/*.php"
    - path: "src/*/*.php"

# Pinned exactly: the rules name tree node types, and those can change across grammar releases.
grammar:
  provider: tree-sitter
  provider_version: "0.26.0"
  language: php
  grammar_version: "0.24.1"

# The whole project at any depth; a dependent pack or the project settings narrows it.
folders:
  source: ./**

files:
  extensions: [php]
  # A tests folder holds tests and fixtures: mapped, and printed after the rest.
  supporting: ['**/tests/**']
  exclude:
  - '**/vendor/**'
  - '**/node_modules/**'

# How a full name is built, read by the engine as data. namespace names the tree node that
# declares a namespace and the field holding its name; written_names are the tree node types of a
# name written in source, such as the names after extends.
identity:
  qualified_name:
    parts: [namespace, declared_name]
    separator: "\\"
  namespace:
    declaration: namespace_definition
    name_child: name
  written_names: [name, qualified_name, namespace_name]
  # How a written name becomes a full one, the first step that holds giving it: a name with a
  # leading backslash is full without it; a name whose first segment a use of its namespace block
  # binds takes the used path in place of that segment; any other name takes the namespace.
  resolve:
  - full_if_prefixed: "\\"
  - bound_first_segment
  - prefix_with: namespace
  # How an attribute is written: its node, the list that holds it on a declaration, the field of
  # its arguments, one argument and the field of its name, and the text literals with the node of
  # their text.
  attribute:
    node: attribute
    list: attribute_list
    arguments: parameters
    argument: argument
    argument_name: name
    literals: [string, encapsed_string]
    literal_content: string_content
  # A call's arguments: their field, one argument and the field of its name, and the text
  # literals with the node of their text. view('a') holds 'a' at position 0.
  call_arguments: arguments
  call_argument: argument
  call_argument_name: name
  call_literals: [string, encapsed_string]
  call_literal_content: [string_content]
  # The tree node type of a comment; a docblock is the comment just before a declaration.
  comment: comment
