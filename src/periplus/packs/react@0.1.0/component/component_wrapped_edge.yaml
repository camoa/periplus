$schema: https://periplus.dev/schema/0/pack-file.schema.json

# The module's edge to the component that component_wrapped finds.

rules:
- rule: component_edge_wrapped
  reads: file
  in: [typescript_source]
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: '(?m)^[ \t]*(?:export\s+)?const\s+(?<name>(?=\w*[a-z])[A-Z]\w*)\b(?:\s*:\s*[^=\n]+)?\s*=\s*(?:React\.)?(?:forwardRef|memo)\b'
  id: {template: '{module}'}
  line: {capture: name}
  emits: [{edge: {kind: declares_component, from: this_node, to: {template: '{module}:{name}'}}}]
  confidence: inferred
