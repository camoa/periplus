$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A const wrapped in forwardRef or memo, which only a component is.

rules:
- rule: component_node_wrapped
  reads: file
  in: [typescript_source]
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: '(?m)^[ \t]*(?:export\s+)?const\s+(?<name>(?=\w*[a-z])[A-Z]\w*)\b(?:\s*:\s*[^=\n]+)?\s*=\s*(?:React\.)?(?:forwardRef|memo)\b'
  id: {template: '{module}:{name}'}
  line: {capture: name}
  emits: [{node: {type: react.component}}]
  confidence: inferred
