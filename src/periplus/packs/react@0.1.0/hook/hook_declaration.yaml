$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A function declaration named as a hook: its node, and the module's edge to it, from one match.
# A component or hook declared inside another function takes that function's name in its id
# (`module:Outer:Name`), so two nested declarations with one name in one file stay apart.

rules:
- rule: hook_node_declaration
  reads: file
  in: [typescript_source]
  match: &hook_declaration_match
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: '(?m)^[ \t]*(?:export\s+)?(?:default\s+)?(?:async\s+)?function\s*\*?\s+(?<name>use[A-Z]\w*)\b'
  values: &nested_name
    outer: {from: {enclosing: function_body, capture: name, excluding_own: true}, join: ':'}
    qualified: {template: '{outer}:{name}', normalize: [{replace: '^:', with: ''}]}
  id: {template: '{module}:{qualified}'}
  line: {capture: name}
  emits: [{node: {type: react.hook}}]
  confidence: inferred
- rule: hook_edge_declaration
  reads: file
  in: [typescript_source]
  match: *hook_declaration_match
  values: *nested_name
  id: {template: '{module}'}
  line: {capture: name}
  emits: [{edge: {kind: declares_hook, from: this_node, to: {template: '{module}:{qualified}'}}}]
  confidence: inferred
