$schema: "https://periplus.dev/schema/0/pack-manifest.schema.json"

# Known gaps. The basic JavaScript pack maps each function that has a name of its own, as a
# node named <script path>:<name>: function name() {}, async function name() {}, and a const,
# let or var whose value is an arrow function or a function expression. A function assigned to a
# dotted name, A.b.c = function () {} or A.b.c = () => {}, is a js.member_function node (member/):
# named by the dotted name alone, A.b.c, when the table shared_objects holds A, such as window,
# and else named in its script, <script path>:A.b.c. A function written directly in an object
# literal assigned to a dotted name, A.b = { open() {}, close: function () {} }, is named the same
# way, A.b.open or <script path>:A.b.open. Each line below was seen on real code or on a planted
# file. Each script is a js.file node named by its path, and each function above has a
# script_declares_function edge from its script.
# Calls: f() is a js_calls edge to <script path>:f; a.b.c() is a js_calls edge to the member
# function a.b.c, and to the member function <script path>:a.b.c of the calling script, when one
# is mapped. When shared_objects holds a and builtin_objects does not, a call no script assigns is
# a js_calls edge to one unresolved member function a.b.c for every script; any other a.b.c() is
# nothing. A dotted name split over lines, a\n  .b(), is read as a.b, up to three parts. Each edge
# starts at the nearest named or member function that holds the call, else at the script; a rutter
# that depends on this one may name a node of its own that holds the call (encloses_for).
# What it does not map, today:
# - A call to a JavaScript or browser global the table globals holds, such as parseInt(),
#   setTimeout() or fetch(): no edge and no node, unless the script declares a function of that
#   name, which the call reaches. import(): nothing. A call to a name the table library_globals
#   holds, which a rutter for a library adds, is one unresolved function named by the table's
#   value for every script, unless the script declares a function of that name. No edge joins it
#   to its library.
# - A member call on an object shared_objects does not hold, or builtin_objects holds, to a name
#   no member function has, such as console.log(), document.querySelector(), e.x() or this.x(): no
#   edge, no node and no skipped row. So is a method called on a call, an index, a new object or an
#   array, $('.x').hide() or a[0].m(), a call through ?. or a private name, a dotted name of four
#   parts or more split over lines, and a function called where it is written,
#   (function () {})(). A callee computed at run time, a[i](), f()() or (c ? f : g)(): no edge,
#   and a row of the map report's matches skipped. A parenthesis that holds an arrow anywhere is
#   taken as a function called where it is written, so (c ? () => 1 : g)() gives no row.
# - A js_calls edge to a member function, or to a function of the script named like a global,
#   sits at the line of the function or the script it starts at, not at the call: a map rule
#   places it. A call from a member function named by its dotted name alone to a member function
#   named in the script sits at the line of the script.
# - A function assigned to a dotted name whose first part shared_objects does not hold, such as an
#   application's own global object, App.x = function () {}, is named in its script, so a call
#   App.x() in another script gives no edge. A project adds the name to shared_objects under
#   add_table_rows, from a pack of its own.
# - A call to a function another script declares: it stays an unresolved end named in the
#   calling script, <script path>:<name>.
# - A generator, function* name() {}, a class and a class method: no node. A class ends the walk
#   to the object around it, so a class written inside a member function of A.b = {...} gives its
#   methods no node.
# - A dotted name that starts at this, this.x = function () {}: no node. A[k] = function () {},
#   an object literal assigned to a variable, var A = { open() {} }, and one nested inside another,
#   A.b = { c: { open() {} } }: no node. In the object literal, a key written as a quoted text or
#   computed, and an arrow function as a value, { name: () => {} }: no node. A call inside one of
#   these starts at the nearest named function that holds it, or at the script if none does. A
#   function passed as an argument: no node.
# - A function declared inside another gets the same kind of id, so two functions of one name in
#   one script are one node holding both locations. Two scripts that assign one dotted name named
#   without its script, or write it in an object literal, give one member function holding both
#   locations.
# - An import or an export: no rule. A script in a .mjs, .cjs, .jsx or .ts file is not read.
# - The script path is the path from the project folder, so the same script mapped from another
#   folder gets another id.
# - A function assigned to P.x, or written in an object literal assigned to P.x, where the table
#   excluded_objects holds P: no member function. A rutter that adds P maps it, and its node may be
#   where the calls inside start. A function assigned to P.x.y stays a member function. A call to
#   P.x.y on a shared object makes no unresolved member function: that rutter marks it.
# The grammar is a dependency of periplus-map, pinned at tree-sitter-javascript 0.25.0. With
# another version installed, periplus map stops with a problem that names the pin.
pack: js_basic
version: 0.0.1
depends: []
grammar:
  provider: tree-sitter
  provider_version: "0.26.0"
  language: javascript
  grammar_version: "0.25.0"
# The whole project at any depth; a dependent pack or the project settings narrows it.
folders:
  js_source: ./**
files:
  exclude: ['**/node_modules/**']
  types:
    javascript:
      endings: [js]
      reader: tree
      path_values:
        # A script is named by its path from the project folder.
        script:
          pattern: '^(?<file>.+)$'
          template: '{file}'
identity:
  # A full name is the script's path, a colon, and the declared name.
  qualified_name:
    parts: [namespace, declared_name]
    separator: ":"
  namespace:
    path_value: script
  written_names: [identifier]
  # f() names <script path>:f.
  resolve: [prefix_bare_with: namespace]
# The JavaScript and browser global functions, each the value of its own key. function_call skips
# a call to one, and function_call_named_like_global joins it to a function of that name the
# script declares. A rutter for a library adds the library's globals under add_table_rows, each the
# value of its own key too.
tables:
  globals: {setTimeout: setTimeout, setInterval: setInterval, clearTimeout: clearTimeout,
    clearInterval: clearInterval, setImmediate: setImmediate, clearImmediate: clearImmediate,
    queueMicrotask: queueMicrotask, requestAnimationFrame: requestAnimationFrame,
    cancelAnimationFrame: cancelAnimationFrame, requestIdleCallback: requestIdleCallback,
    cancelIdleCallback: cancelIdleCallback, parseInt: parseInt, parseFloat: parseFloat,
    isNaN: isNaN, isFinite: isFinite, String: String, Number: Number, Boolean: Boolean,
    Array: Array, Object: Object, Date: Date, Symbol: Symbol, BigInt: BigInt, Promise: Promise,
    Map: Map, Set: Set, WeakMap: WeakMap, WeakSet: WeakSet, RegExp: RegExp, Error: Error,
    TypeError: TypeError, RangeError: RangeError, Function: Function, eval: eval,
    encodeURIComponent: encodeURIComponent, decodeURIComponent: decodeURIComponent,
    encodeURI: encodeURI, decodeURI: decodeURI, fetch: fetch, alert: alert, confirm: confirm,
    prompt: prompt, require: require, structuredClone: structuredClone, atob: atob, btoa: btoa,
    getComputedStyle: getComputedStyle, matchMedia: matchMedia}
  # The objects every script on a page reaches by one name: the global object under its three
  # names, and the page's document. A function assigned to a dotted name that starts with one of
  # them is one member function for every script (member/member_function.yaml). A rutter for a
  # library adds the library's global objects under add_table_rows, each the value of its own key.
  shared_objects: {window: window, globalThis: globalThis, self: self, document: document}
  # The objects of shared_objects that the language or the browser defines. A call to a member of
  # one that no mapped script assigns makes nothing, so the DOM's methods leave no node
  # (member/member_call.yaml); a call on an object shared_objects holds and this table does not is
  # an unresolved member function when no script assigns it.
  builtin_objects: {window: window, globalThis: globalThis, self: self, document: document}
  # A global function a library defines, as written, to the name an unresolved call to it takes, so
  # the calls of every script meet one node (function/function.yaml). A rutter for the library adds
  # its rows under add_table_rows.
  library_globals: {}
  # Dotted object names whose functions a rutter that depends on this one maps instead, each the
  # value of its own key: a function assigned to <name>.x, or written in an object literal assigned
  # to <name>.x, makes no member function (member/member_function.yaml), and a call to <name>.x.y
  # makes no unresolved one (member/member_call.yaml). Empty here; that rutter adds its rows under
  # add_table_rows.
  excluded_objects: {}
