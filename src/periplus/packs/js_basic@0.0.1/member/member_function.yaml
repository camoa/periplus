$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A function assigned to a member of an object that is reached by a dotted name, A.b.c = ..., and a
# function written in an object literal assigned to one, A.b = { open() {}, close: function () {} }.
# A name whose first part the table shared_objects holds, such as window.a, is reached the same way
# from every script that runs on the page, so its node is named by the dotted name alone, and two
# scripts that assign it give one node holding both locations. A function assigned to any other
# dotted name, A.b.c = ..., is named in its script, <script path>:A.b.c, since A may be local to it.
# A function in an object literal, A.b = { open() {} }, is named the same way by A: A.b.open or
# <script path>:A.b.open. A name that starts at this is the object a call runs on, so it makes
# nothing.

node_types:
- name: js.member_function
  parent: js.function
  id_namespace: js.member_function
# A.b = {...}: the object, so the functions written in it have an enclosing type. Internal: it
# names those functions only.
- name: js.namespace_object
  id_namespace: js.namespace_object
  internal: true

rules:
# A.b.c = function (...) {...}, A's name a key of shared_objects. js_root is the name's first part,
# empty when it starts with no name.
- rule: member_function_from_expression
  reads: file
  in: [js_source]
  match: &expression {declaration: assignment_expression, name_child: left, filetype: javascript, where: [{has_child: function_expression}, &root {name_matches: '(?<js_root>[\w$]*)(?s:.*)'}, &shared {in_table: {table: shared_objects, capture: js_root}}]}
  id: &dotted_id
    from: declared_name
    # A dotted name whose first part is not this.
    pattern: '^(?<js_member>(?:[A-Za-su-z_$][\w$]*|t|t[A-Za-gi-z\d_$][\w$]*|th|th[A-Za-hj-z\d_$][\w$]*|thi|thi[A-Za-rt-z\d_$][\w$]*|this[\w$]+)(?:\.[A-Za-z_$][\w$]*)+)$'
    template: '{js_member}'
  emits: [{node: {type: js.member_function}}]
  confidence: declared
- rule: member_function_from_expression_in_file
  reads: file
  in: [js_source]
  match: *expression
  id: *dotted_id
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# The same, A's name not a key of shared_objects: named in the script.
- rule: member_function_from_expression_in_script
  reads: file
  in: [js_source]
  match: &local_expression {declaration: assignment_expression, name_child: left, filetype: javascript, where: [{has_child: function_expression}, *root, &local {not_in_table: {table: shared_objects, capture: js_root}}]}
  id: &local_id
    from: declared_name
    pattern: '^(?<js_member>(?:[A-Za-su-z_$][\w$]*|t|t[A-Za-gi-z\d_$][\w$]*|th|th[A-Za-hj-z\d_$][\w$]*|thi|thi[A-Za-rt-z\d_$][\w$]*|this[\w$]+)(?:\.[A-Za-z_$][\w$]*)+)$'
    template: '{script}:{js_member}'
  emits: [{node: {type: js.member_function}}]
  confidence: declared
- rule: member_function_from_expression_in_script_in_file
  reads: file
  in: [js_source]
  match: *local_expression
  id: *local_id
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# A.b.c = (...) => {...}, A's name a key of shared_objects.
- rule: member_function_from_arrow
  reads: file
  in: [js_source]
  match: &arrow {declaration: assignment_expression, name_child: left, filetype: javascript, where: [{has_child: arrow_function}, *root, *shared]}
  id: *dotted_id
  emits: [{node: {type: js.member_function}}]
  confidence: declared
- rule: member_function_from_arrow_in_file
  reads: file
  in: [js_source]
  match: *arrow
  id: *dotted_id
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# The same, A's name not a key of shared_objects: named in the script.
- rule: member_function_from_arrow_in_script
  reads: file
  in: [js_source]
  match: &local_arrow {declaration: assignment_expression, name_child: left, filetype: javascript, where: [{has_child: arrow_function}, *root, *local]}
  id: *local_id
  emits: [{node: {type: js.member_function}}]
  confidence: declared
- rule: member_function_from_arrow_in_script_in_file
  reads: file
  in: [js_source]
  match: *local_arrow
  id: *local_id
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
- rule: namespace_object
  reads: file
  in: [js_source]
  match: {declaration: assignment_expression, name_child: left, body_child: object, filetype: javascript, where: [{has_child: object}]}
  id: *dotted_id
  emits: [{node: {type: js.namespace_object}}]
  confidence: declared
# A class, declared or written as a value, ends the walk to the enclosing type, so the methods of
# a class written inside a function of A.b = {...} are not taken as A.b's. The id never fits, so
# neither rule makes a node.
- rule: class_declaration_ends_object
  reads: file
  in: [js_source]
  match: {declaration: class_declaration, name_child: name, body_child: body, filetype: javascript}
  id: &no_id {from: declared_name, pattern: '^$'}
  emits: [{node: {type: js.namespace_object}}]
  confidence: declared
- rule: class_expression_ends_object
  reads: file
  in: [js_source]
  match: {declaration: class, name_child: name, body_child: body, filetype: javascript}
  id: *no_id
  emits: [{node: {type: js.namespace_object}}]
  confidence: declared
# { open(...) {...} } directly in that object, A's name a key of shared_objects. The enclosing type
# is the object's full name, <script path>:A.b, so the condition reads A after the colon and the
# script is cut from the id.
- rule: member_function_from_method
  reads: file
  in: [js_source]
  match: &method {declaration: method_definition, name_child: name, filetype: javascript, where: [{name_matches: '[A-Za-z_$][\w$]*'}, &shared_object {in_table: {table: shared_objects, fill: enclosing_type, pattern: ':(?<js_root>[\w$]+)', capture: js_root}}]}
  id: &member_id {from: [enclosing_type, declared_name], template: '{enclosing_type}.{declared_name}', normalize: [{replace: '^[^:]*:', with: ''}]}
  emits: [{node: {type: js.member_function}}]
  confidence: declared
- rule: member_function_from_method_in_file
  reads: file
  in: [js_source]
  match: *method
  id: *member_id
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# The same, A's name not a key of shared_objects: named in the script, <script path>:A.b.open.
- rule: member_function_from_method_in_script
  reads: file
  in: [js_source]
  match: &local_method {declaration: method_definition, name_child: name, filetype: javascript, where: [{name_matches: '[A-Za-z_$][\w$]*'}, &local_object {not_in_table: {table: shared_objects, fill: enclosing_type, pattern: ':(?<js_root>[\w$]+)', capture: js_root}}]}
  id: &local_member_id {from: [enclosing_type, declared_name], template: '{enclosing_type}.{declared_name}'}
  emits: [{node: {type: js.member_function}}]
  confidence: declared
- rule: member_function_from_method_in_script_in_file
  reads: file
  in: [js_source]
  match: *local_method
  id: *local_member_id
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# { close: function (...) {...} } directly in that object, A's name a key of shared_objects.
- rule: member_function_from_pair
  reads: file
  in: [js_source]
  match: &pair {declaration: pair, name_child: key, filetype: javascript, where: [{has_child: function_expression}, {name_matches: '[A-Za-z_$][\w$]*'}, *shared_object]}
  id: *member_id
  emits: [{node: {type: js.member_function}}]
  confidence: declared
- rule: member_function_from_pair_in_file
  reads: file
  in: [js_source]
  match: *pair
  id: *member_id
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# The same, A's name not a key of shared_objects: named in the script.
- rule: member_function_from_pair_in_script
  reads: file
  in: [js_source]
  match: &local_pair {declaration: pair, name_child: key, filetype: javascript, where: [{has_child: function_expression}, {name_matches: '[A-Za-z_$][\w$]*'}, *local_object]}
  id: *local_member_id
  emits: [{node: {type: js.member_function}}]
  confidence: declared
- rule: member_function_from_pair_in_script_in_file
  reads: file
  in: [js_source]
  match: *local_pair
  id: *local_member_id
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
