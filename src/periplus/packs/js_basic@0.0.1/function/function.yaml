$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

node_types:
- name: js.function
  id_namespace: js.function
- name: js.file
  id_namespace: js.file
# A call named as function_call names one, and a global's call named by the global alone.
# Internal: the map rules join a global's call to the script's function of that name.
- name: js.global_name_call
  id_namespace: js.global_name_call
  internal: true

edge_kinds:
- kind: script_declares_function
  from: js.file
  to: js.function
- kind: js_calls
  from: [js.function, js.file]
  to: js.function
- kind: calls_global_name
  from: [js.function, js.file]
  to: js.global_name_call

rules:
# function name(...) {...}: <script path>:name
- rule: function_declaration
  reads: file
  in: [js_source]
  match: {declaration: function_declaration, name_child: name, filetype: javascript}
  id: {from: qualified_name}
  emits: [{node: {type: js.function}}]
  confidence: declared
- rule: function_declaration_in_file
  reads: file
  in: [js_source]
  match: {declaration: function_declaration, name_child: name, filetype: javascript}
  id: {from: qualified_name}
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# const name = (...) => {...}, and the same with let or var.
- rule: function_from_arrow
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: arrow_function}]}
  id: {from: qualified_name}
  emits: [{node: {type: js.function}}]
  confidence: declared
- rule: function_from_arrow_in_file
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: arrow_function}]}
  id: {from: qualified_name}
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# const name = function (...) {...}, and the same with let or var.
- rule: function_from_expression
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: function_expression}]}
  id: {from: qualified_name}
  emits: [{node: {type: js.function}}]
  confidence: declared
- rule: function_from_expression_in_file
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: function_expression}]}
  id: {from: qualified_name}
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# The script itself: its path from the project folder, the same value that starts each function's
# name. A node for a script that holds no function lets a library reach it.
- rule: script_file
  reads: file
  in: [js_source]
  match: {declaration: program, filetype: javascript}
  id: {from: script}
  emits: [{node: {type: js.file}}]
  confidence: declared
# f(...): an edge to <script path>:f from the nearest named function that holds the call, or from
# the script when no named function holds it. A call inside a function passed as an argument has no
# node of its own, so it starts at the named function around it or at the script. A dotted call,
# a.b(), is member/member_call.yaml's; any other shape, such as f()() or a[i](), makes no edge and
# is a row of the report's matches skipped. A call to a function another script declares stays
# unresolved. A call to import() or to a name the table globals holds makes nothing;
# function_call_named_like_global gives the edge when the script declares a function of that name.
- rule: function_call
  reads: file
  in: [js_source]
  match:
    reference: call_expression
    name_child: function
    whole_written: true
    filetype: javascript
    where: [{name_matches: '[A-Za-z_$][\w$]*|(?s:.*[^\w$.].*)'}]
    skip_names: [import, {table: globals}]
  emits: [{edge: {kind: js_calls, from: enclosing_declaration, to: {types: [js.function], on_miss: unresolved}}}]
  confidence: declared
# f(...) again, to two internal nodes: <script path>:f, and, when the table globals holds f, f
# alone, the table's value. The map rules below join a call that reaches both to the function f the
# script declares, so only a global's call gets an edge here; any other call's is function_call's.
# They look the second node up by the name as called, so each row of globals is its own value.
- rule: function_call_named_like_global
  reads: file
  in: [js_source]
  match:
    reference: call_expression
    name_child: function
    filetype: javascript
    where: [{name_matches: '[A-Za-z_$][\w$]*'}]
    # Keywords, not names: function_call skips import() and lists super() as skipped.
    skip_names: [import, super]
  emits:
  - edge: {kind: calls_global_name, from: enclosing_declaration, to: {types: [js.global_name_call]}}
  - edge: {kind: calls_global_name, from: enclosing_declaration, to: {types: [js.global_name_call], resolve: [lookup_last_segment_in: globals, as_written]}}
  confidence: declared
- rule: function_named_like_global_called_from_function
  reads: map
  match:
    node_type: js.function
    follow: &global_name [{edge: calls_global_name}, {id_matches: '^js\.global_name_call::(?<js_function>.+:(?<js_global>[^:]+))$'}, {node: 'js.global_name_call::{js_global}'}, {node: 'js.function::{js_function}'}]
  emits: [{edge: {kind: js_calls, from: this_node, to: matched_node}}]
  confidence: declared
- rule: function_named_like_global_called_from_script
  reads: map
  match:
    node_type: js.file
    follow: *global_name
  emits: [{edge: {kind: js_calls, from: this_node, to: matched_node}}]
  confidence: declared
