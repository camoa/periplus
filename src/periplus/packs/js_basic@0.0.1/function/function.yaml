$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

node_types:
- name: js.function
  id_namespace: js.function
- name: js.file
  id_namespace: js.file
# A call function_call skips as a global's, named as function_call names a call. Internal: the map
# rules join it to the script's function of that name.
- name: js.global_name_call
  id_namespace: js.global_name_call
  internal: true

edge_kinds:
- kind: script_declares_function
  from: js.file
  to: js.function
- kind: js_calls
  from: [js.function, js.file]
  to: js.function
- kind: calls_global_name
  from: [js.function, js.file]
  to: js.global_name_call

rules:
# function name(...) {...}: <script path>:name
- rule: function_declaration
  reads: file
  in: [js_source]
  match: {declaration: function_declaration, name_child: name, filetype: javascript}
  id: {from: qualified_name}
  emits: [{node: {type: js.function}}]
  confidence: declared
- rule: function_declaration_in_file
  reads: file
  in: [js_source]
  match: {declaration: function_declaration, name_child: name, filetype: javascript}
  id: {from: qualified_name}
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# const name = (...) => {...}, and the same with let or var.
- rule: function_from_arrow
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: arrow_function}]}
  id: {from: qualified_name}
  emits: [{node: {type: js.function}}]
  confidence: declared
- rule: function_from_arrow_in_file
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: arrow_function}]}
  id: {from: qualified_name}
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# const name = function (...) {...}, and the same with let or var.
- rule: function_from_expression
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: function_expression}]}
  id: {from: qualified_name}
  emits: [{node: {type: js.function}}]
  confidence: declared
- rule: function_from_expression_in_file
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: function_expression}]}
  id: {from: qualified_name}
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# The script itself: its path from the project folder, the same value that starts each function's
# name. A node for a script that holds no function lets a library reach it.
- rule: script_file
  reads: file
  in: [js_source]
  match: {declaration: program, filetype: javascript}
  id: {from: script}
  emits: [{node: {type: js.file}}]
  confidence: declared
# f(...): an edge to <script path>:f from the nearest named function that holds the call, or from
# the script when no named function holds it. A call inside a function passed as an argument has no
# node of its own, so it starts at the named function around it or at the script. A dotted call,
# a.b(), is member/member_call.yaml's; any other shape, such as f()() or a[i](), makes no edge and
# is a row of the report's matches skipped. A call to a function another script declares stays
# unresolved. A call to a JavaScript or browser global the list below names makes nothing;
# function_call_named_like_global gives the edge when the script declares a function of that name.
# A name the table library_globals holds, which a rutter for a library adds, is unresolved under
# that table's value when the script declares no function of that name, so every script's call
# meets one node.
- rule: function_call
  reads: file
  in: [js_source]
  match:
    reference: call_expression
    name_child: function
    whole_written: true
    filetype: javascript
    where: [{name_matches: '[A-Za-z_$][\w$]*|(?s:.*[^\w$.].*)'}]
    skip_names: [setTimeout, setInterval, clearTimeout, clearInterval, setImmediate,
      clearImmediate, queueMicrotask, requestAnimationFrame, cancelAnimationFrame,
      requestIdleCallback, cancelIdleCallback, parseInt, parseFloat, isNaN, isFinite, String,
      Number, Boolean, Array, Object, Date, Symbol, BigInt, Promise, Map, Set, WeakMap, WeakSet,
      RegExp, Error, TypeError, RangeError, Function, eval, encodeURIComponent, decodeURIComponent,
      encodeURI, decodeURI, fetch, alert, confirm, prompt, require, import, structuredClone, atob,
      btoa, getComputedStyle, matchMedia]
  emits: [{edge: {kind: js_calls, from: enclosing_declaration, to: {types: [js.function], fallback: [lookup_last_segment_in: library_globals], on_miss: unresolved, on_miss_name: fallback}}}]
  confidence: declared
# A call function_call skips, to a function of that name the script declares. The list is
# function_call's skip_names less import, which no function can be named. The call reaches an
# internal node, and the map rules below keep only a name a function of the script has.
- rule: function_call_named_like_global
  reads: file
  in: [js_source]
  match:
    reference: call_expression
    name_child: function
    filetype: javascript
    where: [{name_matches: 'setTimeout|setInterval|clearTimeout|clearInterval|setImmediate|clearImmediate|queueMicrotask|requestAnimationFrame|cancelAnimationFrame|requestIdleCallback|cancelIdleCallback|parseInt|parseFloat|isNaN|isFinite|String|Number|Boolean|Array|Object|Date|Symbol|BigInt|Promise|Map|Set|WeakMap|WeakSet|RegExp|Error|TypeError|RangeError|Function|eval|encodeURIComponent|decodeURIComponent|encodeURI|decodeURI|fetch|alert|confirm|prompt|require|structuredClone|atob|btoa|getComputedStyle|matchMedia'}]
  emits: [{edge: {kind: calls_global_name, from: enclosing_declaration, to: {types: [js.global_name_call]}}}]
  confidence: declared
- rule: function_named_like_global_called_from_function
  reads: map
  match:
    node_type: js.function
    follow: [{edge: calls_global_name}, {id_matches: '^js\.global_name_call::(?<js_function>.+)$'}, {node: 'js.function::{js_function}'}]
  emits: [{edge: {kind: js_calls, from: this_node, to: matched_node}}]
  confidence: declared
- rule: function_named_like_global_called_from_script
  reads: map
  match:
    node_type: js.file
    follow: [{edge: calls_global_name}, {id_matches: '^js\.global_name_call::(?<js_function>.+)$'}, {node: 'js.function::{js_function}'}]
  emits: [{edge: {kind: js_calls, from: this_node, to: matched_node}}]
  confidence: declared
