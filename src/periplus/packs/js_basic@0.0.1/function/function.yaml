$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

node_types:
- name: js.function
  id_namespace: js.function
- name: js.file
  id_namespace: js.file

edge_kinds:
- kind: script_declares_function
  from: js.file
  to: js.function
- kind: js_calls
  from: [js.function, js.file]
  to: js.function

rules:
# function name(...) {...}: <script path>:name
- rule: function_declaration
  reads: file
  in: [js_source]
  match: {declaration: function_declaration, name_child: name, filetype: javascript}
  id: {from: qualified_name}
  emits: [{node: {type: js.function}}]
  confidence: declared
- rule: function_declaration_in_file
  reads: file
  in: [js_source]
  match: {declaration: function_declaration, name_child: name, filetype: javascript}
  id: {from: qualified_name}
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# const name = (...) => {...}, and the same with let or var.
- rule: function_from_arrow
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: arrow_function}]}
  id: {from: qualified_name}
  emits: [{node: {type: js.function}}]
  confidence: declared
- rule: function_from_arrow_in_file
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: arrow_function}]}
  id: {from: qualified_name}
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# const name = function (...) {...}, and the same with let or var.
- rule: function_from_expression
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: function_expression}]}
  id: {from: qualified_name}
  emits: [{node: {type: js.function}}]
  confidence: declared
- rule: function_from_expression_in_file
  reads: file
  in: [js_source]
  match: {declaration: variable_declarator, name_child: name, filetype: javascript, where: [{has_child: function_expression}]}
  id: {from: qualified_name}
  emits: [{edge: {kind: script_declares_function, from: enclosing_file, to: this_node}}]
  confidence: declared
# The script itself: its path from the project folder, the same value that starts each function's
# name. A node for a script that holds no function lets a library reach it.
- rule: script_file
  reads: file
  in: [js_source]
  match: {declaration: program, filetype: javascript}
  id: {from: script}
  emits: [{node: {type: js.file}}]
  confidence: declared
# f(...): an edge to <script path>:f from the nearest named function that holds the call, or from
# the script when no named function holds it. A call inside an object-member function or a function
# passed as an argument has no node of its own, so it starts at the named function around it or at
# the script. A call written through a member, a.b(), makes no edge and is a row of the
# report's matches skipped. A call to a function another script declares stays unresolved.
- rule: function_call
  reads: file
  in: [js_source]
  match: {reference: call_expression, name_child: function, whole_written: true, filetype: javascript}
  emits: [{edge: {kind: js_calls, from: enclosing_declaration, to: {types: [js.function], on_miss: unresolved}}}]
  confidence: declared
