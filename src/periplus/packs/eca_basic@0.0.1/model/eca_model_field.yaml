$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A condition or an action of a model names a field by field_name, or an action by
# field_name_entity_ref. The file rule links the model to drupal_basic's internal field-name hub
# (field/field_name.yaml) for the machine name the value starts with, so field_x.value names
# field_x and a token names nothing. The map rules give eca_uses_field:
# - to the storage of that name on an entity type the model names, by a bundle or an entity type
#   (model/eca_model_entity_type.yaml), as node for type: 'node article';
# - when no entity type the model names holds a storage of that name, as drupal_basic's code rules
#   do: to the one storage of that name when every storage of it has one entity type, else an
#   eca_uses_shared_field_name edge to its drupal.shared_field_name.
# A name that starts with field_ and that no mapped storage has ends at the unresolved
# field.storage.<name>, a mark; any other name with no storage, such as a base field, gives
# nothing. A capture an alternation takes only where a try reached nothing, named in the edge's
# template, keeps an edge to where the case holds.

edge_kinds:
- kind: eca_names_field
  from: eca.model
  to: drupal.field_name
- kind: eca_uses_field
  from: eca.model
  to: drupal.field_storage
- kind: eca_uses_shared_field_name
  from: eca.model
  to: drupal.shared_field_name

rules:
- rule: eca_model_field_names_from_config
  reads: file
  in: [config, module_config]
  match: {file: 'eca.eca.*', filetype: yaml}
  id: {from: file_stem}
  emits:
  - edge: {kind: eca_names_field, from: this_node, to: {from: {key: 'conditions.*.configuration.field_name'}, pattern: '^(?<field>[a-z][a-z0-9_]*)', template: '{field}', type: drupal.field_name}}
  - edge: {kind: eca_names_field, from: this_node, to: {from: {key: 'actions.*.configuration.field_name'}, pattern: '^(?<field>[a-z][a-z0-9_]*)', template: '{field}', type: drupal.field_name}}
  - edge: {kind: eca_names_field, from: this_node, to: {from: {key: 'actions.*.configuration.field_name_entity_ref'}, pattern: '^(?<field>[a-z][a-z0-9_]*)', template: '{field}', type: drupal.field_name}}
  confidence: declared

- rule: eca_model_uses_field_of_bundle
  reads: map
  match:
    node_type: eca.model
    where: [{id_matches: '^(?<model>.+)$'}]
    follow:
    - edge: eca_acts_on_bundle
    - id_matches: '^drupal\.bundle::(?<entity>[^.]+)\.'
    - node: '{model}'
    - edge: eca_names_field
    - id_matches: '^drupal\.field_name::(?<field>.+)$'
    - node: 'drupal.config::field.storage.{entity}.{field}'
  emits: [{edge: {kind: eca_uses_field, from: this_node, to: matched_node}}]
  confidence: inferred

- rule: eca_model_uses_field_of_entity_type
  reads: map
  match:
    node_type: eca.model
    where: [{id_matches: '^(?<model>.+)$'}]
    follow:
    - edge: eca_acts_on_entity_type
    - id_matches: '^drupal\.entity_type::(?<entity>.+)$'
    - node: '{model}'
    - edge: eca_names_field
    - id_matches: '^drupal\.field_name::(?<field>.+)$'
    - node: 'drupal.config::field.storage.{entity}.{field}'
  emits: [{edge: {kind: eca_uses_field, from: this_node, to: matched_node}}]
  confidence: inferred

# nobundle and notype are captured only where no bundle or entity type of the model holds a
# storage of the name, single only where no two storages of it differ in entity type.
- rule: eca_model_uses_field
  reads: map
  match:
    node_type: eca.model
    where: [{id_matches: '^(?<model>.+)$'}]
    follow:
    - edge: eca_names_field
    - id_matches: '^drupal\.field_name::(?<field>.+)$'
    - try: [{node: '{model}'}, {edge: eca_acts_on_bundle}, {id_matches: '^drupal\.bundle::(?<entity>[^.]+)\.'}, {node: 'drupal.config::field.storage.{entity}.{field}'}]
    - id_matches: '^(?:drupal\.config::|drupal\.field_name::(?<nobundle>))'
    - node: 'drupal.field_name::{field}'
    - try: [{node: '{model}'}, {edge: eca_acts_on_entity_type}, {id_matches: '^drupal\.entity_type::(?<entity>.+)$'}, {node: 'drupal.config::field.storage.{entity}.{field}'}]
    - id_matches: '^(?:drupal\.config::|drupal\.field_name::(?<notype>))'
    - node: 'drupal.field_name::{field}'
    - edge: field_name_ready
    - try: [{edge: field_name_shared}]
    - id_matches: '^(?:drupal\.config::|drupal\.field_name::(?<single>))'
    - node: 'drupal.field_name::{field}'
    - edge: field_name_of
    - id_matches: '^drupal\.config::field\.storage\.(?<entity>[^.]+)\.'
  emits: [{edge: {kind: eca_uses_field, from: this_node, to: {template: 'field.storage.{entity}.{field}{nobundle}{notype}{single}', type: drupal.field_storage}}}]
  confidence: inferred

- rule: eca_model_uses_shared_field_name
  reads: map
  match:
    node_type: eca.model
    where: [{id_matches: '^(?<model>.+)$'}]
    follow:
    - edge: eca_names_field
    - id_matches: '^drupal\.field_name::(?<field>.+)$'
    - try: [{node: '{model}'}, {edge: eca_acts_on_bundle}, {id_matches: '^drupal\.bundle::(?<entity>[^.]+)\.'}, {node: 'drupal.config::field.storage.{entity}.{field}'}]
    - id_matches: '^(?:drupal\.config::|drupal\.field_name::(?<nobundle>))'
    - node: 'drupal.field_name::{field}'
    - try: [{node: '{model}'}, {edge: eca_acts_on_entity_type}, {id_matches: '^drupal\.entity_type::(?<entity>.+)$'}, {node: 'drupal.config::field.storage.{entity}.{field}'}]
    - id_matches: '^(?:drupal\.config::|drupal\.field_name::(?<notype>))'
    - node: 'drupal.field_name::{field}'
    - edge: field_name_shared
  emits: [{edge: {kind: eca_uses_shared_field_name, from: this_node, to: {template: '{field}{nobundle}{notype}', type: drupal.shared_field_name}}}]
  confidence: inferred

# none is captured only where no storage of the name was reached.
- rule: eca_model_uses_field_mark
  reads: map
  match:
    node_type: eca.model
    follow:
    - edge: eca_names_field
    - id_matches: '^drupal\.field_name::(?<field>field_\w+)$'
    - try: [{edge: field_name_of}]
    - id_matches: '^(?:drupal\.config::|drupal\.field_name::(?<none>))'
  emits: [{edge: {kind: eca_uses_field, from: this_node, to: {template: 'field.storage.{field}{none}', type: drupal.field_storage, on_miss: unresolved}}}]
  confidence: inferred
