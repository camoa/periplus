$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# An ECA event plugin declared by the EcaEvent docblock annotation on its class, in the folder ECA's
# event plugin manager discovers in. Two rules because a rule that emits an edge emits no node. An
# id that is not text in double quotes makes no plugin and is listed under skipped in the map
# report.

rules:
- rule: eca_event_from_annotation
  reads: file
  in: [eca_event_classes]
  match: {annotation: EcaEvent, filetype: php, where: [{applies_to: class_declaration}]}
  id: {from: {annotation_key: id}, must_be: string_literal}
  emits: [{node: {type: drupal.eca_event}}]
  confidence: declared
- rule: eca_event_from_annotation_edges
  reads: file
  in: [eca_event_classes]
  match: {annotation: EcaEvent, filetype: php, where: [{applies_to: class_declaration}]}
  id: {from: {annotation_key: id}, must_be: string_literal}
  emits: [{edge: {kind: plugin_class, from: this_node, to: enclosing_class}}]
  confidence: declared
