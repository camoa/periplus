$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# An ECA event plugin declared by the attribute Drupal\eca\Attribute\EcaEvent on its class, in the
# folder ECA's event plugin manager discovers in. Two rules because a rule that emits an edge emits
# no node. An id that is not a text literal makes no plugin and is listed under skipped in the map
# report.

rules:
- rule: eca_event_from_attribute
  reads: file
  in: [eca_event_classes]
  match: {attribute: Drupal\eca\Attribute\EcaEvent, filetype: php, where: [{applies_to: class_declaration}]}
  id: {from: {attribute_argument: id}, must_be: string_literal}
  emits: [{node: {type: drupal.eca_event}}]
  confidence: declared
- rule: eca_event_from_attribute_edges
  reads: file
  in: [eca_event_classes]
  match: {attribute: Drupal\eca\Attribute\EcaEvent, filetype: php, where: [{applies_to: class_declaration}]}
  id: {from: {attribute_argument: id}, must_be: string_literal}
  emits: [{edge: {kind: plugin_class, from: this_node, to: enclosing_class}}]
  confidence: declared
