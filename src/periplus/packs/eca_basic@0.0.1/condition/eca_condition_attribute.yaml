$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# An ECA condition plugin declared by the attribute Drupal\eca\Attribute\EcaCondition on its class,
# in the folder ECA's condition plugin manager discovers in. Two rules because a rule that emits an
# edge emits no node. An id that is not a text literal makes no plugin and is listed under skipped
# in the map report.

rules:
- rule: eca_condition_from_attribute
  reads: file
  in: [eca_condition_classes]
  match: {attribute: Drupal\eca\Attribute\EcaCondition, filetype: php, where: [{applies_to: class_declaration}]}
  id: {from: {attribute_argument: id}, must_be: string_literal}
  emits: [{node: {type: drupal.eca_condition}}]
  confidence: declared
- rule: eca_condition_from_attribute_edges
  reads: file
  in: [eca_condition_classes]
  match: {attribute: Drupal\eca\Attribute\EcaCondition, filetype: php, where: [{applies_to: class_declaration}]}
  id: {from: {attribute_argument: id}, must_be: string_literal}
  emits: [{edge: {kind: plugin_class, from: this_node, to: enclosing_class}}]
  confidence: declared
