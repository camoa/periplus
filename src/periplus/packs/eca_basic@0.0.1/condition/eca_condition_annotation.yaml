$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# An ECA condition plugin declared by the EcaCondition docblock annotation on its class, in the
# folder ECA's condition plugin manager discovers in. Two rules because a rule that emits an edge
# emits no node. An id that is not text in double quotes makes no plugin and is listed under skipped
# in the map report.

rules:
- rule: eca_condition_from_annotation
  reads: file
  in: [eca_condition_classes]
  match: {annotation: EcaCondition, filetype: php, where: [{applies_to: class_declaration}]}
  id: {from: {annotation_key: id}, must_be: string_literal}
  emits: [{node: {type: drupal.eca_condition}}]
  confidence: declared
- rule: eca_condition_from_annotation_edges
  reads: file
  in: [eca_condition_classes]
  match: {annotation: EcaCondition, filetype: php, where: [{applies_to: class_declaration}]}
  id: {from: {annotation_key: id}, must_be: string_literal}
  emits: [{edge: {kind: plugin_class, from: this_node, to: enclosing_class}}]
  confidence: declared
