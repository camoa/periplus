$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# {{ drupal_entity('entity_type', id) }} renders an entity of that type, and
# {{ drupal_entity_form('entity_type', ...) }} renders a form of one. Each is an edge to the entity
# type; the entity itself is named by a value the template holds at run time.

edge_kinds:
- kind: renders_entity_type
  from: drupal.template
  to: drupal.entity_type
- kind: renders_entity_form
  from: drupal.template
  to: drupal.entity_type

rules:
- rule: entity_rendered_in_template
  reads: file
  in: [module_root, theme_root]
  match:
    file: '*.html'
    filetype: drupal_template_text
    text: 'drupal_entity\(\s*[''"](?<entity_type>[^''"\s]+)[''"]'
  id: {template: '{template_name}'}
  emits: [{edge: {kind: renders_entity_type, from: this_node, to: {from: {capture: entity_type}}}}]
  confidence: declared
- rule: entity_form_rendered_in_template
  reads: file
  in: [module_root, theme_root]
  match:
    file: '*.html'
    filetype: drupal_template_text
    text: 'drupal_entity_form\(\s*[''"](?<entity_type>[^''"\s]+)[''"]'
  id: {template: '{template_name}'}
  emits: [{edge: {kind: renders_entity_form, from: this_node, to: {from: {capture: entity_type}}}}]
  confidence: declared
