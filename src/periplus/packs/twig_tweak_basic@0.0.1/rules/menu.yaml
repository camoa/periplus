$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# {{ drupal_menu('menu_name') }}: the template renders the menu, whose config object is
# system.menu.<menu_name>.

edge_kinds:
- kind: renders_menu
  cause: from
  description: "The template calls drupal_menu() for that menu's config object, system.menu.<name>, named as quoted text"
  from: drupal.template
  to: drupal.config_object
- kind: component_renders_menu
  cause: from
  description: "The component's Twig file calls drupal_menu() for that menu's config object, system.menu.<name>, named as quoted text"
  from: drupal.component
  to: drupal.config_object

rules:
- rule: menu_rendered_in_template
  reads: file
  in: [module_root, theme_root]
  match:
    file: '*.html'
    filetype: drupal_template_text
    text: 'drupal_menu\(\s*[''"](?<menu>[^''"\s]+)[''"]'
  id: {template: '{template_name}'}
  emits: [{edge: {kind: renders_menu, from: this_node, to: {template: 'system.menu.{menu}'}}}]
  confidence: declared
# The same call in a component's <name>.twig: the component renders the menu. A file with no
# component_name makes nothing.
- rule: menu_rendered_in_component
  reads: file
  in: [module_root, theme_root]
  match:
    file: '*'
    filetype: drupal_template_text
    text: 'drupal_menu\(\s*[''"](?<menu>[^''"\s]+)[''"]'
  id: {template: '{component_name}'}
  emits: [{edge: {kind: component_renders_menu, from: this_node, to: {template: 'system.menu.{menu}'}}}]
  confidence: declared
