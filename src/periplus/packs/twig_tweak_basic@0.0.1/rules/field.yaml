$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# {{ drupal_field('field_name', 'entity_type', id) }}: the template renders the field, whose storage
# config object is field.storage.<entity_type>.<field_name>.

edge_kinds:
- kind: renders_field
  from: drupal.template
  to: drupal.field_storage

rules:
- rule: field_rendered_in_template
  reads: file
  in: [module_root, theme_root]
  match:
    file: '*.html'
    filetype: drupal_template_text
    text: 'drupal_field\(\s*[''"](?<field>[^''"\s]+)[''"]\s*,\s*[''"](?<entity_type>[^''"\s]+)[''"]'
  id: {template: '{template_name}'}
  emits: [{edge: {kind: renders_field, from: this_node, to: {template: 'field.storage.{entity_type}.{field}'}}}]
  confidence: declared
