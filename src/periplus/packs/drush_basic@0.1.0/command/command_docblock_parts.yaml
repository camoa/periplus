$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# What an annotated command's docblock declares beside its name, read as text inside the docblock
# that holds its @command tag: each @option <name> tag as a drush.command_option <command>|<name>,
# and each @param tag's variable, other than $options, as a drush.command_argument
# <command>|<name>, as the annotated-command library takes a command's arguments from its method's
# parameters. A tag written before @command, as Drush's generator writes them, is read by looking
# ahead to the @command of the same docblock; a tag written after it is read by position, one rule
# pair per position, up to the sixth option and the fourth argument. Declared: the tag states it.
#
# Limits: after @command, a seventh option or a fifth argument gives nothing; an option declared
# only in the $options default array, with no @option tag, gives nothing.

rules:
# A tag before the docblock's @command.
- rule: command_option_before_command
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    reads_sections: [block_comment]
    text: '@option[ \t]+\$?(?<option>[\w-]+)(?=(?:(?!\*/)[\s\S])*?@command[ \t]+(?<command>[\w:.-]+))'
  id: {template: '{command}|{option}'}
  line: {capture: option}
  emits: [{node: {type: drush.command_option}}]
  confidence: declared

- rule: command_option_before_command_edges
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    reads_sections: [block_comment]
    text: '@option[ \t]+\$?(?<option>[\w-]+)(?=(?:(?!\*/)[\s\S])*?@command[ \t]+(?<command>[\w:.-]+))'
  id: {template: '{command}|{option}'}
  line: {capture: option}
  emits: [{edge: {kind: option_of_command, from: this_node, to: {template: '{command}', type: drush.command}}}]
  confidence: declared

- rule: command_argument_before_command
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    reads_sections: [block_comment]
    text: '@param[ \t]+(?:[^\s$]+[ \t]+)?\$(?!options\b)(?<argument>\w+)(?=(?:(?!\*/)[\s\S])*?@command[ \t]+(?<command>[\w:.-]+))'
  id: {template: '{command}|{argument}'}
  line: {capture: argument}
  emits: [{node: {type: drush.command_argument}}]
  confidence: declared

- rule: command_argument_before_command_edges
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    reads_sections: [block_comment]
    text: '@param[ \t]+(?:[^\s$]+[ \t]+)?\$(?!options\b)(?<argument>\w+)(?=(?:(?!\*/)[\s\S])*?@command[ \t]+(?<command>[\w:.-]+))'
  id: {template: '{command}|{argument}'}
  line: {capture: argument}
  emits: [{edge: {kind: argument_of_command, from: this_node, to: {template: '{command}', type: drush.command}}}]
  confidence: declared

