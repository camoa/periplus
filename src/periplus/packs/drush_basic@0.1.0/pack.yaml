$schema: "https://periplus.dev/schema/0/pack-manifest.schema.json"

# Drush commands in the custom modules: each command, named by its name, as mymodule:sync, with
# a command_method edge to php_basic's node for the method that runs it, a command_class edge to
# that method's class, and a command_service edge to the service a services file registers that
# class under. A command is read from the Command attribute on a method,
# #[CLI\Command(name: '...')], and from the @command tag in a method's docblock, both from the
# tree. A method that carries both is one node with two locations. Each alias in a docblock's
# @aliases tag, and each text of the Command attribute's aliases list, is a drush.command_alias
# node with an alias_of_command edge to its command. Each option, from an Option attribute or an
# @option tag, is a drush.command_option <command>|<name> with option_of_command, and each
# argument, from an Argument attribute or a @param tag other than $options, a
# drush.command_argument <command>|<name> with argument_of_command
# (command/command_attribute_parts.yaml, command/command_docblock_parts.yaml). Each hook method,
# from a Hook attribute or a @hook tag, gets a hooks_command edge to the command its target names,
# or with no target to each command its class defines, holding the hook type in hook_type
# (command/command_hook.yaml).
# Each command and alias has an inferred command_in_module or command_alias_in_module edge to the
# module drupal_basic's class_in_module gives the command's class (command/command_in_module.yaml).
# A command class that uses Drush's AutowireTrait and declares no create() gets an autowires_service
# edge from each constructor parameter to the service its type or Autowire attribute names, as
# drupal_basic does for core's trait (command/command_autowire.yaml).
#
# Not mapped yet:
# - An attribute whose name is not the named argument name:, such as #[CLI\Command('x')], or is
#   not a text literal, makes nothing and is listed under skipped.
# - A fifth or later alias in the @aliases tag, a seventh or later @option tag, a fifth or later
#   @param tag, a tag written before @command, and an Option or Argument attribute written before
#   the Command attribute on its method.
# - A hook target written as the command method's name, as an @annotation or as *; usages,
#   topics and validator attributes.
# - A command in an anonymous class, and a command a class inherits from a grandparent, for the
#   service join.
pack: drush_basic
version: 0.1.0
depends: [drupal_basic, php_basic]

add_table_rows:
  # The hook Drush defines in its drush.api.php, which Drush's deploy:hook command runs from a
  # module's .deploy.php file, read by drupal_basic's hook/hook_known.yaml.
  drupal_basic:
    hook_names:
      deploy_NAME: deploy_NAME

files:
  types:
    # drupal_basic's type drupal_php_text, given more spans. drush_command_attributes runs from a
    # Command attribute, #[CLI\Command(name: 'x', ...)], to the function keyword of the method it
    # sits on, so the Option and Argument attributes beside it fall inside; command is the name.
    # drush_aliases is the list an aliases: argument writes. Read by
    # command/command_attribute_parts.yaml.
    drupal_php_text:
      endings: [php, module, theme, inc, install, profile]
      reader: text
      spans:
      - name: drush_command_attributes
        open: '#\[\s*(?:CLI\\|\\?Drush\\Attributes\\)?Command(?=\((?:[^()''"]|''[^'']*''|"[^"]*")*?\bname:\s*[''"](?<command>[^''"]+)[''"])'
        balance: ['(?!x)x', '\bfunction\b']
      - name: drush_aliases
        open: '\b(?<mark>aliases):\s*(?=\[)'
        balance: ['[', ']']

# Detected when a custom module registers Drush commands, or keeps command classes where
# Drush looks for them.
detect:
  any_of:
    - path: "{module_root}/drush.services.yml"
    - path: "{module_root}/src/Drush/Commands/*.php"
    - path: "{module_root}/src/Commands/*.php"

