$schema: https://periplus.dev/schema/0/pack-file.schema.json

# The module's edge to the function that function_arrow finds.

rules:
- rule: function_edge_arrow
  reads: file
  in: [typescript_source]
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: '(?m)^[ \t]*(?:export\s+)?const\s+(?<name>(?!use[A-Z])(?![A-Z]\w*[a-z])\w+)\b(?:\s*:\s*[^=\n]+)?\s*=\s*(?:async\s+)?(?:<[^()]*?>\s*)?(?:\((?:[^()]|\([^()]*\))*\)\s*(?::\s*[^=\n]+)?\s*=>|\w+\s*=>)'
  id: {template: '{module}'}
  line: {capture: name}
  emits: [{edge: {kind: declares_callable, from: this_node, to: {template: '{module}:{name}'}}}]
  confidence: declared
