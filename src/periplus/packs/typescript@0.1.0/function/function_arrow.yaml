$schema: https://periplus.dev/schema/0/pack-file.schema.json

# An arrow const that is neither component nor hook.

rules:
- rule: function_node_arrow
  reads: file
  in: [typescript_source]
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: '(?m)^[ \t]*(?:export\s+)?const\s+(?<name>(?!use[A-Z])(?![A-Z]\w*[a-z])\w+)\b(?:\s*:\s*[^=\n]+)?\s*=\s*(?:async\s+)?(?:<[^()]*?>\s*)?(?:\((?:[^()]|\([^()]*\))*\)\s*(?::\s*[^=\n]+)?\s*=>|\w+\s*=>)'
  id: {template: '{module}:{name}'}
  line: {capture: name}
  emits: [{node: {type: typescript.function}}]
  confidence: declared
