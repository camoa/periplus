$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A name in an import list from a relative path binds to that module's name.

rules:
- rule: import_name_relative
  reads: file
  in: [typescript_source]
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: '(?<!as )(?<![\w$])(?![A-Z][A-Z0-9_]*\b)(?<name>[A-Za-z_$][\w$]*)(?=\s*(?:,|\}|\n))'
  values:
    src: {from: {enclosing: import_named_relative, capture: src}}
    mod:
      template: '{dir}/{src}:{name}'
      normalize:
      - {replace: '/\./', with: '/'}
      - {replace: '[^/]+/\.\./', with: ''}
      - {replace: '[^/]+/\.\./', with: ''}
      - {replace: '[^/]+/\.\./', with: ''}
      - {replace: '[^/]+/\.\./', with: ''}
      - {replace: '/index:', with: ':'}
      # A name outside an import list has no source, so no binding is made.
      - {replace: '^[^:]*/:.*$', with: ''}
  emits:
  - binding: {name: '{name}', target: '{mod}'}
  confidence: inferred
