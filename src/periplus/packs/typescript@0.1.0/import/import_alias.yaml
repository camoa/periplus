$schema: https://periplus.dev/schema/0/pack-file.schema.json

# import ... from '@/lib/thing': the alias root is a project value.

rules:
- rule: import_from_alias
  reads: file
  in:
  - typescript_source
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: (?:\bfrom\s+|\bimport\s+|\bimport\(\s*)['"]@/(?<path>[^'"]+)['"]
  values:
    target:
      template: '{typescript_alias_root}/{path}'
      normalize:
      - replace: /index$
        with: ''
  id:
    template: '{module}'
  line:
    capture: path
  emits:
  - edge:
      kind: imports
      from: this_node
      to:
        template: '{target}'
  confidence: declared
