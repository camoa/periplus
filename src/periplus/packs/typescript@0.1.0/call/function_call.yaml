$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A call inside a function body to a name the file binds to a function.

rules:
- rule: function_call
  reads: file
  in: [typescript_source]
  match:
    file: '**'
    filetype: typescript
    reads_sections: [string]
    text: '(?<![.\w$])(?<!function )(?<!function  )(?<callee>(?!use[A-Z])[A-Za-z_$][\w$]*)(?:<[^()\n]*>)?\('
  values:
    # Nested functions join their names; the innermost one is the caller.
    fn:
      from: {enclosing: function_body, capture: name}
      join: '|'
      normalize:
      - {replace: '^.*\|', with: ''}
  id: {template: '{module}:{fn}'}
  line: {capture: callee}
  emits:
  - edge:
      kind: function_calls_function
      from: this_node
      to:
        from: {capture: callee}
        types: [typescript.callable]
        resolve: [bound_first_segment]
        separator: ':'
  confidence: inferred
