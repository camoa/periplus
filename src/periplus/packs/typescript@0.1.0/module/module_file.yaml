$schema: https://periplus.dev/schema/0/pack-file.schema.json

# Any TypeScript file.

rules:
- rule: module_file
  reads: file
  in:
  - typescript_source
  match:
    file: '**'
    filetype: typescript
  id:
    template: '{module}'
  emits:
  - node:
      type: typescript.module
  confidence: declared
