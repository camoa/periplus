$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# drupal pack — declares the Entity API types and edges. Finds nothing.
#
# The entity type is NOT the class that implements it, and the file this replaces got that
# wrong. It made the class the node and treated id = "redirect" as the class's identity.
#
# References say otherwise. Everything that names an entity type names the machine name:
#   field.storage.node.body                     -> node
#   core.entity_view_display.node.article.…     -> node
# Nothing anywhere writes Drupal\node\Entity\Node. So the entity type is its own node, the
# class is another, and an edge joins them — the same finding as block plugin versus block
# class, which was made first and not carried across.

node_types:
- name: drupal.entity_type
  description: "An entity type, named by its machine name"
  id_namespace: drupal.entity_type
- name: drupal.content_entity_type
  description: "A content entity type, from the ContentEntityType attribute or annotation on its class"
  parent: drupal.entity_type
- name: drupal.config_entity_type
  description: "A config entity type, from the ConfigEntityType attribute or annotation on its class"
  parent: drupal.entity_type
- name: drupal.entity_class
  description: "A PHP class that defines an entity; a more specific type says content or config"
  parent: php.class
- name: drupal.content_entity_class
  description: "A PHP class whose parents or interfaces reach ContentEntityInterface"
  parent: drupal.entity_class
- name: drupal.config_entity_class
  description: "A PHP class whose parents or interfaces reach ConfigEntityInterface"
  parent: drupal.entity_class
- name: drupal.entity_save
  description: "A method named save in an entity class"
  parent: php.method
edge_kinds:
- kind: entity_class
  description: "the entity type is defined by that PHP class, the class its attribute or annotation sits on"
  from: drupal.entity_type
  to: php.class
  # realizes: to, the to end is the code that carries out the from end; a walk that
  # reaches the from end adds the to end at the same hop.
  realizes: to
