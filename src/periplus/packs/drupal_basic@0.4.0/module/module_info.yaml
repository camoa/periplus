$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A module read from its info file. The stem is block_ways.info, so the id drops the .info ending.
# An info file writes a dependency as drupal:block; the project prefix is dropped, and so is a
# version constraint after the name, as in ai:ai (>=1.4.2). recommends (Drupal 11.2 and later) and
# test_dependencies list modules the same way, as recommends_module and test_depends_on_module. The
# configure key names the module's settings route, as configure_route; a route no mapped routing
# file declares, as a core one, ends at a referenced node. core_version_requirement, package and
# lifecycle are kept as attributes, as written.

rules:
- rule: module_from_info_file
  reads: file
  in:
  - module_root
  match:
    file: '*.info'
    filetype: yaml
    where:
    - key:
        name: type
        equals: module
  id:
    from: file_stem
    normalize:
    - replace: \.info$
      with: ''
  emits:
  - node:
      type: drupal.module
  - attribute:
      name: name
      from:
        key: name
  - attribute: {name: core_version_requirement, from: {key: core_version_requirement}}
  - attribute: {name: package, from: {key: package}}
  - attribute: {name: lifecycle, from: {key: lifecycle}}
  confidence: declared
- rule: module_from_info_file_edges
  reads: file
  in:
  - module_root
  match:
    file: '*.info'
    filetype: yaml
    where:
    - key:
        name: type
        equals: module
  id:
    from: file_stem
    normalize:
    - replace: \.info$
      with: ''
  emits:
  - edge:
      kind: depends_on_module
      from: this_node
      to:
        from:
          key: dependencies
        each: true
        pattern: '^(?:[^:( ]*:)?(?<module>[^ (]+)'
        template: '{module}'
  - edge:
      kind: recommends_module
      from: this_node
      to: {from: {key: recommends}, each: true, pattern: '^(?:[^:( ]*:)?(?<module>[^ (]+)', template: '{module}'}
  - edge:
      kind: test_depends_on_module
      from: this_node
      to: {from: {key: test_dependencies}, each: true, pattern: '^(?:[^:( ]*:)?(?<module>[^ (]+)', template: '{module}'}
  - edge:
      kind: configure_route
      from: this_node
      to: {from: {key: configure}, type: drupal.route}
  confidence: declared
