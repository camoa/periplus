$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A quoted text in a <name>.html.twig file shaped like a Drupal id, as an internal
# drupal.template_literal_site node <template>|<text> at the text's own line, under the same test of
# the text as mention/php_literal.yaml: a lowercase letter first, only lowercase letters, digits
# and . : / _ -, a letter or a digit last, a separator inside and 8 characters or more. Read as
# text, so a quoted text in an HTML attribute counts as one in a Twig expression does; a text
# inside a Twig comment makes nothing. The map rules of mention/mention_twig.yaml join the node to
# the thing it names, at the line of the text.

node_types:
- name: drupal.template_literal_site
  id_namespace: drupal.template_literal_site
  internal: true
  description: "internal: the place of a quoted text shaped like a Drupal id in one template, at the text's line"

rules:
- rule: twig_literal_site
  reads: file
  in:
  - module_root
  - theme_root
  match:
    file: '*.html'
    filetype: drupal_template_text
    text: '[''"](?<text>(?=[a-z0-9_.:/-]{8})[a-z][a-z0-9]*(?:[._:/-][a-z0-9]+)+)[''"]'
  id:
    template: '{template_name}|{text}'
  emits: [{node: {type: drupal.template_literal_site}}]
  confidence: mentioned
