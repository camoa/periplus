$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A views style plugin declared by the ViewsStyle attribute on its class. The id is the first argument,
# written alone or named id, and an attribute rule reads one of the two, so there is one node rule
# and one edge rule for each. An id that is not a text literal makes no plugin and is listed under
# skipped in the map report.

rules:
- rule: views_style_from_attribute
  reads: file
  in:
  - views_style_classes
  match:
    attribute: Drupal\views\Attribute\ViewsStyle
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: '0'
    must_be: string_literal
  emits:
  - node:
      type: drupal.views_style_plugin
  confidence: declared
- rule: views_style_from_named_attribute
  reads: file
  in:
  - views_style_classes
  match:
    attribute: Drupal\views\Attribute\ViewsStyle
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.views_style_plugin
  confidence: declared
- rule: views_style_from_attribute_edges
  reads: file
  in:
  - views_style_classes
  match:
    attribute: Drupal\views\Attribute\ViewsStyle
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: '0'
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
- rule: views_style_from_named_attribute_edges
  reads: file
  in:
  - views_style_classes
  match:
    attribute: Drupal\views\Attribute\ViewsStyle
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared

# The views style plugin's title, each written as text or as new TranslatableMarkup('...'), as
# attributes of the node the rule above makes. Read as text, since an attribute rule reads only a
# text literal; the ViewsStyle attribute is known by its name in this folder.
# A value that is not text, such as a constant, gives nothing.
- rule: views_style_words_from_attribute
  reads: file
  in: [views_style_classes]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '(?m)^#\[\s*(?:\\?Drupal\\views\\Attribute\\)?ViewsStyle\s*\((?=(?:\s*|(?:[^\[\]()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\((?:[^()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\([^()]*\))*\)|\[(?:[^\[\]''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\[(?:[^\[\]]|\[[^\[\]]*\])*\])*\])*?(?<![\w$])id\s*:\s*)[''\"](?<pid>[^''\"]+)[''\"])(?=(?:[^\[\]()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\((?:[^()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\([^()]*\))*\)|\[(?:[^\[\]''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\[(?:[^\[\]]|\[[^\[\]]*\])*\])*\])*?(?<![\w$])(?:title)\s*:\s*(?:new\s+\\?(?:\w+\\)*TranslatableMarkup\(\s*)?[''\"])(?:(?=(?:[^\[\]()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\((?:[^()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\([^()]*\))*\)|\[(?:[^\[\]''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\[(?:[^\[\]]|\[[^\[\]]*\])*\])*\])*?(?<![\w$])title\s*:\s*(?:new\s+\\?(?:\w+\\)*TranslatableMarkup\(\s*)?(?<q0>[''\"])(?<title>(?:(?!(?P=q0))[^\\]|\\.)*)(?P=q0)))?'
  id: {template: '{pid}'}
  emits:
  - node: {type: drupal.views_style_plugin}
  - attribute: {name: title, template: '{title}'}
  confidence: declared
