    filetype: drupal_php_text
    ending: [module, install, inc, theme, profile]
    text: '->\s*(?:(?<lt>setLinkTemplate)\(\s*[''"](?<rel>[\w-]+)[''"]\s*,|(?<ap>set)\(\s*[''"]admin_permission[''"]\s*,|(?<ac>addConstraint)\()\s*[''"](?<val>[^''"|]+)[''"]'
  values:
    name: *method
    in_class: {from: {enclosing: class_like_body, capture: class}}
    fn: {template: '{in_class}|{name}', normalize: [{replace: '^[^|]+\|.*$', with: ''}, {replace: '^\|', with: ''}]}
    rk: *rk
    la: {from: {enclosing: entity_type_local, capture: la}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    arr: {template: '{rk}={la}', normalize: [{replace: '^(\$\w+)=(?!\1\s*=).*$', with: ''}, {replace: '^[^=]*=[^=]*=\s*\$', with: ''}, {replace: '\[.*$', with: ''}]}
    etype: {template: '{rk}={la}', normalize: [{replace: '^(\$\w+)=(?!\1\s*=).*$', with: ''}, {replace: '^[^\[]*\[\s*[''"]', with: ''}, {replace: '[''"]\s*\]$', with: ''}]}
    replaces: {template: '{lt}{ap}{ac}', normalize: [{replace: '^setLinkTemplate$', with: 'has_link_template'}, {replace: '^set$', with: 'has_admin_permission'}, {replace: '^addConstraint$', with: 'constraint'}]}
    entry: {template: '{lt}{ap}{ac}={rel}', normalize: [{replace: '^\w+(?==)', with: ''}]}
  id: {template: 'php.function::{fn}|${arr}|{etype}|{replaces}|{entry}|={val}'}
  emits: [{node: {type: drupal.entity_type_alter_site}}]
  confidence: inferred

