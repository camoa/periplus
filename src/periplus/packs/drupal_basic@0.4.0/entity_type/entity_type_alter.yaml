    rk: *rk
    arr: *item_array
    etype: *item_etype
    relu: {template: '{rel}', normalize: [{replace: '-', with: '_'}]}
  id: {template: 'php.method::{psr4_class}::{method}|${arr}|{etype}|route|=entity.{etype}.{relu}|={val}'}
  emits: [{node: {type: drupal.entity_type_alter_site}}]
