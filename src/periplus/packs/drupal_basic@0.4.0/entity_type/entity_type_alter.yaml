# --- The run-time mark is kept only in an entity type alter hook, and not on a local alias -------

- rule: entity_type_runtime_outside_alter_method
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<cls>[^:]+)::(?<m>\w+)::[^:]*\(runtime entity type\)$'}]
    unless: [[{node: 'php.method::{cls}::{m}'}, {edge: implements_hook}, &alter_hook {id_matches: '^drupal\.hook::entity_type_(?:alter|build)$'}]]
  emits: [{withhold: this_node}]
  confidence: declared

- rule: entity_type_runtime_outside_alter_function
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<fn>\w+)::\$[^:]*\(runtime entity type\)$'}]
    unless: [[{node: 'php.function::{fn}'}, {edge: implements_hook}, *alter_hook]]
  emits: [{withhold: this_node}]
  confidence: declared

- rule: entity_type_runtime_on_local_alias
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: '^php\.call_site::(?<site>.+)\(runtime entity type\)$'}]
    follow: [{node: 'drupal.entity_type_alias_call::{site}'}]
  emits: [{withhold: this_node}]
  confidence: declared

# --- The joins ------------------------------------------------------------------------------------

# Each change in a method or function that implements either hook, on its own parameter.
- rule: alters_entity_type
  reads: map
  match:
    node_type: drupal.entity_type_alter_site
    where: [{id_matches: '^drupal\.entity_type_alter_site::(?<owner>php\.\w+::(?<name>[^|]+))\|(?<var>\$\w+)\|(?<etype>[^|]+)\|(?<replaces>(?!route\|)\w+)\|=(?<entry>[^|]+)?\|=(?<value>[^|]+)?$'}]
    follow:
    - {try: [{edge: entity_type_alter_class}, {id_matches: '^drupal\.class_ref::(?<cls>.+)$'}]}
    - {node: 'php.parameter::{name}::{var}'}
    - &owner {node: '{owner}'}
    - {edge: implements_hook}
    - *alter_hook
    - *owner
  emits:
  - edge: {kind: alters_entity_type, from: matched_node, to: {template: '{etype}', types: [drupal.entity_type]}, attributes: {replaces: {template: '{replaces}'}, entry: {template: '{entry}'}, value: {template: '{value}'}}}
  - edge: {kind: sets_entity_type_class, from: matched_node, to: {template: '{cls}', types: [php.class]}, attributes: {replaces: {template: '{replaces}'}, entity_type: {template: '{etype}'}}}
  confidence: inferred

# A link template's path given to the route the map holds for it.
- rule: altered_link_template_serves_route
  reads: map
  match:
    node_type: drupal.entity_type_alter_site
    where: [{id_matches: '^drupal\.entity_type_alter_site::(?<owner>php\.\w+::(?<name>[^|]+))\|(?<var>\$\w+)\|[^|]+\|route\|=(?<route>[^|]+)\|=(?<path>/[^|]*)$'}]
    follow:
    - {node: 'php.parameter::{name}::{var}'}
    - *owner
    - {edge: implements_hook}
    - *alter_hook
    - {node: 'drupal.route::{route}'}
  emits: [{edge: {kind: route_serves_path, from: matched_node, to: {template: '{path}', types: [drupal.url_path]}}}]
  confidence: inferred
