$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A method that implements a hook by the Hook attribute. The hook is named by the attribute's first
# argument, or by the argument named hook, and is a referenced node; the method is the node
# php_basic finds. Two rules, one per way of naming it.
#
# A third links a hook the attribute names, such as #[Hook('node_presave')], to the entity type it
# acts on, by the name pattern and exclusions of hook.yaml's hook_acts_on_entity_type. Read as text,
# because the engine takes an id pattern only on a declaration rule and no edge end from an
# attribute argument except as its target. Text sees no namespace, so any attribute written
# Hook( counts, and a hook name given as a constant gives nothing. A hook whose first part is no
# entity type, not excluded here, ends at a referenced drupal.entity_type node of that name. The
# attribute may be written with its namespace, and the hook may follow named arguments method,
# module or order.

rules:
- rule: hook_from_attribute
  reads: file
  in:
  - source
  match:
    attribute: Drupal\Core\Hook\Attribute\Hook
    filetype: php
    where:
    - applies_to: method_declaration
  emits:
  - edge:
      kind: implements_hook
      from: enclosing_method
      to:
        from:
          attribute_argument: '0'
  confidence: declared
- rule: hook_from_named_attribute
  reads: file
  in:
  - source
  match:
    attribute: Drupal\Core\Hook\Attribute\Hook
    filetype: php
    where:
    - applies_to: method_declaration
  emits:
  - edge:
      kind: implements_hook
      from: enclosing_method
      to:
        from:
          attribute_argument: hook
  confidence: declared
- rule: hook_attribute_acts_on_entity_type
  reads: file
  in:
  - source
  match:
    file: '**'
    filetype: drupal_php_text
    text: '#\[(?:\\Drupal\\Core\\Hook\\Attribute\\)?Hook\((?:\s*(?:method|module|order)\s*:(?:[^,()\[\]]|\([^()]*\)|\[[^\[\]]*\])*,)*\s*(?:hook:\s*)?[''"](?<hook>(?!entity_|block_view(?:_alter)?[''"]|contextual_links_view_alter[''"]|views_|preprocess_|theme_|jsonapi_|language_fallback_candidates_|post_update_)(?<etype>\w+?)_(?:access|create_access|create|presave|insert|update|predelete|delete|preload|load|storage_load|view|view_alter|build_defaults_alter|prepare_form|field_values_init|duplicate|revision_create|revision_delete|translation_create|translation_insert|translation_delete|form_mode_alter|view_mode_alter))[''"]'
  id: {template: '{etype}'}
  line: {capture: hook}
  emits:
  - edge:
      kind: hook_acts_on_entity_type
      from: {template: '{hook}', types: [drupal.hook]}
      to: this_node
  confidence: inferred

# The Hook attribute on a class, which Drupal 11.1 and later read as a hook implementation by the
# class's method: the method its argument method names, as #[Hook('x', method: 'm')] or
# #[Hook('x', 'm')], or __invoke when it names none, as #[Hook('x')]. One rule per form. Read as
# text, since the method is named only in the attribute. The class is named from the file's path
# by Drupal's PSR-4 layout, so a class kept outside src gives an edge from a method that does not
# exist, and the rules are inferred. The attribute is followed by other attributes or by the class
# line, with final, abstract or readonly. It may be written with its namespace,
# #[\Drupal\Core\Hook\Attribute\Hook(...)], and its named arguments in any order: a rule for the
# hook named after method, as #[Hook(method: 'm', hook: 'x')], and one for __invoke with the hook
# named after module or order, as #[Hook(module: 'y', hook: 'x')].
- rule: hook_from_class_attribute_named_method
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [php, api.php]
    text: '#\[(?:\\Drupal\\Core\\Hook\\Attribute\\)?Hook\((?:\s*(?:module|order)\s*:(?:[^,()\[\]]|\([^()]*\)|\[[^\[\]]*\])*,)*\s*(?:hook:\s*)?[''"](?<hook>\w+)[''"](?:[^\[\]]|\[[^\[\]]*\])*?\bmethod:\s*[''"](?<method>\w+)[''"](?:[^\[\]]|\[[^\[\]]*\])*\](?=\s*(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:(?:final|abstract|readonly)\s+)*class\b)'
  id: {template: '{hook}'}
  line: {capture: hook}
  emits: &class_hook_edge
  - edge:
      kind: implements_hook
      from: {template: '{psr4_class}::{method}', types: [php.method]}
      to: this_node
  confidence: inferred
- rule: hook_from_class_attribute_second_argument
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [php, api.php]
    text: '#\[(?:\\Drupal\\Core\\Hook\\Attribute\\)?Hook\(\s*(?:hook:\s*)?[''"](?<hook>\w+)[''"]\s*,\s*[''"](?<method>\w+)[''"](?:[^\[\]]|\[[^\[\]]*\])*\](?=\s*(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:(?:final|abstract|readonly)\s+)*class\b)'
  id: {template: '{hook}'}
  line: {capture: hook}
  emits: *class_hook_edge
  confidence: inferred
- rule: hook_from_class_attribute_invoke
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [php, api.php]
    text: '#\[(?:\\Drupal\\Core\\Hook\\Attribute\\)?Hook\(\s*(?:hook:\s*)?[''"](?<hook>\w+)[''"]\s*(?:,\s*(?:module|order):(?:[^\[\]()]|\[[^\[\]]*\]|\([^()]*\))*)?\)\s*\](?=\s*(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:(?:final|abstract|readonly)\s+)*class\b)'
  values:
    method: {template: '__invoke'}
  id: {template: '{hook}'}
  line: {capture: hook}
  emits: *class_hook_edge
  confidence: inferred
- rule: hook_from_class_attribute_method_first
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [php, api.php]
    text: '#\[(?:\\Drupal\\Core\\Hook\\Attribute\\)?Hook\((?:[^\[\]]|\[[^\[\]]*\])*?\bmethod:\s*[''"](?<method>\w+)[''"](?:[^\[\]]|\[[^\[\]]*\])*?\bhook:\s*[''"](?<hook>\w+)[''"](?:[^\[\]]|\[[^\[\]]*\])*\](?=\s*(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:(?:final|abstract|readonly)\s+)*class\b)'
  id: {template: '{hook}'}
  line: {capture: hook}
  emits: *class_hook_edge
  confidence: inferred
- rule: hook_from_class_attribute_invoke_named
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [php, api.php]
    text: '#\[(?:\\Drupal\\Core\\Hook\\Attribute\\)?Hook\((?:\s*(?:module|order)\s*:(?:[^,()\[\]]|\([^()]*\)|\[[^\[\]]*\])*,)+\s*hook:\s*[''"](?<hook>\w+)[''"]\s*(?:,\s*(?:module|order)\s*:(?:[^,()\[\]]|\([^()]*\)|\[[^\[\]]*\])*)*,?\s*\)\s*\](?=\s*(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:(?:final|abstract|readonly)\s+)*class\b)'
  values:
    method: {template: '__invoke'}
  id: {template: '{hook}'}
  line: {capture: hook}
  emits: *class_hook_edge
  confidence: inferred
