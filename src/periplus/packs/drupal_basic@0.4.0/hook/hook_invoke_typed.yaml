    node_type: drupal.typed_call
    where: [{id_matches: '(?s)^drupal\.typed_call::(?<call>(?<holder>[^$]+)::\$(?<var>\w+)->(?:invoke|invokeAllDeprecated)\((?:[^,()''"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|\([^()]*\))*,\s*[''"](?<hook>\w+)[''"]\s*[,)].*)$'}]
    follow: *parameter_walk
    unless: *parameter_unless
  emits: [{edge: {kind: invokes_hook, from: matched_node, to: {template: '{hook}', types: [drupal.hook]}}}]
  confidence: inferred

