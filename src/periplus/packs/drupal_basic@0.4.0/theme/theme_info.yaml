$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A theme read from its info file. The stem is simple_blog.info, so the id drops the .info ending.
# The base theme is written under the key 'base theme', with a space; a library as module/name.
# core_version_requirement, package and lifecycle are kept as attributes, as written.

rules:
- rule: theme_from_info_file
  reads: file
  in:
  - theme_root
  match:
    file: '*.info'
    filetype: yaml
    where:
    - key:
        name: type
        equals: theme
  id:
    from: file_stem
    normalize:
    - replace: \.info$
      with: ''
  emits:
  - node:
      type: drupal.theme
  - attribute:
      name: name
      from:
        key: name
  - attribute: {name: core_version_requirement, from: {key: core_version_requirement}}
  - attribute: {name: package, from: {key: package}}
  - attribute: {name: lifecycle, from: {key: lifecycle}}
  confidence: declared
- rule: theme_from_info_file_edges
  reads: file
  in:
  - theme_root
  match:
    file: '*.info'
    filetype: yaml
    where:
    - key:
        name: type
        equals: theme
  id:
    from: file_stem
    normalize:
    - replace: \.info$
      with: ''
  emits:
  - edge:
      kind: uses_library
      from: this_node
      to:
        from:
          key: libraries
        each: true
  confidence: declared
# 'base theme: false', the boolean, means no base theme, as core reads it. A quoted 'false' is a
# name, and still links.
- rule: theme_from_info_file_base_theme
  reads: file
  in:
  - theme_root
  match:
    file: '*.info'
    filetype: yaml
    where:
    - key:
        name: type
        equals: theme
    - key:
        name: base theme
        not_equals: false
  id:
    from: file_stem
    normalize:
    - replace: \.info$
      with: ''
  emits:
  - edge:
      kind: based_on_theme
      from: this_node
      to:
        from:
          key: base theme
  confidence: declared
