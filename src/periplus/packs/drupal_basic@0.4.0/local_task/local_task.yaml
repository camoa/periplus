$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A local task, a tab, named by its key in a links.task file. links_to_route (menu_link/menu_link.yaml)
# joins it to its route_name; task_base_route to the route whose tabs it joins, child_of_task to
# the task its parent_id names. link_class and link_deriver join a local task, a local action or a
# contextual link to the class or the deriver its class or deriver key names.

node_types:
- name: drupal.local_task
  description: "A local task (a tab), one top-level key of a module's links.task.yml file"
  id_namespace: drupal.local_task

edge_kinds:
- kind: task_base_route
  cause: to
  description: "The local task is a tab in the group of that route, named by its base_route key"
  from: drupal.local_task
  to: drupal.route
- kind: child_of_task
  cause: none
  description: "The local task is a child tab of that local task, named by its parent_id key"
  from: drupal.local_task
  to: drupal.local_task
- kind: link_class
  cause: from
  description: "The local task, local action or contextual link uses that class, named by its class key"
  from: [drupal.local_task, drupal.local_action, drupal.contextual_link]
  to: php.class
- kind: link_deriver
  cause: from
  description: "The local task, local action or contextual link has its entries made at run time by that deriver class, named by its deriver key"
  from: [drupal.local_task, drupal.local_action, drupal.contextual_link]
  to: php.class
