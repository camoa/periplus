$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A field formatter declared by the FieldFormatter attribute on its class, the twin of the
# annotation rule. Two rules because a rule that emits an edge emits no node. An id that is not a
# text literal makes no formatter and is listed under skipped.

rules:
- rule: field_formatter_from_attribute
  reads: file
  in:
  - field_formatter_classes
  match:
    attribute: Drupal\Core\Field\Attribute\FieldFormatter
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.field_formatter
  confidence: declared
- rule: field_formatter_from_attribute_edges
  reads: file
  in:
  - field_formatter_classes
  match:
    attribute: Drupal\Core\Field\Attribute\FieldFormatter
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared

# The field formatter's label and description, each written as text or as new TranslatableMarkup('...'), as
# attributes of the node the rule above makes. Read as text, since an attribute rule reads only a
# text literal; the FieldFormatter attribute is known by its name in this folder.
# A value that is not text, such as a constant, gives nothing.
- rule: field_formatter_words_from_attribute
  reads: file
  in: [field_formatter_classes]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '(?m)^#\[\s*(?:\\?Drupal\\Core\\Field\\Attribute\\)?FieldFormatter\s*\((?=(?:(?:[^\[\]()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\((?:[^()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\([^()]*\))*\)|\[(?:[^\[\]''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\[(?:[^\[\]]|\[[^\[\]]*\])*\])*\])*?(?<![\w$])id\s*:\s*)[''\"](?<pid>[^''\"]+)[''\"])(?=(?:[^\[\]()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\((?:[^()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\([^()]*\))*\)|\[(?:[^\[\]''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\[(?:[^\[\]]|\[[^\[\]]*\])*\])*\])*?(?<![\w$])(?:label|description)\s*:\s*(?:new\s+\\?(?:\w+\\)*TranslatableMarkup\(\s*)?[''\"])(?:(?=(?:[^\[\]()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\((?:[^()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\([^()]*\))*\)|\[(?:[^\[\]''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\[(?:[^\[\]]|\[[^\[\]]*\])*\])*\])*?(?<![\w$])label\s*:\s*(?:new\s+\\?(?:\w+\\)*TranslatableMarkup\(\s*)?(?<q0>[''\"])(?<label>(?:(?!(?P=q0))[^\\]|\\.)*)(?P=q0)))?(?:(?=(?:[^\[\]()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\((?:[^()''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\([^()]*\))*\)|\[(?:[^\[\]''\"]|''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*\"|\[(?:[^\[\]]|\[[^\[\]]*\])*\])*\])*?(?<![\w$])description\s*:\s*(?:new\s+\\?(?:\w+\\)*TranslatableMarkup\(\s*)?(?<q1>[''\"])(?<description>(?:(?!(?P=q1))[^\\]|\\.)*)(?P=q1)))?'
  id: {template: '{pid}'}
  emits:
  - node: {type: drupal.field_formatter}
  - attribute: {name: label, template: '{label}'}
  - attribute: {name: description, template: '{description}'}
  confidence: declared
