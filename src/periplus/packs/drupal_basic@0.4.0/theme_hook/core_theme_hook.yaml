$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A template in a theme named exactly for a theme hook of Drupal core overrides that hook's
# template: node.html.twig is the template of the theme hook node, views-view-fields.html.twig
# of views_view_fields. A suggestion of one, <core hook>--<anything>.html.twig, suggests that hook:
# node--article--teaser suggests node. Either gives the node drupal.theme_hook::<hook>, which no
# hook_theme of the mapped code declares, so that theme_hook/suggestion_hook.yaml joins the
# suggestion, theme_hook/preprocess_theme_hook.yaml joins a preprocess of the hook and
# route/entity_canonical_theme_hook.yaml joins an entity's canonical route to it. The core hooks
# are the path values core_hook and core_hook_suggestion of drupal_template_text in pack.yaml; a
# template of another name gives nothing here. A module's template of such a name gives nothing:
# Drupal finds templates by name only in themes, and a module registers its own, as a hook of its
# own or with a base hook. Inferred, because the file name is a convention.

rules:
- rule: core_theme_hook
  reads: file
  in: [theme_root]
  match: {file: '**', filetype: drupal_template_text, text: '\Z'}
  id: {template: '{core_hook}'}
  emits: [{node: {type: drupal.theme_hook}}]
  confidence: inferred

- rule: core_theme_hook_of_suggestion
  reads: file
  in: [theme_root]
  match: {file: '**', filetype: drupal_template_text, text: '\Z'}
  id: {template: '{core_hook_suggestion}'}
  emits: [{node: {type: drupal.theme_hook}}]
  confidence: inferred

- rule: core_theme_hook_template
  reads: file
  in: [theme_root]
  match: {file: '**', filetype: drupal_template_text, text: '\Z'}
  id: {template: '{template_name}'}
  emits:
  - edge:
      kind: theme_hook_template
      from: {template: '{core_hook}', type: drupal.theme_hook}
      to: this_node
  confidence: inferred
