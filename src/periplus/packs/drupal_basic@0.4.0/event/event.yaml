$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# An event, named as Symfony names it, by the text its name constant holds: drupal.event::<text>,
# as drupal.event::mymod.order_placed, whenever a mapped file declares that constant with a text.
# Each such constant of an event class is a drupal.event_constant, <class>::<CONST>, with a
# names_event edge to the event, so two constants that hold one text name one event. An event
# whose constant's text is not in the mapped code, as core's or Symfony's KernelEvents::REQUEST, or
# a contributed module's when its code is not on disk in contrib_module, is named by its constant,
# fully qualified, and stays referenced. An event dispatched as an object is named by its class's
# full name, as drupal.event::Drupal\my_module\Event\Paid.
# A subscriber method subscribes to an event and a method dispatches it.
#
# In a trait, self:: and static:: name the class that uses the trait, which the trait's own code
# never shows, so the event rules read self::NAME, static::NAME and the method of a callable on
# $this, self::class or static::class against the trait only when the trait itself declares that
# constant or method, as PHP 8.2 lets a trait declare a constant. Every other reading is the
# runtime mark with the text as written, even when one mapped class uses the trait: another class,
# mapped or not, may use it too, and an edge to one user would change meaning when a file elsewhere
# adds a use. Such a registration or dispatch is read both ways, and an internal site
# trait‖<the reading against the trait>‖<the runtime mark>‖<the constant or method> lets the two
# rules below keep one, before the passes. self::class, static::class, new self, new static and
# $this as a subscriber, an event object or a tag's class are the using class, so in a trait they
# are always the runtime mark.

node_types:
- name: drupal.event
  description: "an event, named by the text its name constant holds, or by the constant as <class>::<NAME> when the mapped code does not hold that text"
  id_namespace: drupal.event
# The id drupal.event::<text> of each text a mapped constant holds, as an end that only an event
# rule's node or edge brings into the map (event/event_name.yaml).
- name: drupal.event_text
  description: "the text a class constant holds, as a possible event name; only an event rule brings one into the map"
  parent: drupal.event
  internal: true
- name: drupal.event_constant
  description: "a class constant whose text names an event, as <class>::<NAME>"
  id_namespace: drupal.event_constant
# Each class constant, as <class>::<CONST>; event/event_name.yaml reads it in the map.
- name: drupal.class_constant
  description: "a constant that a class, interface or enum declares, as <class>::<NAME>"
  id_namespace: drupal.class_constant
  internal: true
# A subscription, at the line of its event's key: <event>|<use>|<listener>, the event as
# <class>::<CONST>. The use is subscribed for a class written through a use statement, and
# subscribed_here for a class of the file's own namespace or self:: and static::, which a map rule
# keeps when no use statement binds the class. A ->dispatch() call is
# <event>|<use>~<object>|<owner>|<key> (event/event_dispatch.yaml). A listener attribute or tag
# (event/event_listener.yaml) is <owner>|<method>|<use>|<event as written>, the owner a class or a
# service, the use listens, listens_derived, tagged or tagged_derived, or <owner>|<method>|<use>
# with listens_typed or tagged_typed when the event comes from the method's parameter type, and
# <event>|subscribed_runtime|<class>|<constant as written> for a drupal.runtime_listener, with
# subscribed_runtime_here for a constant of the file's own namespace.
- name: drupal.event_use
  description: "one event key in getSubscribedEvents(), one listener attribute or tag, or one ->dispatch() call, at its line, kept so map rules can make the event's edges"
  id_namespace: drupal.event_use
  internal: true

edge_kinds:
- kind: subscribed_by
  cause: from
  description: "the method listens to that event: a getSubscribedEvents() key, an AsEventListener attribute or a kernel.event_listener tag names it, or it is an exception handler"
  from: drupal.event
  to: php.method
- kind: dispatched_by
  cause: to
  description: "the method dispatches that event, by ->dispatch()"
  from: drupal.event
  to: php.method
# An end built from the kind's types must share one id namespace, so a dispatch in a function has
# its own kind.
- kind: dispatched_by_function
  cause: to
  description: "the function dispatches that event, by ->dispatch() in a file outside src"
  from: drupal.event
  to: php.function
- kind: names_event
  cause: none
  description: "the event constant holds that event's name as its text"
  from: drupal.event_constant
  to: drupal.event
- kind: is_event_constant
  cause: none
  description: "a self-link marking the class constant as an event name, because its class descends from an Event class or its class name ends in Events"
  from: drupal.class_constant
  to: drupal.class_constant
- kind: text_may_name_event
  cause: none
  description: "the constant text could be that event's name; read from const declarations as text, and kept out of the written map"
  from: drupal.constant_text
  to: drupal.event
# A use's listener, so a listener no mapped file declares stays in the map as an end, unresolved
# for a getSubscribedEvents() key.
- kind: use_names_listener
  cause: none
  description: "the subscription names that method, its listener"
  from: drupal.event_use
  to: php.method
# A key's priority, on the key itself, which the map rules read when the key's use_names_listener
# edge is taken back, as for a method a mapped ancestor declares.
- kind: use_has_priority
  cause: none
  description: "a self-link holding the subscription's priority"
  from: drupal.event_use
  to: drupal.event_use
# A priority written as a constant, self::LATE or X::PRIORITY, joined to that constant so the map
# rules read the integer a mapped file declares it with (constant/constant_text.yaml).
- kind: use_priority_constant
  cause: none
  description: "the use's priority is written as that class constant"
  from: drupal.event_use
  to: drupal.class_constant

rules:

# The trait declares the name: the runtime mark is taken back at the site's place.
- rule: trait_name_declared
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::trait‖(?<use>[^‖]+)‖(?<mark>[^‖]+)‖(?<check>[^‖]+)$'}]
    follow: [{node: '{check}'}, {node: '{mark}'}]
  emits: [{withhold: matched_node}]
  confidence: inferred

# It does not: the reading against the trait is taken back, and the runtime mark stays.
- rule: trait_name_undeclared
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::trait‖(?<use>[^‖]+)‖(?<mark>[^‖]+)‖(?<check>[^‖]+)$'}]
    follow: [{node: '{use}'}]
    unless: [[{node: '{check}'}]]
  emits: [{withhold: matched_node}]
  confidence: inferred
