$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Which class constants name an event. Each constant of a class, interface or enum is an internal
# node: the rule matches each const_element, so const A = 'a', B = 'b'; gives A and B, each at its
# own line, and the one-step name_child [name] reads the name, which has no field. Two map rules
# mark as an event constant each constant of a class that descends from Symfony's Event or
# Drupal's Event, through mapped parents, and each constant of a class whose name ends in Events,
# as core's KernelEvents names its events. Of such a class, an event constant holds a text or a
# string built from one, never an integer, a float, a boolean, null or an array
# (constant/constant_text.yaml); when the class documents some of its constants with @Event, as
# core's ConfigEvents does, only those and the ones a dispatch, a key, an attribute or a
# registration call names (use_names_constant, read from the use's id) are event constants.
# An event constant whose text constant/constant_text.yaml reads gives the event of that text and
# a drupal.event_constant that names it; one whose text it does not read gives the event of
# <class>::<CONST>.

node_types:
# The method name Symfony derives from an event's text, <on<Event>>|<the same in lower case>.
- name: drupal.derived_listener
  description: "the listener method name Symfony derives from an event's text, <name>|<name in lower case>"
  id_namespace: drupal.derived_listener
  internal: true

edge_kinds:
- kind: use_names_constant
  cause: none
  description: "the dispatch, key, attribute or registration names that class constant as its event, on the class written or the nearest mapped ancestor that declares it"
  from: drupal.event_use
  to: drupal.class_constant
- kind: documented_as_event
  cause: none
  description: "the class constant's docblock holds @Event, so its class documents which of its constants name events"
  from: drupal.class_constant
  to: drupal.event_use
- kind: derives_listener
  cause: none
  description: "a listener of the event this text names, with no method, is that derived method"
  from: drupal.constant_text
  to: drupal.derived_listener

rules:
- rule: class_constant
  reads: file
  in: [source]
  match: {declaration: const_element, name_child: [name], filetype: php}
  id: {from: [enclosing_type, declared_name], template: '{enclosing_type}::{declared_name}'}
  emits: [{node: {type: drupal.class_constant}}]
  confidence: declared

# Each text a constant holds, as the end drupal.event::<text>, so a map rule can reach the event
# of that text; constant_text_may_name_event's edge itself stays out of the map. A name after a
# comma or a space is read too, so const A = 'a', B = 'b'; and const A = 'a',B = 'b'; give both
# texts: the comma or semicolon after a text is looked at, not taken. A text is read as PHP reads
# the literal, as constant/constant_text.yaml says, so 'A\B' and 'A\\B' both give A\B. A text read
# that no event constant holds reaches nothing.
- rule: constant_text_may_name_event
  reads: file
  in: [source]
  match: &constant_text_match
    file: '**'
    filetype: drupal_php_text
    text: '(?:\bconst\s+(?:\w+\s+)?|[,\s]\s*)(?<constant>[A-Z][A-Z0-9_]*)\s*=\s*(?:''(?<single_text>(?:[^''\\]|\\.)+)''|"(?<double_text>(?:[^"\\$]|\\[\\"]|\\(?![ntrvef0-7$"\\]|x[0-9A-Fa-f]|u\{))+)")(?=\s*[;,])'
  values: &constant_text_values
    # \' is a quote in the single-quoted text, before §D; \" one in the double-quoted, after it.
    text: {template: '§S{single_text}§D{double_text}', normalize: [{replace: '\\\\', with: '¤'}, {replace: '\\''(?=[^§]*§D)', with: ''''}, {replace: '\\"(?![^§]*§D)', with: '"'}, {replace: '¤', with: '\'}, {replace: '^§S|§D', with: ''}]}
  id: {template: '{text}'}
  emits: [{edge: {kind: text_may_name_event, from: this_node, to: {template: '{text}', types: [drupal.event_text]}}}]
  confidence: inferred

# The method Symfony names for a listener that names this text as its event and no method:
# on<Event>, each letter at the start or after a character other than a letter or a digit made
# upper case and those characters dropped, as onKernelResponse for kernel.response, with that
# name in lower case, as PHP finds a method in any letter case. The listener rules read it in the
# map from a constant's text, where the listener holds only the constant (event/event_listener.yaml,
# event/listener_registration.yaml).
- rule: constant_text_derives_listener
  reads: file
  in: [source]
  match: *constant_text_match
  values:
    <<: *constant_text_values
    derived:
      template: '{text}'
      normalize: &derive
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))a', with: 'A'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))b', with: 'B'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))c', with: 'C'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))d', with: 'D'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))e', with: 'E'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))f', with: 'F'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))g', with: 'G'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))h', with: 'H'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))i', with: 'I'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))j', with: 'J'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))k', with: 'K'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))l', with: 'L'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))m', with: 'M'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))n', with: 'N'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))o', with: 'O'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))p', with: 'P'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))q', with: 'Q'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))r', with: 'R'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))s', with: 'S'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))t', with: 'T'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))u', with: 'U'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))v', with: 'V'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))w', with: 'W'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))x', with: 'X'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))y', with: 'Y'}
      - {replace: '(?:^|(?<=[^A-Za-z0-9]))z', with: 'Z'}
      - {replace: '[^A-Za-z0-9]', with: ''}
      - {replace: '^', with: 'on'}
    lower: {template: '{derived}', case: lower}
  id: {template: '{text}'}
  emits: [{edge: {kind: derives_listener, from: this_node, to: {template: '{derived}|{lower}', types: [drupal.derived_listener]}}}]
  confidence: inferred

# A contributed module's constants, in a file whose name holds Event at any depth of its src folder
# (contrib_event_source, pack.yaml), give their text and the method Symfony derives from it,
# and nothing else: no node of the map, only the internal class constant <class>::<NAME>, its
# class named by the file's path, so a custom subscriber's key ContribEvents::NAME names the event
# of that text and meets a listener that names the text. Nothing is read when the folder is absent.
- rule: contrib_constant_text
  reads: file
  in: [contrib_event_source]
  match: &contrib_constant_match
    file: '*Event*'
    filetype: drupal_php_text
    ending: [php, api.php]
    text: '(?:\bconst\s+(?:\w+\s+)?|[,\s]\s*)(?<constant>[A-Z][A-Z0-9_]*)\s*=\s*(?:''(?<single_text>(?:[^''\\]|\\.)+)''|"(?<double_text>(?:[^"\\$]|\\[\\"]|\\(?![ntrvef0-7$"\\]|x[0-9A-Fa-f]|u\{))+)")(?=\s*[;,])'
  values: *constant_text_values
  id: {template: '{text}'}
  emits: [{edge: {kind: has_constant_text, from: {template: '{psr4_class}::{constant}', types: [drupal.class_constant]}, to: this_node}}]
  confidence: inferred

- rule: contrib_constant_derives_listener
  reads: file
  in: [contrib_event_source]
  match: *contrib_constant_match
  values:
    <<: *constant_text_values
    derived: {template: '{text}', normalize: *derive}
    lower: {template: '{derived}', case: lower}
  id: {template: '{text}'}
  emits: [{edge: {kind: derives_listener, from: this_node, to: {template: '{derived}|{lower}', types: [drupal.derived_listener]}}}]
  confidence: inferred

# An event dispatched as an object is named by its class, so a listener that names X::class and no
# method has the method Symfony derives from the class's full name, as onDrupalMyModuleEventPaid
# for Drupal\my_module\Event\Paid. The full name is read where a file gives it: a class a file
# under src declares, by Drupal's PSR-4 layout; a class a use statement imports; and \A\B::class
# written with its namespace. Each is the same internal drupal.constant_text <full name> a constant
# of that text gives, so the listener rules read one derived name either way.
- rule: class_name_derives_listener
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '(?m)^(?:(?:final|abstract|readonly)\s+)*(?<declared>class)\s+\w+'
  values:
    derived: {template: '{psr4_class}', normalize: *derive}
    lower: {template: '{derived}', case: lower}
  id: {template: '{psr4_class}'}
  emits: [{edge: {kind: derives_listener, from: this_node, to: {template: '{derived}|{lower}', types: [drupal.derived_listener]}}}]
  confidence: inferred

- rule: imported_class_derives_listener
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '(?m)^use\s+\\?(?<path>(?:[A-Za-z_]\w*\\)+[A-Za-z_]\w*)(?:\s+as\s+\w+)?\s*;'
  values:
    derived: {template: '{path}', normalize: *derive}
    lower: {template: '{derived}', case: lower}
  id: {template: '{path}'}
  emits: [{edge: {kind: derives_listener, from: this_node, to: {template: '{derived}|{lower}', types: [drupal.derived_listener]}}}]
  confidence: inferred

- rule: written_class_derives_listener
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '(?<![\w\\])\\(?<path>[A-Za-z_]\w*(?:\\[A-Za-z_]\w*)+)::class\b'
  values:
    derived: {template: '{path}', normalize: *derive}
    lower: {template: '{derived}', case: lower}
  id: {template: '{path}'}
  emits: [{edge: {kind: derives_listener, from: this_node, to: {template: '{derived}|{lower}', types: [drupal.derived_listener]}}}]
  confidence: inferred

# A constant whose docblock holds @Event, in a class or an interface, as core's ConfigEvents
# documents each of its event names; the class is marked documented|<class>.
- rule: event_documented
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    reads_sections: [block_comment]
    text: '/\*\*(?:[^*@]|\*(?!/)|@(?!Event\b))*@Event\b(?:[^*]|\*(?!/))*\*/\s*(?:(?:final|public|protected|private)\s+)*const\s+(?:[A-Za-z_\\?|]+\s+)?(?<constant>[A-Z][A-Z0-9_]*)\s*='
  values:
    in_class: {from: {enclosing: class_like_body, capture: class}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    fns: {from: {enclosing: php_namespace, capture: ns}, join: '|', normalize: [{replace: '^.*\|', with: ''}, {replace: '(?<=.)$', with: '\'}]}
    cls: {template: '{fns}{in_class}'}
  line: {capture: constant}
  id: {template: '{cls}::{constant}'}
  emits: [{edge: {kind: documented_as_event, from: this_node, to: {template: 'documented|{cls}', type: drupal.event_use}}}]
  confidence: inferred

# An event constant holds a text or a string built from one, never an integer, a float, a boolean,
# null or an array. Of a class that documents none of its constants with @Event, each such constant
# is one; of a class that documents some, those it documents and those a dispatch, a subscriber key,
# a listener attribute, an addListener or an addTag call names.
# The class constant a dispatch, a subscriber key, a listener attribute, an addListener or an
# addTag call names as its event, read from the use's id.
- rule: use_names_constant
  reads: map
  match:
    node_type: drupal.event_use
    where: [{id_matches: '^drupal\.event_use::(?<cc>[^|:]+(?:::[^|:]+)*?)::(?<cn>[A-Z][A-Z0-9_]*)\|(?:disp|disp_here|reg|reg_here|subscribed|subscribed_here)[~|]'}]
    follow:
    - node: 'php.type::{cc}'
    - ancestors: [inherits, implements]
    - id_matches: '^php\.type::(?<cd>.+)$'
    - node: 'drupal.class_constant::{cd}::{cn}'
  emits: [{edge: {kind: use_names_constant, from: this_node, to: matched_node}}]
  confidence: inferred

- rule: event_constant_of_event_class
  reads: map
  match:
    node_type: drupal.class_constant
    where: [{id_matches: '^drupal\.class_constant::(?<class>[^:]+)::(?<constant>[A-Z][A-Z0-9_]*)$'}]
    follow:
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?:Symfony\\Contracts|Drupal\\Component)\\EventDispatcher\\Event$'
    unless: [[{edge: has_constant_int}], [{edge: has_other_value}], [{node: 'drupal.event_use::documented|{class}'}]]
  emits: [{edge: {kind: is_event_constant, from: this_node, to: this_node}}]
  confidence: inferred

- rule: event_constant_of_event_class_documented
  reads: map
  match:
    node_type: drupal.class_constant
    where: [{id_matches: '^drupal\.class_constant::(?<class>[^:]+)::(?<constant>[A-Z][A-Z0-9_]*)$'}]
    follow:
    - edge: documented_as_event
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?:Symfony\\Contracts|Drupal\\Component)\\EventDispatcher\\Event$'
    unless: [[{edge: has_constant_int}], [{edge: has_other_value}]]
  emits: [{edge: {kind: is_event_constant, from: this_node, to: this_node}}]
  confidence: inferred

- rule: event_constant_of_event_class_used
  reads: map
  match:
    node_type: drupal.class_constant
    where: [{id_matches: '^drupal\.class_constant::(?<class>[^:]+)::(?<constant>[A-Z][A-Z0-9_]*)$'}]
    follow:
    - incoming_edge: use_names_constant
    - node: 'php.type::{class}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::(?:Symfony\\Contracts|Drupal\\Component)\\EventDispatcher\\Event$'
    unless: [[{edge: has_constant_int}], [{edge: has_other_value}]]
  emits: [{edge: {kind: is_event_constant, from: this_node, to: this_node}}]
  confidence: inferred

- rule: event_constant_of_events_class
  reads: map
  match:
    node_type: drupal.class_constant
    where: [{id_matches: '^drupal\.class_constant::(?<class>[^:]*Events)::(?<constant>[A-Z][A-Z0-9_]*)$'}]
    unless: [[{edge: has_constant_int}], [{edge: has_other_value}], [{node: 'drupal.event_use::documented|{class}'}]]
  emits: [{edge: {kind: is_event_constant, from: this_node, to: this_node}}]
  confidence: inferred

- rule: event_constant_of_events_class_documented
  reads: map
  match:
    node_type: drupal.class_constant
    where: [{id_matches: '^drupal\.class_constant::(?<class>[^:]*Events)::(?<constant>[A-Z][A-Z0-9_]*)$'}]
    follow: [{edge: documented_as_event}]
    unless: [[{edge: has_constant_int}], [{edge: has_other_value}]]
  emits: [{edge: {kind: is_event_constant, from: this_node, to: this_node}}]
  confidence: inferred

- rule: event_constant_of_events_class_used
  reads: map
  match:
    node_type: drupal.class_constant
    where: [{id_matches: '^drupal\.class_constant::(?<class>[^:]*Events)::(?<constant>[A-Z][A-Z0-9_]*)$'}]
    follow: [{incoming_edge: use_names_constant}]
    unless: [[{edge: has_constant_int}], [{edge: has_other_value}]]
  emits: [{edge: {kind: is_event_constant, from: this_node, to: this_node}}]
  confidence: inferred

- rule: event_by_text
  reads: map
  match:
    node_type: drupal.class_constant
    follow:
    - edge: is_event_constant
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
  id: {template: '{text}'}
  emits: [{node: {type: drupal.event}}]
  confidence: inferred

# untexted is captured only where the constant has no text.
- rule: event_by_constant
  reads: map
  match:
    node_type: drupal.class_constant
    where: [{id_matches: '^drupal\.class_constant::(?<class>[^:]+)::(?<constant>[A-Z][A-Z0-9_]*)$'}]
    follow:
    - edge: is_event_constant
    - try: [{edge: has_constant_text}]
    - id_matches: '^(?:drupal\.constant_text::|drupal\.class_constant::(?<untexted>))'
  id: {template: '{class}::{constant}{untexted}'}
  emits: [{node: {type: drupal.event}}]
  confidence: inferred

- rule: event_constant
  reads: map
  match:
    node_type: drupal.class_constant
    where: [{id_matches: '^drupal\.class_constant::(?<class>[^:]+)::(?<constant>[A-Z][A-Z0-9_]*)$'}]
    follow: [{edge: is_event_constant}, {edge: has_constant_text}]
  id: {template: '{class}::{constant}'}
  emits: [{node: {type: drupal.event_constant}}]
  confidence: inferred

- rule: event_constant_names_event
  reads: map
  match:
    node_type: drupal.class_constant
    where: [{id_matches: '^drupal\.class_constant::(?<class>[^:]+)::(?<constant>[A-Z][A-Z0-9_]*)$'}]
    follow:
    - edge: is_event_constant
    - edge: has_constant_text
    - id_matches: '^drupal\.constant_text::(?<text>.+)$'
    - node: 'drupal.event::{text}'
  emits: [{edge: {kind: names_event, from: {template: '{class}::{constant}', type: drupal.event_constant}, to: matched_node}}]
  confidence: inferred
