$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# The routes core's route providers build from an entity type's link templates, which no routing
# file declares. An entity type whose route_provider names DefaultHtmlRouteProvider or
# AdminHtmlRouteProvider, or a mapped class that extends one, gets the route
# entity.<type>.<template name with each dash written as an underscore> for its add-form,
# edit-form and delete-form templates; for canonical when it has a view builder, which a content
# entity type has by default; for collection when it has a list builder and an admin_permission or
# a collection_permission; for add-page when its entity_keys name a bundle; and for
# delete-multiple-form when it has a delete-multiple-confirm form, as the provider's code checks.
# One that names RevisionHtmlRouteProvider, or a class that extends it, gets the route for its
# version-history, revision, revision-revert-form and revision-delete-form templates. Each route
# gets a route_serves_path edge to the template's path and a route_from_link_template edge to the
# entity type, holding the template's name in the edge attribute rel, both at the template's
# line. Inferred: core's provider code, not the mapped files, builds the route. A route a routing
# file also declares is the same node.
#
# Limits:
# - A provider that overrides its parent's route methods still reads as building every route its
#   parent builds; one that builds other routes gives none of them.
# - A route a route subscriber changes or removes keeps the path the template gives.
# - The derived path gets no shape_of_route edge, so a template's path of that shape does not
#   reach the route.

edge_kinds:
- kind: route_from_link_template
  cause: none
  description: "core's route provider builds the route from that entity type's link template; the edge attribute rel holds the template's name"
  from: drupal.route
  to: drupal.entity_type
- kind: builds_html_routes
  cause: none
  description: "step to route_from_link_template: the route provider entry names DefaultHtmlRouteProvider, AdminHtmlRouteProvider or a class that extends one"
  from: drupal.entity_type_entry
  to: php.class
- kind: builds_revision_routes
  cause: none
  description: "step to route_from_link_template: the route provider entry names RevisionHtmlRouteProvider or a class that extends it"
  from: drupal.entity_type_entry
  to: php.class

rules:
- rule: route_provider_builds_html_routes
  reads: map
  match:
    node_type: drupal.entity_type_entry
    where: [{id_matches: '^drupal\.entity_type_entry::(?<owner>[^|]+)\|route_provider\|[^|]+$'}]
    follow:
    - edge: entry_names_class
    - id_matches: '^drupal\.class_ref::Drupal\\Core\\Entity\\Routing\\(?:Default|Admin)HtmlRouteProvider$'
  emits: [{edge: {kind: builds_html_routes, from: this_node, to: {template: '{owner}', types: [php.class]}}}]
  confidence: declared

- rule: route_provider_subclass_builds_html_routes
  reads: map
  match:
    node_type: drupal.entity_type_entry
    where: [{id_matches: '^drupal\.entity_type_entry::(?<owner>[^|]+)\|route_provider\|[^|]+$'}]
    follow:
    - edge: entry_names_class
    - id_matches: '^drupal\.class_ref::(?<provider>.+)$'
    - node: 'php.type::{provider}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::Drupal\\Core\\Entity\\Routing\\(?:Default|Admin)HtmlRouteProvider$'
  emits: [{edge: {kind: builds_html_routes, from: this_node, to: {template: '{owner}', types: [php.class]}}}]
  confidence: inferred

- rule: route_provider_builds_revision_routes
  reads: map
  match:
    node_type: drupal.entity_type_entry
    where: [{id_matches: '^drupal\.entity_type_entry::(?<owner>[^|]+)\|route_provider\|[^|]+$'}]
    follow:
    - edge: entry_names_class
    - id_matches: '^drupal\.class_ref::Drupal\\Core\\Entity\\Routing\\RevisionHtmlRouteProvider$'
  emits: [{edge: {kind: builds_revision_routes, from: this_node, to: {template: '{owner}', types: [php.class]}}}]
  confidence: declared

- rule: route_provider_subclass_builds_revision_routes
