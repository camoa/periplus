  match:
    node_type: drupal.entity_type_entry
    where: [{id_matches: '^drupal\.entity_type_entry::(?<owner>[^|]+)\|route_provider\|[^|]+$'}]
    follow:
    - edge: entry_names_class
    - id_matches: '^drupal\.class_ref::(?<provider>.+)$'
    - node: 'php.type::{provider}'
    - ancestors: [inherits]
    - id_matches: '^php\.type::Drupal\\Core\\Entity\\Routing\\RevisionHtmlRouteProvider$'
  emits: [{edge: {kind: builds_revision_routes, from: this_node, to: {template: '{owner}', types: [php.class]}}}]
  confidence: inferred

- rule: link_template_route_form
  reads: map
  match:
    node_type: drupal.entity_type_entry
    where: [{id_matches: '^drupal\.entity_type_entry::(?<owner>[^|]+)\|links\|(?<rel>add-form|edit-form|delete-form)\|(?<route_rel>[^|]+)$'}]
    follow:
    - node: 'php.type::{owner}'
    - incoming_edge: builds_html_routes
    - node: 'php.type::{owner}'
    - edge: entity_type_of_class
    - id_matches: '^drupal\.entity_type::(?<type>.+)$'
  emits: [{edge: {kind: route_from_link_template, from: {template: 'entity.{type}.{route_rel}', types: [drupal.route]}, to: matched_node, attributes: {rel: {template: '{rel}'}}}}]
  confidence: inferred

- rule: link_template_route_path_form
  reads: map
  match:
    node_type: drupal.entity_type_entry
    where: [{id_matches: '^drupal\.entity_type_entry::(?<owner>[^|]+)\|links\|(?<rel>add-form|edit-form|delete-form)\|(?<route_rel>[^|]+)$'}]
    follow:
    - node: 'php.type::{owner}'
    - incoming_edge: builds_html_routes
    - node: 'php.type::{owner}'
    - edge: entity_type_of_class
    - id_matches: '^drupal\.entity_type::(?<type>.+)$'
    - node: 'drupal.entity_type_entry::{owner}|links|{rel}|{route_rel}'
    - edge: link_template_path
  emits: [{edge: {kind: route_serves_path, from: {template: 'entity.{type}.{route_rel}', types: [drupal.route]}, to: matched_node}}]
  confidence: inferred

