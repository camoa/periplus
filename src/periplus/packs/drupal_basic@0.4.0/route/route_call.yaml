$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A route named in a PHP call, joined to that route. A method or a function that builds a link from
# a route name gives a links_to_route edge to the route: Url::fromRoute('x'),
# Link::createFromRoute('t', 'x') and $this->redirect('x'). The first two are declared: a static
# call on a named class says what it is. $this->redirect is inferred: the object's name, not its
# type, says the class redirects to routes, as a controller or a form does. A route no mapped
# routing file declares ends at a referenced node.
#
# Limits:
# - A call links from the method or function around it, in a class, a trait or an enum.
# - A route name that is not a text literal gives no edge. One built at run time from a variable,
#   in a method, is kept by call/runtime_argument.yaml as a php.call_site marked resolution
#   runtime; a constant, and a variable in a function, go under skipped.
# - $this->redirect is matched on $this only; ->setRedirect on any object.
# - An entity's ->toUrl('rel') names a link template of an entity whose type the code holds only
#   at run time, and Url::fromRouteMatch() a route the request gives: neither gives an edge.
# - new Url($route) in a method is kept as a php.call_site marked resolution runtime, as
#   call/runtime_argument.yaml keeps Url::fromRoute($route); in a function of a module-family
#   file, call/runtime_argument_in_function.yaml keeps it the same way.
# - Url and Link are matched by their short name or written in full, with or without a leading
#   backslash.

rules:
# Url::fromRoute('my.route').
- rule: route_call_from_url
  reads: file
  in: [source]
  match:
    reference: scoped_call_expression
    name_child: [scope, name]
    filetype: php
    where:
    - name_matches: {child: scope, pattern: '(?:\\?Drupal\\Core\\)?Url'}
    - name_matches: {child: name, pattern: fromRoute}
    - name_matches: {child: arguments, pattern: &literal_first '(?s)\((?!\s*[^,$]*\$).*'}
  emits:
  - edge:
      kind: links_to_route
      from: enclosing_declaration
      to: {from: {argument: 0}, types: [drupal.route]}
  confidence: declared

# Url::fromRoute($route) in a function of a plain .php file, or outside any function: no rule marks
# it resolution runtime, so it stays under skipped. In a method or a module-family function
# call/runtime_argument.yaml and call/runtime_argument_in_function.yaml mark it.
- rule: route_call_from_url_unmarked
  reads: file
  in: [source]
  match:
    reference: scoped_call_expression
    name_child: [scope, name]
    filetype: php
    ending: [php]
    where:
    - name_matches: {child: scope, pattern: '(?:\\?Drupal\\Core\\)?Url'}
    - name_matches: {child: name, pattern: fromRoute}
    - name_matches: {child: arguments, pattern: &variable_first '(?s)\(\s*[^,$]*\$.*'}
    - &outside_method {not_within: [method_declaration]}
  emits:
  - edge:
      kind: links_to_route
      from: enclosing_declaration
      to: {from: {argument: 0}, types: [drupal.route]}
  confidence: declared

# Link::createFromRoute('Text', 'my.route'): the route name is the second argument.
- rule: route_call_from_link
  reads: file
  in: [source]
  match:
    reference: scoped_call_expression
    name_child: [scope, name]
    filetype: php
    where:
    - name_matches: {child: scope, pattern: '(?:\\?Drupal\\Core\\)?Link'}
    - name_matches: {child: name, pattern: createFromRoute}
  emits:
  - edge:
      kind: links_to_route
      from: enclosing_declaration
      to: {from: {argument: 1}, types: [drupal.route]}
  confidence: declared

# $this->redirect('my.route') in a controller or a form.
- rule: route_call_from_redirect
  reads: file
  in: [source]
  match:
    reference: member_call_expression
    name_child: name
    filetype: php
    where:
    - name_matches: {child: object, pattern: '\$this'}
    - name_matches: {child: name, pattern: redirect}
  emits:
  - edge:
      kind: links_to_route
      from: enclosing_declaration
      to: {from: {argument: 0}, types: [drupal.route]}
  confidence: inferred

# new Url('my.route') in a method of a class under src, read as text, since a new has no call
# arguments the tree rules read; a leading backslash or the full name Drupal\Core\Url also counts.
- rule: route_call_from_new_url
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: '\bnew\s+(?:\\?Drupal\\Core\\)?Url\s*\(\s*[''"](?<route>[\w.-]+)[''"]'
  values:
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{route}'}
  line: {capture: route}
  emits:
  - edge: {kind: links_to_route, from: {template: '{psr4_class}::{method}', types: [php.method]}, to: this_node}
  confidence: declared

# The same in a function of a module, install, inc, theme or profile file.
- rule: route_call_from_new_url_in_function
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [module, install, inc, theme, profile]
    text: '\bnew\s+(?:\\?Drupal\\Core\\)?Url\s*\(\s*[''"](?<route>[\w.-]+)[''"]'
  values:
    function: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{route}'}
  line: {capture: route}
  emits:
  - edge: {kind: links_to_route, from: {template: '{function}', types: [php.function]}, to: this_node}
  confidence: declared

# $form_state->setRedirect('my.route') in a form, or on any other object. The second condition
# passes over a first argument that holds a variable, which call/entity_definition_call.yaml's
# runtime_set_redirect_call, in a method, and its twin in a module-family function mark
# resolution runtime.
- rule: route_call_from_set_redirect
  reads: file
  in: [source]
  match:
    reference: member_call_expression
    name_child: name
    filetype: php
    where:
    - name_matches: {child: name, pattern: setRedirect}
    - name_matches: {child: arguments, pattern: *literal_first}
  emits:
  - edge:
      kind: links_to_route
      from: enclosing_declaration
      to: {from: {argument: 0}, types: [drupal.route]}
  confidence: inferred

# ->setRedirect($route) where no rule marks it, as route_call_from_url_unmarked.
- rule: route_call_from_set_redirect_unmarked
  reads: file
  in: [source]
  match:
    reference: member_call_expression
    name_child: name
    filetype: php
    ending: [php]
    where:
    - name_matches: {child: name, pattern: setRedirect}
    - name_matches: {child: arguments, pattern: *variable_first}
    - *outside_method
  emits:
  - edge:
      kind: links_to_route
      from: enclosing_declaration
      to: {from: {argument: 0}, types: [drupal.route]}
  confidence: inferred

# new Url($route) in a method of a class under src: the route is built at run time, a php.call_site
# <class>::<method>::new Url(runtime) marked resolution runtime, with its edges to and from the
# method. Two rules, because a rule that emits an edge emits no node.
- rule: runtime_route_call_from_new_url
  reads: file
  in: [source]
  match: &new_url_runtime
    file: '**'
    filetype: drupal_php_text
    text: '\bnew\s+(?:\\?Drupal\\Core\\)?Url\s*\(\s*[^,)''"$]*\$'
  values: &new_url_runtime_values
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{psr4_class}::{method}::new Url(runtime)'}
  emits:
  - node: {type: php.call_site}
  - attribute: {name: resolution, template: runtime}
  confidence: declared

- rule: runtime_route_call_from_new_url_in
  reads: file
  in: [source]
  match: *new_url_runtime
  values: *new_url_runtime_values
  id: {template: '{psr4_class}::{method}::new Url(runtime)'}
  emits:
  - edge: {kind: has_call_site, from: {template: '{psr4_class}::{method}', types: [php.method]}, to: this_node}
  - edge: {kind: call_site_in, from: this_node, to: {template: '{psr4_class}::{method}', types: [php.method]}}
  confidence: declared
