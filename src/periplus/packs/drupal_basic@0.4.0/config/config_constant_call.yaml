$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A configuration object named by self::X or static::X in \Drupal::config(), or get() or
# getEditable() on a config factory, as config_call.yaml reads them ($this->config(self::X) is read
# by config_form_edit.yaml), in a method: an internal drupal.config_constant_call_site node at the
# call's line, <class>::<method>|read|<arguments> or <class>::<method>|edit|<arguments>. The map
# rules walk from the class to its parents and interfaces, take the text of the nearest one that
# declares X (constant/constant_text.yaml), and give reads_config_object or edits_config_object
# from the method to that configuration object, at the line of each call, an unresolved one when
# no file declares it. A constant the class itself declares also gives config_call.yaml's edge.

node_types:
- name: drupal.config_constant_call_site
  id_namespace: drupal.config_constant_call_site
  internal: true
  description: "internal: a read or edit of configuration named by self::X or static::X in one method, at the call's line"

rules:
- rule: config_constant_read_by_drupal
  reads: file
  in: [source]
  match:
    declaration: scoped_call_expression
    name_child: name
    filetype: php
    where:
    - name_matches: {child: scope, pattern: '\\?Drupal'}
    - name_matches: {child: name, pattern: config}
    - &config_constant {name_matches: {child: arguments, pattern: '\(\s*(?:self|static)::[A-Z_][A-Z0-9_]*\s*\)'}}
    - &in_method {within: [method_declaration]}
  id:
    from: [enclosing_type, enclosing_method, arguments]
    template: '{enclosing_type}::{enclosing_method}|read|{arguments}'
  emits: &site [{node: {type: drupal.config_constant_call_site}}]
  confidence: declared

- rule: config_constant_read_from_factory
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: name
    filetype: php
    where:
    - name_matches: {child: object, pattern: &factory_object '(?s).*(?:configFactory|config_factory)(?:\(\))?|(?:\$container|\$this->container|\\?Drupal::getContainer\(\))->get\([''"]config\.factory[''"]\)|\\?Drupal::service\([''"]config\.factory[''"]\)'}
    - name_matches: {child: name, pattern: get}
    - *config_constant
    - *in_method
  id:
    from: [enclosing_type, enclosing_method, arguments]
    template: '{enclosing_type}::{enclosing_method}|read|{arguments}'
  emits: *site
  confidence: inferred

- rule: config_constant_edited_from_factory
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: name
    filetype: php
    where:
    - name_matches: {child: object, pattern: *factory_object}
    - name_matches: {child: name, pattern: getEditable}
    - *config_constant
    - *in_method
  id:
    from: [enclosing_type, enclosing_method, arguments]
    template: '{enclosing_type}::{enclosing_method}|edit|{arguments}'
  emits: *site
  confidence: inferred

- rule: config_read_by_class_constant
  reads: map
  match:
    node_type: drupal.config_constant_call_site
    where: [{id_matches: '^drupal\.config_constant_call_site::(?<class>[^:|]+)::(?<method>[^:|]+)\|read\|\(\s*(?:self|static)::(?<constant>\w+)\s*\)$'}]
    follow:
    - &class {node: 'php.type::{class}'}
    - &ancestors {ancestors: [inherits, implements]}
    - &owner {id_matches: '^php\.type::(?<owner>.+)$'}
    - &constant {node: 'drupal.class_constant::{owner}::{constant}'}
    - &text {edge: has_constant_text}
    - &config {id_matches: '^drupal\.constant_text::(?<config>.+)$'}
    - &method {node: 'php.method::{class}::{method}'}
  emits: [{edge: {kind: reads_config_object, from: matched_node, to: {template: '{config}', types: [drupal.config_object], on_miss: unresolved}}}]
  confidence: inferred

- rule: config_edited_by_class_constant
  reads: map
  match:
    node_type: drupal.config_constant_call_site
    where: [{id_matches: '^drupal\.config_constant_call_site::(?<class>[^:|]+)::(?<method>[^:|]+)\|edit\|\(\s*(?:self|static)::(?<constant>\w+)\s*\)$'}]
    follow: [*class, *ancestors, *owner, *constant, *text, *config, *method]
  emits: [{edge: {kind: edits_config_object, from: matched_node, to: {template: '{config}', types: [drupal.config_object], on_miss: unresolved}}}]
  confidence: inferred
