$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A block type is a bundle: it says what fields a content block has. It refines drupal.bundle and
# shares its id, block_content.<id>.

node_types:
- name: drupal.block_type
  description: "a custom block type read from a block_content.type.* config file; a bundle of block_content, as block_content.basic"
  parent: drupal.bundle
