$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Configuration of two contributed modules that switches a form's protection on or off, named by
# form id. config_names_form runs to a form the file switches on, and config_names_form_off to a
# form it names and leaves off, so each edge says which:
# - a captcha point, captcha.captcha_point.<id>, names its form in formId; its top-level status
#   decides, true or absent on, false off (config/config_status.yaml also writes it on the node);
# - honeypot.settings protects each form_settings key whose value is true. A key whose value is
#   false is off only while protect_all_forms is false, so it is read only below
#   protect_all_forms: false. Each item of unprotected_forms is off, whatever protect_all_forms is.
# The form_settings entries are read as text, through the spans honeypot_form_settings and
# honeypot_selected_forms the pack declares, since a data rule cannot test an entry's own true or
# false. A rule's id is the config object's, built from the captures of those spans, so a match
# outside them names an empty value and makes nothing.
#
# With protect_all_forms: true, honeypot protects every form outside unprotected_forms whose id has
# no non-letter right before system_, search_ or views_exposed_form_, as honeypot's form alter
# tests. The file then gives the config object the attribute protect_all_forms, as written, and an
# internal drupal.protect_all_forms node; a map rule gives config_names_form from honeypot.settings
# to each form id a mapped class returns that the test lets through and unprotected_forms does not
# list. That edge sits at the form id's place, where the map holds it. A form id the map only
# references, such as core's user_login_form, gets no edge; the attribute says the file protects it
# too. A form_settings key may be written bare or in quotes.

node_types:
- name: drupal.protect_all_forms
  description: "internal: a configuration object that switches protection on for every form"
  id_namespace: drupal.protect_all_forms
  internal: true

attributes:
- name: protect_all_forms
  on: [drupal.config_object]
  description: "honeypot.settings' protect_all_forms as written: true protects every form outside unprotected_forms"

edge_kinds:
- kind: config_names_form
  cause: to
  description: "The config object switches protection on for that form id: a captcha point whose status is not false, or a form honeypot.settings protects"
  from: drupal.config_object
  to: drupal.form_id
- kind: config_names_form_off
  cause: to
  description: "The config object names that form id and leaves its protection off: a captcha point whose status is false, or a form honeypot.settings leaves unprotected"
  from: drupal.config_object
  to: drupal.form_id

rules:
- rule: captcha_point_form
  reads: file
  in: [config, module_config]
  match:
    file: captcha.captcha_point.*
    filetype: yaml
    where:
    - key: {name: status, not_equals: false}
  id: {from: file_stem}
  emits:
  - edge:
      kind: config_names_form
      from: this_node
      to: {from: {key: formId}}
  confidence: declared

- rule: captcha_point_form_off
  reads: file
  in: [config, module_config]
  match:
    file: captcha.captcha_point.*
    filetype: yaml
    where:
    - key: {name: status, equals: false}
  id: {from: file_stem}
  emits:
  - edge:
      kind: config_names_form_off
      from: this_node
      to: {from: {key: formId}}
  confidence: declared

- rule: honeypot_unprotected_forms
  reads: file
  in: [config, module_config]
  match:
    file: honeypot.settings
    filetype: yaml
  id: {from: file_stem}
  emits:
  - edge:
      kind: config_names_form_off
      from: this_node
      to: {from: {key: unprotected_forms}, each: true}
  confidence: declared

# my_form: true inside form_settings, whatever protect_all_forms is.
- rule: honeypot_protected_form
  reads: file
  in: [config, module_config]
  match:
    file: honeypot.settings
    filetype: drupal_yml_text
    text: '(?m)^[ \t]+[''"]?(?<form>[A-Za-z0-9_]+)[''"]?:[ \t]*true[ \t]*$'
  values:
    config: {from: {enclosing: honeypot_form_settings, capture: mark}, normalize: [{replace: '^form_settings$', with: 'honeypot.settings'}]}
  id: {template: '{config}'}
  line: {capture: form}
  emits:
  - edge:
      kind: config_names_form
      from: this_node
      to: {template: '{form}', type: drupal.form_id}
  confidence: declared

# my_form: false inside form_settings, below protect_all_forms: false. Each span gives half of the
# id, so it is whole only inside both.
- rule: honeypot_unprotected_form_setting
  reads: file
  in: [config, module_config]
  match:
    file: honeypot.settings
    filetype: drupal_yml_text
    text: '(?m)^[ \t]+[''"]?(?<form>[A-Za-z0-9_]+)[''"]?:[ \t]*false[ \t]*$'
  values:
    owner: {from: {enclosing: honeypot_form_settings, capture: mark}, normalize: [{replace: '^form_settings$', with: 'honeypot'}]}
    name: {from: {enclosing: honeypot_selected_forms, capture: mark}, normalize: [{replace: '^protect_all_forms$', with: 'settings'}]}
  id: {template: '{owner}.{name}'}
  line: {capture: form}
  emits:
  - edge:
      kind: config_names_form_off
      from: this_node
      to: {template: '{form}', type: drupal.form_id}
  confidence: declared

# protect_all_forms as written, on the config object.
- rule: honeypot_protect_all_forms_setting
  reads: file
  in: [config, module_config]
  match:
    file: honeypot.settings
    filetype: yaml
    where:
    - key: {name: protect_all_forms, not_equals: null}
  id: {from: file_stem}
  emits:
  - node: {type: drupal.config_object}
  - attribute: {name: protect_all_forms, from: {key: protect_all_forms}}
  confidence: declared

- rule: honeypot_protects_all_forms
  reads: file
  in: [config, module_config]
  match:
    file: honeypot.settings
    filetype: yaml
    where:
    - key: {name: protect_all_forms, equals: true}
  id: {from: file_stem}
  emits: [{node: {type: drupal.protect_all_forms}}]
  confidence: declared

# Each form id a mapped class returns, while protect_all_forms is true, unless unprotected_forms
# lists it or honeypot's test passes it over.
- rule: honeypot_protects_every_form
  reads: map
  match:
    node_type: drupal.form_id
    where: [{id_matches: '^drupal\.form_id::(?!.*[^a-zA-Z](?:system|search|views_exposed_form)_)'}]
    follow: [{node: 'drupal.protect_all_forms::honeypot.settings'}]
    unless: [[{incoming_edge: config_names_form_off}, {id_matches: '^drupal\.config::honeypot\.settings$'}]]
  emits: [{edge: {kind: config_names_form, from: {template: 'honeypot.settings', types: [drupal.config_object]}, to: this_node}}]
  confidence: inferred
