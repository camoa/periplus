- {<<: *argument_row, rule: service_argument_flow_11, match: {file: '*.services', filetype: drupal_yml_text, text: '(?m)^[ \t]+arguments:[ \t]*\[\s*(?:(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|\[(?:[^\[\]''"]|''[^'']*''|"[^"]*"|\[[^\[\]]*\])*\]|\{(?:[^{}''"]|''[^'']*''|"[^"]*")*\}|[^,\[\]{}''"\s#](?:[^,\[\]{}\n#]*[^,\[\]{}\s#])?)\s*,\s*){11}(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|\[(?:[^\[\]''"]|''[^'']*''|"[^"]*"|\[[^\[\]]*\])*\]|\{(?:[^{}''"]|''[^'']*''|"[^"]*")*\}|[^,\[\]{}''"\s#](?:[^,\[\]{}\n#]*[^,\[\]{}\s#])?)'}, id: {template: '{in_services}|{service}|11', normalize: [{replace: '^services\|', with: ''}]}}
