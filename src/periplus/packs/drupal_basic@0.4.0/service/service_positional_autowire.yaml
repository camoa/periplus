$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# An autowired service whose arguments are a list. Symfony gives the listed arguments to the first
# parameters of the class's constructor, by position, and autowires each parameter after them, as
# service/service_autowire.yaml autowires a service with no list: the service whose id is the
# parameter's type, an injects_service edge at the parameter's line, inferred. The rules there give
# no edge to a service with a list; these give the edge to each parameter at a position past the
# list's end.
#
# A rule reads no position of a child, so position is read as text, one rule per place: each of the
# constructor's first twelve parameters, in a file under src, gets an internal
# drupal.constructor_parameter_position node, <class>::$<name>, with an edge to its position, 0 to
# 11; each argument of a list, written [a, b] or as lines that start with a dash, an internal
# drupal.service_positional_argument node, <service>|<index>. A list counts only when its whole is
# read, at most twelve arguments, each a quoted text, a plain word, a bracketed list or a braced map
# on its own, with no line between two dash lines: a drupal.service_arguments_read node. A list read
# in part, a parameter past the twelfth, or one the patterns do not read, as one with a comment in
# its declaration, gives no edge, as before. Each parameter before the place is an atomic group,
# (?>...), so a constructor with fewer parameters fails at once instead of trying every split.
#
# A service with a parent key gets no edge here: Symfony adds its list after the parent's
# arguments, so its positions depend on the parent.
#
# Limits: a named argument, $name: '@x', in a list's place is service_autowire.yaml's; a parameter
# typed by a class no service names gets the unresolved edge only, as service_autowire.yaml gives
# it; an Autowire attribute on a parameter past the list gives no edge here.

node_types:
- name: drupal.constructor_parameter_position
  description: "internal: a constructor parameter, <class>::$<name>, read by its place in the parameter list"
  id_namespace: drupal.constructor_parameter_position
  internal: true
- name: drupal.argument_position
  description: "internal: a position in a parameter or argument list, from 0"
  id_namespace: drupal.argument_position
  internal: true
- name: drupal.service_positional_argument
  description: "internal: an argument of a service's list, <service>|<index>"
  id_namespace: drupal.service_positional_argument
  internal: true
- name: drupal.service_arguments_read
  description: "internal: a service whose list of arguments the patterns read to its end"
  id_namespace: drupal.service_arguments_read
  internal: true

edge_kinds:
- kind: parameter_at_position
  cause: none
  description: "internal: the constructor parameter stands at that position"
  from: drupal.constructor_parameter_position
  to: drupal.argument_position

rules:
- &position_row
  rule: constructor_parameter_at_0
  reads: file
  in: [source]
  match: {file: '**', filetype: drupal_php_text, text: '\bfunction\s+__construct\s*\(\s*(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$(?<param>\w+)'}
  id: {template: '{psr4_class}::${param}'}
  line: {capture: param}
  emits: [{edge: {kind: parameter_at_position, from: this_node, to: {template: '0', types: [drupal.argument_position]}}}]
  confidence: declared
- {<<: *position_row, rule: constructor_parameter_at_1, match: {file: '**', filetype: drupal_php_text, text: '\bfunction\s+__construct\s*\(\s*(?>(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$\w+(?:\s*=\s*(?:''[^'']*''|"[^"]*"|\[[^\[\]]*\]|\w+\([^()]*\)|[^,()\[\]''"]+))?\s*,\s*){1}(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$(?<param>\w+)'}, emits: [{edge: {kind: parameter_at_position, from: this_node, to: {template: '1', types: [drupal.argument_position]}}}]}
- {<<: *position_row, rule: constructor_parameter_at_2, match: {file: '**', filetype: drupal_php_text, text: '\bfunction\s+__construct\s*\(\s*(?>(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$\w+(?:\s*=\s*(?:''[^'']*''|"[^"]*"|\[[^\[\]]*\]|\w+\([^()]*\)|[^,()\[\]''"]+))?\s*,\s*){2}(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$(?<param>\w+)'}, emits: [{edge: {kind: parameter_at_position, from: this_node, to: {template: '2', types: [drupal.argument_position]}}}]}
- {<<: *position_row, rule: constructor_parameter_at_3, match: {file: '**', filetype: drupal_php_text, text: '\bfunction\s+__construct\s*\(\s*(?>(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$\w+(?:\s*=\s*(?:''[^'']*''|"[^"]*"|\[[^\[\]]*\]|\w+\([^()]*\)|[^,()\[\]''"]+))?\s*,\s*){3}(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$(?<param>\w+)'}, emits: [{edge: {kind: parameter_at_position, from: this_node, to: {template: '3', types: [drupal.argument_position]}}}]}
- {<<: *position_row, rule: constructor_parameter_at_4, match: {file: '**', filetype: drupal_php_text, text: '\bfunction\s+__construct\s*\(\s*(?>(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$\w+(?:\s*=\s*(?:''[^'']*''|"[^"]*"|\[[^\[\]]*\]|\w+\([^()]*\)|[^,()\[\]''"]+))?\s*,\s*){4}(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$(?<param>\w+)'}, emits: [{edge: {kind: parameter_at_position, from: this_node, to: {template: '4', types: [drupal.argument_position]}}}]}
- {<<: *position_row, rule: constructor_parameter_at_5, match: {file: '**', filetype: drupal_php_text, text: '\bfunction\s+__construct\s*\(\s*(?>(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$\w+(?:\s*=\s*(?:''[^'']*''|"[^"]*"|\[[^\[\]]*\]|\w+\([^()]*\)|[^,()\[\]''"]+))?\s*,\s*){5}(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$(?<param>\w+)'}, emits: [{edge: {kind: parameter_at_position, from: this_node, to: {template: '5', types: [drupal.argument_position]}}}]}
- {<<: *position_row, rule: constructor_parameter_at_6, match: {file: '**', filetype: drupal_php_text, text: '\bfunction\s+__construct\s*\(\s*(?>(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$\w+(?:\s*=\s*(?:''[^'']*''|"[^"]*"|\[[^\[\]]*\]|\w+\([^()]*\)|[^,()\[\]''"]+))?\s*,\s*){6}(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$(?<param>\w+)'}, emits: [{edge: {kind: parameter_at_position, from: this_node, to: {template: '6', types: [drupal.argument_position]}}}]}
- {<<: *position_row, rule: constructor_parameter_at_7, match: {file: '**', filetype: drupal_php_text, text: '\bfunction\s+__construct\s*\(\s*(?>(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$\w+(?:\s*=\s*(?:''[^'']*''|"[^"]*"|\[[^\[\]]*\]|\w+\([^()]*\)|[^,()\[\]''"]+))?\s*,\s*){7}(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$(?<param>\w+)'}, emits: [{edge: {kind: parameter_at_position, from: this_node, to: {template: '7', types: [drupal.argument_position]}}}]}
- {<<: *position_row, rule: constructor_parameter_at_8, match: {file: '**', filetype: drupal_php_text, text: '\bfunction\s+__construct\s*\(\s*(?>(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$\w+(?:\s*=\s*(?:''[^'']*''|"[^"]*"|\[[^\[\]]*\]|\w+\([^()]*\)|[^,()\[\]''"]+))?\s*,\s*){8}(?:#\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*)*(?:[^,()\[\]''"$#/]|/(?![/*]))*\$(?<param>\w+)'}, emits: [{edge: {kind: parameter_at_position, from: this_node, to: {template: '8', types: [drupal.argument_position]}}}]}
