# A list read to its end: at most twelve arguments, each one the patterns above read.
- {<<: *argument_row, rule: service_arguments_read_flow, match: {file: '*.services', filetype: drupal_yml_text, text: '(?m)^[ \t]+arguments:[ \t]*\[\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|\[(?:[^\[\]''"]|''[^'']*''|"[^"]*"|\[[^\[\]]*\])*\]|\{(?:[^{}''"]|''[^'']*''|"[^"]*")*\}|[^,\[\]{}''"\s#](?:[^,\[\]{}\n#]*[^,\[\]{}\s#])?)(?:\s*,\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|\[(?:[^\[\]''"]|''[^'']*''|"[^"]*"|\[[^\[\]]*\])*\]|\{(?:[^{}''"]|''[^'']*''|"[^"]*")*\}|[^,\[\]{}''"\s#](?:[^,\[\]{}\n#]*[^,\[\]{}\s#])?)){0,11}\s*,?\s*\]'}, id: {template: '{in_services}|{service}', normalize: [{replace: '^services\|', with: ''}]}, emits: [{node: {type: drupal.service_arguments_read}}]}
- {<<: *argument_row, rule: service_arguments_read_block, match: {file: '*.services', filetype: drupal_yml_text, text: '(?m)^[ \t]+arguments:[ \t]*(?:#[^\n]*)?\n(?<li>[ \t]+)-[^\n]*\n(?:(?P=li)-[^\n]*\n){0,11}(?!(?P=li)[ \t]*\S)'}, id: {template: '{in_services}|{service}', normalize: [{replace: '^services\|', with: ''}]}, emits: [{node: {type: drupal.service_arguments_read}}]}

# The joins: each as its twin in service_autowire.yaml, for a service whose list is read whole,
# from a parameter at a position the list leaves out.
- rule: autowired_parameter_after_arguments_by_id
  reads: map
  match:
    node_type: drupal.constructor_parameter
    where: [{id_matches: &parameter '^drupal\.constructor_parameter::(?<class>[^:]+)::__construct::\$(?<param>\w+)::(?<type>[^:]+)$'}]
    unless: &has_autowire_attribute
    - [{node: 'php.property::{class}::${param}'}, {edge: has_attribute}, {id_matches: &di_attribute '^php\.type::Symfony\\Component\\DependencyInjection\\Attribute\\'}]
    - [{node: 'php.parameter::{class}::${param}'}, {edge: has_attribute}, {id_matches: *di_attribute}]
    follow:
    - node: 'drupal.service::{type}'
    - &class_service {node: 'php.type::{class}'}
    - &incoming_service {incoming_edge: service_class}
    - &service_id {id_matches: '^drupal\.service::(?<svc>.+)$'}
    - &own_autowire {node: 'drupal.autowired_service::{svc}'}
    - &read {node: 'drupal.service_arguments_read::{svc}'}
    - &position_node {node: 'drupal.constructor_parameter_position::{class}::${param}'}
    - &position_edge {edge: parameter_at_position}
    - &position {id_matches: '^drupal\.argument_position::(?<at>\d+)$'}
    - &the_service {node: 'drupal.service::{svc}'}
    unless_matched: &filled
    - [{node: 'drupal.service_positional_argument::{svc}|{at}'}]
    - [{node: 'drupal.service_named_argument::{svc}|{param}'}]
    - [{node: 'drupal.service::{svc}'}, {edge: extends_service}]
  emits: &by_id [{edge: {kind: injects_service, from: matched_node, to: {template: '{type}', types: [drupal.service]}, attributes: {autowired_by: {template: 'type is the service id or alias'}}}}]
  confidence: inferred

- rule: autowired_parameter_after_arguments_by_id_from_defaults
  reads: map
  match:
    node_type: drupal.constructor_parameter
    where: [{id_matches: *parameter}]
    unless: *has_autowire_attribute
    follow:
    - node: 'drupal.service::{type}'
    - *class_service
    - *incoming_service
    - *service_id
    - &file_autowire_1 {edge: in_services_file}
    - &file_autowire_2 {id_matches: '^drupal\.services_file::(?<file>.+)$'}
    - &file_autowire_3 {node: 'drupal.autowire_services_file::{file}'}
    - *read
    - *position_node
    - *position_edge
    - *position
    - *the_service
    unless_matched: &filled_by_defaults
    - [{node: 'drupal.service_positional_argument::{svc}|{at}'}]
    - [{node: 'drupal.service_named_argument::{svc}|{param}'}]
    - [{node: 'drupal.service::{svc}'}, {edge: extends_service}]
    - [{node: 'drupal.service_sets_autowire::{svc}'}]
  emits: *by_id
  confidence: inferred

- rule: autowired_parameter_after_arguments_unresolved
  reads: map
  match:
    node_type: drupal.constructor_parameter
    where: [{id_matches: *parameter}]
    unless: *has_autowire_attribute
    follow: [*class_service, *incoming_service, *service_id, *own_autowire, *read, *position_node, *position_edge, *position, *the_service]
    unless_matched:
    - [{node: 'drupal.service_positional_argument::{svc}|{at}'}]
    - [{node: 'drupal.service_named_argument::{svc}|{param}'}]
    - [{node: 'drupal.service::{svc}'}, {edge: extends_service}]
    - [{node: 'drupal.service::{type}'}]
  emits: &unresolved [{edge: {kind: injects_service, from: matched_node, to: {template: '{type}', types: [drupal.service], on_miss: unresolved}, attributes: {autowired_by: {template: 'type is the service id or alias'}}}}]
  confidence: inferred

- rule: autowired_parameter_after_arguments_unresolved_from_defaults
  reads: map
  match:
    node_type: drupal.constructor_parameter
    where: [{id_matches: *parameter}]
    unless: *has_autowire_attribute
    follow: [*class_service, *incoming_service, *service_id, *file_autowire_1, *file_autowire_2, *file_autowire_3, *read, *position_node, *position_edge, *position, *the_service]
    unless_matched:
    - [{node: 'drupal.service_positional_argument::{svc}|{at}'}]
    - [{node: 'drupal.service_named_argument::{svc}|{param}'}]
    - [{node: 'drupal.service::{svc}'}, {edge: extends_service}]
    - [{node: 'drupal.service_sets_autowire::{svc}'}]
    - [{node: 'drupal.service::{type}'}]
  emits: *unresolved
  confidence: inferred
