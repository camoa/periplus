# Each argument of a list, by its index: [a, b] written in brackets, and lines that start with a dash.
- &argument_row
  rule: service_argument_flow_0
  reads: file
  in: [module_root, services_source]
  match: {file: '*.services', filetype: drupal_yml_text, text: '(?m)^[ \t]+arguments:[ \t]*\[\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|\[(?:[^\[\]''"]|''[^'']*''|"[^"]*"|\[[^\[\]]*\])*\]|\{(?:[^{}''"]|''[^'']*''|"[^"]*")*\}|[^,\[\]{}''"\s#](?:[^,\[\]{}\n#]*[^,\[\]{}\s#])?)'}
  values: &entry_values
    in_services: {from: {enclosing: services_block, capture: mark}}
    service: {from: {enclosing: service_entry, capture: service}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{in_services}|{service}|0', normalize: [{replace: '^services\|', with: ''}]}
  emits: [{node: {type: drupal.service_positional_argument}}]
  confidence: declared
- {<<: *argument_row, rule: service_argument_block_0, match: {file: '*.services', filetype: drupal_yml_text, text: '(?m)^[ \t]+arguments:[ \t]*(?:#[^\n]*)?\n(?<li>[ \t]+)-[^\n]*'}, id: {template: '{in_services}|{service}|0', normalize: [{replace: '^services\|', with: ''}]}}
- {<<: *argument_row, rule: service_argument_flow_1, match: {file: '*.services', filetype: drupal_yml_text, text: '(?m)^[ \t]+arguments:[ \t]*\[\s*(?:(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|\[(?:[^\[\]''"]|''[^'']*''|"[^"]*"|\[[^\[\]]*\])*\]|\{(?:[^{}''"]|''[^'']*''|"[^"]*")*\}|[^,\[\]{}''"\s#](?:[^,\[\]{}\n#]*[^,\[\]{}\s#])?)\s*,\s*){1}(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*"|\[(?:[^\[\]''"]|''[^'']*''|"[^"]*"|\[[^\[\]]*\])*\]|\{(?:[^{}''"]|''[^'']*''|"[^"]*")*\}|[^,\[\]{}''"\s#](?:[^,\[\]{}\n#]*[^,\[\]{}\s#])?)'}, id: {template: '{in_services}|{service}|1', normalize: [{replace: '^services\|', with: ''}]}}
