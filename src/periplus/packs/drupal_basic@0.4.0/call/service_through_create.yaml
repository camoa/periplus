# The setter: $instance->p = $container->get('x');, the variable and service kept apart.
- rule: create_property
  reads: file
  in: [source]
  match: &setter {file: '**', filetype: drupal_php_text, text: '\$(?<var>\w+)\s*->\s*(?<prop>\w+)\s*=\s*(?:\$container\s*->\s*get|(?<![\w\\$>:])\\?Drupal::service)\(\s*[''"](?<svc>[\w.-]+)[''"]\s*\)\s*;'}
  values: *method_value
  id: &setter_id {template: '{psr4_class}::{method}|{prop}'}
  line: {capture: svc}
  emits: [{node: {type: drupal.create_property}}]
  confidence: declared

- rule: create_property_service
  reads: file
  in: [source]
  match: *setter
  values: *method_value
  id: *setter_id
  line: {capture: svc}
  emits: [{edge: {kind: create_property_service, from: this_node, to: {template: '{var}|{svc}', types: [drupal.create_property_value]}}}]
  confidence: declared

# The joins. Each goes up inherits from the call's class to the nearest class that declares the
# property, or that sets it in create().
- rule: service_through_create_argument
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: &this_call '^php\.call_site::(?<site>(?<class>[^:]+)::[^:]+::\$this->(?<member>\w+)->\w+)$'}]
    follow:
    - &up_1 {node: 'php.type::{class}'}
    - &up_2 {ancestors: [inherits]}
    - &up_3 {id_matches: '^php\.type::(?<owner>.+)$'}
    - &declared {node: 'php.property::{owner}::${member}'}
    - &assignment {node: 'php.member_assignment::{owner}::$this->{member}'}
    - {edge: assigned_value}
    - {id_matches: '^php\.member_assignment_value::[^:]+::__construct::\$this->\w+=\$(?<parameter>\w+)$'}
    - {node: 'drupal.constructor_parameter_position::{owner}::${parameter}'}
    - &at_1 {edge: parameter_at_position}
    - &at_2 {id_matches: '^drupal\.argument_position::(?<at>\d+)$'}
    - &arg_1 {node: 'drupal.create_argument::{owner}::create|{at}'}
    - &arg_2 {edge: create_argument_service}
    - &arg_3 {id_matches: '^drupal\.container_service::(?<svc>.+)$'}
    - &container_1 {node: 'php.parameter::{owner}::create::$container'}
    - &container_2 {edge: parameter_typed_as}
    - &container_3 {id_matches: '::\$container::(?:Symfony\\Component\\DependencyInjection|Psr\\Container)\\ContainerInterface$'}
    - &site_1 {node: 'php.call_site::{site}'}
    - &site_2 {edge: call_site_in}
    unless_matched:
    - [*assignment, {edge: assigned_value}, {id_matches: '^php\.member_assignment_value::[^:]+::(?!__construct::\$this->\w+=\${parameter}$)'}]
    - &child_create [{node: 'php.method::{class}::create'}, {id_matches: '^php\.method::(?!{owner}::create$)'}]
  emits: &to_service [{edge: {kind: calls_service, from: matched_node, to: {template: '{svc}', types: [drupal.service]}}}]
  confidence: declared

# A promoted parameter is the property: no plain parameter of that name, and no assignment.
- rule: service_through_create_promoted_argument
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: *this_call}]
    follow:
    - *up_1
    - *up_2
    - *up_3
    - *declared
    - {node: 'drupal.constructor_parameter_position::{owner}::${member}'}
    - *at_1
    - *at_2
    - *arg_1
    - *arg_2
    - *arg_3
    - *container_1
    - *container_2
    - *container_3
    - *site_1
    - *site_2
    unless_matched:
    - [{node: 'php.parameter::{owner}::__construct::${member}'}]
    - [*assignment]
    - *child_create
  emits: *to_service
  confidence: declared

- rule: service_through_create_property
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: *this_call}]
    follow:
    - *up_1
    - *up_2
    - *up_3
    - {node: 'drupal.create_property::{owner}::create|{member}'}
    - {edge: create_property_service}
    - &setter_value {id_matches: '^drupal\.create_property_value::(?<var>\w+)\|(?<svc>.+)$'}
    - &instance_1 {node: 'php.local_variable::{owner}::create::${var}'}
    - &instance_2 {edge: local_assigned}
    - &instance_3 {id_matches: '(?s)^php\.local_value::(?<value>[^:]+::\$\w+=(?:(?:parent|static|self)::create\s*\(|new\s+(?:static|self)\b).*)$'}
    - *container_1
    - *container_2
    - *container_3
    - *site_1
    - *site_2
    unless_matched:
    - [{node: 'php.member_assignment::{owner}::$this->{member}'}]
    - &other_instance [*instance_1, *instance_2, {id_matches: '(?s)^php\.local_value::(?!{value}$)'}]
  emits: *to_service
  confidence: declared

# The class: each service its own create() hands to the new object.
- rule: class_creates_with_argument
  reads: map
  match:
    node_type: drupal.create_argument
    where: [{id_matches: '^drupal\.create_argument::(?<owner>[^:]+)::create\|\d+$'}]
    follow: [*arg_2, *arg_3, *container_1, *container_2, *container_3, &the_class {node: 'php.type::{owner}'}]
  emits: &class_edge [{edge: {kind: creates_with_service, from: matched_node, to: {template: '{svc}', types: [drupal.service]}}}]
  confidence: declared

- rule: class_creates_with_property
  reads: map
  match:
    node_type: drupal.create_property
    where: [{id_matches: '^drupal\.create_property::(?<owner>[^:]+)::create\|\w+$'}]
    follow: [{edge: create_property_service}, *setter_value, *instance_1, *instance_2, *instance_3, *container_1, *container_2, *container_3, *the_class]
    unless_matched: [*other_instance]
  emits: *class_edge
  confidence: declared
