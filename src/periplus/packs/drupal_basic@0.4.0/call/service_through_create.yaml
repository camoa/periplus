$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A class Drupal builds through its static create(ContainerInterface $container, ...), the factory
# of a form, a controller, a plugin of ContainerFactoryPluginInterface or a deriver, and a call on
# a service that create() hands it. Drupal's convention has two ways of writing it:
# - return new static(..., $container->get('x'), ...) or new self(...): the Nth argument is the
#   service x, the constructor's Nth parameter gets it, and the constructor stores it,
#   $this->p = $param, or holds it as a promoted parameter, __construct(protected Foo $p);
# - $instance = parent::create($container) or new static(...), then $instance->p =
#   $container->get('x'), and return $instance.
# \Drupal::service('x') in place of $container->get('x') counts the same.
#
# Each call $this->p->m() in a method of that class, or of a child that has no create() of its
# own, gives calls_service from the method to x, at the call's line. The class gets
# creates_with_service to x at the line that names it. Declared: create()'s $container parameter
# is typed ContainerInterface, and the code names the service, the position and the property; it
# is stronger evidence than call/service_through_typed_member.yaml's type match. Where both give
# the same service, the map holds one edge with both rules' provenance rows.
#
# A rule reads no position of a child, so position is read as text, one rule per place, 0 to 11,
# as service/service_positional_autowire.yaml reads the constructor's parameters. An argument is
# read whole only when it is the call alone: $container->get('x')->get('y') hands its result, not
# x, and gives nothing.
#
# A property the class also assigns any other value, anywhere, gives no edge: the map does not
# know which value holds at the call. A setter's variable must hold parent::create(...),
# static::create(...), self::create(...), new static(...) or new self(...), and nothing else.
#
# Limits: a service named X::class, a create() whose container parameter is not named $container,
# a constructor that hands a parameter to parent::__construct(), a call through a property only a
# parent's constructor stores, and a parameter past the twelfth give no edge here. A class built
# with new elsewhere, as in a test, is not seen: the edge says what create() gives.

node_types:
- name: drupal.create_argument
  description: "internal: an argument of new static() or new self(), <class>::<method>|<position>, that gets a service from the container"
  id_namespace: drupal.create_argument
  internal: true
- name: drupal.container_service
  description: "internal: a service id an argument or a setter gets from the container, before the map joins it to the service"
  id_namespace: drupal.container_service
  internal: true
- name: drupal.create_property
  description: "internal: a property a method sets on a variable's object to a service from the container, <class>::<method>|<property>"
  id_namespace: drupal.create_property
  internal: true
- name: drupal.create_property_value
  description: "internal: the variable and service of a create_property, <variable>|<service>"
  id_namespace: drupal.create_property_value
  internal: true

edge_kinds:
- kind: create_argument_service
  cause: none
  description: "internal: the argument gets that service from the container"
  from: drupal.create_argument
  to: drupal.container_service
- kind: create_property_service
  cause: none
  description: "internal: the property is set on that variable's object to that service"
  from: drupal.create_property
  to: drupal.create_property_value
- kind: creates_with_service
  cause: from
  description: "the class's create() gets that service from the container and hands it to the new object, as a constructor argument or by setting a property"
  from: php.class
  to: drupal.service

rules:

- &argument_node
  rule: create_argument_at_0
  reads: file
  in: [source]
  match: {file: '**', filetype: drupal_php_text, text: '\bnew\s+(?:static|self)\s*\(\s*(?:\$container\s*->\s*get|(?<![\w\\$>:])\\?Drupal::service)\(\s*[''"](?<svc>[\w.-]+)[''"]\s*\)\s*(?=[,)])'}
  values: &method_value
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{psr4_class}::{method}|0'}
  line: {capture: svc}
  emits: [{node: {type: drupal.create_argument}}]
  confidence: declared
- &argument_edge
  rule: create_argument_service_at_0
  reads: file
  in: [source]
  match: {file: '**', filetype: drupal_php_text, text: '\bnew\s+(?:static|self)\s*\(\s*(?:\$container\s*->\s*get|(?<![\w\\$>:])\\?Drupal::service)\(\s*[''"](?<svc>[\w.-]+)[''"]\s*\)\s*(?=[,)])'}
  values: *method_value
  id: {template: '{psr4_class}::{method}|0'}
  line: {capture: svc}
  emits: [{edge: {kind: create_argument_service, from: this_node, to: {template: '{svc}', types: [drupal.container_service]}}}]
  confidence: declared
