- {<<: *argument_service, rule: service_argument_service_block_1, match: {file: '*.services', filetype: drupal_yml_text, text: '(?m)^[ \t]+arguments:[ \t]*(?:#[^\n]*)?\n(?<li>[ \t]+)-[^\n]*\n(?P=li)-[ \t]*[''"]@\??(?!(?:[\w-]+\.)*inner[''"])(?<svc>\w[\w.-]*)[''"][ \t]*(?:#[^\n]*)?$'}, id: {template: '{in_services}|{service}|1', normalize: [{replace: '^services\|', with: ''}]}}
