$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A service a services file builds with a list of arguments, ['@x', ...] or lines that start with
# a dash, and a call on one of them: the list's Nth argument @x, or @?x, goes to the Nth parameter
# of the class's constructor, which stores it, $this->p = $param, or holds it as a promoted
# parameter. Each call $this->p->m() in a method of that class gives calls_service from the method
# to x, at the call's line. Declared: the services file names the service and its place, and the
# class's code names the parameter and the property. It joins where
# call/service_through_typed_member.yaml cannot, as a core interface in a map that holds no core
# services file; where both give the same service, the map holds one edge with both rows.
#
# The list's place is read as text, as service/service_positional_autowire.yaml reads it, places 0
# to 11, and only from a list read whole. @.inner and @<id>.inner, the service a decorator
# replaces, are left out.
#
# No edge: a service with a parent key, whose places depend on the parent; a class two services
# build, as the call cannot say which; a property the class also assigns any other value; a call
# in a child class, which its own service builds; a named argument, $name: '@x'.

edge_kinds:
- kind: positional_argument_service
  cause: none
  description: "internal: the services file gives that service at this place of the list"
  from: drupal.service_positional_argument
  to: drupal.container_service

rules:

- &argument_service
  rule: service_argument_service_flow_0
  reads: file
  in: [module_root]
  match: {file: '*.services', filetype: drupal_yml_text, text: '(?m)^[ \t]+arguments:[ \t]*\[\s*[''"]@\??(?!(?:[\w-]+\.)*inner[''"])(?<svc>\w[\w.-]*)[''"]\s*[,\]]'}
  values:
    in_services: {from: {enclosing: services_block, capture: mark}}
    service: {from: {enclosing: service_entry, capture: service}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{in_services}|{service}|0', normalize: [{replace: '^services\|', with: ''}]}
  line: {capture: svc}
  emits: [{edge: {kind: positional_argument_service, from: this_node, to: {template: '{svc}', types: [drupal.container_service]}}}]
  confidence: declared
- {<<: *argument_service, rule: service_argument_service_block_0, match: {file: '*.services', filetype: drupal_yml_text, text: '(?m)^[ \t]+arguments:[ \t]*(?:#[^\n]*)?\n(?<li>[ \t]+)-[ \t]*[''"]@\??(?!(?:[\w-]+\.)*inner[''"])(?<svc>\w[\w.-]*)[''"][ \t]*(?:#[^\n]*)?$'}, id: {template: '{in_services}|{service}|0', normalize: [{replace: '^services\|', with: ''}]}}
