- rule: service_through_services_argument
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: &this_call '^php\.call_site::(?<site>(?<class>[^:]+)::[^:]+::\$this->(?<member>\w+)->\w+)$'}]
    follow:
    - &declared {node: 'php.property::{class}::${member}'}
    - &assignment {node: 'php.member_assignment::{class}::$this->{member}'}
    - {edge: assigned_value}
    - {id_matches: '^php\.member_assignment_value::[^:]+::__construct::\$this->\w+=\$(?<parameter>\w+)$'}
    - {node: 'drupal.constructor_parameter_position::{class}::${parameter}'}
    - &at_1 {edge: parameter_at_position}
    - &at_2 {id_matches: '^drupal\.argument_position::(?<at>\d+)$'}
    - &service_1 {node: 'php.type::{class}'}
    - &service_2 {incoming_edge: service_class}
    - &service_3 {id_matches: '^drupal\.service::(?<sid>.+)$'}
    - &read {node: 'drupal.service_arguments_read::{sid}'}
    - &argument_1 {node: 'drupal.service_positional_argument::{sid}|{at}'}
    - &argument_2 {edge: positional_argument_service}
    - &argument_3 {id_matches: '^drupal\.container_service::(?<svc>.+)$'}
    - &site_1 {node: 'php.call_site::{site}'}
    - &site_2 {edge: call_site_in}
    unless_matched:
    - [*assignment, {edge: assigned_value}, {id_matches: '^php\.member_assignment_value::[^:]+::(?!__construct::\$this->\w+=\${parameter}$)'}]
    - &shared [*service_1, *service_2, {id_matches: '^drupal\.service::(?!{sid}$)'}]
    - &parent [{node: 'drupal.service::{sid}'}, {edge: extends_service}]
  emits: &to_service [{edge: {kind: calls_service, from: matched_node, to: {template: '{svc}', types: [drupal.service]}}}]
  confidence: declared

- rule: service_through_services_promoted_argument
  reads: map
  match:
    node_type: php.call_site
    where: [{id_matches: *this_call}]
    follow: [*declared, {node: 'drupal.constructor_parameter_position::{class}::${member}'}, *at_1, *at_2, *service_1, *service_2, *service_3, *read, *argument_1, *argument_2, *argument_3, *site_1, *site_2]
    unless_matched:
    - [{node: 'php.parameter::{class}::__construct::${member}'}]
    - [*assignment]
    - *shared
    - *parent
  emits: *to_service
  confidence: declared
