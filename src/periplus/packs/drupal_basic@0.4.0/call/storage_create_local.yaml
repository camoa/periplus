$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# $storage = ...->getStorage('invoice'); then $storage->create([...]) later in the same method or
# function: a creates_entity_type edge (call/entity_create_static.yaml) from that method or
# function to the entity type the literal names, at the create call's line. Read as text, as
# '#theme' is: the method's class is the one the file's path names by Drupal's PSR-4 layout, and a
# function is read in a module, install, inc, theme, profile, deploy.php or post_update.php
# file.
#
# Inferred: the variable is followed from its assignment as text.
#
# Missing results: a variable assigned again between the two, a create call inside a closure or
# a later function, and a getStorage whose argument is not a text literal give no edge. The call
# may be written $storage?->create(...) too.

rules:
- rule: storage_create_local_in_method
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    text: &local_text '\$(?<var>\w+)\s*=\s*[^;]*->\s*getStorage\(\s*[''"](?<et>[a-z0-9_]+)[''"]\s*\)\s*;(?:(?!\bfunction\b|\$(?P=var)\s*=[^=>])[\s\S])*?(?<call>\$(?P=var)\s*\??->\s*create)\s*\('
  values:
    method: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{et}'}
  line: {capture: call}
  emits:
  - edge:
      kind: creates_entity_type
      from: {template: '{psr4_class}::{method}', types: [php.method]}
      to: this_node
  confidence: inferred

- rule: storage_create_local_in_function
  reads: file
  in: [source]
  match:
    file: '**'
    filetype: drupal_php_text
    ending: [module, install, inc, theme, profile]
    text: *local_text
  values:
    function: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{et}'}
  line: {capture: call}
  emits:
  - edge:
      kind: creates_entity_type
      from: {template: '{function}', types: [php.function]}
      to: this_node
  confidence: inferred

- rule: storage_create_local_in_deploy_function
  reads: file
  in: [source]
  match:
    file: '*.deploy'
    filetype: drupal_php_text
    ending: [php, api.php]
    text: *local_text
  values:
    function: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{et}'}
  line: {capture: call}
  emits:
  - edge:
      kind: creates_entity_type
      from: {template: '{function}', types: [php.function]}
      to: this_node
  confidence: inferred

- rule: storage_create_local_in_post_update_function
  reads: file
  in: [source]
  match:
    file: '*.post_update'
    filetype: drupal_php_text
    ending: [php, api.php]
    text: *local_text
  values:
    function: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
  id: {template: '{et}'}
  line: {capture: call}
  emits:
  - edge:
      kind: creates_entity_type
      from: {template: '{function}', types: [php.function]}
      to: this_node
  confidence: inferred
