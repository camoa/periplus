$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# The twins of call/runtime_argument.yaml for a call in a function of a module-family file, such
# as a hook in a .module file. A function there holds what its body holds, as a class does, so the
# enclosing type of a call in it is the function. Each twin matches as the method twin it mirrors,
# and its id is that twin's without the method part. The last rules twin
# call/entity_definition_call.yaml's ->setRedirect($route) and route/route_call.yaml's
# new Url($route). $this->redirect() and config/config_runtime_name.yaml's $this->config($name)
# have no twin: they need $this.
#
# Limits:
# - Module-family files only. A plain function in a .php file stays under skipped, because there a
#   twin keyed on the enclosing type would fire inside every method of a class and merge them.
# - A class method in a module-family file is matched by the method twins alone: each twin here
#   carries holder: function_definition, so it fires only when its nearest holder is a function.

rules:
# The node is the one php_basic's find_function makes; drupal_js_basic's php_function_holds_body
# emits it in every PHP file.
- rule: php_function_holds_module_body
  reads: file
  in: [source]
  match:
    declaration: function_definition
    name_child: name
    body_child: body
    filetype: php
    ending: &module_endings [module, install, theme, inc, profile]
  id: {from: qualified_name}
  emits: [{node: {type: php.function}}]
  confidence: declared

# Url::fromRoute('my.' . $name).
- rule: runtime_route_call_from_url_in_function
  reads: file
  in: [source]
  match:
    declaration: scoped_call_expression
    name_child: name
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &url_where
    - name_matches: {child: scope, pattern: '(?:\\?Drupal\\Core\\)?Url'}
    - name_matches: {child: name, pattern: fromRoute}
    - name_matches: {child: arguments, pattern: &first_variable '(?s)\(\s*[^,$]*\$.*'}
  id: &scoped_id
    from: [enclosing_type, scope, name]
    template: "{enclosing_type}::{scope}::{name}"
  emits: &runtime_node
  - node: {type: php.call_site}
  - attribute: {name: resolution, template: runtime}
  confidence: declared

- rule: runtime_route_call_from_url_in_function_in
  reads: file
  in: [source]
  match:
    declaration: scoped_call_expression
    name_child: name
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *url_where
  id: *scoped_id
  emits: &runtime_edges
  - edge: {kind: has_call_site, from: enclosing_class, to: this_node}
  - edge: {kind: call_site_in, from: this_node, to: enclosing_class}
  confidence: declared

# Link::createFromRoute($text, $route): the second argument.
- rule: runtime_route_call_from_link_in_function
  reads: file
  in: [source]
  match:
    declaration: scoped_call_expression
    name_child: name
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &link_where
    - name_matches: {child: scope, pattern: '(?:\\?Drupal\\Core\\)?Link'}
    - name_matches: {child: name, pattern: createFromRoute}
    - name_matches: {child: arguments, pattern: '(?s)\((?:[^,()]|\([^()]*\))*,\s*[^,$]*\$.*'}
  id: *scoped_id
  emits: *runtime_node
  confidence: declared

- rule: runtime_route_call_from_link_in_function_in
  reads: file
  in: [source]
  match:
    declaration: scoped_call_expression
    name_child: name
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *link_where
  id: *scoped_id
  emits: *runtime_edges
  confidence: declared

# \Drupal::service($id) and \Drupal::cache($bin).
- rule: runtime_service_call_in_function
  reads: file
  in: [source]
  match:
    declaration: scoped_call_expression
    name_child: name
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &service_where
    - name_matches: {child: scope, pattern: '\\?Drupal'}
    - name_matches: {child: name, pattern: 'service|cache'}
    - name_matches: {child: arguments, pattern: *first_variable}
  id: *scoped_id
  emits: *runtime_node
  confidence: declared

- rule: runtime_service_call_in_function_in
  reads: file
  in: [source]
  match:
    declaration: scoped_call_expression
    name_child: name
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *service_where
  id: *scoped_id
  emits: *runtime_edges
  confidence: declared

# \Drupal::getContainer()->get($id).
- rule: runtime_container_get_call_in_function
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &container_where
    - name_matches: {child: object, pattern: &container_object '\$container|\$this->(?:container|getContainer\(\))|(?:\\?Drupal|static|self)::getContainer\(\)'}
    - name_matches: {child: name, pattern: get}
    - name_matches: {child: arguments, pattern: *first_variable}
  id: &member_runtime_id
    from: [enclosing_type, declared_name, name]
    template: "{enclosing_type}::{declared_name}->{name}(runtime)"
  emits: *runtime_node
  confidence: declared

- rule: runtime_container_get_call_in_function_in
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *container_where
  id: *member_runtime_id
  emits: *runtime_edges
  confidence: declared

# \Drupal::getContainer()?->get($id).
- rule: runtime_container_nullsafe_get_call_in_function
  reads: file
  in: [source]
  match:
    declaration: nullsafe_member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &container_nullsafe_where
    - name_matches: {child: object, pattern: *container_object}
    - name_matches: {child: name, pattern: get}
    - name_matches: {child: arguments, pattern: *first_variable}
  id: &nullsafe_id
    from: [enclosing_type, declared_name, name]
    template: "{enclosing_type}::{declared_name}?->{name}(runtime)"
  emits: *runtime_node
  confidence: declared

- rule: runtime_container_nullsafe_get_call_in_function_in
  reads: file
  in: [source]
  match:
    declaration: nullsafe_member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *container_nullsafe_where
  id: *nullsafe_id
  emits: *runtime_edges
  confidence: declared

# \Drupal::entityQuery($type).
- rule: runtime_entity_query_call_in_function
  reads: file
  in: [source]
  match:
    declaration: scoped_call_expression
    name_child: name
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &entity_query_where
    - name_matches: {child: scope, pattern: '\\?Drupal'}
    - name_matches: {child: name, pattern: 'entityQuery(?:Aggregate)?'}
    - name_matches: {child: arguments, pattern: *first_variable}
  id: *scoped_id
  emits: *runtime_node
  confidence: declared

- rule: runtime_entity_query_call_in_function_in
  reads: file
  in: [source]
  match:
    declaration: scoped_call_expression
    name_child: name
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *entity_query_where
  id: *scoped_id
  emits: *runtime_edges
  confidence: declared

# \Drupal::entityTypeManager()->getStorage($type).
- rule: runtime_storage_call_in_function
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &storage_where
    - name_matches: {child: object, pattern: &manager_object '(?s).*entityTypeManager(?:\(\))?'}
    - name_matches: {child: name, pattern: getStorage}
    - name_matches: {child: arguments, pattern: *first_variable}
  id: *member_runtime_id
  emits: *runtime_node
  confidence: declared

- rule: runtime_storage_call_in_function_in
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *storage_where
  id: *member_runtime_id
  emits: *runtime_edges
  confidence: declared

# \Drupal::entityTypeManager()?->getStorage($type).
- rule: runtime_storage_nullsafe_call_in_function
  reads: file
  in: [source]
  match:
    declaration: nullsafe_member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &storage_nullsafe_where
    - name_matches: {child: object, pattern: *manager_object}
    - name_matches: {child: name, pattern: getStorage}
    - name_matches: {child: arguments, pattern: *first_variable}
  id: *nullsafe_id
  emits: *runtime_node
  confidence: declared

- rule: runtime_storage_nullsafe_call_in_function_in
  reads: file
  in: [source]
  match:
    declaration: nullsafe_member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *storage_nullsafe_where
  id: *nullsafe_id
  emits: *runtime_edges
  confidence: declared

# $entity_type_manager->getDefinition($type), hasDefinition and getHandler, on the objects
# call/entity_definition_call.yaml reads.
- rule: runtime_entity_definition_call_in_function
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &definition_where
    - name_matches: {child: object, pattern: '(?s).*entityTypeManager(?:\(\))?|\$entity_type_manager|(?:\$container|\$this->container|\\?Drupal::getContainer\(\))->get\([''"]entity_type\.manager[''"]\)|\\?Drupal::service\([''"]entity_type\.manager[''"]\)'}
    - name_matches: {child: name, pattern: 'getDefinition|hasDefinition|getHandler'}
    - name_matches: {child: arguments, pattern: *first_variable}
  id: *member_runtime_id
  emits: *runtime_node
  confidence: declared

- rule: runtime_entity_definition_call_in_function_in
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *definition_where
  id: *member_runtime_id
  emits: *runtime_edges
  confidence: declared

# ->setRedirect($route), as call/entity_definition_call.yaml's runtime_set_redirect_call.
- rule: runtime_set_redirect_call_in_function
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: &redirect_where
    - name_matches: {child: name, pattern: setRedirect}
    - name_matches: {child: arguments, pattern: *first_variable}
  id: *member_runtime_id
  emits: *runtime_node
  confidence: declared

- rule: runtime_set_redirect_call_in_function_in
  reads: file
  in: [source]
  match:
    declaration: member_call_expression
    name_child: object
    filetype: php
    ending: *module_endings
    holder: function_definition
    where: *redirect_where
  id: *member_runtime_id
  emits: *runtime_edges
  confidence: declared

# new Url($route), as route/route_call.yaml's runtime_route_call_from_new_url, read as text: a
# php.call_site <function>::new Url(runtime). A method of a class kept in the file has no
# function name here and gives nothing.
- rule: runtime_route_call_from_new_url_in_function
  reads: file
  in: [source]
  match: &new_url_in_function
    file: '**'
    filetype: drupal_php_text
    ending: *module_endings
    text: '\bnew\s+(?:\\?Drupal\\Core\\)?Url\s*\(\s*[^,)''"$]*\$'
  values: &new_url_function_values
    name: {from: {enclosing: named_function, capture: function}, join: '|', normalize: [{replace: '^.*\|', with: ''}]}
    in_class: {from: {enclosing: class_like_body, capture: class}}
    function: {template: '{in_class}|{name}', normalize: [{replace: '^[^|]+\|.*$', with: ''}, {replace: '^\|', with: ''}]}
  id: {template: '{function}::new Url(runtime)'}
  emits: *runtime_node
  confidence: declared

- rule: runtime_route_call_from_new_url_in_function_in
  reads: file
  in: [source]
  match: *new_url_in_function
  values: *new_url_function_values
  id: {template: '{function}::new Url(runtime)'}
  emits:
  - edge: {kind: has_call_site, from: {template: '{function}', types: [php.function]}, to: this_node}
  - edge: {kind: call_site_in, from: this_node, to: {template: '{function}', types: [php.function]}}
  confidence: declared
