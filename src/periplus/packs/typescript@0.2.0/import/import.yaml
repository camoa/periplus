$schema: https://periplus.dev/schema/0/pack-file.schema.json

# One module importing another. A name that resolves to no file, such as a stylesheet, stays a
# referenced node.

edge_kinds:
- kind: imports
  cause: from
  description: "the file or module imports that thing: a PHP use statement names a class, function or constant, a TypeScript import names a module"
  from: typescript.module
  to: typescript.module
