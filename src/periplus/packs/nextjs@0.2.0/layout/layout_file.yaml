$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A file named layout under app.

rules:
- rule: layout_file
  reads: file
  in:
  - nextjs_app
  match:
    file: layout
    filetype: typescript
  id:
    template: '{module}'
  emits:
  - node:
      type: nextjs.layout
  confidence: declared
- rule: layout_file_edges
  reads: file
  in:
  - nextjs_app
  match:
    file: layout
    filetype: typescript
    reads_sections: [string, block_comment, line_comment]
    text: '\A'
  id:
    template: '{module}'
  emits:
  - edge:
      kind: layout_in_module
      from: this_node
      to:
        template: '{module}'
  confidence: declared
