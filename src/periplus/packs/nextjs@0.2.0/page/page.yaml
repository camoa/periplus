$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A page: the URL a page file serves, joined to the module that holds its code.

node_types:
- name: nextjs.page
  description: "A page, named by the URL its page file serves, with route groups removed and each dynamic segment written []"
  id_namespace: nextjs.page
edge_kinds:
- kind: page_in_module
  description: "the page's code is in that module"
  from: nextjs.page
  to: typescript.module
