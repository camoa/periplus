$schema: https://periplus.dev/schema/0/pack-file.schema.json

# A file with one of those names under app.

rules:
- rule: special_file
  reads: file
  in:
  - nextjs_app
  match:
    file: '*'
    filetype: typescript
  id:
    template: '{special}'
  emits:
  - node:
      type: nextjs.special_file
  confidence: declared
