$schema: https://periplus.dev/schema/0/pack-file.schema.json

# loading, error, not-found, template, default and global-error, named by their module so that two
# of one kind on one URL stay apart.

node_types:
- name: nextjs.special_file
  description: "A loading, error, not-found, template, default or global-error file under app, named by its module"
  id_namespace: nextjs.special_file
