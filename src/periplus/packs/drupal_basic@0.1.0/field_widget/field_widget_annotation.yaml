$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A field widget declared by the FieldWidget docblock annotation on its class. An id that is
# not text in double quotes makes no field widget and is listed under skipped.

rules:
- rule: field_widget_from_annotation
  reads: file
  in:
  - field_widget_classes
  match:
    annotation: FieldWidget
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.field_widget
  - attribute:
      name: label
      from:
        annotation_key: label
  confidence: declared
- rule: field_widget_from_annotation_edges
  reads: file
  in:
  - field_widget_classes
  match:
    annotation: FieldWidget
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      annotation_key: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
