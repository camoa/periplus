$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# Every file in the config folders becomes a node, and a rule that understands more refines it.
# Its dependencies key lists modules, configuration and themes, and its enforced key the same
# three lists; an enforced dependency is a dependency, each cited at its item's line.
node_types:
- name: drupal.config_object
  id_namespace: drupal.config

edge_kinds:
- kind: config_depends
  from: drupal.config_object
  to: drupal.config_object
- kind: depends_on_module
  from:
  - drupal.module
  - drupal.config_object
  to: drupal.module
- kind: depends_on_theme
  from: drupal.config_object
  to: drupal.theme

rules:
- rule: any_config_file
  reads: file
  in:
  - config
  - module_config
  match:
    file: '*'
    filetype: yaml
  id:
    from: file_stem
  emits:
  - node:
      type: drupal.config_object
  confidence: declared
- rule: any_config_file_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: '*'
    filetype: yaml
  id:
    from: file_stem
  emits:
  - edge:
      kind: config_depends
      from: this_node
      to:
        from:
          key: dependencies.config
        each: true
  - edge:
      kind: depends_on_module
      from: this_node
      to:
        from:
          key: dependencies.module
        each: true
  - edge:
      kind: config_depends
      from: this_node
      to:
        from:
          key: dependencies.enforced.config
        each: true
  - edge:
      kind: depends_on_module
      from: this_node
      to:
        from:
          key: dependencies.enforced.module
        each: true
  - edge:
      kind: depends_on_theme
      from: this_node
      to:
        from:
          key: dependencies.theme
        each: true
  - edge:
      kind: depends_on_theme
      from: this_node
      to:
        from:
          key: dependencies.enforced.theme
        each: true
  confidence: declared
