$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A field formatter declared by the FieldFormatter attribute on its class, the twin of the
# annotation rule. Two rules because a rule that emits an edge emits no node. An id that is not a
# text literal makes no formatter and is listed under skipped.

rules:
- rule: field_formatter_from_attribute
  reads: file
  in:
  - field_formatter_classes
  match:
    attribute: Drupal\Core\Field\Attribute\FieldFormatter
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.field_formatter
  confidence: declared
- rule: field_formatter_from_attribute_edges
  reads: file
  in:
  - field_formatter_classes
  match:
    attribute: Drupal\Core\Field\Attribute\FieldFormatter
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
