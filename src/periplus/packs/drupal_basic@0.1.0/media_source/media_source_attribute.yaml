$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A media source plugin declared by the MediaSource attribute, or by its subclass OEmbedMediaSource,
# on its class. Two rules per attribute because a rule that emits an edge emits no node. An id that
# is not a text literal makes no plugin and is listed under skipped in the map report.

rules:
- rule: media_source_from_attribute
  reads: file
  in:
  - media_source_classes
  match:
    attribute: Drupal\media\Attribute\MediaSource
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.media_source
  confidence: declared
- rule: media_source_from_attribute_edges
  reads: file
  in:
  - media_source_classes
  match:
    attribute: Drupal\media\Attribute\MediaSource
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
- rule: media_source_from_oembed_attribute
  reads: file
  in:
  - media_source_classes
  match:
    attribute: Drupal\media\Attribute\OEmbedMediaSource
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.media_source
  confidence: declared
- rule: media_source_from_oembed_attribute_edges
  reads: file
  in:
  - media_source_classes
  match:
    attribute: Drupal\media\Attribute\OEmbedMediaSource
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
