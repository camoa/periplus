$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A block plugin declared by the Block attribute on its class. Two rules because a rule that emits
# an edge emits no node. An id that is not a text literal, such as a constant, makes no plugin and
# is listed under skipped in the map report.

rules:
- rule: block_plugin_from_attribute
  reads: file
  in:
  - block_plugin_classes
  match:
    attribute: Drupal\Core\Block\Attribute\Block
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.block_plugin
  confidence: declared
- rule: block_plugin_from_attribute_edges
  reads: file
  in:
  - block_plugin_classes
  match:
    attribute: Drupal\Core\Block\Attribute\Block
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
