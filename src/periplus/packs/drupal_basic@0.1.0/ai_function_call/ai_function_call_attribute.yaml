$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# An AI function call plugin declared by the FunctionCall attribute on its class. Two rules because
# a rule that emits an edge emits no node. An id that is not a text literal makes no plugin and is
# listed under skipped in the map report.

rules:
- rule: ai_function_call_from_attribute
  reads: file
  in:
  - ai_function_call_classes
  match:
    attribute: Drupal\ai\Attribute\FunctionCall
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - node:
      type: drupal.ai_function_call
  confidence: declared
- rule: ai_function_call_from_attribute_edges
  reads: file
  in:
  - ai_function_call_classes
  match:
    attribute: Drupal\ai\Attribute\FunctionCall
    filetype: php
    where:
    - applies_to: class_declaration
  id:
    from:
      attribute_argument: id
    must_be: string_literal
  emits:
  - edge:
      kind: plugin_class
      from: this_node
      to: enclosing_class
  confidence: declared
