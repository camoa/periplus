$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A route, named by its key in a routing file, and the PHP method or form class that answers it. A
# route requires a permission it needs, and accepts each of permissions any one of which lets in.

node_types:
- name: drupal.route
  id_namespace: drupal.route

edge_kinds:
- kind: requires_permission
  from: drupal.route
  to: drupal.permission
- kind: accepts_permission
  from: drupal.route
  to: drupal.permission
- kind: handled_by
  from: drupal.route
  to: php.method
- kind: uses_form
  from: drupal.route
  to: php.class
