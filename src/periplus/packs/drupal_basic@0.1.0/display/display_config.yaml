$schema: "https://periplus.dev/schema/0/pack-file.schema.json"

# A display read from its config file: for each of the form and view displays, one node rule and
# one edge rule per edge kind, and one displays rule per bundle entity type. A display shows a
# configured field that is a key under content and that its dependency list names: the list names
# every configured field, shown or hidden, and content also holds base and extra fields.

rules:
- rule: form_display_from_config
  reads: file
  in:
  - config
  - module_config
  match:
    file: core.entity_form_display.*
    filetype: yaml
  id:
    from: file_stem
  emits:
  - node:
      type: drupal.form_display
  confidence: declared
- rule: form_display_from_config_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: core.entity_form_display.*
    filetype: yaml
  id:
    from: file_stem
  emits:
  - edge:
      kind: shows_field
      from: this_node
      to:
        from:
        - key: targetEntityType
        - key: bundle
        - each: content.*
        template: field.field.{targetEntityType}.{bundle}.{key}
        where:
        - listed_at: dependencies.config
  confidence: declared
- rule: form_display_block_type_edges
  reads: file
  in:
  - config
  - module_config
  match:
    file: core.entity_form_display.*
    filetype: yaml
    where:
    - key:
        name: targetEntityType
        equals: block_content
  id:
    from: file_stem
  emits:
  - edge:
      kind: displays
      from: this_node
      to:
        from:
        - key: targetEntityType
        - key: bundle
        template: '{targetEntityType}.type.{bundle}'
        type: drupal.block_type
  confidence: declared
