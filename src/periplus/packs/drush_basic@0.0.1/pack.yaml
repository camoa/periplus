$schema: "https://periplus.dev/schema/0/pack-manifest.schema.json"

# Drush commands in the custom modules: each command, named by its name, as mymodule:sync, with
# a command_method edge to php_basic's node for the method that runs it, a command_class edge to
# that method's class, and a command_service edge to the service a services file registers that
# class under. A command is read from the Command attribute on a method,
# #[CLI\Command(name: '...')], and from the @command tag in a method's docblock, both from the
# tree. A method that carries both is one node with two locations. Each alias in a docblock's
# @aliases tag is a drush.command_alias node with an alias_of_command edge to its command.
#
# Not mapped yet:
# - An attribute whose name is not the named argument name:, such as #[CLI\Command('x')], or is
#   not a text literal, makes nothing and is listed under skipped.
# - Aliases in the attribute, aliases: ['a'], and a fifth or later alias in the @aliases tag.
# - Usages, options, arguments, hooks (#[CLI\Hook], @hook), topics and validators.
# - A command in an anonymous class, and a command a class inherits from a grandparent, for the
#   service join.
pack: drush_basic
version: 0.0.1
depends: [drupal_basic, php_basic]

